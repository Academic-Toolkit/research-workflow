cycle:
  applies_to: null
  rolling_calls: []
  note: >-
    2026-10-27 沒有找到開放中的特刊徵稿：Internet Archive 2026-08-19 抓取的 Announcements 頁最新一則是 2021-09-27。
    官網說特刊的客座編輯提案可寄給 editors-in-chief（jss_mission）。

# ─────────────────────────────────────────────────────────────
warnings:
  - 【scope 是最大風險】JSS 明文不收方法論創新："JSS does NOT publish methodological innovations in computational statistics. Novel models or estimation procedures should be published elsewhere prior to the submission"；對應的軟體之後可投，但須有 "substantial software innovation"；針對特定模型或演算法的實作視為方法論文章的補充材料，也不收；沒有對應文章的軟體不收。目標是「廣泛類別的統計模型與程序的完整開源實作，或其運算基礎設施」，較窄的用 code snippet
  - 理論稿不在範圍：2026-10-27 讀到的頁面中沒有任何允許純理論或純方法論稿件的條文（與 asa/jcgs 允許附條件的理論稿不同）
  - 套件不需要已上 CRAN 才能投稿，但官方偏好標準套件庫：「if at all possible」應同時放 CRAN、Bioconductor 或 PyPI，「not just GitHub, GitLab」；R 套件的複合物件至少要用 S3 類別與 print、plot、summary 方法
  - 可重現性在初次投稿就必附：PDF 稿、原始碼、所有結果的複製材料（最好是單一獨立腳本）；結果須在至少一個平台上完全可重現；建議在一般 PC 上一小時內跑完，否則另附快速版腳本；審稿人要驗證可重現性，有條件接受之前要解決所有可重現性問題；接受是有條件的，最終稿不符樣式與可重現要求就不出版
  - 軟體授權限 GPL-2、GPL-3 或與 GPL 相容；"JSS does NOT consider software distributed under other licenses."；已出版的程式碼與文章不能更新，JSS 不是軟體庫
  - 稿件須用 LaTeX 與 JSS 樣式檔、只收 PDF；官網不協助從 Word 等轉檔；不符形式的稿件立刻退回；沒有頁數上限但超過 30 頁審查時間明顯變長；"Extensive simulation studies are discouraged."
  - 被 JSS 退稿的稿件不能重投
  - 官網沒有公布 IF、接受率、首次決定天數、投稿到接受天數；只有定性說法 "publication times can be rather long"（志工營運）。JCR 的 IF 與分區需登入，本次未查（not_found）；SJR 分區（SCImago，2025）三個類別皆為 Q1，不是 JCR
  - 官網沒有寫審稿是單匿名、雙匿名或公開；也沒有 preprint、生成式 AI、利益衝突、重複投稿、倫理的政策條文（查過 authors、mission、about、submissions、guides/submission、style 六頁）
  - 【來源狀態】2026-10-27 jstatsoft.org 連不上（TCP 逾時，五個國家的探測點也逾時），所有 JSS 頁面取自 Internet Archive 的存檔（抓取日 2026-08-02 至 2026-10-05，各 source 的 note 有網址），不是官網現場；官網恢復後要用 Safari 重讀確認規定沒有變
  - jss_authors 與 jss_submission_guide 兩頁的措辭不同：authors 頁較詳，寫審稿人要驗證可重現性、一小時建議、code.html 與 CRAN 等標準套件庫偏好；guide 頁較簡短，另有跨平台可重現的敘述；頁面都沒有日期，哪一頁較新無從判斷，本記錄以 authors 頁為準
  - SCImago 與 MJL 把發行者列為 UCLA，JSS 官網與 Crossref 的發行者是 Foundation for Open Access Statistics；官網側欄的支持單位是 Innsbruck、Zürich 與 UCLA Statistics
  - 官網導覽列的路徑是 /index.php/jss/authors 等，SCImago 與 DOAJ 仍連到舊路徑 /pages/view/authors；舊路徑存檔最後一次回 200 是 2021-09，現在是否導向新路徑本次未能測試
