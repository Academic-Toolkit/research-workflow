    publisher_stated:
      status: not_published
      checked: 2026-10-27
      src: jss_submissions
      note: >-
        JSS 官網沒有列收錄清單；側欄 External 區只有連結（American Statistical Association Publications、
        Current Index to Statistics、SCImago、DOAJ、JSS BibTeX Database (1996-2015)、IDEAS）。收錄以上方 MJL 為準。
  metrics:
