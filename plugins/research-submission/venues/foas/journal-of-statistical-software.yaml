--- # research-submission venue record
# 內容擷取自 Journal of Statistical Software（jstatsoft.org）的 Information for Authors、Information on Mission、
# Submissions、About the Journal、Editorial Team、Style Guide、Submission Guide 等頁面與 JSS 風格手冊（jss.pdf）、
# Foundation for Open Access Statistics（foastat.org）的三個頁面、SCImago、Clarivate Master Journal List，2026-10-27。
#
# 【重要：2026-10-27 當天 jstatsoft.org 連不上，下列 JSS 頁面不是從官網現場讀的】
# 當天 curl 對 www.jstatsoft.org 所有路徑都是 TCP 連線逾時（25–60 秒；nc 對 138.232.16.156 的 80 與 443 埠、ping 也不通），
# Safari 顯示「無法打開網頁」；用 check-host.net 從法國、斯洛維尼亞、土耳其、烏克蘭、伊朗的探測點測也全部逾時，
# 所以不是本機網路問題。各頁原始碼裡有一段已被註解掉的公告（未標年份）寫 6 月 30 日至 7 月 2 日曾因 AI 請求暴增而中斷服務，
# 那是另一次事件；這次中斷的原因頁面沒有說明。改讀 Internet Archive（web.archive.org）保存的原始 HTML（網址帶 id_，
# 即網站當時送出的未改寫頁面），抓取日如下，各 source 的 note 另有完整網址：
#   authors 2026-08-02、submissions 與 guides/submission 與 jss-style.zip 2026-08-19、style 2026-09-28、
#   mission 與 about 與 editorialTeam 2026-10-05。
# 這些是官網頁面的存檔，不是官網現場；頁面在抓取日之後有沒有改動，本次無從得知。
# JSS 官網恢復後，請用 Safari 重讀每個 jstatsoft.org 來源，確認 must_contain 仍在、規定沒有變，再更新 last_verified_at。
#
# 讀取方式：foastat.org 以 curl 可取得完整頁面（200）；SCImago 與 MJL 用 Safari 讀（MJL 是 JS 單頁應用，只能在頁內查詢）。
# 收錄緣由：語料庫缺這本；補錄統計軟體類期刊，供 choose-venue 比較用。
# 本記錄只放期刊公開規定與公開的編輯部名單，不含任何投稿者或稿件資訊。
#
# sources 排序是刻意的：http 來源排在前面、browser 來源排在最後。
# verify.py 以「替換第一個 extracted_sha256: null」寫回 hash，若 browser 來源排在前面，
# http 來源的 hash 會被寫進 browser 來源的欄位。

schema_version: 1
id: foas/journal-of-statistical-software
kind: journal
family: statistics-journals
status: active

# ─────────────────────────────────────────────────────────────
sources:
  - id: foas_jss
    role: supporting
    url: https://www.foastat.org/jss.html
    note: >-
      FOAS（出版者基金會）自己的 JSS 說明頁：JSS 對讀者與作者都免費、開銷來源、使用 OJS、論文與軟體一起出版。
      頁面沒有日期，內文提到 useR! 2014 與 2011 年的 Nature 報導，是約 2014 年的文字；
      約 20,000 美元／年的開銷與 UCLA 統計系負擔的說法，只當歷史背景，不當現況。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "JSS is free for readers and authors"
        min_extracted_chars: 2000
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: foas_about
    role: supporting
    url: https://www.foastat.org/about.html
    note: FOAS 的法律地位（加州非營利公益法人、501(c)(3)，免稅生效日 2012-09-01）與三位 Officers。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "FOAS is a nonprofit public benefit corporation registered in California"
        min_extracted_chars: 700
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: foas_philosophy
    role: supporting
    url: https://www.foastat.org/philosophy.html
    note: FOAS 對 open access 與 reproducible research 的立場；一句話說 JSS 隨每篇文章發布程式碼。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "distributes code along with all of its"
        min_extracted_chars: 1800
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: jss_authors
    role: authoritative
    url: https://www.jstatsoft.org/authors
    note: >-
      Information for Authors：規定本體（Requirements、Software Preparation、Manuscript Preparation、Online Submission、
      Review Process、Publishing Process）。2026-10-27 官網連不上（見檔頭），內容取自 Internet Archive 於 2026-08-02 的抓取：
      https://web.archive.org/web/20260802142123id_/https://www.jstatsoft.org/authors
      導覽列的連結是 https://www.jstatsoft.org/index.php/jss/authors；SCImago 與 DOAJ 仍連到舊路徑 /pages/view/authors
      （存檔最後一次 200 是 2021-09-22）。
      本頁比 jss_submission_guide 詳細，兩頁有數處措辭不同（見 warnings）；以本頁為準。
    fetch:
      method: browser
      http_failure_mode: >-
        2026-10-27 curl 對 www.jstatsoft.org 所有路徑 TCP 連線逾時（不是 bot 挑戰頁；check-host.net 的歐洲探測點也逾時），
        所以 curl 是否可用未能測試，http_viable 不填。頁面是伺服器端渲染的 OJS 3 頁面，存檔的原始 HTML 含完整內文，
        官網恢復後請補測 curl。
      validity:
        must_contain: "Extensive simulation studies are discouraged"
        min_extracted_chars: 6000
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: jss_mission
    role: authoritative
    url: https://www.jstatsoft.org/mission
    note: >-
      Information on Mission：Scope、Types of Papers、Code、Copyright and Costs。JSS 收什麼、不收什麼寫在這一頁。
      2026-10-27 官網連不上，內容取自 Internet Archive 於 2026-10-05 的抓取：
      https://web.archive.org/web/20261005205514id_/https://www.jstatsoft.org/mission
    fetch:
      method: browser
      http_failure_mode: 同 jss_authors（2026-10-27 官網連線逾時，未能測試 curl）。
      validity:
        must_contain: "JSS does NOT publish methodological innovations in computational statistics"
        min_extracted_chars: 4000
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: jss_submissions
    role: authoritative
    url: https://www.jstatsoft.org/about/submissions
    note: >-
      OJS 的 Submissions 頁：Submission Preparation Checklist（投稿時逐項勾選）、Copyright Notice、側欄的 Journal Information
      （Publisher、Editors-in-chief、ISSN、CODEN）與 Support（無作者費用）。
      2026-10-27 官網連不上，內容取自 Internet Archive 於 2026-08-19 的抓取：
      https://web.archive.org/web/20260819203345id_/https://www.jstatsoft.org/about/submissions
    fetch:
      method: browser
      http_failure_mode: 同 jss_authors（2026-10-27 官網連線逾時，未能測試 curl）。
      validity:
        must_contain: "I/we have prepared the replication materials for all results from the manuscript"
        min_extracted_chars: 2000
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: jss_about
    role: authoritative
    url: https://www.jstatsoft.org/about
    note: >-
      About the Journal：Focus and Scope（只導向 mission 與 authors 兩頁）、Open Access Policy（CC Attribution 3.0 Unported、
      程式碼用 GPL）、隱私政策（最後修改 2021-09-25；提到 2026-04 中旬起郵件服務改用 mailbox.org）。
      頁面沒有 peer review policy、publication frequency 之類的 OJS 預設段落。
      2026-10-27 官網連不上，內容取自 Internet Archive 於 2026-10-05 的抓取：
      https://web.archive.org/web/20261005205537id_/https://www.jstatsoft.org/about
    fetch:
      method: browser
      http_failure_mode: 同 jss_authors（2026-10-27 官網連線逾時，未能測試 curl）。
      validity:
        must_contain: "This journal provides immediate open access to its content"
        min_extracted_chars: 8000
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: jss_editorial_team
    role: authoritative
    url: https://www.jstatsoft.org/about/editorialTeam
    note: >-
      Editorial Team：五位 Editors-in-Chief、Technical Editor、四位 Replication Editors、Editor/Publisher、Book Review Editor、
      Founding Editor、Junior Editor 與 Editors 名單。頁面沒有說明各職務的職責，也沒有任期。
      2026-10-27 官網連不上，內容取自 Internet Archive 於 2026-10-05 的抓取：
      https://web.archive.org/web/20261005205514id_/https://www.jstatsoft.org/about/editorialTeam
    fetch:
      method: browser
      http_failure_mode: 同 jss_authors（2026-10-27 官網連線逾時，未能測試 curl）。
      validity:
        must_contain: "Replication Editors"
        min_extracted_chars: 4500
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: jss_style
    role: supporting
    url: https://www.jstatsoft.org/style
    note: >-
      Style Guide 與 FAQ：LaTeX 與 JSS 樣式檔必用、四種範本（article、codesnippet、software review、book review）、
      R 套件如何註明 JSS 論文、如何引用軟體。
      2026-10-27 官網連不上，內容取自 Internet Archive 於 2026-09-28 的抓取：
      https://web.archive.org/web/20260928101024id_/https://www.jstatsoft.org/style
    fetch:
      method: browser
      http_failure_mode: 同 jss_authors（2026-10-27 官網連線逾時，未能測試 curl）。
      validity:
        must_contain: "Code snippet contributions are produced in the same way as articles"
        min_extracted_chars: 10000
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: jss_submission_guide
    role: supporting
    url: https://www.jstatsoft.org/guides/submission
    note: >-
      Submission Guide：Types of Papers（五種投稿類型）加 OJS 四步驟投稿流程與修訂稿上傳。
      這頁的 Requirements、Review Process 段落比 jss_authors 簡短、措辭不同（見 warnings），頁面沒有日期可判斷哪一頁較新；規定以 jss_authors 為準；
      類型清單與投稿步驟只見於本頁。頁面約 350 KB，多數是內嵌的步驟示意圖，文字約 13,000 字元。
      2026-10-27 官網連不上，內容取自 Internet Archive 於 2026-08-19 的抓取：
      https://web.archive.org/web/20260819203345id_/https://www.jstatsoft.org/guides/submission
    fetch:
      method: browser
      http_failure_mode: 同 jss_authors（2026-10-27 官網連線逾時，未能測試 curl）。
      validity:
        must_contain: "JSS publishes the following types of original contributions"
        min_extracted_chars: 8000
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: jss_style_manual
    role: supporting
    url: https://www.jstatsoft.org/public/journals/1/jss-style.zip
    note: >-
      jss 文件類別的壓縮檔，內含 jss.pdf（風格手冊，首頁標 Achim Zeileis、April 28, 2026）、jss.cls、jss.bst、README.txt。
      手冊寫：摘要與關鍵字的宣告（關鍵字至少一個、不大寫）、四種文件類型（article、codesnippet、bookreview、softwarereview）、
      最終版須含完整原始檔。手冊沒有摘要字數上限或篇幅上限。
      這是二進位檔：verify.py 的 HTML 抽取器對它只能產生決定性的位元組指紋，不是可讀文字；must_contain 只用來確認拿到的是 zip。
      2026-10-27 官網連不上，zip 取自 Internet Archive 於 2026-08-19 的抓取（網址帶 id_ 為原始位元組）：
      https://web.archive.org/web/20260819203430id_/https://www.jstatsoft.org/public/journals/1/jss-style.zip
      下載後解壓到獨立目錄，用 pdftotext 讀 jss.pdf，沒有執行任何檔案。
    fetch:
      method: browser
      http_failure_mode: 同 jss_authors（2026-10-27 官網連線逾時，未能測試 curl）。
      validity:
        must_contain: "jss.cls"
        min_extracted_chars: 100000
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: scimago
    role: supporting
    url: https://www.scimagojr.com/journalsearch.php?q=12137&tip=sid&clean=0
    note: >-
      SCImago（SJR）期刊頁：SJR、分區（三個類別各一）、H-index、Scope、ISSN。sid 12137 由
      journalsearch.php?q=1548-7660&tip=iss 的搜尋結果取得（搜尋頁只列這一筆）。
      SCImago 把發行者列為 University of California at Los Angeles，與 JSS 官網及 Crossref 的 Foundation for Open Access Statistics 不同。
      頁面的 "How to publish in this journal" 連結指向 https://www.jstatsoft.org/pages/view/authors（舊路徑）。
      SCImago 對 curl 回 403 挑戰頁（2026-10-27 實測 HTTP 403、5586 bytes），本次用 Safari 讀。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "Cloudflare 挑戰頁：curl 對 q=12137 的網址回 HTTP 403、5586 bytes（2026-10-27 實測，標題 Just a moment...）；Safari 可正常讀取（約 24,000 字元）"
      validity:
        must_contain: "Journal of Statistical Software"
        min_extracted_chars: 8000
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27

  - id: mjl
    role: supporting
    url: https://mjl.clarivate.com/home
    note: >-
      Clarivate Master Journal List。JS 單頁應用，結果頁網址不帶查詢字串，無法用網址重現；
      只能在頁內於 #search-box 填 ISSN、按 #search-button 後讀結果列。
      本次填 1548-7660，結果頁網址是 https://mjl.clarivate.com/search-results。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "SPA 空殼：curl /home 回 HTTP 200、11,428 bytes（2026-10-27 實測），查詢結果需在頁內操作"
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27

