identity:
  name: Journal of Statistical Software
  abbreviation: JSS
  publisher: Foundation for Open Access Statistics
  publisher_src: jss_submissions
  publisher_note: >-
    JSS 官網側欄 "Publisher:Foundation for Open Access Statistics"。MJL 與 SCImago 把發行者列為 UCLA
    （MJL 的字串為 "JOURNAL STATISTICAL SOFTWARE , UCLA DEPT STATISTICS, 8130 MATH SCIENCES BLDG, BOX 951554, LOS ANGELES, USA, CA, 90095-1554"；
    SCImago 為 "University of California at Los Angeles"）。Crossref（2026-10-27 查詢，publisher 字串少一個 s："Foundation for Open Access Statistic"）
    與 OpenAlex（host organization "Foundation for Open Access Statistics"）都指向 FOAS。FOAS 是加州非營利公益法人（501(c)(3)，見 foas_about）。
  owner: Foundation for Open Access Statistics
  owner_src: jss_submissions
  sponsors:
    - {name: Universität Innsbruck, src: jss_submissions}
    - {name: Universität Zürich, src: jss_submissions}
    - {name: UCLA Statistics, src: jss_submissions}
  sponsors_note: >-
    官網側欄 "Universität Innsbruck, Universität Zürich, and UCLA Statistics provide support staff, website maintenance, website hosting,
    and some graduate student support." 伺服器由 Innsbruck 大學營運（jss_about 隱私政策）。
  issn: {electronic: "1548-7660", src: [jss_submissions, scimago, mjl]}
  issn_note: >-
    官網只列一個 ISSN（"ISSN:1548-7660"），沒有分 print／online。MJL 寫 "ISSN / eISSN: 1548-7660"，SCImago 為 15487660，
    Crossref（2026-10-27 查詢）記為 electronic。官網另列 CODEN JSSOBK。
  coden: JSSOBK
  homepage: https://www.jstatsoft.org/
  established: 1996
  established_src: jss_mission
  established_note: 官網 mission 寫 "committed to electronic open-access publishing since its foundation in 1996"；FOAS 頁面寫 "Established in 1996"。
  frequency: 連續出版（"Each published article will be a separate issue. Issues are published in volumes."）
  frequency_src: jss_authors
  article_types_listed: [Scholarly articles（軟體文章）, Code snippets, Special issues, Book reviews, Reviews and comparisons of closed-source statistical software]
  open_access: 完全開放取用；作者與讀者皆不付費（官網："JSS charges no author fees or subscription fees"）
  editors:
    editors_in_chief:
      - {name: Bettina Grün, affiliation: "Wirtschaftsuniversität Wien"}
      - {name: Torsten Hothorn, affiliation: "Universität Zürich"}
      - {name: Rebecca Killick, affiliation: "Clemson University"}
      - {name: Nathalie Vialaneix, affiliation: "INRAE (Toulouse)"}
      - {name: Achim Zeileis, affiliation: "Universität Innsbruck"}
    technical_editor: {name: Reto Stauffer, affiliation: "Universität Innsbruck"}
    replication_editors:
      - {name: Kathrin Gruber, affiliation: "Erasmus University Rotterdam"}
      - {name: Lucas Kook, affiliation: "Copenhagen Business School"}
      - {name: Patricia Puchhammer, affiliation: "TU Wien"}
      - {name: Laura Vana-Gür, affiliation: "TU Wien"}
    editor_publisher: {name: Katharine Mullen, affiliation: "Foundation for Open Access Statistics"}
    book_review_editor: {name: Ulrike Groemping, affiliation: "Beuth University of Applied Sciences Berlin"}
    founding_editor: {name: Jan de Leeuw, affiliation: "UCLA"}
    src: jss_editorial_team
    note: >-
      取自編輯部頁面（Internet Archive 2026-10-05 的抓取），另有一位 Junior Editor 與約六十位 Editors，這裡不逐一列出。
      頁面沒有標示各職務的職責或任期；"Replication Editors" 負責什麼，本次讀到的頁面都沒有說明。
      投稿須知側欄 "Editors-in-chief" 的五個名字與本頁一致。
  external_ids:
    crossref: "1548-7660"
    openalex: issn:1548-7660
    scimago: "12137"
    doaj: "https://doaj.org/toc/1548-7660"
  indexing:
    clarivate_mjl:
      scie: true
      ssci: false
      ahci: false
      esci: false
      web_of_science_core_collection: Science Citation Index Expanded
      additional_indexes: [Essential Science Indicators]
      checked: 2026-10-27
      search_issn: "1548-7660"
      mjl_title_string: "JOURNAL OF STATISTICAL SOFTWARE"
      mjl_publisher_string: "JOURNAL STATISTICAL SOFTWARE , UCLA DEPT STATISTICS, 8130 MATH SCIENCES BLDG, BOX 951554, LOS ANGELES, USA, CA, 90095-1554"
      src: mjl
      note: >-
        搜尋 1548-7660 得 1 筆 "Exact Match Found"（ISSN / eISSN 1548-7660），Web of Science Core Collection 欄只列
        Science Citation Index Expanded；沒有 SSCI、AHCI、ESCI。Additional Web of Science Indexes 欄只列 Essential Science Indicators
