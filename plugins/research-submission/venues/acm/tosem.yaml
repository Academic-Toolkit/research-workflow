# ─────────────────────────────────────────────────────────────
warnings:
  - >-
    一般論文的頁數上限、摘要字數、審查是單盲還是雙盲，TOSEM 官方頁面都沒有寫（已查作者須知、審稿人須知、副編輯須知、ACM Peer Review Policy 與 FAQ）。
    不要自行假設雙盲；作者須知唯一寫明的是審稿人姓名不對作者公開。副編輯須知把「over the page limit」列為 desk reject 理由，所以有上限，只是作者面頁面沒寫。
  - >-
    TOSEM 的「journal-first」是一種投稿類型（新研究、與任何已發表的出版物相差 70% 以上、cover letter 附 200 字 novelty 聲明），
    不是「已在研討會發表」。Fast-impact track、Registered Paper、RCR 與各特刊都要求符合 journal-first 並限 45 頁（不含參考文獻）。
  - >-
    要先貼 arXiv 時：ACM 的自我典藏政策明文允許（"an example of a site ACM authors may post all pre-publication versions of their work to is arXiv"，
    並請在 arXiv 補上正式版 DOI）；但 journal-first 的「70% 規則」沒有說預印本算不算 previous publication，
    若要走 journal-first／fast-impact，建議先向主編確認。
  - >-
    APC：全面開放取用。2027-01-01 後被接受的論文是 US$1800（無 ACM／SIG 會員）或 US$1300（至少一位作者是會員）；
    對應 ACM Open 機構的通訊作者或低收入國家機構免 APC。2026 年補貼期的實際金額頁面沒有列；付款前不會進入 production。
  - >-
    ORCID：投稿的主要作者在投稿時必須提供；全部作者在進入 production 前都要有有效 ORCID。
  - >-
    頁面內容可能過時：charter 署名是前任主編 Mauro Pezze，SCImago 頁仍列前任主編的信箱；首頁與作者須知現任是 Abhik Roychoudhury。
    Continuous Special Sections 頁的 Sustainable SE 段落內文錯寫成 quantum；Agentic AI 特刊時程有 2025／2026 年份筆誤。
  - >-
    Human AI Collaboration 特刊的截稿日（2026-10-01，已延長一次）與 Agentic AI 特刊（2025-11-01）都已過。
    該特刊把 reviews、technical reports、opinion pieces、white papers、沒有實質評估的工具或資料集列為 out of scope，只適用該特刊。
  - >-
    生成式 AI：研究過程中用到的 AI（資料、程式、實驗、分析等）必須在 methods 詳細描述；只用來協助寫作則不再要求揭露（ACM Policy on Authorship）。
  - >-
    投稿類型要在 ScholarOne 的 manuscript type 選對（Journal-First Paper、特刊名稱、RCR report、Registered Paper）；
    選錯類型會落入一般審查路徑，頁面沒有說明可否事後更改。
  - >-
    瀏覽器抓取：ACM 的所有頁面都有 Cloudflare，curl 一律 403；要用瀏覽器讀，且分頁要在前景才過得了驗證。
