--- # research-submission venue record
# 內容擷取自 ACM Digital Library 的 TOSEM 期刊頁、ACM 政策頁、Clarivate MJL 與 SCImago，2026-11-15。
#
# 抓取紀錄：dl.acm.org、www.acm.org、authors.acm.org、www.scimagojr.com 對 curl 一律回 Cloudflare 403（約 5.4–5.6 KB 挑戰頁），
# 全部改用 safari-browser（--profile 個人）讀取。Cloudflare 驗證頁在背景分頁會一直停在「請稍候...」（等了 70 秒以上沒過），
# 用 `safari-browser tab focus` 把自己開的分頁切到前景後約 10 秒內通過、之後同一個瀏覽器 session 的其他頁不再被擋。
# 沒有點任何驗證框、沒有解 CAPTCHA。
# mjl.clarivate.com 對 curl 回 200 + 約 11 KB 的 Angular 空殼（不含搜尋結果），搜尋結果要在瀏覽器裡填搜尋框才會出現。
#
# sources 全部是 method: browser，verify.py 會標 NEEDS_AGENT，沒有 http 來源可以建 hash 基準。

schema_version: 1
id: acm/tosem
kind: journal
family: software-engineering-journals
status: active

# ─────────────────────────────────────────────────────────────
sources:
  - id: journal_home
    role: authoritative
    url: https://dl.acm.org/journal/tosem
    note: >-
      期刊首頁：期刊簡介（scope 的短版）、主編、EISSN、最新一期、ACM 政策公告。
      導覽列的真實路徑（Author Guidelines、Journal-First Papers、Fast-Impact Track Papers、Continuous Special Sections、
      Calls for Papers、Reviewers、About、Open Access、Charter）都是從這一頁的連結取得，不是推測。
      首頁沒有 impact factor、錄取率、審查時間等數字。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        Cloudflare 挑戰頁：curl HTTP 403、約 5.4 KB。safari-browser 開在背景分頁時挑戰一直停在「請稍候...」，
        切到前景（tab focus）後約 10 秒通過。
      validity:
        must_contain: "publishes papers on all aspects of that challenge: specification, design, development and maintenance"
        min_extracted_chars: 2500
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: author_guidelines
    role: authoritative
    url: https://dl.acm.org/journal/tosem/author-guidelines
    note: >-
      規定本體：Paper Relevance（scope）、投稿方式、審查流程、ORCID、ACM 政策、作者權利、開放取用、Artifacts and Reproducibility、範本。
      全頁沒有一般論文的頁數／字數上限，沒有摘要字數，沒有說審查是單盲還是雙盲。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Cloudflare 挑戰頁（同 journal_home），curl HTTP 403、約 5.5 KB。
