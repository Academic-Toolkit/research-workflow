      extracted_sha256: null

  - id: cup_transparency
    role: authoritative
    url: https://www.cambridge.org/core/journals/mathematical-structures-in-computer-science/information/journal-policies/research-transparency
    note: Research transparency（資料與程式碼政策）：只是鼓勵，沒有強制條文。
    fetch:
      method: http
      http_viable: true
      validity:
