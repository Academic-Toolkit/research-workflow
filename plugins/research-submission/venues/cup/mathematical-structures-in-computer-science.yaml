--- # research-submission venue record
# 內容擷取自 Cambridge Core 的期刊頁面（出版：Cambridge University Press）、ScholarOne 投稿入口的登入頁、SCImago 與
# Clarivate Master Journal List，全部 2026-10-25。Cambridge 各子頁、ScholarOne、SCImago、MJL 經 Safari 讀頁面文字
# （document.body.innerText）；latest-issue 頁的一句編輯按語與 measuring-impact 頁的 Clarivate 指標說明，Safari 的 innerText
# 讀不到（前者在收合的摘要裡，後者內文不出現），改用 curl 取得的原始 HTML 抽出文字，見各 source 的 note。
# 出刊頻率與特刊的判斷另參考 Cambridge 的 All issues 與 Collections 頁，這兩頁只用 curl 取得的 HTML，沒有用 Safari 讀，也沒有列為 source。
# Cambridge 的頁面對 curl 都回正常內容（沒有 bot 挑戰頁），所以各 Cambridge source 的 fetch.method 記 http。
# ScholarOne 與 SCImago 對 curl 回 HTTP 403 的 Cloudflare 挑戰頁，只能用 Safari 讀，記 method: browser。
# MSCS 的須知集中在 Cambridge 的 Author instructions 底下四頁（首頁的 Editorial policy、Preparing your materials、
# Submitting your materials、Fees and pricing），沒有像 JSL 那樣分散到學會網站。期刊首頁連到
# .../information/instructions-contributors，該網址 2026-10-25 轉址到 .../information/author-instructions。
# 另外讀過但內容不足以成為 source 的頁面：contact-details（只有 Cambridge 通用的聯絡指引）、post-publication-impact
# （Altmetric 與分享的通用說明）、reviewer-benefits 沒有讀。

schema_version: 1
id: cup/mathematical-structures-in-computer-science
kind: journal
family: logic-journals
status: active

# ─────────────────────────────────────────────────────────────
# 來源與 provenance。所有 Cambridge 網址皆由期刊首頁與 Journal information 選單的連結取得，非推測。
# ─────────────────────────────────────────────────────────────
sources:
  - id: cup_instructions
    role: authoritative
    url: https://www.cambridge.org/core/journals/mathematical-structures-in-computer-science/information/author-instructions
    note: >-
      Author instructions 首頁，頁內小標 "Editorial policy"：本刊範圍的官方敘述（五段），是範圍的本體，比首頁的一段長得多。
      另有 "Article Type Publication Costs" 小標，只有一段 APC 豁免的文字，沒有文章類型表。
      期刊首頁的連結 .../information/instructions-contributors 轉址到這一頁。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "The journal aims to bridge the gap between theoretical contributions and software design"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: cup_preparing
    role: authoritative
    url: https://www.cambridge.org/core/journals/mathematical-structures-in-computer-science/information/author-instructions/preparing-your-materials
    note: >-
      Cambridge 的 "Preparing your materials"：檔案格式（PDF，LaTeX 另附）、版面（雙行距、摘要不超過 300 字）、圖、編號、Harvard 參考文獻格式、
      作者單位、競爭利益聲明、ORCID（通訊作者必填）、先前發表政策、補充材料、AI 工具聲明、無障礙要求。沒有頁數或字數上限。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Papers should begin with an abstract of not more than 300 words"
        min_extracted_chars: 10000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: cup_submitting
    role: authoritative
    url: https://www.cambridge.org/core/journals/mathematical-structures-in-computer-science/information/author-instructions/submitting-your-materials
    note: >-
      投稿入口（ScholarOne，https://mc.manuscriptcentral.com/mscs）、投稿即表示未曾發表也未在別處審查、LaTeX 版本在錄取時須交、ORCID、licence to publish。
      頁內顯示的網址文字被截成 "http://mc.manuscriptcentral.co..."，實際 href 為 http://mc.manuscriptcentral.com/mscs（頁內另有 "Proceed to submission system"
      按鈕連到 https://mc.manuscriptcentral.com/mscs）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Papers must be submitted as a PDF via the following online submission system"
        min_extracted_chars: 3500
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: cup_fees
    role: authoritative
    url: https://www.cambridge.org/core/journals/mathematical-structures-in-computer-science/information/author-instructions/fees-and-pricing
    note: APC 的金額表（GBP、USD）。頁面沒有彩色費、頁費或投稿費。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Article Processing Charges for this journal"
        min_extracted_chars: 1800
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: cup_oa
    role: authoritative
    url: https://www.cambridge.org/core/journals/mathematical-structures-in-computer-science/information/journal-policies/open-access-options
    note: 開放取用選項、機構協議、Green OA（沒有寫禁運月數）、Plan S、preprint 政策。頁面沒有申請 APC 豁免的辦法（見 warnings）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "This journal allows preprints to be posted anywhere at any time"
        min_extracted_chars: 3500
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: cup_review
    role: authoritative
    url: https://www.cambridge.org/core/journals/mathematical-structures-in-computer-science/information/peer-review-information/review-process
    note: 審稿模式（單匿名）；全頁只有一段，沒有申訴辦法（申訴見 cup_ethics）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "single-anonymized model of peer review"
        min_extracted_chars: 1400
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: cup_ethics
