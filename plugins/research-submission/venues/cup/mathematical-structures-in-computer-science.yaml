# ─────────────────────────────────────────────────────────────
identity:
  name: Mathematical Structures in Computer Science
  abbreviation: MSCS
  abbreviation_note: 'cup_instructions 寫 "Mathematical Structures in Computer Science (MSCS)"；ScholarOne 網址代碼為 mscs（來源 cup_submitting）'
  publisher: Cambridge University Press
  publisher_evidence: >-
    SCImago 出版社欄 "Cambridge University Press"，國別 United Kingdom；MJL 出版社欄
    "CAMBRIDGE UNIV PRESS , EDINBURGH BLDG, SHAFTESBURY RD, CAMBRIDGE, ENGLAND, CB2 8RU"。
    Cambridge 的 About 頁沒有寫擁有者，也沒有寫代表哪個學會出版（與 JSL 的 "on behalf of the owners" 不同）。
  issn: {print: "0960-1295", electronic: "1469-8072", src: cup_home}
  issn_cross_check: >-
    cup_about 同；SCImago 頁 "ISSN 09601295, 14698072"；MJL 搜尋 0960-1295 得 "ISSN / eISSN: 0960-1295 / 1469-8072"。四處一致。
  homepage: https://www.cambridge.org/core/journals/mathematical-structures-in-computer-science
  hosting_platform: {name: Cambridge Core, url: "https://www.cambridge.org/core/journals/mathematical-structures-in-computer-science"}
  subject_area:
    value: Theoretical computer science（以數學結構與數理邏輯為基礎）
    scimago: "Computer Science → Computer Science Applications；Mathematics → Mathematics (miscellaneous)"
    src: [cup_instructions, scimago]
  frequency:
    value: continuous publishing
    src: [cup_about, cup_latest]
    note: >-
      cup_about 寫 "Frequency: 1 issue per year"。cup_latest 的最新一期是 2024 年 11 月的 Volume 34 Special Issue 10，其 Editorial Preface 摘要寫
