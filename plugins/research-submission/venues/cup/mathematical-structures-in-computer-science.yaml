    note: >-
      Cambridge 的出版倫理政策在本刊的版本：作者資格與通訊作者責任、剽竊、重複發表、文字重用、論文改寫、審稿（至少兩位獨立審稿人、單匿名）、
      補充材料不審查、競爭利益、申訴。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "This journal usually requires a minimum of two independent peer reviewers"
        min_extracted_chars: 9000
    snapshot:
      fetched_at: 2026-10-25
