      這一頁是本刊已刊出文章的紀錄，不是範圍條款，也不是徵稿。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Foreword for the special issue"
        min_extracted_chars: 8000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

