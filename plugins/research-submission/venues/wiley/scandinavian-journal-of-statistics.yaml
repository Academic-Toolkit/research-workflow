identity:
  name: Scandinavian Journal of Statistics
  publisher:
    name: Wiley
    note: >-
      期刊首頁頁尾版權為 John Wiley & Sons；Clarivate MJL 的 Publisher 欄寫 "WILEY , 111 RIVER ST, HOBOKEN, USA, NJ, 07030-5774"。
    src: mjl
  owner:
    name: Board of the Foundation of the Scandinavian Journal of Statistics
    quote: "© Board of the Foundation of the Scandinavian Journal of Statistics"
    note: 期刊首頁標題區的版權行；頁面沒有進一步說明這個基金會的角色。
    src: journal_home
  societies:
    quote: "Scandinavian Journal of Statistics is published under the auspices of the Nordic statistical associations:"
    members:
      - Danish Society for Theoretical Statistics
      - Finnish Statistical Society
      - Norwegian Statistical Association
      - Swedish Statistical Society
    founded: {value: 1974, quote: "Founded in 1974 by four Scandinavian statistical societies", src: journal_home}
    src: society_info
  issn: {print: "0303-6898", electronic: "1467-9469", src: journal_home}
  homepage: https://onlinelibrary.wiley.com/journal/14679469
  hosting_platform: {name: Wiley Online Library, url: "https://onlinelibrary.wiley.com/journal/14679469"}
  editors:
    - {name: Rolf Larsson, affiliation: "Department of Mathematics, Uppsala University, Sweden", role: Editor, src: editorial_board}
    - {name: Xavier de Luna, affiliation: "Department of Statistics, Umeå University, Sweden", role: Editor, src: editorial_board}
    - {name: Aila Särkkä, affiliation: "Chalmers University of Technology and University of Gothenburg, Sweden", role: Editor, src: editorial_board}
  editor_term:
    status: not_published
    checked: 2026-11-13
    src: journal_home
    note: >-
      首頁寫三位 "have joined the journal as Editors for the next three years"，但沒有標任期年份。
      editorial_board 的 Previous Editors 以三年一屆列出（最近一屆標 2022–2024：Sangita Kulathinal、Jaakko Peltonen、
      Mikko Sillanpää），現任三位的任期起迄頁面沒寫。
  production_contact: {email: SJOS@wiley.com, role: Production Editor (contact page), src: contact}
  editorial_contact:
    status: not_published
    checked: 2026-11-13
    src: contact
    note: Contact 頁的 "Editorial Contact Information" 只寫 "See Author Guidelines."，沒有編輯部信箱。三位 Editors 的信箱在 editorial_board 頁，此處未抄錄。
  frequency:
    status: not_published
    checked: 2026-11-13
    src: journal_home
    note: >-
      期刊首頁、Overview 都沒有刊期的文字說明。首頁 Recent issues 列出 Volume 53 的四期（Issue 1 March 2026、
      Issue 2 June 2026、Issue 3 September 2026、Issue 4 December 2026），從這個列表可見一卷四期，但那是對列表的解讀，不是頁面的陳述。
  external_ids:
    crossref: "0303-6898"
    openalex: issn:0303-6898
  access:
    model: hybrid
    statement: "Scandinavian Journal of Statistics offers authors the option to publish their articles Open Access: immediately free to read, download, and share."
    note: >-
      期刊的頁面沒有直接寫 SJS 是 hybrid 期刊。這個分類是依 open_access 頁的 "offers authors the option to publish their
      articles Open Access"，以及首頁最近文章中只有部分標 "Open Access" 而判讀。oa_advantages 頁拿來比較的是
      "open access articles in hybrid journals"，並註明 "Note that the above metrics are program averages for our hybrid open
      access articles and individual journal metrics will vary"，那是 Wiley 整體的說法，不是對 SJS 的分類陳述。
    src: open_access
  indexing:
    clarivate_mjl:
      scie: true
      ssci: false
      ahci: false
      esci: false
      web_of_science_core_collection: Science Citation Index Expanded
      additional_indexes: [Current Contents Physical, Chemical & Earth Sciences, Essential Science Indicators]
      checked: 2026-11-13
      search_issn: "0303-6898"
      mjl_title_string: "SCANDINAVIAN JOURNAL OF STATISTICS"
      mjl_publisher_string: "WILEY , 111 RIVER ST, HOBOKEN, USA, NJ, 07030-5774"
      src: mjl
      note: >-
        搜尋 0303-6898 得 1 筆 "Exact Match Found"（ISSN / eISSN 0303-6898 / 1467-9469），Web of Science Core Collection
        欄只列 Science Citation Index Expanded；沒有 SSCI、AHCI、ESCI。Additional Web of Science Indexes 欄列
        Current Contents Physical, Chemical & Earth Sciences 與 Essential Science Indicators。
    publisher_stated:
      src: overview
      note: >-
        Overview 頁自述的收錄清單，另含 "Science Citation Index (Clarivate Analytics)"、SCOPUS、MathSciNet、zbMATH、
        Current Index to Statistics、PsycINFO 等；SCIE 以上方 MJL 為準，MJL 只列 SCIE。
      list: [ABI/INFORM Collection (ProQuest), Academic Search (EBSCO Publishing), Academic Search Alumni Edition (EBSCO Publishing), Academic Search Premier (EBSCO Publishing), Advanced Technologies & Aerospace Database (ProQuest), Business Premium Collection (ProQuest), CompuMath Citation Index (Clarivate Analytics), "Current Contents: Physical, Chemical & Earth Sciences (Clarivate Analytics)", Current Index to Statistics (ASA/IMS), Journal Citation Reports/Science Edition (Clarivate Analytics), Materials Science & Engineering Database (ProQuest), Mathematical Reviews/MathSciNet/Current Mathematical Publications (AMS), ProQuest, Proquest Business Collection (ProQuest), ProQuest Central (ProQuest), PsycINFO/Psychological Abstracts (APA), Quality Control & Applied Statistics (Executive Sciences Institute), Science Citation Index (Clarivate Analytics), Science Citation Index Expanded (Clarivate Analytics), SciTech Premium Collection (ProQuest), SCOPUS (Elsevier), Statistical Theory & Method Abstracts (Zentralblatt MATH), Technology Collection (ProQuest), ZBMATH (Zentralblatt MATH)]
  metrics:
    impact_factor:
      value: 1.2
      year: 2025
      provider: Clarivate
      as_of: 2026-11-13
      src: journal_metrics
      note: 頁面標 "2025 Journal Impact Factor (Clarivate):"；首頁同列 1.2。沒有說明 2025 是 JCR 發布年或資料年。
    journal_citation_indicator:
      value: 0.57
      year: 2025
      provider: Clarivate
      as_of: 2026-11-13
      src: journal_metrics
    citescore: {value: 2.2, year: 2025, provider: Scopus, as_of: 2026-11-13, src: journal_metrics}
    quartiles:
      - {system: SJR, category: "Statistics and Probability", subject_area: Mathematics, quartile: Q2, year: 2025, as_of: 2026-11-13, src: scimago}
      - system: SJR
        category: "Statistics, Probability and Uncertainty"
        subject_area: Decision Sciences
        quartile: Q2
        year: 2025
        as_of: 2026-11-13
        src: scimago
        note: >-
          SCImago 的 Subject Area and Category 欄列這兩個類別；表格 "Category / Year / Quartile" 中 2025 年兩者皆為 Q2。
          2024 年 Statistics and Probability 為 Q1、Statistics, Probability and Uncertainty 為 Q2。頁面同列 "SJR 2025" 為 0.786、
          H-Index 75。這是 SJR 分區，不是 JCR；SCImago 不是本刊官方頁面。
    jcr_quartile:
      status: not_published
      checked: 2026-11-13
      src: journal_metrics
      note: >-
        Wiley 的指標頁與首頁都沒有列分區或類別名次。JCR 需登入 Clarivate，本次未查，不填 JCR 分區。
        （此段原為 quartiles 欄的內容，2026-11-13 改放這裡，quartiles 改記 SCImago 的 SJR 分區。）
    acceptance_rate:
      value: "25%"
      year: 2025
      quote: "2025 Acceptance rate:"
      note: 數值 25% 在該行下一行；首頁摘要寫 "25% Acceptance Rate"。頁面沒有說明母體（投稿數、是否含 desk reject）與計算方式。
      as_of: 2026-11-13
      src: journal_metrics
    time_to_first_decision:
      value: 11
      unit: days
      statistic: median
      year: 2025
      quote: "2025 Submission to first decision (median) :"
      note: 頁面沒有說明起迄點，也沒有說明是否含不送外審的直接退稿。
      as_of: 2026-11-13
      src: journal_metrics
    time_submission_to_acceptance:
      value: 321
      unit: days
      statistic: median
      year: 2025
      quote: "2025 Submission to acceptance (median) :"
      note: 頁面沒有說明母體與計算方式。
      as_of: 2026-11-13
      src: journal_metrics
    time_acceptance_to_publication:
      value: 20
      unit: days
      statistic: median
      year: 2025
