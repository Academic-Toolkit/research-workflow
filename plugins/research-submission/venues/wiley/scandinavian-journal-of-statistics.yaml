  policies:
    dual_submission: forbidden
    prior_publication:
      quote: >-
        Submission of a manuscript is held to imply that the paper has neither been published elsewhere, including
        conference proceedings, nor is under consideration by any other journal.
      src: author_guidelines
    conference_extension:
      allowed: conditional
      quote: >-
        Extended versions of works published in part in a conference proceedings can be considered for publication,
        provided that the submission has been extended with substantial new contributions and that it does not have
        excessive textual overlap with the previous conference publication; authors must indicate such extension in
        their cover letter, and must cite the original publication in the new manuscript and clearly describe the extension.
      src: author_guidelines
    after_acceptance:
      quote: "Furthermore, once a paper is accepted it must not be published elsewhere in the same or similar form without the Editors’ written consent."
      src: author_guidelines
    plagiarism_and_dual_publication:
      statement: >-
        SJS follows the general Wiley guidelines, 並對數學論文另加三條具體規則（逐字如下）。
      rules_quote:
        - "Avoid word‐by‐word copying of whole sentences, and definitely, whole paragraphs."
        - "If a definition or theorem is taken from other work, and is not well known, use clear citation of the source, even if adapted to a new setting."
        - "Proofs that are just minor modifications of previously published proofs should not be included, but instead handled by reference, with an explanation of necessary modifications."
      wiley_ethics_page: {url: "https://authorservices.wiley.com/ethics-guidelines/dual-publication-plagiarism-and-defamation.html", note: 連結目標頁本次未讀}
      src: author_guidelines
    preprints:
      allowed: true
      quote: >-
        Scandinavian Journal of Statistics will consider for review articles previously available as preprints. Authors
        may also post the submitted version of a manuscript to a preprint server at any time. Authors are requested to
        update any pre-publication versions with a link to the final published article.
      wiley_wide: >-
        Wiley 全社政策頁（wiley_preprints）說 "A number of Wiley journals have set policies independently and authors should
        refer to the policy on the individual journal pages."，SJS 的頁面有上面這段自己的規定。
      src: author_guidelines
    generative_ai:
      journal_statement:
        quote: "Authors may wish to refer to Wiley's guidelines on using AI tools in your research."
        src: author_guidelines
      journal_specific_policy:
        status: not_published
        checked: 2026-11-13
        src: author_guidelines
        note: SJS 頁面沒有自己的生成式 AI 政策，只用上面這句指向 Wiley 全社指引。
      wiley_wide:
        disclosure_quote: "Disclose your use of AI transparently in your manuscript so readers can understand your process"
        disclosure_placement_quote: "In your Acknowledgments when AI assists with manuscript drafting, editing, translation, or formatting."
        requirement_quote: "Wiley requires disclosure of AI when used to generate substantial text or restructure arguments."
        journal_policies_vary: "Editorial policies vary in what types of AI use they permit."
        note: >-
          以上是 Wiley 全社指引的句子（wiley_ai_guidelines），2026-11-13 重查時四句都在 curl 取得的 HTML 去標籤後的文字中
          （畫面上是否預設折疊本次沒有核對）。該指引是否逐字適用於 SJS，SJS 頁面沒有再說明，
          只說 "Authors may wish to refer to"。
        src: wiley_ai_guidelines
    copyright:
      transfer_unless_open_access: >-
        未選開放取用時，通訊作者簽 Copyright Assignment Form；經 Author Services 的 Wiley Author Licensing Service (WALS) 簽署。
      open_access_licences: [CC BY, CC BY-NC, CC BY-NC-ND]
      funder_deposit: >-
        NIH、RCUK 成員與 Wellcome Trust 等資助者要求錄取稿在禁運期後存放於典藏庫；Wellcome 與 RCUK 資助的開放取用稿件可用 CC-BY。
      src: author_guidelines
    early_view:
      statement: "Early View articles are complete and final."
      note: Early View 文章已完成審稿、修訂與編修，上線後不能再修改；以 DOI 引用。
      src: author_guidelines
    offprints: 通訊作者在註冊 Author Services 後，於印刷版出刊時可得免費 PDF offprint
    conflict_of_interest: {status: not_published, checked: 2026-11-13, src: author_guidelines}
    orcid: {status: not_published, checked: 2026-11-13, src: author_guidelines}
    funding_statement: {status: not_published, checked: 2026-11-13, src: author_guidelines}
    ethics: {status: not_published, checked: 2026-11-13, src: author_guidelines, note: SJS 頁面除了抄襲與重複發表之外沒有其他倫理聲明要求。}

