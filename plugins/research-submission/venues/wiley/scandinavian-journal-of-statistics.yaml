--- # research-submission venue record
# 內容擷取自 Wiley Online Library 上 Scandinavian Journal of Statistics（SJS）自己的頁面，以及
# 作者指引頁連出的 Wiley 全社政策頁（AI、preprint、資料分享、審稿），2026-11-13。
# onlinelibrary.wiley.com 全站由 Cloudflare managed challenge 擋 curl（HTTP 403），期刊頁面是用
# safari-browser 讀 document.body.innerText 取得；authors.wiley.com 與 wiley.com 的政策頁 curl 讀得到。
# 所有子頁網址皆由期刊首頁的導覽選單與作者指引頁內的連結取得，非推測。
# SJS 的須知只有一頁（Author Guidelines），規定本體都在那一頁；期刊本身沒有獨立的 scope 頁以外的
# 篇幅、審稿、資料政策頁。這些欄位多數是「查過，官方沒寫」，已逐項標 not_published。

schema_version: 1
id: wiley/scandinavian-journal-of-statistics
kind: journal
family: statistics-journals
status: active

# ─────────────────────────────────────────────────────────────
sources:
  - id: author_guidelines
    role: authoritative
    url: https://onlinelibrary.wiley.com/page/journal/14679469/homepage/forauthors.html
    note: >-
      期刊首頁選單 AUTHORS 底下的 "Author Guidelines"，也是首頁 "Submit an article" 與 "Submit a Manuscript"
      連到的頁面。SJS 的投稿規定本體全在這一頁（約 23,700 字元）：投稿條件、語言、稿件準備（Word 或 LaTeX、
      摘要與關鍵詞、參考文獻、定理排版）、Supporting Information、數學論文的抄襲規則、preprint、版權與 OA 授權。
      頁內沒有篇幅上限、審稿制度、資料與程式碼政策（innerText 與 DOM textContent 都查過）。頁內 "Guidelines for the
      preparation of Supporting Information are available here" 連到 http://olabout.wiley.com/WileyCDA/Section/id-828014.html，
      2026-11-13 重查時 curl 得 301 轉 https，之後 20 秒逾時、0 bytes，讀不到（同日較早一次未經複核的紀錄寫 HTTP 522；見 warnings）。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        Cloudflare managed challenge：curl 回 HTTP 403 + 約 5.5 KB 的 "Just a moment..." 頁
        （2026-11-13 測試 onlinelibrary.wiley.com 的 10 個不同 URL，皆 403、5472–5659 bytes）。
        須以 safari-browser 開啟後讀 innerText。
      validity:
        must_contain: "Submission of a manuscript is held to imply that the paper has neither been published elsewhere"
        min_extracted_chars: 14000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: overview
    role: authoritative
    url: https://onlinelibrary.wiley.com/page/journal/14679469/homepage/productinformation.html
    note: >-
      首頁選單 ABOUT 底下的 "Overview"。載有 Aims and Scope 與出版社自述的收錄清單。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "more than eighty per cent of the manuscripts are submitted from outside Scandinavia"
        min_extracted_chars: 2000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: journal_home
    role: authoritative
    url: https://onlinelibrary.wiley.com/journal/14679469
    note: >-
      期刊首頁：ISSN、版權歸屬、現任編輯、一句話宗旨與應用領域、Journal Metrics 摘要。
      導覽選單的 ABOUT 與 AUTHORS 底下的各子頁連結從這裡取得。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁，5472 bytes）。
      validity:
        must_contain: "well justified by theory and numerical experiments"
        min_extracted_chars: 3500
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: journal_metrics
    role: authoritative
    url: https://onlinelibrary.wiley.com/journal/14679469/journal-metrics
    note: >-
      首頁 "Journal Metrics" 與 "VIEW ALL METRICS" 連到的頁面。Wiley 為各刊統一格式的指標頁，標 2025 年：
      CiteScore、Journal Citation Indicator、Journal Impact Factor、錄取率、首次決定與接受的中位天數。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "Submission to first decision (median)"
        min_extracted_chars: 1500
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: open_access
    role: authoritative
    url: https://onlinelibrary.wiley.com/page/journal/14679469/homepage/fundedaccess.html
    note: 首頁選單 AUTHORS 底下的 "Open Access"：APC 金額、授權、稅。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "submissions will be subject to an APC if accepted and published in the journal"
        min_extracted_chars: 2600
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: editorial_board
    role: supporting
    url: https://onlinelibrary.wiley.com/page/journal/14679469/homepage/editorialboard.html
    note: 首頁選單 ABOUT 底下的 "Editorial Board"：三位 Editors、副編輯名單、歷任 Editors（每屆三年）。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "Associate Editors"
        min_extracted_chars: 2000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: society_info
    role: supporting
    url: https://onlinelibrary.wiley.com/page/journal/14679469/homepage/society.html
    note: 首頁選單 ABOUT 底下的 "Society Information"：四個北歐統計學會。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "published under the auspices of the Nordic statistical associations"
        min_extracted_chars: 900
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: special_issues
    role: supporting
    url: https://onlinelibrary.wiley.com/page/journal/14679469/homepage/special-issues
    note: 首頁選單的 "Special Issues"：只列已出刊的 special section，沒有徵稿公告。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "Special Section in Honour of Nils Lid Hjort"
        min_extracted_chars: 900
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: contact
    role: supporting
    url: https://onlinelibrary.wiley.com/page/journal/14679469/homepage/contact.html
    note: >-
      首頁選單的 "Contact"。編輯聯絡處寫 "See Author Guidelines."，只列出版端的聯絡信箱。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "Editorial Contact Information"
        min_extracted_chars: 900
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: supporting_information
    role: supporting
    url: https://onlinelibrary.wiley.com/page/journal/14679469/homepage/supporting_information.htm
    note: >-
      首頁 "More from this journal" 的 "Supporting Information"。2026-11-13 這一頁只列帶有 Supporting Information
      的文章標題，沒有任何準備補充材料的規則（規則在 author_guidelines 的第 xi 點）。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "Don't Miss Supporting Information from Scandinavian Journal of Statistics"
        min_extracted_chars: 4000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: wiley_ai_guidelines
    role: supporting
    url: https://www.wiley.com/en-us/publish/article/ai-guidelines/
    note: >-
      作者指引頁 "Authors may wish to refer to Wiley's guidelines on using AI tools in your research." 的連結目標
      （curl 轉址到 https://www.wiley.com/publishing/article/ai-guidelines）。這是 Wiley 全社的 AI 指引，
      不是 SJS 自己的規定；SJS 頁面只指向它。下方引用的揭露位置等句子，2026-11-13 重查時在 curl 取得的原始 HTML 中找到；
      這些句子在瀏覽器畫面上是否預設折疊，本次沒有用 Safari 核對。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Disclose your use of AI transparently in your manuscript so readers can understand your process"
        min_extracted_chars: 50000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: wiley_preprints
    role: supporting
    url: https://authors.wiley.com/author-resources/Journal-Authors/open-access/preprints-policy.html
    note: >-
      作者指引頁 "Please find the Wiley preprint policy here." 的連結目標（原連結為 authorservices.wiley.com
      並帶 ?1，轉址到 authors.wiley.com）。Wiley 全社政策，頁尾說各刊可自訂，以期刊自己的頁面為準；
      SJS 自己的 preprint 規定在 author_guidelines 第 7 點。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Wiley believes journals should allow authors to submit manuscripts which they have already made available as a preprint"
        min_extracted_chars: 2000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: wiley_data_sharing
    role: supporting
    url: https://authors.wiley.com/author-resources/Journal-Authors/open-access/data-sharing-citation/data-sharing-policy.html
    note: >-
      從 Wiley 作者資源的 "Data Sharing & Citation" 頁點入的 "Data Sharing Policy"。2026-11-13 以 Safari 確認：
      preprint 政策頁的側欄有 "Data Sharing & Citation" 連結（curl 取得的 HTML 裡沒有這個側欄連結），
      該頁再連到本頁。Wiley 全社的四級資料分享政策。SJS 的頁面沒有寫自己屬於哪一級。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "All research- and synthesis-based articles must include a Data Availability Statement"
        min_extracted_chars: 5000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: wiley_peer_review
    role: supporting
    url: https://authors.wiley.com/author-resources/Journal-Authors/submission-peer-review/peer-review.html
    note: >-
      Wiley 作者資源的 "Peer Review" 頁。只描述 Wiley 全社的審稿類型與流程，沒有列出 SJS 用哪一種；
      頁內 "check the review model for each journal we publish" 連到 review confidentiality policy 頁。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "The length of the peer review process varies by journal"
        min_extracted_chars: 8000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: wiley_review_confidentiality
    role: supporting
    url: https://authors.wiley.com/Reviewers/journal-reviewers/tools-and-resources/review-confidentiality-policy.html
    note: >-
      peer_review 頁 "check the review model for each journal we publish" 的連結目標。Wiley 全社的審稿保密政策，
      沒有逐刊列出審稿制度。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Journals with open review policies will have this noted within their Author Guidelines"
        min_extracted_chars: 1600
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: invited_papers
    role: supporting
    url: https://onlinelibrary.wiley.com/journal/14679469/invited-papers
    note: >-
      首頁 "More from this journal" 的 "Invited Papers"：NORDSTAT 與 Nordic-Baltic Biometric Conference 的 SJS 講者
      受邀投稿與已刊出的三篇。2026-11-13 重查時新增為來源（article_types 的說明引用它）。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "The speakers are invited to submit a paper to the journal in relation to their talk."
        min_extracted_chars: 1500
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: news
    role: supporting
    url: https://onlinelibrary.wiley.com/page/journal/14679469/homepage/news.html
    note: >-
      首頁 "More from this journal" 的 "News"：SJS Lecture 歷年紀錄、SJS Prize、Early View、NIH 公開取用說明。
      沒有投稿規定或題材限制。2026-11-13 重查時新增為來源，作為 out_of_scope_hints 查過的頁面之一。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "Scandinavian Journal of Statistics Lectures"
        min_extracted_chars: 2500
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: oa_advantages
    role: supporting
    url: https://onlinelibrary.wiley.com/page/journal/14679469/homepage/oa-advantages
    note: >-
      首頁選單 ABOUT 底下的 "OA Advantages"。只有 Wiley 混合型期刊開放取用文章的整體平均（views、citations、Altmetric），
      頁面註明是 "program averages"，不是 SJS 自己的數字。2026-11-13 重查時新增為來源（identity.access 引用它）。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "Publish Open Access with Scandinavian Journal of Statistics"
        min_extracted_chars: 1800
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: mjl
    role: supporting
    url: https://mjl.clarivate.com/home
    note: >-
      Clarivate Master Journal List。在 /home 的 #search-box 填 ISSN 0303-6898、按 #search-button 查詢，
      結果頁網址不帶查詢字串（https://mjl.clarivate.com/search-results），無法用網址重現，只能在頁內操作。
      curl 回 HTTP 200 + 11428 bytes 的 JavaScript 空殼，去標籤後只剩頁面標題（約 60 字元），沒有期刊資料。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        JavaScript 應用程式空殼（HTTP 200、11428 bytes、去標籤後只剩頁面標題）；查詢結果只在頁內產生，
        verify.py 無法重抓。重新驗證時用 safari-browser 在 /home 搜尋 ISSN。
    snapshot: {fetched_at: 2026-11-13, last_verified_at: 2026-11-13}

  - id: scimago
    role: supporting
    url: https://www.scimagojr.com/journalsearch.php?q=14072&tip=sid&clean=0
    note: >-
      SCImago（SJR）期刊頁。sid 14072 由 journalsearch.php?q=0303-6898&tip=iss&clean=0 的搜尋結果取得（只列 "Scandinavian Journal of
      Statistics" 一筆，出版者標 "Wiley-Blackwell Publishing Ltd"）。curl 回 403 Cloudflare 挑戰頁，2026-11-13 以 Safari 讀到約 21.6 K 字元。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "403, Cloudflare challenge page (~5.7 KB)"
      validity:
        must_contain: "The set of journals have been ranked according to their SJR and divided into four equal groups"
        min_extracted_chars: 12000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

