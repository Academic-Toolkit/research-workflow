# ─────────────────────────────────────────────────────────────
# SLOW — 數年不變。
# ─────────────────────────────────────────────────────────────
requirements:
  refresh: {check_every: P6M, method: extracted_hash_diff}

  scope:
    aims:
      quote: >-
        The Scandinavian Journal of Statistics publishes significant, innovative, original contributions to
        statistical methodology, well justified by theory and numerical experiments, and illustrated by real data.
      src: journal_home
    aims_overview:
      quote: >-
        It is an international journal devoted to reporting significant and innovative original contributions to
        statistical methodology, well justified by theory and numerical experiments, and illustrated by real data
        applications. The journal specialises in statistical modelling showing particular appreciation of the
        underlying substantive research problems.
      src: overview
    application_fields_listed:
      quote: >-
        We specialise in statistical works that appreciate the underlying substantive research problems, e.g., in
        mathematical statistics, robust statistics, survival analysis, causal inference, high dimensional statistics,
        machine learning, Bayesian computation, extreme-value theory, longitudinal, and spatial data.
      note: 原文用 "e.g."，是舉例而非封閉清單。
      src: journal_home
    theory_application_balance:
      status: not_published
      checked: 2026-11-13
      src: overview
      note: >-
        頁面沒有說理論與應用的比重。上面兩句 aims 的措辭把三樣東西並列為對統計方法論貢獻的描述：
        首頁寫 "well justified by theory and numerical experiments, and illustrated by real data"，
        Overview 寫 "well justified by theory and numerical experiments, and illustrated by real data applications"，
        即理論、數值實驗、真實資料例子。頁面沒有寫缺少其中一項的稿件會被怎麼處理，也沒有寫三者的先後。
        首頁與 Overview 的主詞都是 "statistical methodology"，頁面沒有出現純理論或純應用論文的專門說明。
    evaluation_criteria:
      status: not_published
      checked: 2026-11-13
      src: author_guidelines
      note: >-
        查過 journal_home、overview、author_guidelines、contact、editorial_board、news、invited_papers：沒有給審稿人的評分判準頁，
        也沒有 referee guidelines。首頁的 "Reviewer Resources" 連到 Wiley 全社的審稿人頁，不是 SJS 專屬，
        wiley_peer_review 的 "What is the reviewer looking for?" 同樣是全社通用清單，都未收錄為 SJS 的判準。
    out_of_scope_hints:
      status: not_published
      checked: 2026-11-13
      src: overview
      note: >-
        查過 journal_home、overview、author_guidelines、contact、editorial_board、society_info、special_issues、news、
        invited_papers、oa_advantages、journal_metrics、open_access（2026-11-13 重查，author_guidelines 另查 DOM textContent）：
        沒有一句話說明期刊不想要哪一類稿件，
        或給哪一類較低優先。與「什麼稿件不要」最接近的是 author_guidelines 的兩條內容限制，見
        policies.plagiarism_and_dual_publication 與 policies.dual_submission，它們談的是重複與抄襲，不是題材。
    internationality:
      quote: "Today more than eighty per cent of the manuscripts are submitted from outside Scandinavia."
      src: overview

  article_types:
    status: not_published
    checked: 2026-11-13
    src: author_guidelines
    note: >-
      author_guidelines 沒有文章類型清單，也沒有各類型的限制。首頁最近五篇都標 "ORIGINAL ARTICLE"；
      首頁 "More from this journal" 另有 Invited Papers（invited_papers 頁：NORDSTAT 與 Nordic-Baltic Biometric Conference 的
      SJS 講者 "are invited to submit a paper to the journal in relation to their talk"）與 Special Issues（只列已出刊的 special section）。Practitioner Points 是
      author_guidelines 裡的選填項目，不是文章類型。

  # schema 的 length 需要 value + unit。SJS 的頁面沒有任何頁數或字數上限，不能編一個值，
  # 所以放在 length_policy（venue_table.py 會把它當作「查過，沒有」）。
  length_policy:
    status: not_published
    checked: 2026-11-13
    src: author_guidelines
    note: >-
      author_guidelines 全頁沒有出現篇幅上限（無頁數、字數或圖表數限制）。與篇幅有關的只有行距要求：
      "at least 1 1/2 spacing (18 points) and wide margins"，那是排版要求不是上限。
      另有 "The main text should be readable as a standalone document. Long proofs can be placed in an Appendix."，
      以及把程式碼與大量模擬結果移到 Supporting Information 的許可，見 supplementary_material。

  abstracts:
    - id: main
      max_words: 150
      required_at: submission
      structure: 結構式（intro/methods/results/conclusion）或非結構式皆可
      rules:
        - 不含公式
        - 不含對其他文獻的引用
      quote: >-
        The main text should be preceded by a short abstract of not more than 150 words containing no formulas or
        references to other literature.
      structure_quote: "Abstract structured (intro/methods/results/conclusion) or unstructured;"
      note: 摘要字數上限出自 author_guidelines 的 "iii) Abstract and key words"，主文件內容清單另寫結構式或非結構式。
      src: author_guidelines
  keywords:
    conflict:
      detail: >-
        author_guidelines 對關鍵詞數量說了兩個不同的上限：主文件內容清單寫 "Up to seven keywords;"，
        "iii) Abstract and key words" 寫 "A list of not more than 10 key words, in alphabetical order, and indicating the
        content of the paper, should be included after the abstract. No classification codes are needed."
      max_by_main_document_list: 7
      max_by_abstract_section: 10
      ordering: alphabetical（見 iii）
      classification_codes: 不需要（"No classification codes are needed."）
      src: author_guidelines
  practitioner_points:
    required: false
    quote: >-
      Practitioner Points (optional) Authors will need to provide no more than 3 ‘key points’, written with the
      practitioner in mind, that summarize the key messages of their paper to be published with their article;
    src: author_guidelines
  running_headline: {max_characters: 40, quote: "running headline (containing not more than 40 characters, spacings included)", src: author_guidelines}

  formatting:
    typesetting: Word 或 LaTeX 皆可
    main_file_quote: "The main manuscript file can be submitted in Microsoft Word (.doc or .docx) or LaTeX (.tex) format."
    single_or_split_files: >-
      初次投稿可以是單一檔案（含主文、表、圖）或圖表另檔；進入修訂階段時圖表必須另檔。
    main_document_contents:
      quote: "Main body: formatted as introduction, materials & methods, results, discussion, conclusion;"
      note: >-
        出自 author_guidelines "Your main document file should include:" 清單（同一清單還有標題、作者全名與機構、
        Acknowledgments、摘要、"Up to seven keywords;"、選填的 Practitioner Points、References、Tables、Figure legends）。
        這是 Wiley 通用清單的措辭，頁面沒有說數學或理論論文是否須照這五段排列。
      src: author_guidelines
    spacing_and_margins:
      quote: "The manuscripts should have at least 1 1/2 spacing (18 points) and wide margins."
    latex:
      template_recommended:
        quote: "For author requiring a LaTeX template, we strongly recommend reviewing Wiley’s New Journal Design (NJD) LaTeX Authoring Template."
        link: https://authorservices.wiley.com/author-resources/Journal-Authors/Prepare/new-journal-design.html
        note: 連結目標頁本次未讀；上述網址取自 author_guidelines 頁內連結。
      authorea_template:
        quote: "Note that using this template is optional."
        link: https://authorea.com/templates/scandinavian_journal_of_statistics
        note: 連結目標頁本次未讀。
      upload_designations:
        - 'Main Document – LaTeX .tex File（主文件的檔案類別）'
        - 'Main Document - LaTeX PDF（同行評審用的 PDF）'
        - 'LaTeX Supplementary File（主文引用的其他支援檔）'
      pdf_for_review:
        quote: "When submitting a LaTeX Main Document, you must also provide a PDF version of the manuscript for Peer Review."
      post_acceptance_files: >-
        錄取後須提供：無錯誤編譯的 PDF；LaTeX 原始檔（文字、圖說、表，最好在單一檔案）；BibTeX 檔（如有使用）與所有編譯所需檔案
        （特別是 NJD 範本類別以外的樣式、類別或參考文獻檔 .bbl/.bst/.blg）；圖檔用 EPS、PDF 或 TIFF，
        並要求 "not to create figures using LaTeX codes"。
      src: author_guidelines
    title_page: 第一頁含標題、running headline（≤40 字元含空白）、作者姓名與所屬機構；標題不得含縮寫
    headings: 最好編號；不要用不必要的大寫
    formulas: >-
      盡量減少頁面空白，用 a/b 取代分式、用轉置的列向量取代行向量；獨立公式與正文分開，編號放右側括號，
      連續編號 (1), (2)…
    theorems:
      quote: >-
        The words “Theorem”, “Lemma”, “Corollary”, “Proposition” and “Definition” (and their appropriate numerals)
        are to appear in bold face. The complete body of a theorem, lemma, corollary and proposition is to appear in
        italics.
      src: author_guidelines
    references:
      order: 依字母序；同作者依年代；同年用 a, b, c 區分
      in_text_et_al: 'et al. 用於六位以上作者的文內引用（"et al. is used for references in the text when there are six or more authors"）'
      list_style: >-
        頁面只給例子、沒有指名任何格式手冊；例子的寫法是作者、年、標題、刊名、卷、頁、DOI。"More than 7 authors" 的例子
        列前六位作者後以 "…" 接最後一位（這是對例子的描述，頁面沒有用文字寫成規則）。
      personal_communication: 'Not allowed in reference list. Cite in text only.'
      src: author_guidelines
    tables_and_figures:
      tables: 'Tables and should be given on separate pages at the end of the manuscript.'
      tables_note: 此句與上方 single_or_split_files 的「初次投稿可為單一檔案」並存，頁面沒有調和兩者。
      figures: 圖用 PDF、TIFF 或 EPS，檔名標明圖號；向量圖優先，必要時用 300 dpi 以上的點陣圖
      final_resolution: 錄取後圖檔 EPS、TIFF 或 PDF，解析度不低於 300 dpi
      colour: {quote: "Colour figures may be published in print free of charge.", src: author_guidelines}
    footnotes: "Should be avoided as far as possible."
    address_and_appendices: 稿末附作者現址與 e-mail；附錄放在地址之後；合著論文只列一位作者的地址
    language: >-
      英文。"Authors are solely responsible for their written English."；
      編輯若認為語言不可接受，作者須在錄取前自行修訂。
    src: author_guidelines

  supplementary_material:
    allowed: true
    statement: "Scandinavian Journal of Statistics encourages supporting web materials."
    main_text_standalone:
      quote: >-
        The main text should be readable as a standalone document. Long proofs can be placed in an Appendix. Other
        contents, such as computer code and extensive simulation results, not essential to the main results can be
        made available as Supporting Information. Detailed references to results in Supporting Information should be
        avoided.
    may_include: 詳細證明、額外表與圖、電腦程式碼、資料集、影片檔（"detailed proofs, additional tables and figures, computer code, datasets and movie files"）
    listing_rule: >-
      列在參考文獻之前，以 "Supporting information. Additional information for this article is available online"
      開頭並附簡短說明；編號 Appendix S1、Fig. S1、Table S1 等。
    self_contained_references: "Supporting Information should include a list of references for any literature referred to therein, to make it a self-contained piece of work."
    submission: >-
      以 "online supporting information" 為名，與主文件一起經投稿系統上傳。
    preparation_guidelines_link:
      status: not_found
      checked: 2026-11-13
      note: >-
        頁內 "Guidelines for the preparation of Supporting Information are available here" 連到
        http://olabout.wiley.com/WileyCDA/Section/id-828014.html。2026-11-13 重查時 curl 得 301 轉 https，之後 20 秒逾時、
        0 bytes，讀不到（同日較早一次未經複核的紀錄寫 HTTP 522）。
        supporting_information 頁也只列文章標題，沒有準備規則。
      src: author_guidelines
    src: author_guidelines

  openness:
    data_and_code:
      status: not_published
      checked: 2026-11-13
      src: author_guidelines
      note: >-
        SJS 的 author_guidelines、overview、journal_home 都沒有資料或程式碼的公開政策，也沒有說期刊屬於
        Wiley 四級資料政策中的哪一級。唯一相關的是上面 supplementary_material 的許可：程式碼與大量模擬結果
        "can be made available as Supporting Information"（"can"，非要求）。
    wiley_wide_policy:
      quote: >-
        All research- and synthesis-based articles must include a Data Availability Statement, whether or not the data
        used in the article is shared.
      levels: [Encourages Data Sharing, Expects Data Sharing, Mandates Data Sharing, Mandates Data Sharing and Peer Reviews Data]
      note: >-
        這是 Wiley 全社資料分享政策頁的句子，頁面接著說各刊依表中四級之一設定。SJS 屬於哪一級、
        純理論論文是否算 "research- and synthesis-based articles" 都沒有在 SJS 頁面或 Wiley 政策頁中明說。
      src: wiley_data_sharing
    preregistration: {status: not_published, checked: 2026-11-13, src: author_guidelines}
    reporting_standards: {status: not_published, checked: 2026-11-13, src: author_guidelines}

  review:
    type: not_published
    checked: 2026-11-13
    src: author_guidelines
    statement: >-
      查過 journal_home、overview、author_guidelines、editorial_board、society_info、contact：沒有一處說明 SJS
      是 single-anonymised、double-anonymised 還是其他審稿制度，也沒有作者匿名稿件的要求。
      wiley_peer_review 說 Wiley 有多種審稿類型，並說 "The length of the peer review process varies by journal"；
      wiley_review_confidentiality 說 "Journals with open review policies will have this noted within their Author
      Guidelines"。SJS 的 author_guidelines 沒有這樣的註記，但這只能排除「公開審稿」，不能判定是單盲或雙盲。
      作者那一側：author_guidelines 要求主文件與首頁列出作者姓名與機構（見 author_anonymization），
      所以投稿稿件不匿名；審稿人是否匿名，頁面沒有寫。2026-11-13 重查時 author_guidelines 另查了 DOM textContent，
      沒有 anonym、blind 等字。
    open_review_note_quote: "Journals with open review policies will have this noted within their Author Guidelines."
    open_review_note_src: wiley_review_confidentiality
    author_anonymization:
      required: false
      quote: >-
        The full names of the authors with institutional affiliations where the work was conducted, with a footnote for
        the author’s present address if different from where the work was conducted;
      first_page_quote: >-
        The first page should contain: title of the paper, running headline (containing not more than 40 characters,
        spacings included), authors’ names, and the institutions to which the authors are affiliated.
      note: >-
        兩句都要求稿件本身列出作者姓名，頁面沒有匿名稿或去識別化版本的選項。這是對作者端的要求，
        不等於期刊說明了審稿制度（review.type 仍為 not_published）。
      src: author_guidelines
    author_may_suggest_reviewers: {status: not_published, checked: 2026-11-13, src: author_guidelines}
    outcomes_and_stages: {status: not_published, checked: 2026-11-13, src: author_guidelines, note: SJS 頁面沒有說明審稿階段、決定類別或時程目標；只有 journal_metrics 的 2025 年實際中位數。}
    published_timings:
      first_decision_median_days: {value: 11, year: 2025, src: journal_metrics}
      submission_to_acceptance_median_days: {value: 321, year: 2025, src: journal_metrics}
      acceptance_to_publication_median_days: {value: 20, year: 2025, src: journal_metrics}
      note: 首次決定與接受的中位數差距大（11 天 vs 321 天），頁面沒有說明兩者的母體與起迄點是否相同。
    proofs: {quote: "Note that proofs should be returned within 48 hours from receipt of first proof.", src: author_guidelines}
    language: 編輯若判定語言不可接受，作者須自行負責修訂；Wiley Editing Services 是選配服務
    language_src: author_guidelines

  submission:
    portal: https://authors.wiley.com/journal/SJOS
    system: Wiley Authors 投稿入口（登入走 Wiley ScienceConnect）
    portal_verified: true
    portal_note: >-
      2026-11-13 重查時以 safari-browser 兩個連結都開過：author_guidelines 的 "Wiley Authors submission portal" 與
      "Start your submission" 連結（https://authors.wiley.com/journal/SJOS），以及同頁的 "Research Exchange Submission portal"
      連結（https://wiley.atyponrex.com/journal/SJOS），都轉到 https://wiley.scienceconnect.io/login，頁面是
      「登录 CONNECT 以继续访问 Wiley Authors」的登入表單（介面語言為簡體中文）。兩個入口頁都打得開；沒有登入，
      所以投稿表單、投稿系統內的欄位與勾選項沒有看到。curl 對兩個網址都回 HTTP 200 + 1319 bytes 的 JavaScript 空殼
      （最後網址分別為 authors.wiley.com/dashboard/journal/SJOS 與 authors.wiley.com/dashboard/journal?groupCode=SJOS）。
    instruction_inconsistency: >-
      author_guidelines 第 1 點寫 "New submissions should be made via the Wiley Authors submission portal"，並說
      在 submission.wiley.com 的 "My Submissions" 查進度；LaTeX 段落與 Supporting Information 段落則寫
      "Research Exchange"（"via Research Exchange"、"Research Exchange Submission portal"）。頁面沒有說兩者是否為同一系統，
      本次兩個連結都導向同一個 Wiley 登入頁。
    status_tracking: "You may check the status of your submission at any time by logging on to submission.wiley.com and clicking the “My Submissions” button."
    technical_help: submissionhelp@wiley.com（頁面給的投稿系統技術支援）
    conditions:
      quote: >-
        Submission of a manuscript is held to imply that the paper has neither been published elsewhere, including
        conference proceedings, nor is under consideration by any other journal.
    cover_letter_must_state:
      - 稿件是先前研討會論文集論文的延伸版時，須在 cover letter 說明（見 policies.conference_extension）
    language: 英文
    src: author_guidelines

