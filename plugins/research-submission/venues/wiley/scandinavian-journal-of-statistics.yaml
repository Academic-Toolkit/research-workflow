# ─────────────────────────────────────────────────────────────
warnings:
  - >-
    篇幅上限官方沒有寫：author_guidelines 全頁沒有頁數、字數或圖表數限制（已逐段檢查），只要求至少 1.5 倍行距（18 點）與寬邊界。
    沒有上限不等於沒有編輯判斷；頁面沒有談過長稿件的處理方式。
  - >-
    摘要上限 150 字（不含公式與文獻引用），但關鍵詞數量頁面自相矛盾：主文件內容清單寫 "Up to seven keywords"，
    摘要與關鍵詞段落寫 "not more than 10 key words"（字母序、不需分類碼）。投稿時以 7 個以內並按字母序最保險。
  - >-
    aims 的措辭是 "significant, innovative, original contributions to statistical methodology, well justified by theory and
    numerical experiments, and illustrated by real data"（首頁）；Overview 的措辭是 "significant and innovative original
    contributions to statistical methodology, well justified by theory and numerical experiments, and illustrated by real data
    applications"。頁面沒有排除任何題材或給低優先，也沒有說
    缺少數值實驗或真實資料例子的稿件如何處理；但這三樣被並列為方法論貢獻的描述，投稿稿件的組成宜對照這句話自查。
  - >-
    審稿制度（單盲、雙盲或其他）SJS 的任何頁面都沒有寫；Wiley 全社頁只說公開審稿的刊會在 Author Guidelines 註明，
    SJS 沒有註明。作者指引要求主文件與首頁列出作者姓名與機構，沒有匿名稿的選項；審稿人是否匿名頁面無法判定。
  - >-
    數學論文有 SJS 專屬的重複與抄襲規則：不得逐字抄整句或整段；引用他處不廣為人知的定義或定理須明確引用；
    只是微幅修改已發表證明的證明 "should not be included, but instead handled by reference, with an explanation of necessary
    modifications"。已在研討會論文集發表的內容，延伸版須有 "substantial new contributions"、不得有過多文字重疊，
    並須在 cover letter 說明、引用原文、清楚描述延伸部分。
  - >-
    指標與費用：Wiley 頁面標 2025 年投稿到接受的中位數為 321 天（首次決定中位數 11 天），錄取率 25%，Journal Impact Factor 1.2。
    開放取用選項的 APC 為 3,850 USD / 2,520 GBP / 3,200 EUR（不含稅）；頁面沒有提到投稿費或頁費，印刷版彩圖免費。
    作者指引頁內有一個失效連結（Supporting Information 準備規則，olabout.wiley.com；2026-11-13 重查時
    curl 逾時、讀不到），且投稿入口
    同時被稱為 "Wiley Authors submission portal" 與 "Research Exchange"，兩個連結本次都導向同一個 Wiley 登入頁。
