      不得當成 ASE 2027 的任何日期或費用。ASE 2027 的對應欄位見 cycle（全部 not_published）。
    timezone_as_stated: >-
      各軌 Important Dates 標題寫 “Important Dates AoE (UTC-12h)”；註冊費截止則寫
