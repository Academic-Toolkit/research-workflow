# ─────────────────────────────────────────────────────────────
# FAST — ASE 2027（下一屆尚未截稿的版次）。官方尚未公開，全部 not_published。
# ─────────────────────────────────────────────────────────────
cycle:
  applies_to: 2027
  status: upcoming
  # 【注意】官方沒公布 2027 會議日期，所以 expires_at 不是官方日期。
  # schema 規定 conference 的 expires_at 必填，這裡填 2027-12-31 當「保守的失效上限」：
  # ASE 2026 是 10 月舉行；這個日期之後此 cycle 視為作廢；實際日期公布後必須改成會議結束日。
  expires_at: 2027-12-31

  edition: ASE 2027
  edition_number:
    status: not_published
    checked: 2026-11-15
    note: ASE 2026 為第 41 屆；2027 屆官方頁面未公開，不寫屆次。
  dates:
    dates_status:
      status: not_published
      checked: 2026-11-15
      note: >-
        官方（researchr 與 ase-conferences.org）沒有 2027 日期。WebSearch 找到一個第三方
        彙整站（conferencelists.org）寫 El Paso、2027-10-24，但那不是官方來源，
        沒有任何官方頁面佐證，本記錄不採信，也未寫進欄位。
  # schema 的 cycle.venue.* 是字串／enum，放不下 unknown 物件，所以 venue 整塊省略，改用 venue_status。
  venue_status:
    status: not_published
    checked: 2026-11-15
    note: 城市、場館、國家、舉辦形式（in_person/virtual/hybrid）2027 屆官方都未公布。

  portal:
    system: HotCRP
    verified: false
    note: >-
      ASE 2026 各軌用 HotCRP（每軌一個子站，例如 ase26.hotcrp.com）；2027 的投稿系統與網址未公布。
      HotCRP 是 2026 的事實，只當線索。

  deadlines:
    - {id: research_abstract_submission, date: null, status: not_published, checked: 2026-11-15, label: 研究軌摘要投稿截止}
    - {id: research_paper_submission,    date: null, status: not_published, checked: 2026-11-15, label: 研究軌論文投稿截止}
    - {id: research_notification,        date: null, status: not_published, checked: 2026-11-15, label: 研究軌初審通知}
    - {id: research_camera_ready,        date: null, status: not_published, checked: 2026-11-15, label: 研究軌 camera-ready}
    - {id: other_tracks, date: null, status: not_published, checked: 2026-11-15,
       label: Industry / NIER / Tools and Datasets / Journal First / Artifact Evaluation / Doctoral Symposium / SRC / Workshops 各軌截止日,
       note: 全部未公布。}
  deadline_timezone_note: >-
    2027 時區未公布。2026 各軌頁寫 “AoE (UTC-12h)”；2027 是否沿用要等官方公布。

  fees: {status: not_published, checked: 2026-11-15}

  next_edition:
    status: not_published
    checked: 2026-11-15
    note: 本檔的 cycle 已是 2027；2028 屆官方也沒有任何公布。

warnings:
  - >-
    【版次】本檔的 cycle 是 ASE 2027，但官方 ASE 2027 的任何資訊 2026-11-15 都未公開
    （researchr 的 ase-2027 頁面是登入牆、ase-conferences.org 與 series 頁只列到 2026）。
    因此沒有任何 2027 的截稿日、時區、地點、費用可查；請勿用 2026 的日期推算。
  - >-
    【requirements 來自 ASE 2026】頁數、範本、審查方式、主題清單、DAS、AI 揭露、APC 等規定全部取自已舉行的
    ASE 2026 徵稿頁，不是 2027。ASE 2026 比 2025 新增了 Early Rejection 階段與強制 Data Availability
    Statement，顯示規定每年會改；2027 的規定出來後要重新核對。
  - >-
    ASE 2026（已舉行）的日期、地點、費用只放在 requirements.previous_edition_reference，
    僅供估算節奏（2026 研究軌論文截止在 3 月底、屆會在 10 月中）。不得當成 2027 的日期。
  - >-
    【預印本】研究軌徵稿頁只有一句相關規定：建議投稿題目與 arXiv 等處 preprint 的題目不同，審查期間
    不得公開使用投稿題目。該頁沒有明文禁止先貼 arXiv，也沒有說明帶作者姓名的 preprint 是否違反雙匿名。
    要先貼 arXiv 的話，建議先寄信問 PC chairs，並避免與投稿同題。
  - >-
    【雙匿名】研究軌與 NIER 雙匿名（違反者 NIER 會 desk-reject；研究軌要求匿名並以第三人稱引用自己先前的工作），
    但 Industry Showcase 與 Tools and Datasets 不匿名。補充材料（程式、資料）也必須匿名上傳。
  - >-
    【頁數】研究軌投稿 10 頁正文（含圖表與附錄）+ 最多 2 頁只放 references；超過或違反格式會 desk-reject。
    Data Availability Statement 必須放在投稿版的 10 頁之內（錄取後的版本才不計頁）。徵稿頁 tl;dr 寫
    "10 pages (excl. references)"，內文寫 "including all figures, tables, appendices, etc."——附錄算在 10 頁內。
  - >-
    【強制 DAS】所有 ASE 論文需要 Data Availability Statement；資料要放有 DOI 的長期存檔庫（Zenodo、Figshare），
    不能公開須在該節解釋。出版方會檢查，未達要求的 camera-ready 不收。
  - >-
    【AI 使用揭露】生成式 AI 不得列為作者；用 AI 產生的文字、程式、圖表、資料、引用都必須在
    Acknowledgements 或專節揭露（官方：「err on the side of caution」）。共通規定頁另建議在參考文獻附 DOI，
    以降低被當成「幻覺引用」的風險。
  - >-
    【註冊與出版】每篇錄取論文至少要有一位作者以非學生的正式註冊來覆蓋，否則論文會被撤出 proceedings；
    研究軌另寫「at least one author ... is required to register for ASE 2026 and present the paper」。
  - >-
    【費用】ACM 自 2026-01-01 全面 Open Access；機構未加入 ACM Open 的作者需付 APC（2026 年過渡補貼價：
    會員 US$250、非會員 US$350；是否延續到 2027 官方未公布）。
  - >-
    【專利】官方出版日 = 論文在 ACM Digital Library 公開的日期，可能比會議第一天早最多兩週，會影響專利申請。
  - >-
    【作者名單】錄取後作者名單不得變更（reviewer 的利益衝突分配以投稿時名單為準）；題目更改需 Track Chairs 許可。
  - >-
    【每人投稿數】研究軌徵稿頁與共通規定頁沒有載明每位作者的投稿篇數上限（not_found，非「無上限」的保證）。
  - >-
    【錄取率】ASE 2026 官網沒有公布錄取率或投稿數；第三方統計不屬於本語料庫的來源。
  - >-
    【未收的軌】Workshops（各自子站有各自的投稿規定）與 Posters 沒有收進細節；Industry、NIER、Tools、
    Journal First、AE、DS、SRC 的 2026 規定都在 requirements.tracks。
