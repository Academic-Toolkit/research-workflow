--- # research-submission venue record
# IEEE/ACM International Conference on Automated Software Engineering (ASE) — 內容擷取自 2026-11-15。
#
# 這份記錄的結構性事實（讀之前先看這個）：
#   * 2026-11-15 當天，ASE 2026（慕尼黑，2026-10-12 至 2026-10-16）已經辦完（官網
#     proceedings 頁寫「已於 10 月 7 日／8 日出版」）。所以「下一屆尚未截稿的版次」是 ASE 2027。
#   * ASE 2027 的官方頁面當天【沒有公開】：conf.researchr.org/home/ase-2027 回 HTTP 200 但內容是
#     「Access denied / You do not have the privileges to access this part」登入牆，而不存在的
#     屆次（ase-2028、ase-2099）回 HTTP 404 "Page not found"。這個差異顯示 ase-2027 已在系統內
#     建立、但尚未對外公開（這是依回應差異做的推論，不是官方說明）。ASE 指導委員會網站
#     ase-conferences.org 與 researchr 的 series 頁都只列到 ASE 2026。
#   * 因此：cycle 區塊是 ASE 2027，欄位全部 not_published；requirements 的所有規定內容取自
#     ASE 2026（已舉行）的正式徵稿頁。ASE 2026 的日期、地點、費用只放在
#     requirements.previous_edition_reference 當「節奏參考」，【不得】當成 2027 的日期。

schema_version: 1
id: ase/ase
kind: conference
family: software-engineering-conferences
status: active

sources:
  # ── 規定本體：取自 ASE 2026（已舉行）─────────────────────────────
  - id: research_track_2026
    role: authoritative
    url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
    note: >-
      Research Papers 軌道頁；「Call for Papers」分頁內容（雙匿名審查、10+2 頁、研究領域清單、
      Data Availability Statement、AI 使用揭露、arXiv 標題建議、Important Dates）。頁面約 1 MB
      （內含整個節目與 accepted papers 清單），curl 約需 40–100 秒才傳完。URL 慣例由首頁導覽
      點進去確認，是 /track/ase-2026/ase-2026-research-track（不是 /ase-2026-papers 之類，
      後者是 ASE 2025 的命名）。這是已舉行屆次的頁面，內容不應再變動。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "The ASE 2026 Research Track will employ a double-anonymous review process"
        min_extracted_chars: 120000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: submission_policies_2026
    role: authoritative
    url: https://conf.researchr.org/track/ase-2026/ase-2026-submission-instructions-and-policies
    note: >-
      所有軌道共通的規定頁：camera-ready 頁數表、ACM 範本、註冊要求、SIGSOFT 開放科學政策、
      作者與 AI、ACM Open 開放取用費用、Pre-Print Publications、Data Availability Statement FAQ。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "ASE 2026 follows the SIGSOFT Open Science Policy"
        min_extracted_chars: 8000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: industry_2026
    role: authoritative
    url: https://conf.researchr.org/track/ase-2026/ase-2026-industry-showcase
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Submissions to industry showcase track will not undergo double-blind reviews"
        min_extracted_chars: 90000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: nier_2026
    role: authoritative
    url: https://conf.researchr.org/track/ase-2026/ase-2026-nier
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "ASE 2026 NIER adopts a double-blind review process"
        min_extracted_chars: 85000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: tools_datasets_2026
    role: authoritative
    url: https://conf.researchr.org/track/ase-2026/ase-2026-tools-and-data-sets
    note: >-
      軌道名稱官網寫「Tools and Datasets」（導覽）、URL 是 tools-and-data-sets；舊屆稱 tool demonstrations。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Tools and Datasets Availability"
        min_extracted_chars: 90000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: journal_first_2026
    role: authoritative
    url: https://conf.researchr.org/track/ase-2026/ase-2026-journal-first
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "journal-first papers published recently in prestigious software engineering journals"
        min_extracted_chars: 80000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: artifact_evaluation_2026
    role: authoritative
    url: https://conf.researchr.org/track/ase-2026/ase-2026-artifact-evaluation
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "The ASE artifact evaluation track uses a single-anonymous review process"
        min_extracted_chars: 12000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  # ── 輔助來源 ─────────────────────────────────────────────────
  - id: doctoral_symposium_2026
    role: supporting
    url: https://conf.researchr.org/track/ase-2026/ase-2026-doctoral-symposium
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "ASE 2026 Doctoral Symposium"
        min_extracted_chars: 8000
    snapshot: {fetched_at: 2026-11-15, last_verified_at: 2026-11-15, extracted_sha256: null}

  - id: src_2026
    role: supporting
    url: https://conf.researchr.org/track/ase-2026/ase-2026-student-research-competition
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "ACM Student Research Competition (SRC) offers undergraduate and graduate students"
        min_extracted_chars: 11000
    snapshot: {fetched_at: 2026-11-15, last_verified_at: 2026-11-15, extracted_sha256: null}

  - id: workshops_2026
    role: supporting
    url: https://conf.researchr.org/track/ase-2026/ase-2026-workshops
    note: 共同舉辦活動（workshop）的 proposal 頁；各 workshop 自己的投稿規定在各自子站，本記錄未收。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Call for Proposals for Co-Located Conferences and Workshops"
        min_extracted_chars: 3000
    snapshot: {fetched_at: 2026-11-15, last_verified_at: 2026-11-15, extracted_sha256: null}

  - id: registration_2026
    role: supporting
    url: https://conf.researchr.org/attending/ase-2026/registration
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Every accepted paper must be accompanied by at least one Main Conference registration"
        min_extracted_chars: 3500
    snapshot: {fetched_at: 2026-11-15, last_verified_at: 2026-11-15, extracted_sha256: null}

  - id: proceedings_2026
    role: supporting
    url: https://conf.researchr.org/info/ase-2026/proceedings
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "All 15 proceedings of ASE 2026 events were published"
