      AI 工具政策摘要。Bulletin 首頁的連結 "Initial Manuscript Submission form" 指向這個網址。
      本記錄只讀到 Step 0，沒有按 "I accept"，所以後續步驟（作者資料、編輯選擇、檔案上傳等）未讀。
