--- # research-submission venue record
# 內容擷取自 AMS 數位圖書館的 Bulletin 頁面（pubs.ams.org/journals/bull，www.ams.org/journals/bull/ 會轉址到此）、
# AMS 的作者資源與政策頁（www.ams.org/arc、www.ams.org/publications/...）、2026 年 10 月號（63 卷 4 期）印刷版前頁的
# "Information for Authors"（PDF）、EditFlow 投稿入口 Step 0（ams.msp.org）、SCImago 與 Clarivate Master Journal List，
# 全部 2026-10-25 經 Safari 讀頁面文字（document.body.innerText；PDF 則以頁內 fetch 取得檔案後用 pdftotext 抽字）取得。
# AMS 網站（www.ams.org、pubs.ams.org）對 curl 一律回 HTTP 403 + 約 28.8 KB 的 bot 挑戰頁（title 為
# "Verifying your connection :: American Mathematical Society"），所以 AMS 各頁 fetch.method 記 browser、http_viable: false；
# 只有 EditFlow（ams.msp.org）對 curl 正常。
# Bulletin 的須知分散在三處：Bulletin 自己的 Journal Details／About／Submission 三頁（短）、印刷版前頁的 Information for Authors
# （本刊文章該長什麼樣子的唯一詳細說明，也是唯一寫明單匿名審稿的地方）、AMS 全體期刊共用的 ARC／Policies 頁。
# 三處對審稿模式的說法有出入，見 review.type 與 warnings。

schema_version: 1
id: ams/bulletin-of-the-ams
kind: journal
family: mathematics-journals
status: active

# ─────────────────────────────────────────────────────────────
# 來源與 provenance。網址皆由 Bulletin 首頁導覽、頁內連結，或使用者指定的 www.ams.org/journals/bull/ 轉址取得，非推測。
# 例外與已失效的連結見各 source 的 note 與 warnings。
# ─────────────────────────────────────────────────────────────
sources:
  - id: ams_about
    role: authoritative
    url: https://pubs.ams.org/BULL?active=about
    note: >-
      Bulletin 的 About 頁（導覽列 "About Bulletin of the American Mathematical Society"）：期刊概述（範圍一段）、
      1891 起全部期別上線、投稿資訊指向 "Submission for Peer Review" 頁、出版週期、收錄清單（出版社自述）、offprint。
      本站每個 BULL?active=* 頁的頁首都有同一段範圍文字、ISSN 與 MCQ。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 回 HTTP 403 + 28800 bytes 的挑戰頁（title 'Verifying your connection :: American Mathematical Society'）"
      validity:
        must_contain: "makes all issues of the Bulletin freely available to all mathematicians through the generosity of its members"
        min_extracted_chars: 3300
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: ams_submission
    role: authoritative
    url: https://pubs.ams.org/BULL?active=submit
    note: >-
      Bulletin 的 "Submission" 頁（導覽列 "Submission Information"；首頁連結 "Submission for Peer Review" 的實際網址
      https://pubs.ams.org/publications/journals/journalsframework/bullsubmit 會轉址到這裡）。內容是 AMS 各刊共用的初審投稿說明：
      Centralized Manuscript Processing、PDF 優先、紙本替代方式、一稿多投、2020 MSC、abstract 必填、錄取後程序。
      頁內沒有 Bulletin 專屬的文章類型或篇幅規定。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 回 HTTP 403 + 28803 bytes 的挑戰頁"
      validity:
        must_contain: "The AMS uses Centralized Manuscript Processing for initial submissions to AMS journals"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: ams_info_for_authors
    role: authoritative
    url: https://www.ams.org/journals/bull/2026-63-04/bull-63-4-print-matter.pdf
    note: >-
      63 卷 4 期（2026 年 10 月號）印刷版前頁與後頁（首頁 ToC 上方的連結 "View front and back matter from the print issue"），13 頁 PDF，
      PDF 建立日 2026-08-22。其中 "Editorial Information" 與 "Information for Authors" 是本刊投稿規定中最詳細的一份：文章該長什麼樣子、
      誰受邀、審稿模式、初審投稿方式、錄取後程序。網址含期號，每期各有一份（同一命名規則：bull-<卷>-<期>-print-matter.pdf），
      換期後本網址仍可讀但不是最新一期；重新驗證時應改查最新一期的同名檔。
      這份 PDF 的 Information for Authors 內有過時處，見 warnings（初審投稿網址在 2026-10-25 回 404；EPS 圖檔規定與錄取後寄檔方式是舊式程序）。
      本記錄不收其中列的任何 email。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 回 HTTP 403 + 28928 bytes 的挑戰頁；Safari 同頁 fetch 可取得 334314 bytes 的 PDF"
      validity:
        must_contain: "All articles submitted to this journal are peer reviewed"
        min_extracted_chars: 20000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

