# ─────────────────────────────────────────────────────────────
# SLOW — 數年不變。驗證用 hash diff 即可。
# ─────────────────────────────────────────────────────────────
requirements:
  refresh: {check_every: P6M, method: extracted_hash_diff}

  scope:
    aims_verbatim: >-
      The Bulletin publishes expository articles on contemporary mathematical research, written in a way that gives insight to mathematicians
      who may not be experts in the particular topic. The Bulletin also publishes reviews of selected books in mathematics and short articles
      in the Mathematical Perspectives section, both by invitation only.
    aims_verbatim_note: >-
      Bulletin 首頁、About 頁（"Journal overview"）與 SCImago 的 Scope 逐字相同。2026 年 10 月號印刷版前頁的寫法略有不同，且把 "by invitation only"
      的指涉範圍寫得不含歧義："The Bulletin publishes expository articles on contemporary mathematical research written in a way that gives insight to mathematicians
      who may not be experts in the particular topic. The Bulletin publishes, by invitation only, reviews of selected books in mathematics and short articles
      in the “Mathematical Perspectives” section."——受邀限定的是書評與 Mathematical Perspectives，不是 expository articles。
    src: [ams_home, ams_about, ams_info_for_authors, scimago]
    what_an_article_is_expected_to_be:
      statement_verbatim: >-
        A well-written expository article will include motivating problems and examples, some indication of the historical development of the subject,
        and of course the results and open problems that make it an interesting and exciting area of mathematics. In most cases proofs should be at most
        briefly sketched, and there should be a good bibliography whose main aim is to help those wishing to pursue the subject further. Articles reporting on
        recent mathematical research should include an introductory section addressed to nonexperts describing the motivation, background, and significance
        of the results announced. Following the statement of results, there should be a sketch of proofs that may be addressed to experts, including elements
        of the proof which are novel. References should be given so that an interested reader can find the details.
      first_page_requirement_verbatim: >-
        The first page must consist of a short descriptive title, followed by an abstract that summarizes the article in language suitable for mathematicians
        in the general area. The descriptive title should be short but informative; useless or vague phrases such as “some remarks about” or “concerning”
        should be avoided. The abstract should be a brief technical description of the new material.
      src: ams_info_for_authors
      reading: >-
        這是一本綜述／導讀型期刊：寫給「不是該專題專家的數學家」；證明通常只略述，重點在動機、歷史、結果與開放問題、足夠的參考文獻。
        官網沒有把原創研究論文（完整證明）列為排除，但 "In most cases proofs should be at most briefly sketched" 與全刊定位都指向不收完整證明的論文。
    submission_invitation:
      statement_articles: >-
        ams_info_for_authors："Initial submission. Authors of articles may submit manuscripts for consideration as PDF files at ..."；
        "The Bulletin Chief Editor will be notified as new submissions arrive. The Editor will collect these submissions and assign them to subject area specialists."
        ams_editflow 開放給 Bulletin 的 Step 0 投稿表單（"This form may be used to submit a PDF of your manuscript to the Bulletin of the American Mathematical Society for publication consideration."）。
      statement_invited_only: >-
        "reviews of selected books in mathematics and short articles in the Mathematical Perspectives section, both by invitation only"（ams_home、ams_about）；
        "Book Reviews are by invitation only."（ams_info_for_authors）
      lecture_writeups: >-
        ams_info_for_authors："Mathematicians giving AMS lectures (Gibbs Lectures, Colloquium Lectures, and Progress in Mathematics Lectures) or invited hour addresses
        at meetings of the Society are encouraged to write up their lectures using the guidelines for expository articles described above.
        Submissions will be reviewed by the Editorial Board for Articles, and authors will be notified of its decision."
      gap: >-
        官網沒有說明未受邀的 expository article 被收錄的實際比例，也沒有投稿前先詢問編輯（pre-submission inquiry）的程序。
        ams_submission 與 ams_editflow 都是 AMS 各刊共用的通用文字，沒有 Bulletin 專屬的邀稿或不收未受邀稿的說明。
      src: [ams_home, ams_about, ams_info_for_authors, ams_editflow, ams_submission]
    areas:
      - id: all_of_mathematics
        statement: >-
          "expository articles on contemporary mathematical research"（原文）。官網沒有列舉數學子領域，也沒有領域限定；
          ams_info_for_authors 要求每篇附 2020 Mathematics Subject Classification 的主要與次要分類。
        src: [ams_home, ams_info_for_authors]
    acceptance_criteria:
      status: not_published
      checked: 2026-10-25
      src: [ams_home, ams_about, ams_info_for_authors, ams_submission]
      note: >-
        Bulletin 專屬的錄取標準只有上面「文章該長什麼樣子」的描述。AMS 全體期刊的編輯手冊（ams_best_practice）列有「Criteria for Recommending Publication」：
        Mathematical correctness、Originality、Relevance and significance（"Accepted papers should interest the broader readership"）、Clarity and structure，
        但頁面說是給 AMS 各主要研究期刊的編輯，沒有說逐字適用於 Bulletin，且「Originality」一條與綜述型期刊的關係頁面沒有說明。
    explicit_exclusions:
      status: not_published
      checked: 2026-10-25
      src: [ams_home, ams_about, ams_info_for_authors, ams_submission, ams_arc_journals]
      note: >-
        沒有 "we do not publish X" 形式的主題排除句。ams_arc_journals 寫編輯可以不送外審直接退稿："Editors may reject papers without external review that are
        not suitable for publication in the journal due to reasons such as subject matter or clear weaknesses in scientific content or presentation style."
        （AMS 全體期刊共用）。

  # 文章類型：只收官方頁面描述的類型。length 欄記官方公布的規定；官方沒有公布篇幅時寫 not_published，
  # 另以 observed_length 記已刊出稿件的頁數範圍（刊出結果，不是規定）。
  article_types:
    - id: expository_article
      label: Expository article（Bulletin 的主體文章）
      description_verbatim: >-
        The Bulletin publishes expository articles on contemporary mathematical research, written in a way that gives insight to mathematicians
        who may not be experts in the particular topic.
      invited: false
      invited_basis: >-
        官方文字只把書評與 Mathematical Perspectives 列為受邀限定；ams_info_for_authors 寫 "Authors of articles may submit manuscripts for consideration"。
        這只表示投稿管道對作者開放，不表示未受邀稿的錄取比例（官網未公布）。
      content_expectations: 見 scope.what_an_article_is_expected_to_be
      review: 外審（"All articles submitted to this journal are peer reviewed."），由 Editorial Board for Articles 處理
      length:
        status: not_published
        checked: 2026-10-25
        src: [ams_info_for_authors, ams_submission, ams_editflow, ams_about]
        note: 官網沒有頁數、字數或參考文獻數的上限或建議值。
      observed_length:
        unit: pages_typeset
        min: 17
        max: 133
        median: 31
        n: 15
        extra: 另有 1 篇 3 頁的專輯導言（63 卷 3 期）不計入
        basis: >-
          63 卷（2026）1–4 期目錄的頁碼範圍（刊出時的期刊頁數；例：1–57、59–77、79–117、119–144、177–197、199–331、355–389、395–419、421–437、
          439–469、471–490、491–529、531–557、559–636、637–684）。這是已刊出稿件的結果，不是投稿規定，也不排除刊出前有刪減。
        src: [ams_home, ams_issues_vol63]
      src: [ams_home, ams_about, ams_info_for_authors]

    - id: mathematical_perspectives
      label: Mathematical Perspectives（短文欄）
      description_verbatim: '"short articles in the Mathematical Perspectives section, both by invitation only"（ams_home、ams_about）'
      invited: true
      invited_basis: >-
        ams_home、ams_about："both by invitation only"；ams_info_for_authors："The Bulletin publishes, by invitation only, reviews of selected books in mathematics
        and short articles in the “Mathematical Perspectives” section."
      length:
        status: not_published
        checked: 2026-10-25
        src: [ams_home, ams_about, ams_info_for_authors]
        note: 官網只用 "short articles"，沒有給頁數或字數。
      observed_length:
        unit: pages_typeset
        min: 11
        max: 31
        n: 4
        extra: 另有 1 頁（61 卷 1 期）與 3 頁（62 卷 2 期）的欄首短文，不計入
        basis: >-
          61 卷 1 期（2024）該欄的一篇 11 頁文章；62 卷 2 期（2025）該欄的 3 篇各 25、28、31 頁文章。
          "short" 在這個欄位的實際頁數範圍相當寬，不是以兩三頁為準。刊出結果，不是投稿規定。
        src: [ams_issue_2024_61_1, ams_issue_2025_62_2]
      src: [ams_home, ams_about, ams_info_for_authors]

    - id: book_review
      label: Book Reviews
      description_verbatim: >-
        "reviews of selected books in mathematics"（ams_home）；"Book Reviews are by invitation only. The first page must include the title of the book being reviewed;
        the name(s) of the author(s); publisher; city of publication; year of publication; number of pages, including front matter; price if known; and ISBN.
        There should also be a footnote with the 2020 Mathematics Subject Classification representing the primary and secondary subjects of the book under review."
      invited: true
      invited_basis: '"both by invitation only"（ams_home）；"Book Reviews are by invitation only."（ams_info_for_authors）'
      review: 由 Editorial Board for Book Reviews 處理（ams_editorial 另列一組委員，主席 Volodymyr Nekrashevych）
      length:
        status: not_published
        checked: 2026-10-25
        src: [ams_info_for_authors, ams_home]
        note: 官網沒有書評的頁數或字數規定。
      observed_length:
        unit: pages_typeset
        min: 7
        max: 11
        n: 7
        basis: '63 卷（2026）1–4 期目錄中書評的頁碼範圍（7、7、7、7、10、11、7 頁）。刊出結果，不是投稿規定。書評頁面寫 "Book reviews do not contain an abstract."'
        src: [ams_home, ams_issues_vol63]
      src: [ams_home, ams_info_for_authors, ams_editorial]

    - id: commentary
      label: Commentary（目錄分欄標籤，官方未說明）
      description_verbatim: null
      invited: {status: not_published, checked: 2026-10-25, src: [ams_home, ams_about, ams_info_for_authors]}
      length:
        status: not_published
        checked: 2026-10-25
        src: [ams_home, ams_about, ams_info_for_authors]
        note: 官網沒有把 Commentary 列為文章類型。
      observed:
        basis: '61 卷 1 期（2024）目錄有一欄 "Commentary"，內容 1–2 頁，單一署名。只看到這一期，未逐期核對其他期是否也有。刊出結果，不是投稿規定。'
        src: ams_issue_2024_61_1
      src: ams_issue_2024_61_1

    - id: selections_reprinted_from_mathematical_reviews
      label: Selections Reprinted from Mathematical Reviews（目錄分欄標籤，官方未說明）
      description_verbatim: null
      invited: {status: not_published, checked: 2026-10-25, src: [ams_home, ams_about, ams_info_for_authors]}
      length:
        status: not_published
        checked: 2026-10-25
        src: [ams_home, ams_about, ams_info_for_authors]
        note: 官網沒有說明這類稿件。
      observed:
        basis: '61 卷 1 期（2024）目錄在 Mathematical Perspectives 欄內列有 "Selections Reprinted from Mathematical Reviews"，13 頁（173–185）。刊出結果，不是投稿規定。'
        src: ams_issue_2024_61_1
      src: ams_issue_2024_61_1

  article_types_note: >-
    官方頁面只描述三類：expository articles、Mathematical Perspectives（受邀）、book reviews（受邀）。Commentary 與 Selections Reprinted from Mathematical Reviews
    只是已刊目錄上的分欄標籤，官方文字沒有說明。官網沒有 research article、short communication、survey 等分類；沒有 "errata article" 以外的更正類型
    （印刷版前頁寫更正重大錯誤用 errata article："Corrections of critical errors may be made to the paper by submitting an errata article to the Editor."）。

  length_note:   # schema 的 length 需要 value 與 unit；官方沒有篇幅規定，故不放 requirements.length
    status: not_published
    checked: 2026-10-25
    src: [ams_info_for_authors, ams_submission, ams_editflow, ams_about, ams_arc_journals]
    note: >-
      Bulletin 與 AMS 通用投稿頁都沒有任何篇幅規定（沒有頁數、字數、圖表數或參考文獻數上限）。已刊出稿件的頁數範圍見 article_types[].observed_length。

  abstracts:
    - id: main
      max_words: {status: not_published, checked: 2026-10-25, src: [ams_submission, ams_info_for_authors]}
      required_at: initial_submission
      rules:
        - 'ams_submission："An abstract is required. It should be a brief technical description of the new material."'
        - 'ams_info_for_authors："The first page must consist of a short descriptive title, followed by an abstract that summarizes the article in language suitable for mathematicians in the general area."'
        - 'ams_submission："No abstracts appear in the printed journal starting in 1998." 摘要在網站免費供所有人閱讀。'
        - '書評沒有摘要："Book reviews do not contain an abstract."（ams_home 的目錄頁）'
      src: [ams_submission, ams_info_for_authors, ams_home]
  keywords:
    msc_classification:
      required: true
      statement: >-
        ams_submission："Included with the footnotes to the paper should be the 2020 Mathematics Subject Classification representing the primary and secondary subjects of the article."；
        ams_info_for_authors："Each paper should include a footnote with the 2020 Mathematics Subject Classification representing the primary and secondary subjects of the article."
      src: [ams_submission, ams_info_for_authors]
    free_keywords:
      max: {status: not_published, checked: 2026-10-25, src: [ams_info_for_authors]}
      statement: 'ams_info_for_authors："The Mathematics Subject Classification footnote may be followed by a list of key words and phrases describing the subject matter of the article and taken from it."（可選）'
      src: ams_info_for_authors

  formatting:
    submission_file: 單一 PDF 檔（含全部文字、圖與附錄）
    statement: >-
      ams_editflow："The PDF should include all text, graphics, and appendices for the paper. Do not upload separate files for text, graphics, and appendices."；
      ams_info_for_authors："Manuscripts must be a single file with images embedded."；
      ams_submission："The preferred method of submission is to upload a PDF file using the Initial Manuscript Submission form."
    paper_alternative: >-
      可郵寄紙本到 "Centralized Manuscript Processing, Bulletin of the AMS, 201 Charles Street, Providence, Rhode Island 02904-2213 USA"，
      須附期刊名、通訊作者姓名、聯絡資料（含 email 與郵寄地址）與建議的編輯（ams_submission、ams_editflow）。
    typesetting: >-
      錄取後建議用 AMS-LaTeX 與 AMS 的作者套件（ams_submission："Authors are encouraged to use AMS-prepared style files in preparing their papers."；
      ams_info_for_authors："Manuscripts should be electronically prepared in AMS-LATEX."）。投稿（初審）階段官網沒有要求特定格式，只要求 PDF。
    template:
      class: AMS author package for the Bulletin
      src: [ams_submission, ams_info_for_authors]
      note: >-
        作者套件從 Bulletin 的 Submission 頁 "AMS-prepared style files" 連結取得（pubs.ams.org/bull/bullauthorpac.html）；另有 Overleaf 上的 AMS journal article templates。
        本記錄沒有下載套件。
    after_acceptance: >-
      ams_submission："Once a paper has been accepted for publication, authors should follow the online Submission Instructions."
      ams_info_for_authors 寫錄取後應立即將最終版原始檔寄到 Providence 辦公室。這份舊式說明裡的圖檔規定（EPS）與
      "Submission Instructions" 頁（pubs.ams.org/jourhtml/submitms.html）在 2026-10-25 已過時或失效，見 warnings。
    authors_identifiable: >-
      ams_info_for_authors 的審稿描述是單匿名（審稿人知道作者），所以稿件應列作者。但 AMS 全體政策正在轉向雙匿名（稿件不得含作者姓名與單位），
      Bulletin 的頁面沒有說已轉換。見 review.type 與 warnings。
    src: [ams_submission, ams_editflow, ams_info_for_authors]

  supplementary_material:
    status: not_published
    checked: 2026-10-25
    src: [ams_submission, ams_info_for_authors, ams_editflow]
    note: Bulletin 與 AMS 通用投稿頁都沒有補充材料的規定。EditFlow 要求初審 PDF 包含全部附錄，不收分開的檔案。

  reproducibility:
    code_and_data_sharing_mandate:
      status: not_published
      checked: 2026-10-25
      src: [ams_submission, ams_info_for_authors, ams_editflow, ams_policies]
      note: 沒有資料或程式碼公開、資料可得性聲明的規定。
    formalization_or_proof_checking:
      status: not_published
      checked: 2026-10-25
      src: [ams_submission, ams_info_for_authors, ams_editflow, ams_ai_policy]
      note: 官網沒有關於形式化驗證（proof assistant）或機器證明稿件的規定。AMS 對 AI 工具的規定見 policies.generative_ai。
    reporting_standards: {status: not_published, checked: 2026-10-25, src: [ams_submission, ams_info_for_authors], note: 無 TOP、JARS 或其他報告標準要求}

  review:
    type: single_anonymized
    basis: >-
      ams_info_for_authors（63 卷 4 期，2026 年 10 月）的 Information for Authors："All articles submitted to this journal are peer reviewed. The AMS has a single-blind
      peer-review process in which the reviewers know who the authors of the manuscripts are, but the authors do not have access to information on who the peer reviewers are."
    conflict: >-
      ams_arc_journals（AMS 全體期刊）寫："Historically, the AMS has had a single-anonymous peer-review process ... In 2021, the AMS Council voted to transition to a
      double-anonymous peer review process in which both authors and referees of a given article remain anonymous to each other, and this transition is being rolled out
      across the research journal portfolio."；ams_policies 另有 "Double Anonymous Peer Review" 一節。ams_double_anonymous_news（2022）說從 Proceedings of the AMS 與 Representation Theory 起步，
      其餘期刊之後推行；該政策要求投稿稿件不含作者姓名與單位，但不要求匿名化參考文獻、致謝與經費資訊。
      Bulletin 自己的 About、Submission 頁與 EditFlow Step 0 沒有提到匿名投稿，只有印刷版前頁明寫單匿名。因此本記錄採單匿名，但這是 2026 年 10 月號印刷版的敘述；
      EditFlow Step 0 之後的步驟未讀，投稿時以投稿系統與 Chief Editor 的指示為準。
    src: [ams_info_for_authors, ams_arc_journals, ams_policies, ams_double_anonymous_news, ams_about, ams_submission, ams_editflow]
    external_review: >-
      ams_arc_journals："All articles accepted for publication in AMS Journals are peer reviewed by external reviewers. Editors may reject papers without external review
      that are not suitable for publication in the journal due to reasons such as subject matter or clear weaknesses in scientific content or presentation style."
    originality_check: 'ams_arc_journals："To verify originality, your article may be checked by the originality detection service."'
    editorial_process: >-
      ams_info_for_authors："The Bulletin Chief Editor will be notified as new submissions arrive. The Editor will collect these submissions and assign them to subject area specialists."
      受邀的書評與 Mathematical Perspectives 的處理流程官網沒有說明。
    stages:
      status: not_published
      checked: 2026-10-25
      src: [ams_about, ams_submission, ams_info_for_authors, ams_arc_journals, ams_editflow]
      note: 官網沒有說明審稿人人數、輪次或各階段時程（編輯手冊 ams_best_practice 只有給編輯的建議："no more than two major revisions"）。
    timeline_targets:
      status: not_published
      checked: 2026-10-25
      src: [ams_about, ams_submission, ams_info_for_authors, ams_arc_journals, ams_editflow]
      note: 對作者的時程承諾沒有。編輯手冊的 "usually 1?2 weeks"（初審）是給編輯的指引，見 identity.metrics.time_to_first_decision 的 note。
    appeals:
      statement: >-
        ams_policies 有 "AMS Process for Filing, Investigating, Communicating Results, and Appealing Claims"（子頁 .../policies/filingclaims）；該子頁本記錄沒有讀。
      src: ams_policies
    author_may_suggest_editor: >-
      ams_submission（紙本投稿須附的資料）："The author should suggest an appropriate Editor to review the paper"。EditFlow Step 0 沒有提到；後續步驟未讀。
    author_may_suggest_reviewers: {status: not_found, checked: 2026-10-25, src: [ams_submission, ams_info_for_authors, ams_editflow], note: Step 0 與其他頁面都沒有提到；EditFlow 後續步驟未讀}
    revisions_link: >-
      修訂稿不要走新投稿入口：ams_editflow 寫 "If you are trying to upload a revision of a previously submitted article, use the status link from the email you received from us
      about your original submission."；被拒稿的修訂版不得重新投稿，除非編輯委員會明確邀請（"unless you have been explicitly invited to re-submit by the editorial board of this journal"）。

  submission:
    portal: https://ams.msp.org/submit_new.php?j=bull
    system: EditFlow（MSP 的編輯管理平台；AMS 稱此入口為 "Initial Manuscript Submission form"）
    file: 單一 PDF（含全部文字、圖與附錄）
    conditions:                     # ams_editflow 的 Author Agreement；按 "I accept" 即表示同意
      - 稿件原創、從未以全部或部分形式發表
      - 稿件目前沒有在別處審查中，審查期間也不會投到別處
      - 稿件不是本刊先前被拒稿件的修訂版，除非編輯委員會明確邀請重投
      - 每位共同作者都知道此投稿以其名義送出，且各有只屬於本人的有效 email
      - 沒有共同作者冒用身分
      - 已閱讀並理解 AMS 的 AI 工具政策（見 policies.generative_ai）
    paper_alternative: 見 formatting.paper_alternative
    portal_steps_read: Step 0 only
    steps_not_read: 作者資料、編輯選擇、cover letter、檔案上傳等欄位未讀（需按 "I accept" 才會進入，本記錄沒有開始投稿）
    contact: 初審投稿問題寄 jrnl-initsub@ams.org（ams_arc_journals、ams_editflow 皆列）
    stale_pointer: >-
      ams_info_for_authors 的 Information for Authors 寫初審 PDF 投稿網址是 http://www.ams.org/peer-review/submission.pl；
      2026-10-25 該網址回 "This page was not found on the AMS website."（404）。現行入口是上面的 EditFlow 網址（Bulletin 首頁的 "Initial Manuscript Submission form" 連結）。
    src: [ams_editflow, ams_submission, ams_arc_journals, ams_info_for_authors]

  fees:
    submission: {status: not_published, checked: 2026-10-25, src: [ams_submission, ams_editflow, ams_info_for_authors, ams_arc_journals], note: Bulletin、AMS 通用投稿頁與 EditFlow Step 0 都沒有提投稿費}
    apc:
      status: not_published
      checked: 2026-10-25
      src: [ams_open_access, ams_submission, ams_info_for_authors, ams_copyright]
      note: >-
        ams_open_access 只對兩本 gold OA 期刊公布 APC（Proceedings of the AMS Series B：US$1,500；Transactions of the AMS Series B：US$2,750；AMS 會員擔任通訊作者者 $247）。
        Bulletin 不在其中，Bulletin 與 AMS 通用投稿頁、版權頁都沒有提到 Bulletin 的 APC 或付費開放取用選項。
    page_charges: {status: not_published, checked: 2026-10-25, src: [ams_submission, ams_info_for_authors], note: 沒有頁費規定}
    color_print: {status: not_published, checked: 2026-10-25, src: [ams_submission, ams_info_for_authors], note: 沒有彩色圖費用規定}

  open_access:
    options: [訂閱制（作者不付費）, 預印本與作者接受稿的張貼（green OA；見 policies.preprints）]
    gold_oa_option: {status: not_published, checked: 2026-10-25, src: [ams_open_access, ams_copyright, ams_submission], note: AMS 的 gold OA 名單只有兩本 Series B 期刊，Bulletin 不在其中；官網沒有提到 Bulletin 文章的付費 OA 選項}
    licenses_offered: >-
      ams_open_access 與 ams_copyright 的 Creative Commons 授權（CC-BY-NC-ND、CC-BY-NC、CC BY-ND、CC-BY）只用於 diamond 或 gold OA 刊物（"Articles published in AMS diamond or gold open access journals will be distributed under Creative Commons licenses"）。
      ams_submission 的 "After Acceptance" 段寫 "If the article is to be published in one of the AMS Open Access journals, authors must agree which Creative Commons License will be selected."
      Bulletin 不屬於這些期刊。
    green_oa:
      embargo_months: 0
      statement: >-
        ams_open_access（Green Open Access Journals 一節）："With green open access, the author may post a prepublication version of a journal article on their personal web page,
        their institution's noncommercial repository, and/or on arXiv.org with no embargo period. The AMS considers any version of the paper up to the final peer-reviewed manuscript,
        including revisions that take into account comments and suggestions of referees (often called the Author-Accepted-Manuscript), to be a prepublication version."
      src: ams_open_access
      note: ams_open_access 沒有逐一列出哪些期刊屬於 green 模式；此頁把 AMS 研究期刊分為 diamond、green、gold 三種，Bulletin 不在 diamond 與 gold 名單，所以適用的是 green（推論，頁面沒有明寫 Bulletin 屬於 green）。
    open_archive: >-
      ams_open_access："Open Archive: All subscription journal content over 5 years old (rolling) is open and free to read to all."
    src: [ams_open_access, ams_copyright, ams_submission, ams_about]

  policies:
    dual_submission: forbidden
    dual_submission_wording: >-
      ams_submission："No paper that has been previously published, or is being considered for publication elsewhere, should be submitted to the American Mathematical Society,
      nor may a paper that is under consideration by the American Mathematical Society be submitted elsewhere."；
      ams_info_for_authors："By submitting a paper to this journal, authors certify that the results have not been submitted to nor are they under consideration for publication
      by another journal, conference proceedings, or similar publication."
    preprints:
      allowed: true
      statement: >-
        ams_copyright："An author’s accepted manuscript (AAM) or other draft version of the work, either before or after peer review, may be reproduced under a CC BY Creative Commons License
        by any means for educational and scientific purposes by the author(s). This means that the pre-publication draft of the work may be posted on the author’s personal website,
        contributed to the author’s institutional repository, and/or posted on pre-print servers such as arXiv.org, all provided that no commercial use of the material is made
        (no fees may be charged for access to or use of the material) and no derivative works are included."（適用於 "non-open access journal and proceedings articles"）
      before_submission: >-
        ams_double_anonymous_news："We will place no new restrictions on how authors choose to disseminate and publicize their work—for example, by giving talks,
        posting preprints that include author names, and discussing with colleagues."（針對雙匿名政策的說明；2022 年新聞稿）
      note: >-
        官網沒有一句專門回答「投稿前張貼預印本是否算先前發表」。ams_copyright 允許在審稿前後張貼草稿（"either before or after peer review"），
        ams_double_anonymous_news 說 AMS 對張貼含作者姓名的預印本不設新限制。這兩處合起來顯示預印本不被視為先前發表，但頁面沒有用這個字眼表述。
        另外，ams_copyright 該句同時說 "under a CC BY" 又限制「商業用途與衍生作品」，字面上自相矛盾（CC BY 允許商業用途與衍生作品）；本記錄照原文抄錄，未解讀。
      src: [ams_copyright, ams_open_access, ams_double_anonymous_news]
    copyright:
      transfer_required: false
      statement: >-
        ams_copyright："Authors must grant the AMS specific permission to publish their work (i.e., a formal "consent to publish"). ... Authors are encouraged, but not required, to transfer
        copyright to their work to the AMS."；"With this agreement, authors may choose to transfer copyright to the AMS, to retain copyright, and/or choose to dedicate their work to the public domain
        28 years following publication (see Section 6)."（該頁讀到的內容只到 Section 4，Section 6 本記錄未見）
      process: 錄取後 AMS Providence 辦公室寄 Consent to Publish 給所有作者，處理稿件前必須完成（ams_info_for_authors："A Consent to Publish is required before we can begin processing your paper."）
      src: [ams_copyright, ams_info_for_authors, ams_submission]
    generative_ai:
      author_listing: 'ams_ai_policy 與 ams_editflow："AI tools, including ChatGPT and other large language models, cannot be listed as authors, as they cannot take responsibility for the submitted work."'
      disclosure: >-
        ams_ai_policy："Authors who use AI tools in the writing of a manuscript, production of images or graphical elements of the paper, or in the collection and analysis of data,
        must be transparent in disclosing in the Materials and Methods (or similar section) of the paper how the AI tool was used and which tool was used.
        Authors are fully responsible for the content of their manuscript, even those parts produced by an AI tool, and are thus liable for any breach of publication ethics."
      reviewer_side: 'ams_ai_policy："Editors and referees are not to upload papers under review to an LLM in any format, for any reason."'
      src: [ams_ai_policy, ams_editflow]
    authorship:
      statement: >-
        ams_authorship："Authors are often listed in alphabetical order."；署名變更（順序、增刪）須全體作者同意，初審投稿後的變更要以全體作者簽署的信或全體副本的 email 向編輯說明。
      src: ams_authorship
    ethics:
      statement: >-
        AMS 研究期刊是 COPE（Committee on Publication Ethics）的會員（ams_policies："AMS Research Journals participate as members of the Committee on Publication Ethics (COPE)"；
        ams_journals_list 同）；ams_policies 列有學術誠信、作者署名、申訴、冒犯性素材等政策，各子頁本記錄沒有逐一讀。
      src: [ams_policies, ams_journals_list]
    conflict_of_interest:
      author_disclosure: {status: not_found, checked: 2026-10-25, src: [ams_submission, ams_info_for_authors, ams_editflow, ams_ai_policy], note: "只有編輯手冊（ams_best_practice）提到 'declared by authors'，沒有對作者的揭露格式或欄位要求；EditFlow 後續步驟未讀"}
    language_editing: >-
      ams_submission 的 Useful Tools 列有 Charlesworth Author Services 的語言編修服務（ams_arc_journals："AMS journal contributors receive 15% off"）；自選，自費。
    originality_detection: 見 review.originality_check

  standards: []

# ─────────────────────────────────────────────────────────────
# FAST — 期刊無年度週期。
# ─────────────────────────────────────────────────────────────
cycle:
  applies_to: null
  rolling_calls: []
  special_issues:
    status: not_published
    checked: 2026-10-25
    note: >-
      Bulletin 首頁、About、Submission 與編輯名單頁都沒有徵稿或特刊公告。已刊目錄顯示偶有專題成組（63 卷 3 期一組同主題的歷史文章；62 卷 2 期的 Mathematical Perspectives 一組），
      但那是受邀欄目的刊出結果，不是公開徵稿。

# ─────────────────────────────────────────────────────────────
warnings:
  - >-
    Bulletin 是綜述／導讀型期刊，不是原創研究論文期刊："expository articles on contemporary mathematical research, written in a way that gives insight to mathematicians who may not be experts in the particular topic"，
    證明 "in most cases ... should be at most briefly sketched"。官網沒有說明未受邀的 expository article 被收錄的比例，也沒有投稿前詢問編輯的程序；書評與 Mathematical Perspectives 為受邀限定。
  - >-
    審稿模式有出入：2026 年 10 月號印刷版前頁寫單匿名（"single-blind"，審稿人知道作者）；AMS 全體的 ARC 頁寫政策正轉向雙匿名（投稿稿件不含作者姓名與單位），
    "is being rolled out across the research journal portfolio"，2022 年新聞稿只列 Proceedings of the AMS 與 Representation Theory 兩本。Bulletin 的 About、Submission 與
    EditFlow Step 0 沒有提到匿名投稿。本記錄採單匿名，並限於這個日期的印刷版敘述；投稿前在 EditFlow 後續步驟與系統說明再確認稿件是否要去掉作者資訊。
  - >-
    官網沒有任何篇幅規定（頁數、字數、參考文獻數）。article_types[].observed_length 的頁數範圍是已刊出稿件的結果（expository article 17–133 頁，中位數 31；n = 15，63 卷 2026），不是投稿規定。
  - >-
    官方沒有公布 Journal Impact Factor、錄取率、首次決定時間、投稿到接受時間，也沒有 backlog 數字（印刷版前頁說有，卻在 2026-10-25 的 Bulletin 網頁上找不到）。
    AMS 自己公布的指標是 MCQ，與 JCR 的 Impact Factor 不同；Bulletin 首頁寫 2024 年 0.84，期刊總覽頁寫 0.47 且沒標年度，兩個值對不上。JCR 分區需登入，本記錄沒有。
    記錄中的 Q2 是 SJR 分區（Applied Mathematics、Mathematics (miscellaneous)），不是 JCR。Web of Science 只收錄在 SCIE（MJL 核對），不在 SSCI、AHCI、ESCI。
  - >-
    存取與開放取用的字面說法互相有出入：Bulletin 首頁寫 "A current active subscription to the electronic version of this journal is required to view article PDFs in all volumes"；
    About 頁寫 "The American Mathematical Society makes all issues of the Bulletin freely available to all mathematicians through the generosity of its members"；
    AMS Open Access 頁寫訂閱刊內容滿 5 年（滾動）開放。Bulletin 沒有公布 APC 或付費 OA 選項（AMS 只有 Proceedings Series B 與 Transactions Series B 是 gold OA）。
    要把論文放上 arXiv 或個人網站，依 AMS Copyright Policy 允許張貼作者接受稿或更早的草稿。
  - >-
    投稿前要確認的過時連結：印刷版前頁的 Information for Authors 寫初審投稿網址為 http://www.ams.org/peer-review/submission.pl，2026-10-25 回 404，
    現行入口是 https://ams.msp.org/submit_new.php?j=bull；同一份說明提到的 "Submission Instructions" 頁（Bulletin 首頁連結 https://pubs.ams.org/jourhtml/submitms.html）
    在 2026-10-25 轉址到 AMS Digital Library 的搜尋結果頁（沒有內容）；前頁 PDF 裡的圖檔規定（EPS／TIFF）、錄取後寄原始檔到特定 email 的說明是舊式程序，投稿階段只需要單一 PDF。
  - >-
    AMS 網站（www.ams.org、pubs.ams.org）對 curl 與一般腳本回 HTTP 403 + 約 28.8 KB 的 "Verifying your connection" 挑戰頁；重新驗證時要用 Safari 開頁面確認原文仍在，
    verify.py 對這些來源會回 NEEDS_AGENT，這是預期結果。Bulletin 首頁與各期目錄頁每期都會變，hash 會常變；規定性內容的比對以 ams_about、ams_submission、ams_info_for_authors 為準。
  - >-
    EditFlow 只讀到 Step 0（沒有按 "I accept"）。作者資料、編輯選擇、cover letter、檔案上傳等欄位要求未知；初審投稿的 PDF 是否要去掉作者姓名與單位，Step 0 沒有說。
