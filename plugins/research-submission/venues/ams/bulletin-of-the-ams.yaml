identity:
  name: Bulletin of the American Mathematical Society
  name_variants:
    - value: Bulletin (New Series) of the American Mathematical Society
      src: [ams_info_for_authors]
      note: 印刷版前頁與 AMS Author Packages 清單使用的全名
  abbreviation: Bull. Amer. Math. Soc.
  abbreviation_note: 縮寫出自各篇文章的引用行 "Bull. Amer. Math. Soc. 63 (2026), 531-557"（ams_home）
  publisher: American Mathematical Society
  owner: American Mathematical Society
  publisher_evidence: >-
    ams_info_for_authors："Bulletin (New Series) of the American Mathematical Society ... is published quarterly by the American Mathematical Society
    at 201 Charles Street, Providence, RI 02904-2213 USA."
    MJL 出版社欄 "AMER MATHEMATICAL SOC , 201 CHARLES ST, PROVIDENCE, USA, RI, 02940-2213"（郵遞區號與 AMS 自己寫的 02904 不同，MJL 端的筆誤）；
    SCImago 出版社欄 "American Mathematical Society"，國別 United States。
  issn: {print: "0273-0979", electronic: "1088-9485", src: ams_home}
  issn_cross_check: >-
    SCImago 頁 "ISSN 02730979, 10889485"；MJL 搜尋 0273-0979 得 "ISSN / eISSN: 0273-0979 / 1088-9485"；ams_info_for_authors 也寫
    "ISSN 0273-0979 (print); ISSN 1088-9485 (online)"。四處一致。
  homepage: https://pubs.ams.org/journals/bull
  homepage_note: 使用者指定的 https://www.ams.org/journals/bull/ 在 2026-10-25 轉址到 pubs.ams.org/journals/bull
  hosting_platform: {name: AMS Digital Library, url: "https://pubs.ams.org/journals/bull"}
  subject_area:
    value: Mathematics（涵蓋全數學，無單一子領域限定）
    scimago: "Mathematics → Applied Mathematics；Mathematics (miscellaneous)"
    src: [scimago, ams_home]
  frequency:
    value: quarterly
    src: [ams_about, ams_info_for_authors]
    note: '"The Bulletin of the American Mathematical Society is published quarterly with articles electronically published individually to the AMS website before appearing in an issue."（ams_about）'
  founded:
    value: 1891
    src: [ams_about, scimago]
    note: 'ams_about："beginning with the inaugural issue published in 1891"；SCImago 涵蓋年份 1891–2026'
  coverage: {value: "1891-2026", src: scimago, note: SCImago 頁面所列涵蓋年份}
  external_ids:
    scimago: "24660"
    crossref: "0273-0979"
    openalex: issn:0273-0979
  open_access:
    value: subscription_with_green_oa
    src: [ams_open_access, ams_copyright, ams_home, ams_about]
    note: >-
      Bulletin 不在 AMS 的 diamond OA 名單（Communications of the AMS、Conformal Geometry and Dynamics、Representation Theory）
      也不在 gold OA 名單（Proceedings of the AMS Series B、Transactions of the AMS Series B）。AMS 只對這兩本 gold 刊公布 APC。
      摘要、參考文獻與書目資料對所有人免費；ams_home 寫 PDF 需要現行電子版訂閱；ams_open_access 寫訂閱刊內容滿 5 年（滾動）開放；
      ams_about 另有一句 "The American Mathematical Society makes all issues of the Bulletin freely available to all mathematicians through the generosity of its members."
      這幾句在字面上互相有出入，見 warnings。預印本與作者接受稿的張貼規定見 requirements.policies.preprints。
