identity:
  name: Annals of the Institute of Statistical Mathematics
  abbreviation: AISM
  publisher: Springer Nature（Springer；SCImago 標 "Springer Netherlands"，MJL 標 "SPRINGER HEIDELBERG"）
  publisher_src: [springer_journal_home, scimago, mjl]
  owner:
    name: The Institute of Statistical Mathematics, Tokyo
    note: >-
      ISM 頁寫 "AISM is an official publication of the Institute of Statistical Mathematics."；Springer 首頁頁尾
      "© The Institute of Statistical Mathematics, Tokyo"，Societies and partnerships 欄列 ISM；著作權依 ISM 頁移轉或授權給 ISM。
      ISM 訂閱頁寫 "Issues from Vol.40 onwards are distributed by Springer."
    src: [ism_journal_home, springer_journal_home, ism_info_for_authors]
  issn: {print: "0020-3157", electronic: "1572-9052"}
  issn_src: [springer_journal_home, scimago, mjl]
  homepage: https://link.springer.com/journal/10463
  society_site: https://www.ism.ac.jp/editsec/aism/
  editorial_office:
    organization: Editorial Office, The Institute of Statistical Mathematics, 10-3 Midori-cho, Tachikawa, Tokyo 190-8562, Japan
    email: editsec@ml1.ism.ac.jp
    note: >-
      Springer 的 contact 頁寫 "(external support: editsec@ml1.ism.ac.jp)"；ISM 頁寫成 "editsec (at) ml1.ism.ac.jp"。
      投稿問題、審稿流程、稿件狀態的詢問寄這裡。
    src: [springer_contact, ism_journal_home]
  editors:
    # 兩個官方頁面對 Co-Editors 的名單不同：Springer 頁是 Kengo Kamatani 與 Kei Kobayashi，ISM 頁是 Kengo Kamatani 與 Ryo Okui
