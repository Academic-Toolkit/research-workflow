--- # research-submission venue record
# 內容擷取自 Annals of the Institute of Statistical Mathematics（AISM）的兩組官方頁面，2026-11-13：
#   (1) 統計數理研究所（ISM，東京）自己的期刊站 www.ism.ac.jp/editsec/aism/（首頁、Information for Authors、
#       Research Data Policy、Editorial Board、Permission to reproduce）；
#   (2) Springer Nature Link 的期刊頁（link.springer.com/journal/10463：首頁、aims and scope、submission guidelines、
#       how to publish with us、ethics and disclosures、editorial board、contact、volumes and issues）；
#   另有 Springer 全品牌期刊政策頁、Editorial Manager 登入頁、SCImago 與 Clarivate Master Journal List。
# 讀取方式：Springer 與 ISM 的 HTML 頁都先用 curl 取得完整頁面（200），文字用 Python html.parser 自行去標籤；
#   SCImago 與 MJL 用 Safari（--profile 個人）讀 document.body.innerText；本記錄的引文都出自這些自行抽取的文字，
#   沒有用摘要型抓取器當引文來源。
# 兩組官方頁面的內容已經不同步：ISM 的 Information for Authors 標 "Revised on January 1, 2026"，
#   Springer 的 submission guidelines 沒有修訂日期，著作權、重印本、審稿描述的文字與 ISM 頁不同；
#   編輯群名單與影響係數也不一致。見 warnings 與各欄的 src。
# 本刊沒有 Instructions for Authors PDF；投稿規定全部在上述兩個 HTML 頁。
# 本記錄只放期刊公開規定，不含任何投稿者或稿件資訊。

schema_version: 1
id: ism/aism
kind: journal
family: statistics-journals
status: active

# ─────────────────────────────────────────────────────────────
# 來源與 provenance。所有網址由期刊首頁、ISM 站的選單與頁內連結取得，非推測。
# ─────────────────────────────────────────────────────────────
sources:
  - id: ism_info_for_authors
    role: authoritative
    url: https://www.ism.ac.jp/editsec/aism/aism-info-author.html
    note: >-
      ISM 自己的 Information for Authors，頁首標 "Revised on January 1, 2026"，各節標題分八項
      （General、Copyright (effective on January 1, 2026)、Submission of Papers、Manuscripts、Supplementary Material、
      Proofs、Page charges and Reprints (effective on January 1, 2026)、Research Data Policy）。
      Editorial Manager 的 About 選單 "Instructions For Authors" 連到這一頁
      （http://www.ism.ac.jp/editsec/aism/aism-info-author.html，由 editorial_manager 來源的原始碼取得）。
      與 springer_submission_guidelines 的文字大部分相同，但著作權、頁費與重印本、審稿描述三處不同，見 warnings。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Papers are screened by the Editors"
        min_extracted_chars: 5000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: springer_submission_guidelines
    role: authoritative
    url: https://link.springer.com/journal/10463/submission-guidelines
    note: >-
      Springer Link 上的 Instructions for Authors（單一 HTML 頁，沒有 PDF 版）：General、Copyright、Submission of Papers、
      Manuscripts、Supplementary Material、Proofs、Page charges and Reprints、Research Data Policy、Open access publishing。
      頁面沒有修訂日期，著作權與重印本的文字與 ISM 站 2026-01-01 版不同（見 warnings）。
      目錄另列 "Mistakes to avoid during manuscript preparation"，連到 https://link.springer.com/pre-submission?journalId=10463，
      該頁只有勾選清單的框架，沒有本刊專屬規定，未列為來源。
      頁尾含讀者的 IP 位址與機構授權名單，抽取文字的 hash 會隨連線改變。Springer 對沒有 cookie 的請求會導向
      ?error=cookies_not_supported&code=... 的網址，內容相同。
      抓取方式（適用所有 link.springer.com 的 HTML 來源）：curl 可取得完整頁面（200），但 verify.py 用的 Python urllib
      只會拿到約 3 KB 的 Client Challenge 頁（HTTP 200，2026-11-13 實測），所以記為 browser／http_viable: false，
      verify.py 只會回 NEEDS_AGENT；重新驗證時用 Safari 或 curl 讀頁面，確認 must_contain 仍在。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 取得完整頁面（200、203358 bytes），但 Python urllib（verify.py 的抓取器）只拿到 3036 bytes、209 字元的 Client Challenge 頁（HTTP 200）"
      validity:
        must_contain: "The maximum length of the manuscript should not normally exceed 35 pages"
        min_extracted_chars: 6000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

