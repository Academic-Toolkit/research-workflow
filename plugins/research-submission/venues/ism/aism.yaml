# ─────────────────────────────────────────────────────────────
warnings:
  - >-
    本刊有兩組官方須知，文字已經不同步：ISM 站的 Information for Authors 標 "Revised on January 1, 2026"，Springer 的 submission guidelines
    沒有日期。差異有三處：(1) 著作權：ISM 頁寫錄取後可選 standard license 或 open access (Creative Commons) license，未選 OA 才移轉著作權給 ISM；
    Springer 頁寫一律移轉。(2) 重印本：Springer 頁寫三十份免費，ISM 頁寫提供 PDF 下載連結、紙本重印本付費購買。
    (3) 審稿描述：Springer 頁寫 "All manuscripts will be reviewed by at least two reviewers."，ISM 頁寫編輯初篩後交副編輯處理，沒有審稿人人數。
    兩個 style file 的 zip 也不同（見 ism_style_zip 與 springer_style_zip 的 note）。投稿前兩邊都要讀，並以投稿系統的實際畫面為準。
  - >-
    篇幅上限 "should not normally exceed 35 pages" 是軟性措辭；官方沒有定義頁的版面（行距、字級、邊界），也沒有說是否含附錄、參考文獻、表、圖，
    更沒有說補充材料是否計入。官方保留拒收「篇幅過長或用過小字體塞滿頁面」稿件的權利（"The Editors reserve the right to refuse to receive
    manuscripts that have excessive lengths or have overstuffed pages with immoderately small fonts."）。摘要不超過 150 字、單一段落、不得引用文獻；
    關鍵字不超過 10 個；以 PDF 投稿，AISM 的 LaTeX style file 只是 "recommended"。
  - >-
    審稿制度（單匿名或雙匿名）本刊頁面沒有寫，不能假設。須知要求標題頁列作者姓名與單位，也沒有提供匿名稿件的選項；Springer 全品牌政策頁只說
    多數期刊用單匿名、各刊可不同。要確定時問編輯部（editsec@ml1.ism.ac.jp）或看投稿系統的稿件類型與上傳說明。
  - >-
    scope 沒有任何排除句：官方只說收「理論、計算與／或方法面向有新啟發的高品質論文」，強調新方法（由真實資料促成）、統一理論、既有方法與理論的分析與改進，
    也想對機器學習與計量經濟學有貢獻。官方沒有談機率論、純應用或軟體論文，沒有列審稿判準，也沒有公布初篩退稿比例；
    ISM 頁只說 "Papers are screened by the Editors."。官方沉默不等於收或不收。
  - >-
    費用：無投稿費（未見）、無頁費（"There will be no page charge."）。hybrid：錄取後可選訂閱路徑（免費）或開放取用（APC £2390 / $3290 / €2790，另加稅，
    以接受日當天的價格為準）。資料公開只是 "encourages"，本刊頁面沒有資料可用性聲明、preprint、AI 使用的條文；這三項只有 Springer Nature
    全品牌政策可引用，記錄裡都標為 publisher-wide，不是本刊自己的規定。
  - >-
    指標不一致且未點名提供者：Springer 首頁印 Journal Impact Factor 1.4 (2025)、5-year 1.1 (2025)；ISM 首頁印 Impact factor 0.6 (2024)、
    Five year impact factor 1.0 (2024)；兩頁都沒寫是否出自 JCR。分區只有 SJR（SCImago，Statistics and Probability，2025 為 Q2），JCR 分區未查。
    首次決定速度只有 "2019 年 7 月至 2020 年 6 月收到的稿件約 60%／80%／90% 在 1／3／5 個月內有首次決定" 這一句分布描述；
    接受率、投稿到接受的時間官方都沒有公布。Editorial board 也不一致：Springer 頁 Co-Editors 是 Kamatani 與 Kei Kobayashi，ISM 頁是 Kamatani 與 Ryo Okui。
