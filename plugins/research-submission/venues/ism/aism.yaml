# ─────────────────────────────────────────────────────────────
# SLOW — 數年不變。
# ─────────────────────────────────────────────────────────────
requirements:
  refresh: {check_every: P6M, method: manual}

  scope:
    aims: >-
      宗旨是提供統計學者公開交流的論壇，並推進「讓人類能處理資訊、因應不確定性」的統計科學；收錄在統計科學的
      理論、計算與／或方法面向有新啟發的高品質論文；強調 (a) 由真實資料促成的新方法、(b) 統一理論的發展、
      (c) 既有方法與理論的分析與改進；也想對機器學習與計量經濟學的統計科學有貢獻。
    quote: >-
      Annals of the Institute of Statistical Mathematics (AISM) aims to provide a forum for open communication among
      statisticians, and to contribute to the advancement of statistics as a science to enable humans to handle information
      in order to cope with uncertainties. It publishes high-quality papers that shed new light on the theoretical,
      computational and/or methodological aspects of statistical science. Emphasis is placed on (a) development of new
      methodologies motivated by real data, (b) development of unifying theories, and (c) analysis and improvement of
      existing methodologies and theories. It also seeks to contribute to statistical science in machine learning and
      econometrics.
    src: [springer_aims_and_scope, ism_journal_home, springer_journal_home]
    emphasis:
      quote: >-
        Emphasis is placed on (a) development of new methodologies motivated by real data, (b) development of unifying
        theories, and (c) analysis and improvement of existing methodologies and theories.
      src: springer_aims_and_scope
    evaluation_criteria:
      status: not_published
      checked: 2026-11-13
      src: [springer_aims_and_scope, springer_submission_guidelines, ism_info_for_authors, ism_journal_home]
      note: >-
        官方頁面沒有列審稿或錄取判準（沒有 referee guidelines 頁，也沒有 novelty、importance 之類的判準清單）。能引用的只有
        scope 的 "high-quality papers that shed new light on ..." 與上方 Emphasis 三點。ISM 的 Information for Authors 只寫
        "Papers are screened by the Editors. Papers not rejected by the screening are assigned to an associate editor who will handle
        the review process."，沒有說初篩看什麼。
    explicit_exclusions:
      status: not_published
      checked: 2026-11-13
      src: [springer_aims_and_scope, springer_journal_home, springer_submission_guidelines, ism_info_for_authors, ism_journal_home, ism_data_policy]
      note: >-
        在 aims and scope、Springer 首頁、submission guidelines、ISM 首頁與 Information for Authors、Research Data Policy 全文，
        沒有任何一句說本刊不收或低優先處理某類主題或稿件類型（以 "not"、"do not"、"discouraged"、"outside" 等字檢查，
        命中的句子都不是談收稿範圍：見 limiting_statements_verbatim）。官方沒有說機率論、純應用、軟體或套件論文收或不收；
        頁面出現 "probab" 只在參考文獻格式範例的書名，出現 "applic" 只在參考文獻範例的書名與資料政策的 "where possible and applicable"，"software" 在這些頁面完全沒出現
        （2026-11-13 全文搜尋）。這是官方沉默，不是同意也不是反對。
    limiting_statements_verbatim:
      # 對稿件有界定或限制作用的句子，逐字列出；官方沒有用排除語氣談過主題。
      - quote: >-
          The Editors encourage prospective authors to submit manuscripts within the scope of Annals of the Institute of
          Statistical Mathematics (AISM).
        effect: 鼓勵投稿在範圍內的稿件；範圍就是上方 scope 那一段，官方沒有進一步定義。
        src: [springer_submission_guidelines, ism_info_for_authors]
      - quote: >-
          To qualify for publication, papers must be previously unpublished and not be under consideration for publication elsewhere.
        effect: 資格條件是未發表且未在他處審查中，與主題無關。
        src: [springer_submission_guidelines, ism_info_for_authors]
      - quote: >-
          The Editors reserve the right to refuse to receive manuscripts that have excessive lengths or have overstuffed pages
          with immoderately small fonts.
        effect: 篇幅與版面的限制，不是主題限制。措辭是 "reserve the right"，屬保留權利，不是一律退稿。
        src: [springer_submission_guidelines, ism_info_for_authors]
      - quote: >-
          Papers are screened by the Editors. Papers not rejected by the screening are assigned to an associate editor who
          will handle the review process.
        effect: 說明有編輯初篩；沒有說初篩的標準，也沒有說多少比例被初篩退稿。只出現在 ISM 頁，Springer 頁沒有這兩句。
        src: ism_info_for_authors
    named_topics:
      value: [machine learning, econometrics]
      note: scope 最後一句 "It also seeks to contribute to statistical science in machine learning and econometrics." 是唯一點名的領域。
      src: springer_aims_and_scope
    theory_vs_application: >-
      scope 同時列 "theoretical, computational and/or methodological aspects"，強調的三點含 "development of unifying theories"
      與 "development of new methodologies motivated by real data"。官方沒有說純理論稿件需要附實證或模擬，也沒有說純應用稿件不收。
    audience: {status: not_published, checked: 2026-11-13, src: [springer_aims_and_scope], note: scope 沒有列出目標讀者}
    scimago_subject_areas: [Mathematics / Statistics and Probability]
    scimago_subject_areas_src: scimago

  article_types:
    status: not_published
    checked: 2026-11-13
    src: [springer_submission_guidelines, ism_info_for_authors, springer_aims_and_scope, springer_journal_home]
    note: >-
      submission guidelines 與 ISM 的 Information for Authors 都沒有文章類型清單，也沒有各類型的篇幅規格；
      通篇只說 "papers" 與 "manuscripts"。投稿系統是否另有類型選單，本記錄無法得知（需登入）。
  article_type_labels_observed:
    labels: [OriginalPaper]
    src: springer_journal_home
    as_of: 2026-11-13
    note: 這是 Springer 首頁「最新文章」五筆在列表上的標籤，不是投稿規定，也不代表沒有其他類型。

  length:
    value: 35
    unit: pages_typeset
    basis:
      unit_as_stated: pages
      note: >-
        官方只寫 "35 pages"，沒有說行距、字級、邊界或排版樣式，也沒有說是否以 AISM style file 計頁。schema 的單位列舉
        沒有「未指定」，pages_typeset 是最接近的選項（作者交 PDF、頁面自己排版），不代表官方定義了排版樣式。
        官方頁面確有的相關句子是 "All pages should be numbered." 與 "overstuffed pages with immoderately small fonts"。
    wording: >-
      Manuscripts should be arranged as follows: (1) title page, (2) abstract, keywords, (3) text, (4) appendices (if necessary),
      (5) acknowledgements (when appropriate), (6) references, (7) tables and (8) figures. All pages should be numbered.
      The maximum length of the manuscript should not normally exceed 35 pages. The Editors reserve the right to refuse to receive
      manuscripts that have excessive lengths or have overstuffed pages with immoderately small fonts.
    includes_note:
      status: not_published
      checked: 2026-11-13
      src: [springer_submission_guidelines, ism_info_for_authors]
      note: >-
        官方沒有說 35 頁是否含附錄、參考文獻、表、圖。前一句列出的稿件排列順序含這些部分，但那是「怎麼排列」，沒有說這些都計入頁數，
        所以 schema 的 includes 欄留空，不替官方補。
    exceptions: >-
      措辭是 "should not normally exceed"，屬軟性上限；官方沒有寫超過時的處理方式，也沒有寫超過需事先聯絡編輯。
      補充材料可放技術推導、證明、額外圖表、資料與程式（見 supplementary_material），但官方沒有說補充材料是否計入頁數。
    src: [springer_submission_guidelines, ism_info_for_authors]
    word_limit: {status: not_published, checked: 2026-11-13, src: [springer_submission_guidelines, ism_info_for_authors]}
    figures_tables_max: {status: not_published, checked: 2026-11-13, src: [springer_submission_guidelines], note: 只寫 "Tables should be restricted to the minimum necessary" 與 "The number of figures is to be restricted as much as possible"，沒有數字上限}
    references_max: {status: not_published, checked: 2026-11-13, src: [springer_submission_guidelines]}

  abstracts:
    - id: single
      applies_to: all_manuscripts
      max_words: 150
      paragraphs: 1
      required_at: submission
      quote: >-
        Abstract: Each manuscript should be preceded by an abstract of no more than 150 words in a single paragraph.
        The abstract should state results in such a way that the reader can evaluate their significance.
        References should not be cited in the abstract.
      note: 不是結構化摘要；官方沒有要求分段標題。Springer 頁與 ISM 頁文字相同。
      src: [springer_submission_guidelines, ism_info_for_authors]
  keywords:
    max: 10
    unit: "key words or phrases"
    position: 緊接在摘要之後
    quote: >-
      Keywords: Immediately after the abstract no more than ten key words or phrases are to be supplied to represent the
      subject matter of the paper.
    msc_classification: {status: not_published, checked: 2026-11-13, src: [springer_submission_guidelines, ism_info_for_authors, ism_style_zip], note: 須知與 template.tex 都沒有 MSC 分類碼的要求}
    src: [springer_submission_guidelines, ism_info_for_authors]

  title_page:
    required_fields:
      - 標題（簡短、清楚、能反映內容）
      - 作者姓名
      - 作者單位與地址（與現在地址不同時用腳註）
      - 通訊作者與校樣收件人的標示（建議寫在最後一個腳註；沒寫則寄給第一作者）
      - 建議的 running head（少於 60 個字元含空格，放在腳註）
    quote: >-
      The title page should include the article title, the authors’ names, the authors’ affiliations and addresses, and any
      necessary footnotes. Authors’ present addresses, if different, should be footnoted. The title should be brief, clear and
      informative of the contents of the paper. A proposed running head of less than 60 characters and spaces should be included
      in the footnote. For co-authors, it is desirable to indicate in the last footnote the author to whom correspondence and
      proofs should be sent, otherwise they will be sent to the first-named author.
    note: >-
      引文取自 Springer 頁（用彎引號 ’）；ISM 頁文字相同但用直引號。官方沒有提到 ORCID、作者貢獻聲明或利益衝突聲明的位置。
    src: [springer_submission_guidelines, ism_info_for_authors]

  formatting:
    submission_file: PDF（"Manuscripts in pdf format should be submitted via the Editorial Manager online submission for the journal."）
    latex:
      status: recommended
      quote: It is recommended to use the AISM style file for LaTeX2e below.
      note: >-
        是「建議」，不是強制；須知沒有要求原始 tex 檔，也沒有要求 Word 或 LaTeX 以外的格式說明。
        ISM 頁的版本把連結寫成 https://www.ism.ac.jp/editsec/aism/aism-style.zip。
      src: [springer_submission_guidelines, ism_info_for_authors]
    template:
      class: svjour3
      documentclass: "\\documentclass[smallextended,natbib,runningheads]{svjour3}"
      files_in_ism_zip: [history.txt, natbib.sty, readme.txt, spbasic.bst, svglov3.clo, svjour3.cls, template.tex, user_guide3.dvi, user_guide3.pdf]
      files_in_springer_zip: [history.txt, readme.txt, svglov3.clo, svjour3.cls, template.tex, user_guide3.dvi, user_guide3.pdf]
      journalname_command: "\\journalname{Annals of the Institute of Statistical Mathematics}"
      bibliography_style: spbasic（作者年份式；ISM 版 zip 內附 spbasic.bst，Springer 版 zip 沒有）
      keywords_in_template: 範本把關鍵字放在 abstract 環境內（\keywords{First keyword \and Second keyword \and More}）
      note: >-
        template.tex 的檔頭寫 "Springer Heidelberg 2006/07/26"，svjour3.cls 是 2006 版；ISM 版 zip 的 template.tex 與 spbasic.bst
        是 2025-05 更新的。範本註解是範本層級的說明，不是期刊頁面規定。
      src: [ism_style_zip, springer_style_zip]
    arrangement: >-
      標題頁、摘要與關鍵字、正文、附錄（必要時）、致謝（適當時）、參考文獻、表、圖；"All pages should be numbered."
    text_and_footnotes: >-
      "The text should be reasonably subdivided into sections and subsections as necessary. In the text, footnotes should be avoided
      as far as possible."
    equations: >-
      "Only the equations to which reference is made in the text should be numbered consecutively at the right-hand margin by
      enclosing in parentheses as (1), (2), etc."
    tables: >-
      表要精簡（"Tables should be restricted to the minimum necessary"）；阿拉伯數字依出現順序編號；簡短描述性標題放在表上方；
      表註用參考記號或上標小寫字母；原文寫 "typed on separate sheets"，並要在正文標出表的大約插入位置。
    figures: >-
      所有插圖都算 figure，阿拉伯數字依出現順序編號；品質要能直接複製（"suitable for direct reproduction"）；數量盡量少；
      必要時錄取後會要求專業繪圖。線上版彩色圖照樣是彩色，紙本彩色費用由出版商在校對階段通知（見 fees.color_in_print）。
    references:
      style: 作者年份式（正文括號內放作者姓與年份；清單依作者姓氏字母排序，同一作者依年份排序）
      rules:
        - "正文引用範例：Fisher (1932)、Brown (1985, 1986)、Hall (1978a, b)；兩位作者 Johnson and Kotz (1982)；三位以上 Davis et al. (1977)"
        - 同一作者同年有多篇時在年份後加 a、b、c
        - 期刊名要完整拼出，不用縮寫（除非縮寫就是刊名）
        - 每筆要有年份、完整標題、出處、卷號與起訖頁碼
      journal_example: "Akaike, H. (1974). A new look at the statistical model identification. IEEE Transactions on Automatic Control, AC-19, 716-723."
      data_citation: >-
        有 DOI 的資料集可列入參考文獻，引用內容含作者（年）、標題、出版者（儲存庫名稱）、識別碼（見 openness.data_and_code）。
      src: [springer_submission_guidelines, ism_info_for_authors]
    language: English（"The accepted language is English."）
    src: [springer_submission_guidelines, ism_info_for_authors]

