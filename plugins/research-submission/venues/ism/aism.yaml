    note: >-
      ISM 站的 AISM LaTeX2e style file（Information for Authors 第 3 項的連結；ISM 首頁寫 zip 178KB，下載實得 182082 bytes）。
      zip 內 10 個檔：history.txt、natbib.sty（2014-09-03）、readme.txt、spbasic.bst（2025-05-13）、svglov3.clo、svjour3.cls、
      template.tex（2025-05-14）、user_guide3.dvi、user_guide3.pdf。2026-11-13 下載的 sha256 為
      39426dc12e9f231046174b4905f69b524c78676d236aacc545a33ee2d0395291。
      本記錄的範本細節（class 與選項、關鍵字位置、參考文獻樣式）出自解壓後自行讀 template.tex 與 readme.txt。
      verify.py 的 HTML 抽取器讀不到壓縮內容：must_contain 用的是壓縮檔目錄裡的成員檔名，只能斷言抓到的是這個壓縮檔，
      不能斷言規定內容；hash 等於監看整個壓縮檔。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "aism-style/template.tex"
        min_extracted_chars: 100000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

