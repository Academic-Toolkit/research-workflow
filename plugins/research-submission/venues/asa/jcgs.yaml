--- # research-submission venue record
# 內容擷取自 Taylor & Francis（ASA 委託出版）的 JCGS 投稿須知與期刊資訊頁、T&F Author Services 全出版社政策頁、
# ASA 與 IMS 的官方頁面、SCImago、Clarivate Master Journal List，2026-10-25。
# 讀取方式：tandfonline.com 對 curl 回 403 挑戰頁，用 Safari 讀 document.body.innerText；
# authorservices.taylorandfrancis.com、amstat.org、community.amstat.org 以 curl 可取得完整頁面（200）；
# IMS 的頁面前面有 Anubis 機器人檢查（curl 只拿到 7 KB 空殼），Safari 等幾秒後可讀；
# SCImago 與 MJL 用 Safari 讀（MJL 是 JS 單頁應用，只能在頁內查詢）。
# 本刊的「Instructions for authors」是 tandfonline.com 上的 HTML 頁，沒有 PDF；頁尾標示「Updated 10-06-2026」（月日順序頁面未說明）。
# 收錄緣由：語料庫缺這本；與 JASA（asa/jasa）同出版社同學會，但 scope 偏計算與視覺化，供 choose-venue 比較用。
# 本記錄只放期刊公開規定與公開的編輯部名單，不含任何投稿者或稿件資訊。
#
# sources 排序是刻意的：http 來源全部排在前面、browser 來源排在最後。
# verify.py 以「替換第一個 extracted_sha256: null」寫回 hash，若 browser 來源排在前面，
# http 來源的 hash 會被寫進 browser 來源的欄位。

schema_version: 1
id: asa/jcgs
kind: journal
family: statistics-journals
status: active

# ─────────────────────────────────────────────────────────────
sources:
  - id: tf_preprints
    role: supporting
    url: https://authorservices.taylorandfrancis.com/publishing-your-research/making-your-submission/posting-to-preprint-server/
    note: T&F 全出版社層級的 preprint 政策；JCGS 須知頁「Preprints Author Services page」連結指向此頁（連結少了結尾斜線，會導到此頁）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "We do not consider posting on a preprint server to be duplicate publication"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: tf_ai_policy
    role: supporting
    url: https://authorservices.taylorandfrancis.com/editorial-policies/using-ai-in-your-research-and-manuscript-preparations/
    note: T&F 全出版社層級的生成式 AI 政策；JCGS 須知頁 Checklist 的「Declaration of generative AI use」連到此頁。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "How to declare generative AI use in your manuscript"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: tf_supplementary
    role: supporting
    url: https://authorservices.taylorandfrancis.com/publishing-your-research/writing-your-paper/enhancing-your-article-with-supplementary-material/
    note: >-
      T&F 對 supplementary material 的通則：什麼是「for review」、檔案放在 Figshare、不設大小上限、T&F 不檢查也不校對。
      JCGS 須知頁「More information on supplements is available here」的連結
      （https://authorservices.taylorandfrancis.com/enhancing-your-article-with-supplemental-material/）2026-10-25 回 404；
      Checklist 裡另一個連結（.../writing-your-paper/enhance-article-with-supplemental-material/）會導到本頁。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Taylor & Francis supports a range of supplementary materials"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: tf_data_sharing_policies
    role: supporting
    url: https://authorservices.taylorandfrancis.com/data-sharing-policies/
    note: >-
      T&F 的資料共享政策分級（Basic、Share upon reasonable request、Publicly Available、Open Data、Open and FAIR），
      並寫明「請看該期刊的 Instructions for Authors 以得知適用哪一級」。JCGS 須知頁沒有點名其中任何一級，見 requirements.openness。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "A journal with our basic policy encourages you to share"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: tf_metrics_guide
    role: supporting
    url: https://authorservices.taylorandfrancis.com/publishing-your-research/choosing-a-journal/journal-metrics/
    note: >-
      T&F 期刊頁指標的定義：速度指標（首次決定、首次審後決定、接受到上線）與接受率怎麼算。
      JCGS 期刊資訊頁的 "Learn more about journal metrics" 與各指標連結都指向此頁。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Speed to first decision and first post-review decision"
        min_extracted_chars: 10000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: latex_template
    role: supporting
    url: https://files.taylorandfrancis.com/ucgs-template.zip
    note: >-
      須知頁「JCGS LaTeX template (zip file)」。zip 內含 template.tex、template.qmd、agsm.bst、bibliography.bib 與範例圖。
      這是二進位檔：verify.py 的 HTML 抽取器對它只能產生決定性的位元組指紋（可偵測範本被換掉），不是可讀文字；
      must_contain 只用來確認拿到的是 zip 而不是 404 頁。2026-10-25 下載解壓後讀 template.tex 與 template.qmd。
      摘要「200 or fewer words」與關鍵字「3 to 6 keywords, that do not appear in the title」只寫在這個範本裡，須知頁沒有。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "template.tex"
        min_extracted_chars: 100000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: asa_journals
    role: supporting
    url: https://www.amstat.org/publications/journals
    note: ASA 自家期刊總覽頁，JCGS 只有兩句簡介（"A journal of the ASA and the Institute of Mathematical Statistics"）；連到 tandfonline 的 toc/ucgs20/current。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "A journal of the ASA and the Institute of Mathematical Statistics"
        min_extracted_chars: 4000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: asa_data_policy_2018
    role: supporting
    url: https://community.amstat.org/blogs/ronald-wasserstein/2018/01/17/asa-journals-policies-on-data-sharing-and-reproduc
    note: >-
      ASA 執行長 2018-01-17 的部落格文章（署名 Ronald Wasserstein，主要撰稿 Eric Sampson，ASA Journals Manager）：
      ASA 自有期刊的資料與程式碼政策，其中一句點名 JCGS。這是 2018 年的說法，早於現行的投稿須知（2026），
      只當歷史背景，現行規定以 tf_instructions 為準。amstat.org 上的對應頁
      （https://www.amstat.org/publications/q-and-as/asa-journal-policies-on-data-sharing-and-reproducibility）
      只是這篇的摘要，沒有提到 JCGS。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Another example is the Journal of Computational and Graphical Statistics, which requires authors to submit code and data"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: tf_instructions
    role: authoritative
    url: https://www.tandfonline.com/action/authorSubmission?show=instructions&journalCode=ucgs20
    note: >-
      規定本體：About the Journal（含 JCGS 自己寫的 scope 與審查段）、Open Access、Structure、Length、Style Guidelines、
      Supplementary Material、Checklist、Submitting Your Paper、Publication Charges。頁尾標示「Updated 10-06-2026」。
      頁面內 JCGS 自有段落與 T&F 通用段落並存，有數處措辭不一致，記在各欄位的 note。
      由 https://www.tandfonline.com/journals/ucgs20 的 "Instructions for authors" 進入。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        Cloudflare 挑戰頁：curl 回 HTTP 403、約 5.7 KB（2026-10-25 實測）；同站 journals/ucgs20、about-this-journal
        也都是 403 + 約 5.5 KB 的同型挑戰頁。safari-browser（已登入的真實 Safari）可正常讀取（約 22.6 KB 文字）。
      validity:
        must_contain: "the principal criterion for acceptance of an article is the strength of its contribution to these fields"
        min_extracted_chars: 15000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: tf_about
    role: authoritative
    url: https://www.tandfonline.com/journals/ucgs20/about-this-journal
    note: >-
      Aims and scope、Journal metrics、Editorial board、Abstracting and indexing、Open access、Publication details（ISSN）都在本頁。
      "Publication details" 是收合的區塊，document.body.innerText 讀不到，ISSN 要從 DOM 的 .serialDetailsIssn / .serialDetailsEissn 取。
      指標每年更新（頁尾腳註：IF 與分區的版權屬 Journal Citation Reports、Clarivate Analytics；CiteScore 屬 Scopus），
      hash 會因此變動；比對時看 must_contain 與指標那幾行即可。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Cloudflare 挑戰頁（curl HTTP 403、約 5.5 KB），與 tf_instructions 相同。
      validity:
        must_contain: "Articles are written for readers who have a strong background in statistics but are not necessarily experts in computing"
        min_extracted_chars: 8000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: tf_journal_home
    role: supporting
    url: https://www.tandfonline.com/journals/ucgs20
    note: 期刊首頁："Published on behalf of the American Statistical Association"、Aims and scope 摘要、最新文章、現行期別（Volume 35, Issue 3, 2026）。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Cloudflare 挑戰頁（curl HTTP 403、約 5.5 KB），與 tf_instructions 相同。
      validity:
        must_contain: "Published on behalf of the American Statistical Association"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: tf_special_issues
    role: supporting
    url: https://www.tandfonline.com/journals/ucgs20/special-issues
    note: 2026-10-25 頁面寫 "There are no special issues available for this journal"，沒有開放中的徵稿。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Cloudflare 挑戰頁（同 tf_instructions）。
      validity:
        must_contain: "There are no special issues available for this journal"
        min_extracted_chars: 1000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: ims_handbook
    role: supporting
    url: https://imstat.org/ims-handbook/ims-handbook-activities-with-other-organizations/
    note: >-
      IMS Handbook 的「與其他組織的合作」頁：JCGS 的共同出版與管理委員會結構（ASA 為管理夥伴，IMS 與 IFNA 對科學內容與方向提供意見）。
      T&F 的 JCGS 頁面只提到 ASA 與 IMS，Interface Foundation 的角色只見於本頁。
      頁面前有 Anubis 機器人檢查：curl 回 200 但只有約 7 KB 的 "Making sure you're not a bot!" 空殼（2026-10-25 實測），
      Safari 開啟後等約 10 秒才載入內容。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 回 HTTP 200 但只有約 7 KB 的機器人檢查空殼（標題 Making sure you're not a bot!）"
      validity:
        must_contain: "Co-published by the American Statistical Association (ASA), the Interface Foundation (IFNA) and the IMS"
        min_extracted_chars: 5000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: scimago
    role: supporting
    url: https://www.scimagojr.com/journalsearch.php?q=23863&tip=sid&clean=0
    note: >-
      SCImago（SJR）期刊頁：SJR、分區（三個類別各一）、H-index、Scope、ISSN。sid 23863 由
      journalsearch.php?q=1061-8600&tip=iss 的搜尋結果取得（搜尋頁只列這一筆）。
      curl 回 403 挑戰頁（2026-10-25 實測：HTTP 403、5559 bytes），只能用瀏覽器讀。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "403, 5559-byte challenge page"
      validity:
        must_contain: "Journal of Computational and Graphical Statistics"
        min_extracted_chars: 8000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: mjl
    role: supporting
    url: https://mjl.clarivate.com/home
    note: >-
      Clarivate Master Journal List。JS 單頁應用，結果頁網址不帶查詢字串，無法用網址重現；
      只能在頁內於 #search-box 填 ISSN、按 #search-button 後讀結果列。
      本次填 1061-8600，結果頁網址是 https://mjl.clarivate.com/search-results。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "SPA 空殼，查詢結果需在頁內操作（同出版社的其他記錄 2026-10-25 實測 curl /home 為 200、約 11 KB 空殼）"
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25

