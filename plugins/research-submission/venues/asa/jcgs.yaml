cycle:
  applies_to: null
  rolling_calls: []
  note: 2026-10-25 檢查 special issues 頁，頁面寫沒有任何 special issue（src tf_special_issues）。

# ─────────────────────────────────────────────────────────────
warnings:
  - JCGS 的 scope 是計算統計與資料視覺化：理論稿須與其相關並含說明實際應用的結果（"provided that ..."）；軟體稿須帶來新概念、新演算法或新的軟體設計方式；主要判準是對這兩個領域的貢獻強度
  - 須知頁預期隨稿提交程式碼與資料作為 supplement（"are expected to"），例外須經 Editor 准許；頁面沒有寫何時要交，補充材料受 editorial review
  - 篇幅是「平均約 8,000 字、約 35 頁雙行距，含附錄、參考文獻、圖表」的指引，不是明文硬上限；但附錄也算在內，與 JASA 把附錄移到 supplement 的做法不同
  - 審查是單匿名，作者可選雙匿名；選了雙匿名要自行清除身分線索，須知頁沒有寫具體做法與選擇方式；已放 preprint 則匿名性無法保證
  - 摘要 200 字與關鍵字不得與標題重複，只見於 T&F 的 LaTeX 範本，須知頁本文沒有寫；關鍵字數量須知頁寫 3–6 個且依字母順序
  - Short Technical Notes 在文章類型清單裡，但須知頁沒有定義也沒有長度上限
  - IF 1.6 與「JCR 最佳分區 Q2」是 T&F 頁面轉述的 JCR 數字（2025），本次未直接查 JCR；SJR（SCImago）與 CiteScore 的分區是 Q1，是不同系統，引用時要註明系統
  - T&F 頁面的 "15 days avg. from submission to first decision" 含 desk rejection，送外審稿件的首次審後決定是 116 天；頁面對 avg 與 median 並用
  - 須知頁有兩個投稿入口（rp.tandfonline.com 的 Submission Portal 與疑為舊連結的 mc.manuscriptcentral.com/amstat），以 "Go to submission site" 的 journalCode=UCGS 為準
  - 須知頁「More information on supplements is available here」連結已失效（404），內容請看 T&F 的 supplementary material 通則頁（tf_supplementary）
