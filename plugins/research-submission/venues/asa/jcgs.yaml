      checked: 2026-10-25
      note: >-
        JCR 各類別的分區與名次需登入 Clarivate JCR，本次未查，不猜。T&F 頁面轉述的最佳分區見 publisher_stated_best_quartiles
        （Q2，類別未標明）。
    acceptance_rate:
      value: 15
      unit: percent
      as_of: 2026-10-25
      src: tf_about
      basis: >-
        T&F 頁面 "15% acceptance rate"。定義（同頁）："articles accepted for publication by the journal in the previous calendar year
        as percentage of all papers receiving a final decision"。頁面沒有標明是哪一年。
    time_to_first_decision:
      value: 15
      unit: days
      statistic: 頁面寫 "avg."，定義寫 "the average (median) number of days"，兩個詞並用，無法確定是平均還是中位數
      as_of: 2026-10-25
      src: tf_about
      basis: >-
        T&F 頁面 "15 days avg. from submission to first decision"。定義（同頁）：以最近六個月內收到首次決定的稿件計，
        "This includes manuscripts which are not sent for peer review (desk rejections). Manuscripts which are sent out for review
        can therefore have a significantly longer wait than this metric indicates."
    time_to_first_post_review_decision:
      value: 116
      unit: days
      statistic: 同上，頁面寫 "avg."，定義寫 "average (median)"
      as_of: 2026-10-25
      src: tf_about
      basis: 送外審的稿件從投稿到首次審後決定的天數，以最近六個月內收到審後決定的稿件計。
    acceptance_to_online:
      value: 80
      unit: days
      statistic: 同上
      as_of: 2026-10-25
      src: tf_about
      basis: 從接受到 Version of Record 上線，以最近六個月內上線的文章計。
    time_submission_to_acceptance:
      status: not_published
      checked: 2026-10-25
      src: tf_about
      note: T&F 頁面與投稿須知都沒有列投稿到接受的天數。本次沒有做抽樣估計（tandfonline.com 擋 curl，現有的 sample_review_times.py preset 不涵蓋 T&F）。

# ─────────────────────────────────────────────────────────────
requirements:
  refresh: {check_every: P6M, method: extracted_hash_diff}

  scope:
    aims: >-
      計算與視覺化方法在統計與資料分析上的應用與推進：數值方法、圖形展示與方法、感知（perception）。
      讀者是統計背景紮實、但不一定是計算專家的人。
    src: tf_about
    statement_about: >-
      "The Journal of Computational and Graphical Statistics (JCGS) presents the very latest techniques on improving and extending
      the use of computational and graphical methods in statistics and data analysis. Established in 1992, this journal contains
      cutting-edge research, data, surveys, and more on numerical graphical displays and methods, and perception. Articles are
      written for readers who have a strong background in statistics but are not necessarily experts in computing."（tf_about）
    statement_instructions: >-
      "The purpose of the Journal of Computational and Graphical Statistics (JCGS) is to improve and extend the use of computational
      and visualization methods in statistics and data analysis. The journal publishes articles that make original contributions to
      one or both of the fields of computational statistics and data visualization. In addition to quality, the principal criterion
      for acceptance of an article is the strength of its contribution to these fields."（tf_instructions, About the Journal）
    audience: >-
      "Articles should be written for readers who have a strong background in statistics but are not necessarily experts in
      computing and data visualization."
    encouraged: >-
      "Articles describing new computational methods or visualization techniques for application in any area of statistics are
      especially encouraged."
    theory_vs_computation:
      statement: >-
        "Articles of a theoretical nature are appropriate, provided that the results are relevant to computational statistics or
        data visualization and they include results that illustrate practical applications of the new material."
      reading: >-
        純理論稿不是被排除，但有兩個條件：結果須與計算統計或資料視覺化有關，且須含說明實際應用的結果。
        頁面沒有說「純理論稿不收」，條件是用 "provided that" 寫的。
      src: tf_instructions
    software_and_algorithms:
      statement: >-
        "Articles on statistical software are appropriate if they introduce new concepts, new algorithms, or new approaches to software
        design, or otherwise improve existing knowledge about statistical software."
      reading: 軟體稿須帶來新概念、新演算法、新的軟體設計方式，或增進對統計軟體的既有知識；只是發布一個套件不在這句話涵蓋內，但頁面也沒有明說不收。
      src: tf_instructions
    reviews:
      statement: >-
        "Review articles are also acceptable, especially if they describe results in areas of computing or visualization that are
        unlikely to be familiar to most readers of statistics literature."
      src: tf_instructions
    discouraging_or_excluding_sentences:
      - text: '"Avoid over-long papers, as they tend to burden our reviewers, elicit negative reviews, and discourage readership."'
        kind: 鼓勵短稿的勸告，不是排除
        src: tf_instructions
      - text: >-
          "Articles of a theoretical nature are appropriate, provided that the results are relevant to computational statistics or
          data visualization and they include results that illustrate practical applications of the new material."
        kind: 對理論稿附條件（見 theory_vs_computation）
        src: tf_instructions
      - text: >-
          "Articles on statistical software are appropriate if they introduce new concepts, new algorithms, or new approaches to
          software design, or otherwise improve existing knowledge about statistical software."
        kind: 對軟體稿附條件
        src: tf_instructions
    no_categorical_exclusion: >-
      2026-10-25 讀 tf_instructions 與 tf_about 全文，沒有找到「不收某類稿件」的明文；上列三句是最接近排除或勸退的字句。
    reproducibility: 見 openness（程式碼與資料是預期隨稿附上的 supplement，不是 scope 的一部分）。
    peer_review_policy_in_scope: >-
      須知頁 About the Journal 寫 "Please see the journal's Aims & Scope for information about its focus and peer-review policy."，
      但 Aims & Scope 頁（action/journalInformation?show=aimsScope&journalCode=ucgs20 導到 about-this-journal）沒有 peer-review policy 段落；
      審查模式實際寫在須知頁的 Peer Review 段，見 review。

  article_types:
    - id: article
      label: Articles
      limits: 見 length（平均約 8,000 字、約 35 頁雙行距，含附錄、參考文獻、圖表）
      src: tf_instructions
    - id: short_technical_note
      label: Short Technical Notes
      limits: {status: not_published, checked: 2026-10-25, src: tf_instructions}
      note: >-
        須知頁 About the Journal 只寫 "Journal of Computational and Graphical Statistics accepts the following types of article:
        Articles, Short Technical Notes."，沒有定義、也沒有長度上限；tf_about 與 tf_journal_home 亦無。
      src: tf_instructions
    - id: review
      label: Review articles
      note: >-
        須知頁在 scope 段承認 review articles 可接受，但 "accepts the following types" 的清單沒有列 Review；
        是否有獨立的 Review 類型或長度上限，頁面沒有說。
      src: tf_instructions
    - id: proceedings_paper
      label: Papers Published in Proceedings
      note: >-
        已刊於研討會論文集（不論是否經審查）不妨礙投稿。ASA Proceedings 的論文可幾乎原樣投稿；非 ASA proceedings 須是更完整的研究
        （新內容、寫給統計讀者、不侵犯版權），cover letter 須說明期刊版新增了什麼、會議論文是否有版權，並在期刊版引用會議論文。
      src: tf_instructions

  length:
    value: 35
    unit: pages_double_spaced
    basis: {paper: "8.5 x 11 in", font_size_pt: 12, spacing: double, lines_per_page: "26-27", margins: "at least one inch on all four edges"}
    includes: [appendixes, references, tables, figures]
    kind: guideline_average
    approx_words:
      value: 8000
      assumption: "須知頁自己給的對應：'about 8,000 words, or the equivalent of approximately 35 double-spaced pages'，不是本記錄換算"
      confidence: high
    exceptions: >-
      原文："The average JCGS paper should be about 8,000 words, or the equivalent of approximately 35 double-spaced pages
      (about 26-27 lines per page) including all appendices, references, tables, and figures. Avoid over-long papers, as they tend
      to burden our reviewers, elicit negative reviews, and discourage readership."
      這句是「平均值」與「應該約」，不是硬性上限；頁面沒有寫超過多少會被退回。與 JASA 不同：JCGS 把附錄算進篇幅，
      並要求隨稿附上審查需要的未發表論文與技術報告（Supplements for Review）。
      Short Technical Notes 的長度頁面沒有寫。
    src: tf_instructions

  abstracts:
    - id: main
      max_words: 200
      required_at: submission
      structure: unstructured
      note: >-
        須知頁只寫 "The manuscript should contain an abstract"，沒有字數；200 字來自 T&F 提供的 LaTeX 範本
        （template.tex：「The text of your abstract. 200 or fewer words.」）。範本是 T&F 的官方檔，但不是規定頁，
        所以此上限的效力低於須知頁本文。
      src: latex_template

  keywords:
    min: 3
    max: 6
    alphabetical_order: true
    must_not_appear_in_title: true
    note: >-
      須知頁 Preparation of Manuscript 寫 "from three to 6 key words or phrases in alphabetical order"（原文 "orvphrases" 有誤植），
      Checklist 寫 "Between 3 and 6 keywords"。「不得與標題重複」只見於 LaTeX 範本（"3 to 6 keywords, that do not appear in the title"）。
    src: [tf_instructions, latex_template]

  formatting:
    style_manual: {name: ASA Style Guide, url: "https://files.taylorandfrancis.com/asa-style-guide.pdf", src: tf_instructions}
    spelling: American
    quotation_marks: 雙引號；引文中的引文用單引號；長引文縮排且不加引號
    file_formats: [Word, LaTeX]
    initial_submission_format: >-
      Peer Review 段："PDF files are required for initial submission. Upon final acceptance for publication, a LaTeX or plain text file
      of the full text (without figures), along with individual files for all figures will be requested."
      Submitting Your Paper 段另寫 LaTeX 稿先轉成 PDF 上傳，並把 LaTeX 原始檔打成單一 zip 標為「LaTeX Source Files」。
    latex:
      document_class: article（避免任何特殊 macro）
      references: 鼓勵 BibTeX，並須提交 .bbl
      template:
        url: https://files.taylorandfrancis.com/ucgs-template.zip
        note: >-
          2026-10-25 下載解壓檢視 template.tex：article 12pt；\newcommand{\anon}{1} 切換具名版，改為 0 則隱藏作者與致謝、產生匿名版；
          內文 \spacingset{1.8}（註明 DON'T change，約 26 行/頁）；natbib 加 agsm.bst；含 Disclosure statement、
          Data Availability Statement、SUPPLEMENTARY MATERIAL 三個範例區塊；同時附 template.qmd（Quarto 的 jasa-pdf 格式，
          以 journal: blinded: false/true 切換匿名；其註解寫邊界約 0.75 吋，與須知頁「至少 1 吋」不一致）。
      src: [tf_instructions, latex_template]
    page: {size: "8.5 x 11 in", font_size_pt: 12, spacing: "double-spaced（約 26-27 lines/page）", margins: "至少 1 吋", numbered: true}
    element_order: [title page, abstract, keywords, main text（introduction, materials and methods, results, discussion）,
                    acknowledgments, declaration of interest statement, references, appendices, tables（各自一頁）, figures, figure captions（列表）]
    tables_figures:
      placement: >-
        須知頁 Figures and Tables 段：置於內文首次提及後盡快出現，"They should not appear in separate files or at the end after the bibliography."
        但 Formatting and Templates 段另寫 "Figures should be saved separately from the text"，Structure 段又列 tables、figures 在 appendices 之後；
        三處措辭不一致。LaTeX 範本的做法是圖表放在內文。
      figures: "1200 dpi（線稿）、600 dpi（灰階）、300 dpi（彩色），尺寸需與刊出大小相符；格式 PS、JPEG、TIFF，或在 Word 內畫的 DOC/DOCX"
      tables: 表格應呈現新資訊而非重複內文，讀者不看內文也要讀得懂；須提供可編輯檔
      equations: Word 稿的公式須可編輯
      units: SI 單位（非斜體）
      image_descriptions: 作者可選擇附 alt text；T&F 會用 AI 產生圖像描述並讓作者在校樣時檢視
    unpublished_cited_works: 審查需要的未發表論文與技術報告須隨稿附上，作為 Supplements for Review
    src: tf_instructions

  structure:
    cover_letter: {status: not_published, checked: 2026-10-25, src: tf_instructions, note: 須知頁沒有要求 cover letter；只在 Papers Published in Proceedings 段要求該類稿件在 cover letter 說明新增內容}
    supplementary_material:
      expected: true
      statement: >-
        "Authors are expected to submit code and datasets as online supplements to the manuscript. Exceptions for reasons of security or
        confidentiality may be granted by the Editor. Authors are also encouraged to submit supplemental materials that are directly
        related to their papers. The supplements are subject to editorial review and approval."
      hosting: T&F 把 supplementary material 放在 Figshare（見 tf_supplementary）；T&F 不檢查或修改這些檔案，也不提供校樣
      src: [tf_instructions, tf_supplementary]
    statements_required:
      - {id: funding, content: 列出所有經費來源；沒有經費也要聲明, src: tf_instructions}
      - {id: disclosure, content: 利益衝突聲明（"declaration of interest statement"）；無衝突也要寫 "The authors report there are no competing interests to declare.", src: tf_instructions}
      - {id: generative_ai, content: 是否與如何使用生成式 AI；未使用也要聲明, src: tf_instructions}

  review:
    type: single_anonymized
    type_note: 預設單匿名；作者可選雙匿名（見 author_option）
    statement: '"JCGS is now reviewed using a single-anonymous system, with an author option for double-anonymous review."'
    flow: 先由 editor 判斷是否適合，再送外審（"Once your paper has been assessed for suitability by the editor, it will then be single or double anonymous peer reviewed by independent, anonymous expert referees."）
    default: single_anonymous
    author_option: double_anonymous
    how_to_choose_double_anonymous: {status: not_published, checked: 2026-10-25, src: tf_instructions, note: 須知頁沒有說明如何選擇雙匿名（是否在投稿系統勾選、需交哪些檔案）；只在 Submitting Your Paper 段提到上傳檔名 "Manuscript - with author details" 與 "Manuscript - anonymous"}
    author_may_suggest_reviewers: {status: not_published, checked: 2026-10-25, src: tf_instructions}
    src: tf_instructions
    conditional:
      - id: double_anonymous_option
        optional: true
        when: 作者選擇雙匿名審查
        requirements:
          - 須知頁沒有寫匿名化的具體規則；LaTeX 範本把 \anon 設為 0 產生匿名版（隱藏作者與致謝）
          - 範本註解：匿名版不可間接識別作者，例如不要寫 "In Smith et al. (2009) we showed that ..."，改寫 "Smith et al. (2009) showed that ..."
      - id: preprint_posted
        optional: true
        when: 作者已把稿件早期版本放上 preprint server
        requirements: [須知頁提醒匿名性無法保證（"anonymity cannot be guaranteed"）]
    editorial_screening: >-
      須知頁只寫 Crossref 相似度檢查（見 submission.similarity_screening）與零容忍政策；
      退回重投稿件之類的規定頁面沒有寫。

  openness:
    code_and_data:
      expectation: >-
        "Authors are expected to submit code and datasets as online supplements to the manuscript. Exceptions for reasons of security or
        confidentiality may be granted by the Editor."
      strength: expected（"are expected to"），例外由 Editor 准許
      due_at: {status: not_published, checked: 2026-10-25, src: tf_instructions, note: 須知頁沒有寫是初投稿、修改稿還是接受後才要交。LaTeX 範本內的說明寫 "In early stages of the submission process, you may be unsure what to include as supplementary material. Don't worry---this is something that can be worked out at later stages."}
      review_of_supplements: >-
        "The supplements are subject to editorial review and approval."（tf_instructions）。是否有人實際執行程式碼，現行頁面沒有寫。
        2018 年 ASA 部落格（asa_data_policy_2018）寫 JCGS "requires authors to submit code and data (and any other relevant materials) along with their papers,
        although extensive review of those materials is not necessarily performed"，這是 2018 年的說法，現行須知頁沒有重述。
      reproducibility_editor: >-
        about-this-journal 頁的編輯名單（co-editors、editorial coordinator、journals manager、production editor、advisory editors、associate editors）
        沒有列可重現性專責編輯，也沒有像 JASA 那樣的 Reproducibility Pre-Submission Checklist 或 ACC form；這是對 2026-10-25 頁面內容的觀察，不是政策聲明。
      src: [tf_instructions, asa_data_policy_2018]
    data_availability_statement:
      status: not_published
      checked: 2026-10-25
      src: tf_instructions
      note: >-
        須知頁 Checklist 沒有列 Data Availability Statement；T&F 的 LaTeX 範本卻有一個 "Data Availability Statement" 區塊
        （"Deidentified data have been made available at the following URL: XX."），所以實務上期刊預期有，但規定頁沒有要求。
    tf_data_sharing_policy_level:
      status: not_found
      checked: 2026-10-25
      src: tf_data_sharing_policies
      note: T&F 要求看各期刊須知頁以得知適用哪一級資料政策（Basic 到 Open and FAIR）；JCGS 須知頁沒有點名任何一級。
    software_citation: {status: not_published, checked: 2026-10-25, src: tf_instructions, note: 須知頁沒有要求引用軟體}
    authorship_credit: {taxonomy: CRediT, required: false, note: 期刊 "supports" CRediT；投稿時須準備好各作者的 CRediT 角色，有提供才會刊出, src: tf_instructions}

  authorship:
    taxonomy: CRediT
    credit_required: false
    affiliation_changes_after_acceptance: forbidden
    orcid: {required: false, note: '"Where available, please also include ORCiDs and social media handles"'}
    corresponding_author: 須指定一位通訊作者；通訊作者的 email 通常顯示在 PDF 與線上文章
    src: tf_instructions

  submission:
    system: Taylor & Francis Submission Portal
    portal:
      url: https://rp.tandfonline.com/submission/create?journalCode=UCGS
      verified: false
      note: >-
        取自須知頁「Go to submission site」按鈕的 href（2026-10-25）。curl 取該網址回 404（92 KB），未實際載入確認，可能需要登入或瀏覽器環境。
        同頁「Click to Submit Online」按鈕卻指向 https://mc.manuscriptcentral.com/amstat（舊的 ScholarOne ASA 站；curl 回 403，未確認是否仍可用），
        兩個入口不一致；「To submit your manuscript please click here」與 "Submission Portal" 連結用的是小寫 journalCode=ucgs。
        以 "Go to submission site"（journalCode=UCGS）為準，另一個疑為舊連結。
    similarity_screening: Crossref（同意於審查與製作期間做原創性檢查）
    language: English only
    src: tf_instructions

  fees:
    submission: 0
    page_charges: 0
    publication_fee: 0
    statement: "There are no submission fees, publication fees or page charges for this journal."
    apc:
      applies_when: 選擇 Open Select 開放取用時
      amount: {status: not_published, checked: 2026-10-25, src: [tf_instructions, tf_about], note: 兩頁都未列金額，只指向 T&F 的 APC finder；機構或資助者若與 T&F 有 OA 協議可減免或免費}
      not_open_access: 不選 OA 則無 APC
      funding_note: 只有通訊作者可向機構申請 APC 補助，且投稿後不能為了取得資格而更換通訊作者
    color_print:
      online: 免費
      first_four_per_figure: {USD: 400, GBP: 300, AUD: 500, EUR: 350}
      fifth_onward_per_figure: {USD: 75, GBP: 50, AUD: 100, EUR: 65}
      note: 只有印刷版要彩色時才收費；依所在地可能另加稅
    src: tf_instructions

  policies:
    dual_submission: forbidden
    plagiarism: >-
      "The American Statistical Association observes a policy of zero tolerance in cases of malfeasance by authors. These acts include
      plagiarism and submitting nearly identical papers to different publications. Authors who engage in these acts will have their
      papers rejected and their institutions will be notified of the rejection and its motivation."
    preprints:
      allowed: true
      conditions:
        - 可放在非商業 preprint server；T&F 不視為重複發表，也不影響審稿
        - 投稿稿件中須引用該 preprint
        - 接受後在 preprint 上註明已被接受；刊出後加上正式版 DOI
      anonymity_caveat: 已放 preprint 時，期刊明言匿名性無法保證
      journal_specific_statement: {status: not_published, checked: 2026-10-25, src: tf_instructions, note: JCGS 須知頁除了匿名性提醒外沒有自己的 preprint 條文，以 T&F 通則為準}
      src: [tf_preprints, tf_instructions]
    generative_ai:
      disclosure_required: true
      placement: 獨立聲明（"Declaration of generative AI use"）；未使用也須聲明
      suggested_wording_if_unused: "The authors report generative AI was not used in their research or preparation of this manuscript"
      statement_contents: [作者已確認內容原創與正確, AI 工具名稱與版本, 已確認工具使用條款允許發表, 作者對全部內容（含參考文獻正確性）負全責]
      drafting_text: 不允許以生成式 AI 產出稿件或任何章節的初稿
      copyediting: 允許（拼字、文法、行文），不可用來建立或推導論證
      software_coding_assistance: 允許用生成式 AI 產生程式碼，但須經作者審查與驗證其正確性（T&F AI 政策表格；此列沒有額外聲明要求）
      reference_suggestion: 允許，但作者須自行查證
      src: [tf_instructions, tf_ai_policy]
    conflict_of_interest:
      disclosure_required: true
      placement: acknowledgments 之後、references 之前（依 Structure 段的順序：acknowledgments → declaration of interest statement → references）
      wording_if_none: "The authors report there are no competing interests to declare."
      src: tf_instructions
    copyright: 須知頁只列 "Copyright Options"，指向 T&F 出版協議頁；選 OA 則有 Creative Commons 授權選項
    third_party_material: 投稿前須取得版權人書面許可
    accepted_manuscript_online: 接受後先以未編輯的 Accepted Manuscript Online（AMO）上線，之後由 Version of Record 取代；兩者共用同一 DOI
    src: tf_instructions

  standards:
    - id: asa-style-guide
      label: ASA Style Guide
      url: https://files.taylorandfrancis.com/asa-style-guide.pdf
      required: true
      level: 須知頁寫 "Please use this ASA style guide when preparing your paper"
    - {id: credit, label: CRediT, url: "https://authorservices.taylorandfrancis.com/editorial-policies/credit-at-taylor-francis/", required: false}

