    quartiles:
      - {system: SJR, category: Discrete Mathematics and Combinatorics, subject_area: Mathematics, quartile: Q1, year: 2025, as_of: 2026-10-25, src: scimago,
         note: SCImago 列此類別 1999–2025 每年皆為 Q1；頁面不給名次}
      - {system: SJR, category: Statistics and Probability, subject_area: Mathematics, quartile: Q1, year: 2025, as_of: 2026-10-25, src: scimago,
         note: SCImago 列此類別 2025 年為 Q1（1999–2025 只有 2001 年為 Q2）；頁面不給名次}
      - {system: SJR, category: "Statistics, Probability and Uncertainty", subject_area: Decision Sciences, quartile: Q1, year: 2025, as_of: 2026-10-25, src: scimago,
