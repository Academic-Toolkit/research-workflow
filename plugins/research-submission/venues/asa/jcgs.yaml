    IMS Handbook 寫 "Co-published by the American Statistical Association (ASA), the Interface Foundation (IFNA) and the IMS.
    The ASA is designated as the managing JCGS partner, with IMS and IFNA providing input/influence regarding the journal's
    scientific content and direction."，並說明六人管理委員會（ASA、IMS、IFNA 各二）負責審議編輯政策、選任編輯、核准 Associate Editors。
    T&F 的 JCGS 頁面只寫 "Published on behalf of the American Statistical Association"，免責聲明與會員資訊提到 ASA 與 IMS，沒有 Interface Foundation。
    IMS Handbook 頁面沒有日期，Interface Foundation 目前是否仍是共同出版者，本次只找到這一個來源。
