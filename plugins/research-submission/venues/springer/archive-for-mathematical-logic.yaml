  - id: springer_policies
    role: supporting
    url: https://link.springer.com/brands/springer/journal-policies
    note: >-
      Springer 全品牌的期刊政策頁（不是本刊專屬）：preprint 分享、AI 使用、資料可用性、報告規範、知情同意與倫理核准。
      本刊自己的頁面沒有 preprint 條文，preprint 以此頁為準，兩者的關係見 requirements.integrity.preprints。
      頁面很長（約 104 KB 文字），有改版時 hash 一定變，CHANGED 時要人工找出變動的段落。
      Safari 讀取時為了避免與同時開著同一網址的其他分頁混淆，用了帶查詢字串的網址（?journal=153-aml），內容相同。
    fetch:
