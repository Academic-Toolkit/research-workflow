    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 取得完整頁面（200、約 177 KB），但 Python urllib（verify.py 的抓取器）只拿到 3,036 bytes 的 Client Challenge 頁（HTTP 200）"
