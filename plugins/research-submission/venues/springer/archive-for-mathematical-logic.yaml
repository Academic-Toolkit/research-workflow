--- # research-submission venue record
# 內容擷取自 Springer Nature Link 的 Archive for Mathematical Logic 官方頁面（期刊首頁、aims and scope、
# submission guidelines、how to publish with us、ethics & disclosures、editorial board、journal updates）、
# Springer 全品牌期刊政策頁、SCImago、Clarivate Master Journal List，2026-10-25。
# 讀取方式：Springer 的 HTML 頁用 Safari 讀（document.body.innerText），curl 另測一次可取得完整頁面（內容一致）；
# SCImago 擋 curl（403），MJL 是 JS 單頁應用，兩者只能用瀏覽器讀。
# 這本刊沒有 Instructions for Authors PDF：投稿規定全部寫在 submission-guidelines 這一個 HTML 頁。
# 收錄緣由：語料庫缺這本；補錄數理邏輯類期刊，供 choose-venue 比較用。
# 本記錄只放期刊公開規定，不含任何投稿者或稿件資訊。

schema_version: 1
id: springer/archive-for-mathematical-logic
kind: journal
family: logic-journals
status: active

sources:
  - id: submission_guidelines_page
    role: authoritative
    url: https://link.springer.com/journal/153/submission-guidelines
    note: >-
      投稿規定本體：Manuscript Submission、Title Page（摘要、關鍵字）、Classification code（MSC）、Text、References、
      Artwork、Supplementary Information、Ethical Responsibilities、Authorship、Competing Interests、After acceptance、
      Open Choice、Research Data Policy 都在這一個頁面（Safari 讀到約 52 KB 文字）。頁面沒有連到 PDF 版。
      頁尾含讀者的 IP 位址與機構授權名單，抽取文字的 hash 會隨連線改變，verify.py 回報 CHANGED 時先排除這個因素。
      Springer 對沒有 cookie 的請求，部分頁面會導向 ?error=cookies_not_supported&code=... 的網址，內容相同。
      抓取方式（適用所有 link.springer.com 的 HTML 來源）：curl 可取得完整頁面（200），但 verify.py 用的 Python urllib
      只會拿到 3,036 bytes 的 Client Challenge 頁（HTTP 200，2026-10-25 實測 journal/153、
      journal/153/submission-guidelines、brands/springer/journal-policies 三個網址皆如此），所以記為 browser／
      http_viable: false，verify.py 只會回 NEEDS_AGENT；重新驗證時用 Safari 或 curl 讀頁面，確認 must_contain 仍在。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 取得完整頁面（200、約 295 KB），但 Python urllib（verify.py 的抓取器）只拿到 3,036 bytes 的 Client Challenge 頁（HTTP 200）"
      validity:
        must_contain: "Please provide an abstract of 150 to 250 words"
        min_extracted_chars: 15000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: aims_and_scope
    role: authoritative
    url: https://link.springer.com/journal/153/aims-and-scope
    note: 只有一段文字（約 520 字元）。期刊首頁的 Overview 是它的縮寫版。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 取得完整頁面（200、約 175 KB），但 Python urllib（verify.py 的抓取器）只拿到 3,036 bytes 的 Client Challenge 頁（HTTP 200）"
      validity:
        must_contain: "as long as the methods of mathematical logic play a significant role"
        min_extracted_chars: 400
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: journal_home
    role: authoritative
    url: https://link.springer.com/journal/153
    note: >-
      期刊首頁：Overview、Journal metrics（IF、5 年 IF、首次決定中位數、下載數）、最新文章、Journal updates、
      ISSN、收錄資料庫清單。指標與最新文章每週都在變，hash 會因此變動；比對時看 must_contain 與指標那幾行即可。
      「Submit your manuscript」連到 https://submission.nature.com/new-submission/153/3（Snapp）。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 取得完整頁面（200、約 211 KB），但 Python urllib（verify.py 的抓取器）只拿到 3,036 bytes 的 Client Challenge 頁（HTTP 200）"
      validity:
        must_contain: "Submission to first decision (median)"
        min_extracted_chars: 1500
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: how_to_publish
    role: authoritative
    url: https://link.springer.com/journal/153/how-to-publish-with-us
    note: 出版模式（hybrid）、APC 金額與幣別、Creative Commons 授權。APC 以接受日期當天的價格為準。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 取得完整頁面（200、約 187 KB），但 Python urllib（verify.py 的抓取器）只拿到 3,036 bytes 的 Client Challenge 頁（HTTP 200）"
      validity:
        must_contain: "The current APC for Archive for Mathematical Logic is"
        min_extracted_chars: 2000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: ethics_disclosures
    role: authoritative
    url: https://link.springer.com/journal/153/ethics-and-disclosures
    note: 載明審稿模式（single-anonymous）、COPE 會員身分、相似度偵測軟體。
    fetch:
      method: browser
      http_viable: false
