# ─────────────────────────────────────────────────────────────
warnings:
  - 單盲審查：審稿人看得到作者；稿件與 title page 不需要匿名化。
  - 官方須知頁沒有頁數或字數上限；也沒有 MS Word 範本。摘要 150–250 字、關鍵字 4–6 個。
  - 須知頁沒有 preprint 專屬條文；preprint（含 arXiv）依 Springer 出版社政策允許，且不算 prior publication。投稿時要揭露 preprint 的 DOI 與授權。
  - 缺 "Statements and Declarations"（Funding、Competing interests、Ethics、Data availability 等）的投稿會被退回、視為不完整。
  - 原創研究必須附 Data Availability Statement；公開 repository 只是強烈建議。
  - 每次投稿與修稿都要附完整可編輯原始檔（.docx 或 LaTeX），缺者不送審；LaTeX 不可用子資料夾。
  - 延伸研討會論文可以，但須有明顯的新貢獻，並在開頭說明重疊；不得同時在另一個期刊或研討會審查中。
  - Systematic review／mapping 的門檻高，只摘要現況的稿件不太可能被接受；tertiary study 一般不收。
  - 接受後才選 open access 或訂閱；APC 以接受日價格為準（GBP 2,390／USD 3,390／EUR 2,790，另加稅）。選訂閱則不收費。
  - Open science review 是選配，且發生在 "Minor revision" 或接受之後，不影響審查結果；限制取用的資料拿不到 badge。
  - emsejournal.github.io 的 metrics 頁（2018 年止）、open_access 頁（2019 年）與 registered_reports 頁（2023 年止）都已過時，只能當線索。
  - 官方只在首頁標示 JIF 與 5-year JIF（2025），沒有分區、錄取率或投稿到接受的時間；本記錄對這些欄位標 not_published。
  - Clarivate MJL 的 Core Collection 只列 SCIE；沒有 SSCI 或 ESCI。
