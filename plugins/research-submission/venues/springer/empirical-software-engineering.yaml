# ─────────────────────────────────────────────────────────────
requirements:
  refresh: {check_every: P6M, method: extracted_hash_diff}

  scope:
    aims_quote: >-
      "Empirical Software Engineering provides a forum for applied software engineering research with a strong
      empirical component."
    aims_extra_quotes:
      - '"Empirical Software Engineering aims at promoting the publication of industry-relevant research since one of its goals is to address the significant gap between research and practice."'
      - '"Both original and replicated studies can be reported, varying from controlled experiments to field studies, from data intensive to qualitative. Preference is given to studies that can be replicated or expanded upon. Papers on the infrastructure for supporting empirical research are also of interest."'
    topics_listed: >-
      Analysis and design; Model-driven development; Requirements engineering; Verification and validation;
      Maintenance and evolution; Quality assurance; Dependability analysis; Project management;
      Organization models for software development; Predictive models for software dependability;
      Software engineering economics; Applications of artificial intelligence techniques to software engineering;
      Qualitative analysis
    out_of_scope_statement: {status: not_published, checked: 2026-11-15, src: aims_scope, note: Aims and scope 頁沒有列出不收的題材}
    scope_questions_route: >-
      須知頁："If you have questions about the scope and suitability of your article, the Editor-in-Chief will need to view
      the entire manuscript"；在 Editorial Manager 投稿時可附說明
    mentions:
      tools_and_infrastructure: "有：「Papers on the infrastructure for supporting empirical research are also of interest」；沒有獨立的 tool paper 或 technical paper 類型"
      replication: "有：「Both original and replicated studies can be reported」「Preference is given to studies that can be replicated or expanded upon」"
      mining_software_repositories: >-
        Aims and scope 頁沒有出現 mining repositories 字樣。與 MSR 研討會的合作只見於 Registered Reports 頁與特刊清單
        （MSR 2023 等），見 emse_registered_reports、emse_special_issues
      llm_and_ai: >-
        Aims and scope 頁只有「Applications of artificial intelligence techniques to software engineering」，沒有提 LLM 或 agent。
        須知頁在 Title Page 一節規定 LLM 不能列為作者、使用須在 Methods 說明。特刊清單有多個 LLM／agent 主題
        （Advancing Software Engineering with Large Language Models、Agentic Software Engineering: The Rise of AI Teammates、
        Human-Centered AI Transformation for Software Engineering 等），見 emse_special_issues
    src: [aims_scope, submission_guidelines, emse_special_issues]

  article_types:
    - id: research_article
      label: Research Articles（官方頁用語）
      note: 含原創研究與 replication study；方法從 controlled experiment 到 field study、從資料密集到質性
      src: aims_scope
    - id: replication
      label: Replicated studies
      note: 屬 Research Articles 底下；另有曾經的特刊「Replications and Negative Results (RENE)」與「Replications of software engineering experiments」（見 emse_special_issues）
      src: [aims_scope, emse_special_issues]
    - id: registered_report_stage2
      label: Registered Reports（stage 2 報告）
      note: >-
        兩階段：第一階段在研討會的 RR track 取得 in-principle acceptance，作者依 stage 1 protocol 做完研究、寫成論文，
        再投 EMSE 做 stage 2 審查。官方頁列的研討會停在 2023 年，目前有哪些 RR track 本次沒有查到
      src: emse_registered_reports
    - id: secondary_study
      label: Secondary studies（SLR、systematic mapping）
      note: >-
        FAQ："EMSE occasionally publishes secondary studies, but the expectations are high. A review that merely summarizes the
        current state of the field or outlines trends is unlikely to be accepted."；若已有類似的 SLR，須強力說明為何再做一次
      src: emse_faq
    - id: tertiary_study
      label: Tertiary studies（SLR of SLRs）
      note: 'FAQ："EMSE generally does not consider tertiary studies, such as a SLR of SLRs, as relevant."'
      src: emse_faq
    - id: journals_first
      label: Journals-First 軟體工程研討會 track
      note: >-
        官方：EMSE 稿件可投 Journals-First 才能參加多個 SE 研討會的 Journals-First track；細節與截稿日看各研討會網站。
        「If published, Journals-First authors agree that their email addresses, as disclosed in the published article,
        can be shared with conference organizers.」
      src: journals_first_update
    - id: tool_or_technical_paper
      status: not_published
      checked: 2026-11-15
      note: 須知頁與 Aims and scope 都沒有 tool paper、technical paper、short paper、industrial experience 等類型的定義；首頁簡介提到 industrial experience reports
      src: [submission_guidelines, aims_scope, journal_home]
    - id: special_issue_and_collection
      label: 特刊／徵稿 collection（含 by-invitation 的研討會延伸特刊）
      src: [journal_home, emse_special_issues]

  length_limit:
    status: not_published
    checked: 2026-11-15
    src: submission_guidelines
    note: >-
      Instruction for Authors 全文沒有頁數或字數上限（掃過 pages／words／length 等字樣，只有摘要 150–250 字與關鍵字 4–6 個）。
      也沒有指明什麼算入篇幅。須知頁寫明：期刊不提供 MS Word 範本，接受後由出版社排版。

  abstracts:
    - id: main
      min_words: 150
      max_words: 250
      required_at: submission
      constraints: 不得含未定義的縮寫或未指明的引用
      structured: >-
        "Structured abstracts are permitted, but not required, in Empirical Software Engineering."
        若採結構式摘要，分為 Context、Objective、Method、Results、Conclusions
      src: submission_guidelines
  keywords: {min: 4, max: 6, purpose: indexing, src: submission_guidelines}

  structure:
    title_page:
      contents:
        - 標題（concise and informative）
        - 作者姓名、機構（institution, (department), city, (state), country）
        - 通訊作者標示與有效 email
        - ORCID（"If available"）
        - Acknowledgments（放在 title page 的獨立區段）
        - '"Statements and Declarations"：Funding、Competing interests、Ethics approval、Consent、Data／Materials／Code availability、Authors'' contribution'
      note: 缺相關聲明的投稿 "will be returned as incomplete"；接受後出版社才把聲明放進正文的獨立區段
      src: submission_guidelines
    headings: 十進位編號，至多三層
    footnotes: 一律用 footnotes，不用 endnotes
    llm_disclosure_placement: Methods 章節；沒有 Methods 時放在稿件內其他適當位置
    src: submission_guidelines

  formatting:
    file_formats:
      stated: >-
        頁面說法並存：Source Files 段寫 ".docx or LaTeX"；Text 段寫 "Manuscripts should be submitted in Word"
        並說明 "Manuscripts with mathematical content can also be submitted in LaTeX"
      latex: >-
        建議用 Springer Nature LaTeX 範本；上傳的原始檔會自動編譯成單一 PDF 供作者核准；
        LaTeX 投稿 "Please do not use subfolders"（圖、bib 檔都不可放子資料夾）
      editable_source_required: 每次投稿與修稿都要附完整可編輯原始檔，缺者 "will result in your article not being considered for review"
      word_template: 期刊不提供 MS Word 範本
      src: submission_guidelines
    font_and_page: "Text 段寫 'Use a normal, plain font (e.g., 10-point Times Roman)'；使用自動頁碼；沒有行距或頁邊距規定"
    line_numbers: {status: not_published, checked: 2026-11-15, src: submission_guidelines}
    citation_style:
      in_text: author–year in parentheses，例 "(Thompson 1990)"、"(Abbott 1991; Barakat et al. 1995a, b)"
      reference_list: 依第一作者姓氏字母序；有 DOI 一律附 https://doi.org/ 完整連結；期刊名用 ISSN LTWA 縮寫（不確定就用全名）；可用 "et al" 縮短長作者列
      src: submission_guidelines
    figures: {src: submission_guidelines, note: 標準 Springer 圖檔規定（向量用 EPS、半色調用 TIFF；線稿 1200 dpi、半色調 300 dpi、組合 600 dpi）；圖說放在正文檔}
    supplementary: 以 "Online Resource N" 引用，檔名 ESM_N.ext；補充資料照原檔刊出，不轉換、不編修

  review:
    type: single_blind
    quote: '"This journal follows a single-blind reviewing procedure."'
    peer_review_policy: 遵循 Springer 的標準 Peer Review Policy；審稿報告隨決定一起寄給作者
    editorial_screening: 先做完整性檢查，再由編輯決定是否送審；"A concern raised by a single peer reviewer or the Editor themselves may result in the manuscript being rejected."
    author_may_suggest_or_exclude_reviewers: true
    reviewer_suggestion_conditions: 建議的審稿人要完全獨立；通訊作者須提供每位建議審稿人的機構 email，或其他可驗證身分的方式
    editors_as_authors: 編輯是作者時改由另一位編輯委員督導，與其他稿件同一套審查流程
    src: [submission_guidelines, ethics_disclosures]

  openness:
    data_availability_statement:
      required: true
      applies_to: original research
      quote: '"All original research must include a data availability statement."'
      non_public_data: 無法公開時（例如個資疑慮），聲明須說明如何取得資料與再利用條件
      src: submission_guidelines
    data_sharing_policy: 依 Springer Nature research data policy；公開 repository 是 "strongly encouraged"，不是強制
    repository_licence: 鼓勵開放授權，但期刊不強制特定授權
    data_citation: 建議引用公開資料並附 persistent identifier（DOI）
    code_and_materials: >-
      須知頁只在 Authorship principles 的 Data transparency 要求 "all data and materials as well as software application or
      custom code support their published claims and comply with field standards"；沒有獨立的程式碼必交規定
    open_science_initiative:
      status: optional_after_acceptance
      process: >-
        論文拿到 "Minor revision" 或 "Acceptance" 時，決定信會邀請作者提交 replication package，由 open science board 的一位成員另外審；
        作者在最終接受後有 2 週交 package；審稿人有 2 週；需修改時作者再有 2 週。審查為 single-blind。
        品質達 good 或 excellent 者，論文可標註 "Open Science Replication Package validated by the Open Science Board" 並取得 open science badge
      does_not_affect_review: '"All submissions to EMSE will undergo the same known review process regardless of whether authors decide to disclose their data or not."'
      recommended_repositories: [zenodo.org, figshare.com]
      not_recommended: 個人或機構網站、Dropbox、SVN／Git、Academia.edu、ResearchGate
      restricted_access: 限制取用的資料不能拿 open science badge；無法公開的資料（如受 NDA 約束的產業資料）須在稿件中簡短說明
      non_code_artifacts: 模型、圖、需求文件等非執行檔也是合格的 artifact；偏好機器可讀的開放格式（JSON、XMI）
      src: [openscience_update, openscience_github]
    preregistration: {status: not_published, checked: 2026-11-15, src: submission_guidelines, note: 須知頁沒有預先註冊的規定；registered reports 見 article_types}
    top_guidelines: {status: not_found, checked: 2026-11-15, note: Springer 出版社政策頁的 data availability 段落有連結到 ToP 準則，本次沒有讀該段全文，不寫等級}

  journal_first_presentation:
    available: true
    note: 見 article_types.journals_first；EMSE 稿件可參加多個 SE 研討會的 Journals-First track，是否收、截稿日由各研討會決定
    src: journals_first_update

  authorship:
    llm_authorship: 'LLM 不符合作者資格："an attribution of authorship carries with it accountability for the work, which cannot be effectively applied to LLMs"'
    contribution_statement: 建議（"recommends"）列出各作者貢獻，可用自由文字或 CRediT；放 title page
    changes_after_acceptance: 不接受新增、刪除作者或改變順序；修稿階段 "generally not permitted"，須說明理由、由 Editor-in-Chief 裁量
    orcid: {required: false, note: 'title page "If available"；Authorship principles 段 "recommended"', src: submission_guidelines}
    src: submission_guidelines

  submission:
    system: Editorial Manager
    portal:
      url: https://www.editorialmanager.com/emse
      verified: true
      note: 2026-11-15 以 curl 確認轉址到 https://www.editorialmanager.com/emse/default.aspx（HTTP 200、頁面含 Empirical Software Engineering）；網址取自 Springer 首頁「Submit your manuscript」按鈕
    cover_letter:
      required: {status: not_published, checked: 2026-11-15, src: submission_guidelines}
      content_when_applicable: 通訊作者須在 cover letter 說明重複使用的材料，並提及稿中的未出版材料（如 in press）
    funding_in_system: 經費資訊除了 title page，還要在投稿系統內填寫（會進 CrossMark 記錄，不加進稿件本身）
    src: submission_guidelines

  fees:
    submission_fee: {value: 0, quote: '"The journal does not charge a submission fee or publication fee."', src: submission_guidelines}
    model: hybrid（接受後才選訂閱或 open access）
    no_fee_route: 選訂閱模式則不收任何費用（"no APC charges apply"）
    apc:
      applies_when: 作者於接受後選擇 open access
      currency_rates:
        - {currency: GBP, value: 2390}
        - {currency: USD, value: 3390}
        - {currency: EUR, value: 2790}
      price_basis: APC 價格以接受日當天為準
      taxes: 視地區另加 VAT 或當地稅
      src: how_to_publish
    licences: [CC BY, CC BY-NC-ND]
    institutional_agreements: >-
      Springer Nature 與多所機構有 OA 協議，可減免 APC；是否適用取決於通訊作者的機構，頁面依讀者 IP 顯示，
      本記錄不判定任何機構的資格。emsejournal.github.io/open_access 的國家清單是 2019 年的，不採用
    color: 線上彩圖免費；印刷版彩色需作者分攤
    src: [how_to_publish, submission_guidelines]

  policies:
    dual_submission: forbidden
    prior_publication: >-
      "no submission, or substantially overlapping submission, be published or be under review at another journal or conference
      at any time during the review process"
    extended_conference_papers: >-
      "Papers extending previously published conference papers are acceptable, as long as the journal submission provides a
      significant contribution beyond the conference paper, and the overlap is described clearly at the beginning of the journal submission."
    preprints:
      allowed: true
      scope_note: >-
        出版社層級政策（springer_journal_policies），EMSE 自己的須知頁與 Aims 頁沒有 preprint 專屬條文
        （須知頁全文搜尋 preprint、arxiv 皆無命中）
      quotes:
        - '"Springer Nature journals encourage posting of preprints of primary research manuscripts on preprint servers of the authors'' choice, authors'' or institutional websites, and open communications between researchers whether on community preprint servers or preprint commenting platforms."'
        - '"Posting of preprints is not considered prior publication and will not jeopardize consideration at Springer Nature journals."'
        - '"preprints may be posted at any time during the peer review process."'
      disclosure: '"Authors should disclose details of preprint posting, including DOI and licensing terms, upon submission of the manuscript or at any other point during consideration at a Springer Nature journal."'
      after_publication: 作者須在 preprint 紀錄補上正式版的 DOI 與期刊網址
      licence: 作者可自選 preprint 授權（含 Creative Commons）
      citation_form: "Preprint at http://arxiv.org/abs/... (年份)"
      arxiv_named: 政策只泛稱 "preprint servers"，範例引用格式用 arXiv，沒有逐一列出 arXiv
      src: springer_journal_policies
    similarity_screening: 可能使用軟體檢查抄襲；遵循 COPE 指引
    generative_ai:
      authorship: 不得列為作者
      disclosure_required: >-
        LLM 的使用須在 Methods（或其他適當位置）說明；"AI assisted copy editing"（對人寫的文字做可讀性、文法、拼字、標點、語氣的改進，
        不含生成性編輯與自主產生內容）不必聲明
      accountability: 最終文字必須有人負責，且作者同意修改反映其原創工作
      images: 須遵守 Springer 的生成式 AI 圖像政策
      src: submission_guidelines
    competing_interests:
      disclosure_required: true
      scope: 研究開始前 3 年內的利益；3 年外若可能被視為影響稿件也要揭露
      placement: title page 的 Declarations
      src: submission_guidelines
    salami_slicing: 一個研究不得拆成多篇投到多本期刊或同一本期刊
    text_recycling: 擴充舊作須說明重複使用的部分
    ethics_human_participants: 涉及人類參與者的研究須有倫理核准與 informed consent 聲明
    cope_member: true
    src: [submission_guidelines, ethics_disclosures]

  standards: []

