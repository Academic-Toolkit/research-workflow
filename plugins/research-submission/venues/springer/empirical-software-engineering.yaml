# research-submission venue record
# 內容擷取自 Springer Nature Link 的 EMSE 官方頁面、期刊自己的網站 emsejournal.github.io 與 Open Science Initiative 的 GitHub 說明，2026-11-15。
#
# sources 排序是刻意的：http 來源全部排在前面、browser 來源排在最後。
# verify.py --write 以「替換第一個 extracted_sha256: null」寫回 hash，若 browser 來源排在前面，
# http 來源的 hash 會被寫進 browser 來源的欄位。

schema_version: 1
id: springer/empirical-software-engineering
kind: journal
family: software-engineering-journals
status: active

# ─────────────────────────────────────────────────────────────
sources:
  - id: emse_faq
    role: supporting
    url: https://emsejournal.github.io/faq
    note: >-
      期刊編輯群自己維護的網站（emsejournal.github.io，由網站首頁導覽列的「FAQ」進入）。目前只有三則 Q&A，
      其中一則明確規定 systematic review／mapping／tertiary study 的收稿標準。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Does EMSE accept submissions and, potentially, publish secondary studies"
        min_extracted_chars: 1500
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: emse_registered_reports
    role: supporting
    url: https://emsejournal.github.io/registered_reports
    note: >-
      Registered Reports 兩階段流程的說明頁。頁面最新列出的研討會是 2023 年（ICSME／ESEM／MSR 2023），
      內容明顯沒有更新，只能當作流程描述，不能當作目前有哪些 RR track 的清單。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "worked with conferences to provide registered reports"
        min_extracted_chars: 500
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: emse_special_issues
    role: supporting
    url: https://emsejournal.github.io/special_issues
    note: >-
      特刊與徵稿清單。「Open calls」區段混有已過期的項目（例如標 September 28, 2026 與 February 28, 2026 者），
      本頁內部沒有標示哪些已關閉，所以日期只能當線索，以 Springer 的 collections 頁為準。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Open calls for papers"
        min_extracted_chars: 2500
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: openscience_github
    role: authoritative
    url: https://github.com/emsejournal/openscience/
    note: >-
      EMSE Open Science Initiative 的完整流程與 FAQ（replication package 何時交、誰審、badge 條件）。
      Springer 的 Journal updates 頁只有摘要並連到這裡。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "The authors are given 2 weeks to submit their replication package after the final acceptance"
        min_extracted_chars: 8000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: submission_guidelines
    role: authoritative
    url: https://link.springer.com/journal/10664/submission-guidelines
    note: >-
      規定本體（Instruction for Authors）。期刊首頁的「Submission guidelines」連結指向此頁。
      頁面約 59,000 字元；safari-browser 的 get text 在約 54,000 字元處截斷（只少了頁尾），
      以 js 讀 document.body.innerText 可得完整文字。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        Springer Nature Link 的「Client Challenge」頁：curl 回 HTTP 200、3,038 bytes；
        journal home、aims-and-scope、submission-guidelines、how-to-publish-with-us 四個不同 URL 的 body md5 完全相同
        （ef34477109bd5fe7e7bed6cd8efe5ade）。safari-browser（真實 Safari）可正常讀取。
      validity:
        must_contain: "This journal follows a single-blind reviewing procedure"
        min_extracted_chars: 20000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: aims_scope
    role: authoritative
    url: https://link.springer.com/journal/10664/aims-and-scope
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 submission_guidelines（3,038 bytes 的 Client Challenge 空殼）。
      validity:
        must_contain: "provides a forum for applied software engineering research with a strong empirical component"
        min_extracted_chars: 1500
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: journal_home
    role: supporting
    url: https://link.springer.com/journal/10664
    note: >-
      Metrics、主編、開放中的徵稿都在這頁。首頁的 Latest articles 與徵稿清單常變，hash 會頻繁變動，
      CHANGED 時只需核對 metrics 與 calls 兩區。頁面會依讀者的 IP 顯示機構的 open access 資助訊息，因人而異。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 submission_guidelines（3,038 bytes 的 Client Challenge 空殼）。
      validity:
        must_contain: "Submission to first decision (median)"
        min_extracted_chars: 2500
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: how_to_publish
    role: authoritative
    url: https://link.springer.com/journal/10664/how-to-publish-with-us
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 submission_guidelines（3,038 bytes 的 Client Challenge 空殼）。
      validity:
        must_contain: "The current APC for Empirical Software Engineering is"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: ethics_disclosures
    role: supporting
    url: https://link.springer.com/journal/10664/ethics-and-disclosures
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 submission_guidelines（3,038 bytes 的 Client Challenge 空殼）。
      validity:
        must_contain: "member of the Committee on Publication Ethics"
        min_extracted_chars: 1000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: openscience_update
    role: supporting
    url: https://link.springer.com/journal/10664/updates/17253958
    note: Springer 上的 Open Science Initiative 摘要；完整流程在 openscience_github。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 submission_guidelines（3,038 bytes 的 Client Challenge 空殼）。
      validity:
        must_contain: "The EMSE Open Science Initiative will be implemented in a minimally intrusive manner"
        min_extracted_chars: 1500
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: journals_first_update
    role: supporting
    url: https://link.springer.com/journal/10664/updates/17308930
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 submission_guidelines（3,038 bytes 的 Client Challenge 空殼）。
      validity:
        must_contain: "can be submitted as Journals-First papers"
        min_extracted_chars: 800
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: springer_journal_policies
    role: supporting
    url: https://link.springer.com/brands/springer/journal-policies
    note: >-
      Springer 出版社層級的政策頁（preprint、authorship、AI 等）。EMSE 自己的須知頁沒有 preprint 規定，
      只在 Editorial procedure 說明「adheres to the standard Peer Review Policy ... as outlined by Springer
      under Editorial Policies」；preprint 政策出自本頁，是出版社層級，不是 EMSE 專屬條文。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 submission_guidelines（3,038 bytes 的 Client Challenge 空殼）。
      validity:
        must_contain: "Springer Nature journals encourage posting of preprints of primary research manuscripts"
        min_extracted_chars: 20000
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

  - id: clarivate_mjl
    role: external_standard
    url: https://mjl.clarivate.com/search-results
    note: >-
      Web of Science Master Journal List。URL 帶 ?issn= 參數時結果頁不會套用查詢（篩選條件全空），
      要先到 https://mjl.clarivate.com/home，在 #search-box 輸入 1382-3256 再按 #search-button，
      才出現「Exact Match Found」。此頁是 JS 應用程式，verify.py 無法重現這個互動，只能由人或 agent 重查。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        curl 回 HTTP 200、約 11 KB 的 Angular 空殼（沒有任何期刊資料）；結果只在輸入查詢後由 JS 繪出。
      validity:
        must_contain: "Web of Science Core Collection"
        min_extracted_chars: 1500
    snapshot:
      fetched_at: 2026-11-15
      last_verified_at: 2026-11-15
      extracted_sha256: null

