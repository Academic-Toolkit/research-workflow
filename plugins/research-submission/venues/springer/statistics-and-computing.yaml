--- # research-submission venue record
# 內容擷取自 Springer Nature Link 的 Statistics and Computing 官方頁面（期刊首頁、aims and scope、
# submission guidelines、how to publish with us、ethics & disclosures、editorial board、journal updates 兩則公告）、
# Springer 全品牌期刊政策頁、SCImago、Clarivate Master Journal List，2026-10-25。
# 讀取方式：Springer 的 HTML 頁用 Safari 讀（document.body.innerText），curl 另測一次可取得完整頁面（200）；
# SCImago 與 MJL 用 Safari 讀（MJL 是 JS 單頁應用，只能在頁內查詢）。
# 這本刊沒有 Instructions for Authors PDF：投稿規定全部寫在 submission-guidelines 這一個 HTML 頁。
# 這本刊正處於出版模式轉換期：首頁與 FAQ 寫 2026-07-01 起只收 OA 投稿、2027-01-01 起全面開放取用，
# 但 submission-guidelines 與 how-to-publish 兩頁仍保留舊的 hybrid 文字；兩種說法並存，見 warnings。
# 收錄緣由：語料庫缺這本；補錄統計計算類期刊（與 JASA、Annals of Statistics 等同屬 statistics-journals），供 choose-venue 比較用。
# 本記錄只放期刊公開規定，不含任何投稿者或稿件資訊。

schema_version: 1
id: springer/statistics-and-computing
kind: journal
family: statistics-journals
status: active

sources:
  - id: submission_guidelines_page
    role: authoritative
    url: https://link.springer.com/journal/11222/submission-guidelines
    note: >-
      投稿規定本體：Editorial Procedure（首次決定與出版時程）、Manuscript Submission、Title Page（摘要、關鍵字）、Text、
      References、Tables、Artwork、Supplementary Information、Ethical Responsibilities、Authorship、Competing Interests、
      Research Data Policy、After acceptance、Open Choice 都在這一個頁面（Safari 讀到約 55 KB 文字）。頁面沒有連到 PDF 版。
      頁面仍寫 "Editorial Manager" 與「期刊不收投稿費或出版費」，這兩處與首頁的 OA 轉換公告不一致，見 warnings。
      頁尾含讀者的 IP 位址與機構授權名單，抽取文字的 hash 會隨連線改變，verify.py 回報 CHANGED 時先排除這個因素。
      Springer 對沒有 cookie 的請求，部分頁面會導向 ?error=cookies_not_supported&code=... 的網址，內容相同。
      抓取方式（適用所有 link.springer.com 的 HTML 來源）：curl 可取得完整頁面（200），但 verify.py 用的 Python urllib
      只會拿到約 3 KB 的 Client Challenge 頁（HTTP 200，2026-10-25 實測本刊 8 個網址與 brands/springer/journal-policies
      皆如此），所以記為 browser／http_viable: false，verify.py 只會回 NEEDS_AGENT；重新驗證時用 Safari 或 curl 讀頁面，
      確認 must_contain 仍在。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 取得完整頁面（200、約 294 KB），但 Python urllib（verify.py 的抓取器）只拿到約 3 KB 的 Client Challenge 頁（HTTP 200）"
      validity:
        must_contain: "Please provide an abstract of 150 to 250 words"
        min_extracted_chars: 15000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

