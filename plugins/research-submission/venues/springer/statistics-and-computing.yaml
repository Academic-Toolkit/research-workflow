requirements:
  refresh: {check_every: P6M, method: manual}

  scope:
    src: [aims_and_scope, journal_home, scimago]
    aims_and_scope_verbatim:
      - >-
        Statistics and Computing is a bi-monthly refereed journal which publishes papers covering the range of the
        interface between the statistical and computing sciences.
      - >-
        In particular, it addresses the use of statistical concepts in computing science, for example in machine learning,
        computer vision and data analytics, as well as the use of computers in data modelling, prediction and analysis.
        Specific topics which are covered include: techniques for evaluating analytically intractable problems such as
        bootstrap resampling, Markov chain Monte Carlo, sequential Monte Carlo, approximate Bayesian computation, search
        and optimization methods, stochastic simulation and Monte Carlo, graphics, computer environments, statistical
        approaches to software errors, information retrieval, machine learning, statistics of databases and database
        technology, huge data sets and big data analytics, computer algebra, graphical models, image processing,
        tomography, inverse problems and uncertainty quantification.
      - >-
        In addition, the journal contains original research reports, authoritative review papers, discussed papers, and
        occasional special issues on particular topics or carrying proceedings of relevant conferences. Statistics and
        Computing also publishes book review and software review sections.
    overview_verbatim:
      - "Statistics and Computing is a bi-monthly refereed journal publishing papers at the intersection of statistical and computing sciences."
      - "Addresses the use of statistical concepts in computing science and the use of computers in data modelling, prediction and analysis."
      - "Includes techniques for evaluating analytically intractable problems and big data analytics."
      - "Publishes original research reports, authoritative review papers, and discussion papers."
      - "Features special issues dedicated to emerging topics or proceedings of relevant conferences."
    # 官方沒有用 "not" 或 "do not" 排除任何主題；以下是對稿件有界定作用的句子，逐字列出。
    limiting_statements_verbatim:
      - text: "Statistics and Computing is a bi-monthly refereed journal which publishes papers covering the range of the interface between the statistical and computing sciences."
        effect: >-
          收稿範圍是統計與計算科學的交界（"interface"）。官方沒有進一步定義什麼算交界，也沒有說只談統計理論、
          或只談計算實作的稿件是否收。這是界定範圍的句子，不是排除句。
        src: aims_and_scope
      - text: "Scope: If you have questions about the scope and suitability of your article, the Editor-in-Chief will need to view the entire manuscript to make this determination."
        effect: >-
          scope 疑問的處理方式：主編要看整份稿件才判斷，沒有只看摘要的預審詢問管道（原文接著說可在投稿系統填寫對稿件的
          comments/questions）。出自 submission guidelines 的 Editorial Procedure 段。
        src: submission_guidelines_page
    explicit_topic_exclusions: {status: not_published, checked: 2026-10-25, src: [aims_and_scope, journal_home, submission_guidelines_page, scimago],
                                note: 四處文字都沒有列出排除的主題，也沒有 "do not" 或 "not accepted" 之類的句子}
    theory_vs_computation: >-
      scope 文字（aims-and-scope、首頁 Overview）沒有出現 "theory"、"theoretical" 或 "methodology" 這些字，
      沒有說純理論稿件收或不收，也沒有說稿件必須附實作或數值實驗。官方只用 "interface" 界定，並列出具體主題
      （見 aims_and_scope_verbatim）。2026-10-25 在 aims-and-scope、首頁、submission guidelines 與 SCImago scope 全文搜尋：
      "theor" 只在 submission guidelines 的抄襲條文命中 "theories by others"，"methodolog" 只命中 CRediT 範例的
      "Methodology"，兩者都與收稿範圍無關。
    software_statements: >-
      scope 提到兩處：稿件主題 "statistical approaches to software errors"，與期刊另有 "book review and software review
      sections"（軟體評論欄）。scope 沒有說明作者自己的軟體或套件是否屬於收稿範圍，也沒有列軟體論文為一種稿件類型。
      submission guidelines 的 Data transparency 段對作者軟體的要求見 data_sharing。
    symbolic_or_automatic_differentiation: >-
      官方頁面沒有出現 "automatic differentiation"、"algorithmic differentiation"、"symbolic" 或 "differentiation" 等字
      （2026-10-25 在 aims-and-scope、首頁、submission guidelines、SCImago scope 全文搜尋；"differenti" 只命中
      參考文獻格式範例裡的 "partial differential equations"）。最接近的已列主題是
      "computer algebra"（電腦代數）、"search and optimization methods"、"techniques for evaluating analytically
      intractable problems"、"inverse problems and uncertainty quantification"。這些只是 scope 上最接近的字眼，
      不是官方對自動微分或符號微分稿件的表態。
    subfields_listed:
      value: >-
        bootstrap resampling, Markov chain Monte Carlo, sequential Monte Carlo, approximate Bayesian computation,
        search and optimization methods, stochastic simulation and Monte Carlo, graphics, computer environments,
        statistical approaches to software errors, information retrieval, machine learning, statistics of databases and
        database technology, huge data sets and big data analytics, computer algebra, graphical models, image
        processing, tomography, inverse problems, uncertainty quantification
      note: 這是 "Specific topics which are covered include" 後的清單；官方沒有說這份清單是否窮盡。
      src: aims_and_scope
    audience: {status: not_published, checked: 2026-10-25, src: [aims_and_scope, journal_home],
               note: scope 沒有列出目標讀者}
    scimago_subject_areas: [Computer Science / Computational Theory and Mathematics, Decision Sciences / Statistics, Probability and Uncertainty, Mathematics / Statistics and Probability, Mathematics / Theoretical Computer Science]
    scimago_subject_areas_src: scimago

  article_types:
    status: not_published
    checked: 2026-10-25
    src: [submission_guidelines_page, aims_and_scope, journal_home]
    note: >-
      submission guidelines 沒有列出文章類型清單，也沒有各類型的稿件規格。scope 與首頁只用描述句提到類型：
      "original research reports, authoritative review papers, discussed papers, and occasional special issues"，
      以及 "book review and software review sections"（見 scope）。投稿系統是否另有類型選單，本記錄無法得知（需登入）。
  article_type_labels_observed:
    labels: [Original Paper]
    src: journal_home
    as_of: 2026-10-25
    note: >-
      這是已刊出文章在 Springer 列表上的標籤（/articles 頁最新 50 筆全是 "Original Paper"），不是投稿規定，
      也不代表沒有其他類型。

  # submission guidelines 對所有稿件只給摘要字數與關鍵字數；正文字數、頁數、表圖數、文獻數都沒有寫。
  general_limits:
    abstract_words: {min: 150, max: 250}
    keywords: {min: 4, max: 6}
    src: submission_guidelines_page
  length_note:
    status: not_published
    checked: 2026-10-25
    src: submission_guidelines_page
    note: >-
      submission guidelines 全頁沒有正文字數或頁數上限，也沒有表圖數或參考文獻數的上限（以 "length"、"word"、"page"
      搜過全頁文字，與篇幅有關的只有摘要 150–250 字，以及 Editorial Procedure 的 "the length of your article" 一句；
      後者說稿件長度會影響首次決定的時間，不是上限）。投稿系統是否另設硬性上限，本記錄無法得知（需登入，或問編輯部）。
  main_text_words: {status: not_published, checked: 2026-10-25, src: submission_guidelines_page}
  page_limit: {status: not_published, checked: 2026-10-25, src: submission_guidelines_page}
  tables_figures_max: {status: not_published, checked: 2026-10-25, src: submission_guidelines_page}
  references_max: {status: not_published, checked: 2026-10-25, src: submission_guidelines_page}

  abstracts:
    - id: single
      applies_to: all_manuscripts
      min_words: 150
      max_words: 250
      note: >-
        原文："Please provide an abstract of 150 to 250 words. The abstract should not contain any undefined abbreviations
        or unspecified references."（不是結構化摘要；沒有要求分段）
      src: submission_guidelines_page

  keywords: {min: 4, max: 6, purpose: indexing, src: submission_guidelines_page}

  title_page:
    required_fields:
      - 標題（"concise and informative"）
      - 作者姓名
      - 作者單位（機構、（系所）、城市、（州）、國家）
      - 通訊作者的明確標示與可用的 email
      - 有的話，作者的 16 位數 ORCID
    note: >-
      感謝（Acknowledgments，含補助與經費）放在標題頁的獨立一節，經費機構名稱要寫全名。
      暫時沒有單位的作者，Springer 只記錄居住城市與國家，不記 email（除非特別要求）。
      與 Archive for Mathematical Logic 不同，這份須知沒有要求 MSC 分類碼。
    src: submission_guidelines_page

  formatting:
    file_formats: [LaTeX（建議）, Word（.docx）]
    text: >-
      原文："Manuscripts should be submitted in LaTeX. We recommend using Springer Nature's LaTeX template and choosing
      the formatting option "[iicol]". The submission should include the original source (including all style files and
      figures) and a PDF version of the compiled output. Word files are also accepted."
    ms_word_template: >-
      原文："The journal does not provide MsWord templates for your manuscript. ... If accepted, your article will be
      formatted by our production team."
    source_files: >-
      原文："Please ensure you provide all relevant editable source files at every submission and revision. Failing to
      submit a complete set of editable source files will result in your article not being considered for review."
    headings: 十進位標題編號，最多三層（"decimal system of headings with no more than three levels"）
    footnotes: 用腳註不用尾註；腳註不能只放一筆引用，也不能放完整書目資料，不放圖表
    abbreviations: 首次出現時定義，之後一致使用
    tables: 阿拉伯數字連續編號並依序在正文引用；每表要有標題；引用已發表資料要在標題後附來源文獻；表註用上標小寫字母
    figures:
      vector: EPS（建議）；字型要嵌入
      halftone: TIFF；MSOffice 檔也接受
      resolution_dpi: {line_art: 1200, halftone: 300, combination: 600}
      color: 線上版免費；紙本彩色由作者分擔費用（金額未列）
      captions: 放在正文檔，不放圖檔；以粗體 "Fig." 加編號開頭
      size_mm: {large_journal_double_column: 84, large_journal_single_column: 174, small_journal: 119, note: 該刊屬哪一型未標}
      naming: 檔名用 Fig 加編號，例 Fig1.eps
    supplementary_information: >-
      可附影音與其他補充檔；稱為 "Online Resource" 並在正文引用；補充檔不經轉換或編輯，照原樣刊出。
      影音最大 2 GB；文字與簡報用 PDF；試算表用 .csv 或 .xlsx；特殊格式可附 ".nb (Mathematica notebook), and .tex"；
      多檔可打包成 .zip 或 .gz。
    src: submission_guidelines_page

  references:
    style: 作者年份式（正文括號內放作者姓與年份，清單依第一作者姓氏字母排序；清單項目作者姓在前、名縮寫，年份在最後的括號）
    rules:
      - 正文引用範例 "(Thompson 1990)"、"Becker and Seligman (1996)"、"(Abbott 1991; Barakat et al. 1995; Kelso and Smith 1998)"
      - 清單只列已發表或已被接受的文獻；私人通訊與未發表作品只在正文提及
      - 有 DOI 的要附完整 DOI 連結
      - 期刊名用 ISSN LTWA 的標準縮寫；不確定時用全名
      - 範例 "Hamburger, C.: Quasimonotonicity, regularity and duality for nonlinear systems of partial differential equations. Ann. Mat. Pura Appl. 169, 321–354 (1995)"
    src: submission_guidelines_page

  statements_and_declarations:
    required: >-
      原文："The following statements should be included under the heading "Statements and Declarations" for inclusion in
      the published paper. Please note that submissions that do not include relevant declarations will be returned as
      incomplete."
    competing_interests: 要揭露與投稿工作直接或間接相關的財務與非財務利益；開始工作前 3 年內的都要報；原創研究與綜述都要有聲明
    funding: 經費資訊要在投稿系統填，也要在正文 Declarations 段寫
    at_submission_interface: >-
      原文："Author Contribution information and Competing Interest information must be provided at submission via the
      submission interface. Only the information submitted via the interface will be used in the final published version."
    author_contributions: 建議（"recommends"）附貢獻聲明，可用自由文字或 CRediT；放在標題頁
    other_declarations_named: [Funding, Competing interests, Ethics approval, Consent, "Data, Material and/or Code availability", Authors' contribution]
    src: submission_guidelines_page

  data_sharing:
    statement_required: >-
      原文："Sharing of all relevant research data is strongly encouraged and authors must add a Data Availability
      Statement to original research articles."
    policy: 遵循 Springer Nature research data policy；公開存放資料 "strongly encouraged"，不是強制；不能公開時，聲明要說明取得方式與使用條件
    on_request: >-
      原文："Upon request authors should be prepared to send relevant documentation or data in order to verify the
      validity of the results presented."（機密或專有資料除外）
    software_and_code_text: >-
      Authorship principles 的 Data transparency 段原文："All authors are requested to make sure that all data and
      materials as well as software application or custom code support their published claims and comply with field
      standards."（"requested"，不是強制；沒有要求公開程式碼）
    code:
      status: not_published
      checked: 2026-10-25
      src: submission_guidelines_page
      note: >-
        研究資料政策段沒有單獨規定程式碼，也沒有要求提交或公開程式碼；只有上方 Data transparency 段與
        Declarations 清單的 "Data, Material and/or Code availability" 提到 code。補充檔格式清單接受 .tex、
        .nb 等，但那是檔案格式說明，不是要求。
    reproducibility_policy: {status: not_published, checked: 2026-10-25,
                             src: [submission_guidelines_page, aims_and_scope, journal_home, ethics_disclosures],
                             note: 本刊四個頁面全文以 "reproduc"、"replicat"、"github" 搜尋，只命中 data availability statement 段的 "replicate"（一般性建議，非可重現性政策）}
    src: submission_guidelines_page

  review:
    type: single_anonymized
    requirements:
      - >-
        原文："Research content published in this journal is peer reviewed (single-anonymous)."（審稿人知道作者身分，作者不知道審稿人）
      - 可以建議審稿人，也可以要求排除某些人；建議的審稿人要與工作完全無關，且要附機構 email 或其他可驗證身分的連結
      - 期刊不一定採用建議
      - 首次決定的時程描述見 identity.metrics.time_to_first_decision；原文 "Reviewers are given a tight deadline to review the manuscript."
    number_of_reviewers: {status: not_published, checked: 2026-10-25, src: [ethics_disclosures, submission_guidelines_page]}
    reviewer_selection: >-
      原文："Authors are welcome to suggest suitable reviewers and/or request the exclusion of certain individuals when
      they submit their manuscripts. ... Please note that the Journal may not use the suggestions, but suggestions are
      appreciated and may help facilitate the peer review process."
    discussion_papers: >-
      scope 提到 "discussed papers"（首頁寫 "discussion papers"），但 submission guidelines 沒有說明這類稿件的
      投稿或審稿流程。special issues 的決定時程可另訂，原文："special issues of the journal are given an option to adapt
      a different schedule for decisions. Check the Call for Papers for specific schedules."
    src: [ethics_disclosures, submission_guidelines_page]

  integrity:
    plagiarism_screening: >-
      "The journal may use plagiarism detection software to screen submissions."（ethics 頁）；submission guidelines 另有
      "the journal may use software to screen for plagiarism"。
    duplicate_submission: >-
      原文："The manuscript should not be submitted to more than one journal for simultaneous consideration." 提交即表示工作
      未曾發表、未在他處審查中。
    originality: >-
      原文："The submitted work should be original and should not have been published elsewhere in any form or language
      (partially or in full), unless the new work concerns an expansion of previous work. (Please provide transparency on
      the re-use of material ...)"
    salami_slicing: 不得把單一研究拆成多篇投稿。
    authorship_changes: 錄取後不接受增減作者、改通訊作者或改作者順序；修訂階段 "generally not permitted"。
    preprints:
      journal_specific: {status: not_published, checked: 2026-10-25, src: [submission_guidelines_page, aims_and_scope, ethics_disclosures, how_to_publish, journal_home],
                         note: 本刊五個頁面的文字都沒有出現 "preprint"}
      publisher_wide_text: >-
        Springer 政策頁："Springer Nature journals encourage posting of preprints of primary research manuscripts on
        preprint servers of the authors' choice, authors' or institutional websites, and open communications between
        researchers whether on community preprint servers or preprint commenting platforms." 並寫 "preprints may be posted
        at any time during the peer review process." 以及 "Manuscripts posted on preprint servers will not be taken into
        account when determining the advance provided by a study under consideration at a Springer Nature journal."
      disclosure: 投稿時或審稿期間要揭露 preprint 的 DOI 與授權條款；刊出後要更新 preprint 記錄，附上正式版的 DOI 與連結。
      src: springer_policies
      scope_note: >-
        這是 Springer Nature 全品牌政策，不是本刊自己的條文；本刊頁面沒有與它矛盾的文字，也沒有明說採用它。
        條文的「primary research manuscripts」是否涵蓋本刊的各種稿件類型，政策頁沒有進一步說明。
    src: [submission_guidelines_page, ethics_disclosures, springer_policies]

  ai_policy:
    journal_text: >-
      submission guidelines："Large Language Models (LLMs), such as ChatGPT, do not currently satisfy our authorship
      criteria. ... Use of an LLM should be properly documented in the Methods section (and if a Methods section is not
      available, in a suitable alternative part) of the manuscript. The use of an LLM (or other AI-tool) for "AI assisted
      copy editing" purposes does not need to be declared."
    ai_copy_editing_definition: >-
      原文將 "AI assisted copy editing" 定義為對人寫文字的可讀性與風格改進、文法拼字標點與語氣的修正，包含用字與格式調整，
      "but do not include generative editorial work and autonomous content creation"；最終文字須有人負責並經作者同意。
    generative_ai_images: 圖與補充檔段落都要求遵守 Springer 的生成式 AI 圖像政策（連到政策頁），細節見 springer_policies。
    src: [submission_guidelines_page, springer_policies]

  submission:
    portal: https://submission.nature.com/new-submission/11222/3
    system: >-
      Springer Nature 的線上投稿系統（入口網址在 submission.nature.com）。本刊頁面沒有說出系統名稱；
      submission guidelines 的 Editorial Procedure 段仍寫 "Editorial Manager"，但「Submit manuscript」按鈕實際指向
      submission.nature.com，與 Archive for Mathematical Logic 記錄中確認為 Snapp 的入口同一個主機。
      這一點是由網址推論，頁面本身未明說，投稿前以實際登入畫面為準。
    portal_fetch_note: >-
      2026-10-25 用 curl 取該網址得 HTTP 400（導向 submission.springernature.com/new-submission/11222/3?error=cookies_not_supported），
      是投稿入口需要 cookie 與登入，不是網址失效；因此沒有列為監看來源。
    cover_letter_items: >-
      通訊作者要在給編輯的信（cover letter）說明重複使用的材料，並提及稿中任何未發表的材料（例如已被接受但未刊出的稿件）。
    at_submission:
      - 上傳全部可編輯的原始檔（LaTeX 含樣式檔與圖，加編譯後 PDF；或 Word）
      - 在投稿介面填作者貢獻與利益衝突
      - 建議或排除審稿人（選填）
      - 依 OA FAQ，可在投稿過程中申請 APC 折扣或豁免
    after_acceptance: >-
      錄取後系統會發兩封信：一封要確認單位、選出版模式、處理權利與費用；另一封在排版完成後附校樣連結。
      版權：開放取用作者保留版權；訂閱模式下依期刊所有權授予出版社專屬授權或轉讓版權。
      依 FAQ，2026 年底前錄取的稿件仍可在授權簽署時選訂閱路徑，2027-01-01 起只出版 OA。
    src: [submission_guidelines_page, journal_home, oa_transition_faq]

  fees:
    submission:
      status: not_published
      checked: 2026-10-25
      src: [submission_guidelines_page, how_to_publish]
      note: >-
        兩處都沒有提投稿費或審稿費。submission guidelines 的 Editorial Procedure 段原文寫
        "The journal does not charge a submission fee or publication fee. If your article is accepted for
        publication, it will be published without incurring any cost to the authors."，但這段與首頁的 OA 轉換公告
        不一致（見 warnings），不能當作現況的免費承諾。
    apc:
      mandatory: true
      mandatory_note: >-
        首頁公告原文："all submissions received from 1 July 2026 are subject to an article publication charge (APC) if
        accepted and published in the journal (unless a waiver is applied)." FAQ："As of 1 July 2026 we are open for OA
        submissions only." how-to-publish 頁則仍寫 "Authors can also choose to publish under the subscription publishing
        model (no APC charges apply)"，兩種說法並存；FAQ 另說 2026 年底前錄取者仍可選訂閱路徑。
      amount: {usd: 2990, gbp: 2090, eur: 2390}
      currency: USD
      payable: 錄取後才付（"payable by authors' institutions or funders when articles are accepted for publication"）
      tax: 另依適用情形加 VAT 或當地稅
      license: CC BY-NC-ND 4.0 或 CC BY 4.0
      price_rule: "The APC price will be determined from the date on which the article is accepted for publication."
      waiver: >-
        FAQ 原文："You can apply for an APC discount or waiver during the Statistics and Computing submission process.
        The APC waivers team will then confirm if you are eligible for a waiver or discount."
        機構協議涵蓋的稿件由機構集中付款（FAQ："the APC will be centrally invoiced to the OA agreement"）。
      as_of: 2026-10-25
      src: [how_to_publish, oa_transition_faq, journal_home]
    color_in_print: {status: not_published, checked: 2026-10-25, src: submission_guidelines_page,
                     note: 原文 "For color in the print version, authors will be expected to make a contribution towards the extra costs." 沒有列金額；線上版彩色免費}
    language_editing: 選配，Springer Nature Author Services 的英文編修，另計費（頁面標 15% 折扣）；頁面明說不是投稿條件，也不保證送審或錄取
    src: [how_to_publish, oa_transition_faq, submission_guidelines_page]

cycle:
  applies_to: null

warnings:
  - >-
    出版模式正在轉換，官方頁面互相不一致。首頁與 FAQ：2026-07-01 起只收 OA 投稿、錄取後付 APC（可申請折扣或豁免）、
    2027-01-01 起全面 OA。submission guidelines 的 Editorial Procedure 段仍寫「不收投稿費或出版費」、
    how-to-publish 頁仍寫 hybrid 並提供免費的訂閱路徑，且 FAQ 自己也說 2026 年底前錄取者可選訂閱。
    記錄的 APC 金額（USD 2,990 / GBP 2,090 / EUR 2,390）取自 how-to-publish 與 FAQ，兩處數字一致；
    投稿前要以投稿系統的實際選項為準，並確認所屬機構是否有 OA 協議。
  - >-
    scope 以「統計與計算科學的交界」界定，沒有排除任何主題，也沒有談理論稿件、軟體稿件或自動微分、符號微分。
    官方頁面在這些議題上是沉默，不是同意也不是反對；最接近的已列主題是 "computer algebra"。
    scope 疑問的處理方式是主編看整份稿件後判斷。
  - >-
    投稿規定很精簡：整個 submission-guidelines 頁沒有文章類型清單、沒有正文字數或頁數上限，只有摘要 150–250 字與
    關鍵字 4–6 個。不要把別刊的篇幅上限當成本刊的；投稿系統是否另設硬性上限，需登入或問編輯部才知道。
  - >-
    沒有可編輯的原始檔會連審都不審：原文 "Failing to submit a complete set of editable source files will result in your
    article not being considered for review."；缺 Declarations 的稿件會被退回為不完整。
  - >-
    審稿是單匿名（審稿人知道作者），不需要去識別化稿件。
  - >-
    程式碼與資料：資料可用性聲明（Data Availability Statement）是原創研究文章的必要項目，但公開存放資料只是
    "strongly encouraged"；官方頁面沒有要求提交或公開程式碼，也沒有單獨的可重現性政策。
  - >-
    preprint：本刊自己的頁面沒有 preprint 條文；Springer Nature 全品牌政策鼓勵張貼 preprint，且張貼不影響審查時對進展的判斷。
    這份記錄把該政策標為 publisher-wide，沒有假裝是本刊自己的規定。
  - >-
    IF 1.8 與 5 年 IF 2.1 是 Springer 頁面自述，沒有說明系統與年份定義，未另以 JCR 核對；JCR 分區未查（需登入）。
    記錄裡的分區是 SJR（SCImago），2025 年四個類別為 Q1、Q2、Q2、Q1。兩個系統不可互換。
  - >-
    首次決定中位數 3 天是首頁自述，未標統計期間，也未說明是否含不送外審的直接退稿；它與 submission guidelines 的
    「多數情況在三個月內決定」口徑不同，不互相換算。官方沒有公布投稿到接受的時間，也沒有公布接受率。
  - >-
    投稿入口與系統名稱：guidelines 文字仍寫 Editorial Manager，實際按鈕指向 submission.nature.com。
    系統名稱未由本刊頁面證實，登入前不要預設是哪個系統的帳號。
  - >-
    Springer 的 HTML 頁尾含讀者 IP 與機構授權名單，且 verify.py 的 urllib 只拿到 Client Challenge 頁，
    所以這份記錄的 Springer 來源都是 browser／http_viable: false，verify.py 只會回 NEEDS_AGENT；
    不能取代人工用 Safari 或 curl 重讀頁面。
