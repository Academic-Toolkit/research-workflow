warnings:
  - >-
    Technical Papers 的截止日已過：摘要 2026-10-20、全文 2026-10-23（AoE）。今天（2026-11-15）無法再投 MSR 2027 主軌。
    Data and Tool Showcase 也已過（摘要 11-05、全文 11-10 AoE）。仍開放：Registered Reports 初稿（2026-11-20 AoE，
    其摘要 11-13 已過；頁面未說摘要是否為強制）、Industry（2026-12-18 AoE）、Mining Challenge（摘要 12-18、全文 12-23 AoE）；
    Tutorials 截止日尚未公布。
  - >-
    所有日期為 AoE（UTC-12h）。AoE 的截止日要到臺北時間（UTC+8）次日 20:00 才真正過；
    但以「當日 AoE 結束」自行推算容易出錯，實際投稿請以 HotCRP 顯示的截止為準。
  - >-
    2027 年改用 IEEE 模板（\documentclass[10pt,conference]{IEEEtran}，不得帶 compsoc／compsocconf），2026 是 ACM。
    格式偏離（間距、字級）「may result in desk rejection without further review」。
  - >-
    預印本政策（主軌雙匿名）：可放 arXiv，但「must avoid specifying that the manuscript was submitted to MSR 2027」，
    且「During review, authors should not publicly use the submission title」——建議預印本用不同標題。
    Data and Tool 與 Registered Reports 是單匿名，不受此限；Mining Challenge 是雙匿名。
  - >-
    投稿規定的 AI 條款（2027 新增）：虛構參考文獻、未清除的 chatbot 殘留文字、對自動化工具的隱藏指令（白字、PDF metadata）
    都可能被直接退稿，且檢查可在審查的任何階段進行。使用 AI 產生內容須在 Acknowledgements 揭露；僅文字潤飾可免揭露。
  - >-
    主軌 10 頁正文「inclusive of all figures, tables, appendices」，附錄算進 10 頁；參考文獻另有 2 頁但只能放參考文獻。
    各軌頁數不同（Short WIP 4+1、Data/Tool 4+1、Challenge 4+1、RR 6+1、Industry 與 Tutorials 摘要 1+1），不可混用。
  - >-
    本記錄只涵蓋 MSR 2027 的網站內容。論文集出版社、開放取用模式、作者費用、錄取率與投稿數，官方頁面均未陳述
    （標為 not_published），並非漏查。Registered Reports 不會刊於 MSR 論文集。
  - >-
    主軌錄取後作者名單與標題凍結（"can not be changed under any circumstances"），且至少一位作者須註冊並親自報告。
  - >-
    投稿站（HotCRP）本次未實際擷取，portal.verified: false；網址來自 CFP 頁面。
