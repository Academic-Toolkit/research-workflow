    ecr_award: 取得最高學位未滿五年者可在投稿時於 cover letter 申請 BPS Early Career Researcher Best Paper Award（細則另頁，未讀）
    licence: 錄取後在 Wiley Author Services 簽出版授權（可選標準授權或 Creative Commons 授權）
