    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁，約 5.5–5.7 KB）。
      validity:
        must_contain: "is an international, interdisciplinary journal publishing advances in quantitative methodologies in psychology"
        min_extracted_chars: 3400
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: editorial_board
    role: supporting
    url: https://bpspsychub.onlinelibrary.wiley.com/hub/journal/20448317/homepage/editorialboard.html
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁，約 5.6–5.8 KB）。
      validity:
        must_contain: "Consulting Editors"
        min_extracted_chars: 2800
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: contact
    role: supporting
    url: https://bpspsychub.onlinelibrary.wiley.com/hub/journal/20448317/homepage/contact.html
    note: 編輯部與製作部信箱。編輯部信箱的拼法（bmsp@）與 author_guidelines 的（bjmsp@）不同，見 identity.editorial_office。
    fetch:
      method: browser
