cycle:
  applies_to: null
  rolling_calls:
    - id: review_and_tutorial
      label: "Review Articles and Expert Tutorials on Advanced Research Methods"
      type: rolling
      wants: >-
        Review Articles：批判性地回顧進階研究方法；Expert Tutorials：由在 BJMSP 等高排名期刊有發表紀錄的研究者撰寫，
        含電腦程式碼與可運作的例子，讓研究生層級的心理學讀者能用。
      process: >-
        投稿前把 11 點字、1 頁的摘要寄給主編（信箱印在徵稿頁）；全文走一般的匿名審查。官方寫明 "Submissions are accepted on a rolling basis with no specific deadline."
      deadlines:
        - {id: rolling, date: null, status: not_applicable, checked: 2026-11-13, note: 官方寫 "no specific deadline"}
      url: https://bpspsychub.onlinelibrary.wiley.com/hub/journal/20448317/call-for-papers/advanced-research-methods
      src: cfp_advanced_methods
    - id: interpretable_explainable_ai_ml
      label: "Special issue: Interpretable and Explainable AI/ML for Psychological Research"
      type: special_issue
      wants: >-
        讓 AI/ML 方法透明、有統計原則、能支撐心理過程推論的方法學進展；歡迎理論貢獻、方法發展與批判性回顧。
        徵稿頁列了十五個主題（例：intrinsically interpretable models、post hoc 解釋方法的統計性質、潛在表徵的可辨識性）。
      priorities_quote: "Applications of existing AI/ML models and explanation methods are discouraged, except insofar as they are needed to demonstrate, compare, or validate new methodological contributions. Mere benchmarking or simulation studies that compare existing algorithms or explanation tools without novel theoretical or analytical development are also discouraged."
      priorities_note: 這段 Submission Priorities 只適用這個特刊，不是期刊通則。
      process: >-
        先寄不超過 1,000 字的提案到 bmsp@wiley.com（主旨須為 "Special Issue: Interpretable and Explainable AI/ML for Psychological Research"）；
        編輯委員會挑選後寄邀請；全文用 Wiley 的投稿系統提交，並依期刊的 Author Guidelines 準備；全部稿件走一般審查，
        提案獲接受不保證刊出（官方寫 "Acceptance of a proposal does not guarantee publication."）。須附有註解的可重現程式碼。
      deadlines:
        - id: abstract_proposal
          date: 2027-08-02
          timezone: {status: not_published, checked: 2026-11-13}
          note: '官方寫 "Abstract Submission deadline - August 2, 2027"；提案上限 1,000 字'
        - id: invitations
          date: 2027-08-23
          note: '官方寫編輯委員會 "by August 23, 2027" 寄出邀請'
        - id: full_manuscript
          date: 2028-06-15
          timezone: {status: not_published, checked: 2026-11-13}
          note: '官方寫 "Full Manuscript deadline - June 15, 2028"'
      guest_editors: ["Rudolf Debelak（Federal Institute of Technology, Lausanne, Switzerland）", "Qian Zhang（Florida State University, United States）"]
      url: https://bpspsychub.onlinelibrary.wiley.com/hub/journal/20448317/call-for-papers/si-2026-001288
      src: cfp_xai
  published_special_issues:
    - {volume_issue: "79(2)", month: 2026-05, title: "Multiple Multivariate Multimodal Time Series Data Analysis in Psychological Research", guest_editors: [Casper J. Albers, Michael D. Hunter], src: all_issues}
    - {volume_issue: "79(3)", month: 2026-11, title: "Reliability Revisited: Advances in Reliability Measures for Psychological Research", guest_editors: [L. Andries van der Ark, Terrence D. Jorgensen], src: all_issues}

# ─────────────────────────────────────────────────────────────
warnings:
  - >-
    字數上限是 "should normally be no more than 5000 words"（Review Article 6000、Expert Tutorial 4000），官方只說不含 abstract、reference list、tables 與 figures；
    附錄、補充材料、腳註與數學式是否計入沒有說明，Editor 對超長稿件 "retains discretion"。
    官方也沒有說明超長稿件在投稿時如何處理。
  - >-
    心理學相關性是第一道門檻：官方政策是 "to reject without review articles that do not set out the psychological relevance of the paper sufficiently clearly or which fail to meet minimum standards of clarity and presentation"，
    審稿問題的第一、二題也問心理學脈絡與相關性是否清楚。Aims and Scope 的措辭是方法 "that have explicit applications to psychological and behavioral research"。
  - >-
    雙匿名審查：標題頁與主檔分成兩個檔；主檔不得含作者姓名或所屬，引用自己的研究用第三人稱，repository 連結（例如 OSF）也要匿名化，Word 檔要移除檔案屬性。
    另外，投稿作者須提供 ORCID iD（官方寫 "the submitting author (only)"），CRediT 作者貢獻聲明為必填。
  - >-
    所有稿件都要有資料與程式碼可得性聲明（標題頁），且須有 repository 連結才能刊出；官方 "expects that where possible" 公開資料與有註解的可重現程式碼，
    但通用 FAQ 又寫程式碼 "is not a requirement"，兩頁說法不同。無法公開者要在投稿時告知編輯。
  - >-
    Hybrid：作者可選 Open Access，錄取後收 APC（USD 3,570／GBP 2,380／EUR 2,990，未含稅）；通訊作者是 BPS Graduate 或 Chartered 會員時，學會負擔 100% APC。
    官方沒有公布投稿費、頁面費或彩色費用。
  - >-
    官方頁面彼此有出入：期刊宗旨有三種寫法、Expert Tutorial 字數（4000 或 5000）、編輯部信箱（bmsp@wiley.com 或 bjmsp@wiley.com）、
    首次決定（2025 年中位數 21 天，另有 "within 90 days" 的目標）。投稿前宜向編輯部確認。
