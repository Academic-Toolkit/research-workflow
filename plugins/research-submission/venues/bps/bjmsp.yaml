        （前者是 2025 年的實際中位數，後者是對作者的目標），不可互換。
    time_submission_to_acceptance:
      value: 208
      unit: days
      statistic: median
      year: 2025
      basis: 頁面標 "2025 Submission to acceptance (median) :"，沒有說明母體與計算方式
      as_of: 2026-11-13
