  - id: submission_portal
    role: supporting
    url: https://authors.wiley.com/journal/BMSP
    note: >-
      author_guidelines 的 "Wiley Authors submission portal" 與 "Start your submission" 連結的目標。
      curl 會轉址到 https://authors.wiley.com/dashboard/journal/BMSP（HTTP 200，1,319 bytes 的 SPA 空殼，
      <div id="root"></div>，<title> 只有 "Wiley Authors"）。2026-11-13 以 safari-browser 開啟：
      頁面轉到 Wiley 的 CONNECT 登入頁 https://wiley.scienceconnect.io/login；該頁是中文介面（瀏覽器語言所致），
      含「以继续访问 Wiley Authors」一句，選項有 Google、ORCID、Microsoft、WeChat、Apple、郵箱。
      沒有登入，也沒有建立任何投稿，所以投稿表單本身（是否有 BJMSP 專屬欄位）沒有讀到。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        curl 回 HTTP 200，但只有 1,319 bytes 的 SPA 空殼（內容由 JavaScript 產生，沒有可抽取的正文）；
        另一個網址 https://wiley.atyponrex.com/journal/BMSP（出自 cfp_xai）curl 追蹤後落在 https://authors.wiley.com/dashboard/journal?groupCode=BMSP，同樣是 1,319 bytes 的空殼。
