# ─────────────────────────────────────────────────────────────
requirements:
  refresh:
    check_every: P6M
    method: manual
    note: 所有 authoritative 來源都是 browser 讀取（Cloudflare 挑戰），verify.py 無法自動比對；重新驗證要用 Safari 打開被引用的頁面確認原文仍在。

  unread_linked_pages:
    checked: 2026-11-13
    note: 這些是 author_guidelines 或相關頁面連出去、本記錄沒有讀的頁面；其中的規定不在本記錄內。
    list:
      - BPS Journals Terms and Conditions of Submission（.doc）
      - BPS Journals Declaration of Competing Interests（.doc）
      - '"What happens to my paper?"（PDF）'
      - BPS Journals appeals policy and procedure（PDF）
      - Wiley 的 AI guidance for researchers 與 AI guidelines 頁
      - Wiley 的 self-archiving、licensing FAQs、funder 合規工具、Refer and Transfer 頁
      - BPS ECR Best Paper Award 細則
      - 首頁 About 選單的 "OA Advantages" 與 "News"、"Permissions"
      - Registered Reports 頁 Stage 2 以後的內容（只讀了 Stage 1 為止的前段）
      - 圖檔規格頁（figure-preparation）與 Wiley 的 supporting information FAQs

  scope:
    aims: >-
      官方有三種寫法（見 aims_variants）。共同點：收「發展新的量化方法或模型，或延伸、比較、批評既有方法」的文章，
      重點是這些方法要用在心理學問題上；Author Guidelines 的寫法最強調「數學或統計論證的比例比其他心理學期刊通常能接受的更高」。
    src: [overview, author_guidelines, journal_home]
    aims_variants:
      - id: overview
        quote: "The British Journal of Mathematical and Statistical Psychology publishes articles that develop new quantitative methods or models, or extend/compare/critique existing ones that have explicit applications to psychological and behavioral research. The journal welcomes research articles, review articles, expert tutorials, and registered reports."
        topics_quote: "mathematical psychology; psychometrics; decision making; psychophysics; relevant areas of computational modeling, computing and computer software."
        src: overview
        note: 頁面把五個主題領域分行列出，這裡用分號串接；原文是五行清單。
      - id: author_guidelines
        quote: "The British Journal of Mathematical and Statistical Psychology publishes articles relating to areas of psychology which have a greater mathematical or statistical aspect of their argument than is usually acceptable to other journals including:"
        topics_quote: "mathematical psychology; statistics; psychometrics; decision making; psychophysics; classification; relevant areas of mathematics, computing and computer software"
        src: author_guidelines
        note: 頁面把七個領域分行列出，這裡用分號串接；與 overview 相比多了 statistics 與 classification，少了 computational modeling。
      - id: journal_home
        quote: "The British Journal of Mathematical and Statistical Psychology is an international, interdisciplinary journal publishing advances in quantitative methodologies in psychology, such as new models for psychological processes, new approaches to analyzing psychological data, critiques of existing models and improved algorithms for estimating the parameters of a model."
        src: journal_home
    favoured_quote: "These include articles that address substantive psychological issues or that develop and extend techniques useful to psychologists. New models for psychological processes, new approaches to existing data, critiques of existing models and improved algorithms for estimating the parameters of a model are examples of articles which may be favoured."
    favoured_src: author_guidelines
    evaluation_criteria:
      lead_in_quote: "The following series of questions are used in relation to those papers submitted for review:"
      questions:                  # author_guidelines 第 5 節，逐字
        - "Is a psychological or substantive context identified?"
        - "Is the relevance and importance of the work to psychology or related disciplines sufficiently clear?"
        - "Is relevant previous work referred to?"
        - "Is the problem well identified?"
        - "Are alternative solutions considered?"
        - "Are the mathematical or statistical arguments competent and correct?"
        - "Is an example necessary? If given, is the example trivial?"
        - "Is the abstract adequate?"
      src: author_guidelines
      note: >-
        這八題是官方列給審稿的問題，不是計分表，也沒有說明權重。給 Review Article 與 Expert Tutorial 的判準另寫在 cfp_advanced_methods
        （見 article_types）。
    out_of_scope_hints:
      - case: 沒有把論文的心理學相關性交代清楚，或不符合最低的清晰度與呈現標準
        verdict: 政策是不送審直接退
        quote: "In particular, it is policy to reject without review articles that do not set out the psychological relevance of the paper sufficiently clearly or which fail to meet minimum standards of clarity and presentation."
        src: author_guidelines
      - case: 超出範圍或其他不適當的投稿
        verdict: 編輯可不經外審直接退（triage）
        quote: "We also operate a triage process in which submissions that are out of scope or otherwise inappropriate will be rejected by the editors without external peer review."
        src: author_guidelines
      - case: 沒有預先註冊的系統性回顧（只適用 Review Article 中的 systematic review）
        verdict: 投稿時退回作者
        quote: "All systematic reviews must be pre-registered and an anonymous link to the pre-registration must be provided in the main document, so that it is available to reviewers. Systematic reviews without pre-registration details will be returned to the authors at submission."
        src: author_guidelines
    lower_priority_hints:
      status: not_published
      checked: 2026-11-13
      src: [author_guidelines, overview, journal_home]
      note: >-
        查過 author_guidelines、overview、首頁，通則頁面沒有「低優先」或「通常不適合」的類型清單；
        最接近的是上面兩條不送審的條件，以及 "articles which may be favoured" 的正面清單。
        特刊徵稿 cfp_xai 另有自己的 Submission Priorities（只適用該特刊），見 cycle.rolling_calls。
    topical_signal:
      note: >-
        首頁 2026-11-13 的 "Most Recent" 文章標題：Two-stage least squares as a mean and covariance structure estimator: Reconciling econometric
        and psychometric formulations（Maydeu-Olivares 與 Rosseel）；Statistical inference regularized with neural networks and its application in
        psychometrics（Belov、Lüdtke、Ulitzsch）；An uncomplicated introduction to representational measurement theory（Franco 等）；A taxonomy of
        reliability indices for cluster-level constructs measured by multiple individual-level indicators（Jorgensen 與 Jak）。
        已出的 special issue：Volume 79 Issue 2 "Multiple Multivariate Multimodal Time Series Data Analysis in Psychological Research"
        （客座 Casper J. Albers、Michael D. Hunter）、Issue 3 "Reliability Revisited: Advances in Reliability Measures for Psychological Research"
        （客座 L. Andries van der Ark、Terrence D. Jorgensen）。只看了標題，未讀內容。
      src: [journal_home, all_issues]

  article_types:
    - id: article
      label: Article（research article）
      length: "normally no more than 5000 words（不含 abstract、reference list、tables、figures）"
      note: 官方沒有給這一類另外的名稱或定義，Aims and Scope 與 Categories 兩節只稱 "articles"。
      src: author_guidelines
    - id: review_article
      label: Review Article
      length: "6000 words（author_guidelines 與 cfp_advanced_methods 一致）"
      wants: >-
        專家針對數學與統計心理學的重要主題，較長篇幅地回顧歷史、發展與未來。官方列的過往例子：Keselman 等 (2001)、Sheynin (2004)、Steinley (2006)。
        系統性回顧必須預先註冊（見 scope.out_of_scope_hints）。
      process: >-
        官方建議投稿前先把摘要寄給 Editor；編輯也會不定期邀稿；全部走一般的匿名審查。
        徵稿頁寫摘要為 1 頁、11 點字、寄主編（信箱印在徵稿頁），內容含 "a concise summary of the research topic, objectives, methods, expected results, and contributions"，
        並註明 "acceptance for publication is not guaranteed"。
      criteria_quote: "Review Articles will be evaluated based on the thoroughness of the review of existing literature, the ability to synthesize and critique key findings, and the clarity and organization in presenting these findings."
      criteria_src: cfp_advanced_methods
      src: [author_guidelines, cfp_advanced_methods]
    - id: expert_tutorial
      label: Expert Tutorial
      length: "4000 words（author_guidelines）；cfp_advanced_methods 寫 5000 words，建議 4000"
      conflict: >-
        author_guidelines："Papers should normally be no more than 5000 words (6000 for Review Articles and 4000 for Expert Tutorials)"；
        cfp_advanced_methods："Papers should generally not exceed 5000 words for Expert Tutorials (4000 words recommended) and 6000 words for Review Articles."
        兩頁對 Expert Tutorial 的上限說法不同（4000 或 5000 加建議 4000）。
      wants: >-
        作者須有該主題的深入經驗，並 "have typically published several research papers in BJMSP and other high-ranking journals"；
        對象是有良好量化基礎、但還不是該主題專家的心理學博士級研究者；徵稿頁另寫須含電腦程式碼與可運作的例子。
      process: 同 Review Article（建議先寄摘要給 Editor；匿名審查）。
      criteria_quote: "Expert Tutorials will be evaluated on the clarity with which advanced research methods are presented to non-specialist readers and their relevance in addressing emerging needs in the field."
      criteria_src: cfp_advanced_methods
      src: [author_guidelines, cfp_advanced_methods]
    - id: registered_report
      label: Registered Report
      note: 另有獨立規定；兩階段審查，Stage 1 在資料蒐集前審查研究設計與分析計畫，通過者給 in principle acceptance。本記錄不展開。
      src: [author_guidelines, registered_reports]
    - id: special_issue_paper
      label: Special issue / special section 稿件
      note: 照各特刊徵稿的流程，見 cycle.rolling_calls。
      src: cfp_index

  length:
    value: 5000
    unit: words
    basis:
      counting_method: {status: not_published, checked: 2026-11-13, src: author_guidelines,
                        note: '官方寫 "words"，沒有說明用哪個軟體計數、是否含標題頁、腳註、數學式或圖說。'}
    excludes: [abstract, references, tables, figures]
    unstated:
      status: not_published
      checked: 2026-11-13
      src: author_guidelines
      note: >-
        頁面只列 "excludes the abstract, reference list, tables and figures"。附錄、補充材料（Supporting Information）、
        腳註、數學式與證明是否計入沒有說明。
    quote: "Papers should normally be no more than 5000 words (6000 for Review Articles and 4000 for Expert Tutorials) and excludes the abstract, reference list, tables and figures. The Editor retains discretion to publish papers beyond this length in cases where the clear and concise expression of the scientific content requires greater length."
    exceptions: >-
      官方用語 "normally"，並寫 Editor "retains discretion to publish papers beyond this length in cases where the clear and concise
      expression of the scientific content requires greater length"。頁面沒有說明超長的稿件在投稿時會被退回，還是進入審查後再議；
      也沒有說明要不要事先聯絡編輯。
    by_type:
      article: 5000
      review_article: 6000
      expert_tutorial: {value: 4000, note: "cfp_advanced_methods 另寫 5000（建議 4000），兩頁不一致"}
    applies_to: [article, review_article, expert_tutorial]
    src: author_guidelines

  abstracts:
    - id: main
      min_words: 100
      max_words: 200
      structure: 不得有小標題（"The abstract should not include any sub-headings."）
      required_at: submission
      placement: 標題頁（title page）與主檔都列為應有的項目；Author Guidelines 的標題頁清單含 Abstract，主檔清單也含 "Abstract without any subheadings"
      quote: "All articles should be preceded by an Abstract of between 100 and 200 words, giving a concise statement of the intention, results or conclusions of the article. The abstract should not include any sub-headings."
      src: author_guidelines
  keywords: {max: 7, quote: "Up to seven keywords;", note: "標題頁清單只寫 \"Please provide appropriate keywords.\"；\"Up to seven\" 出自主檔應有的項目清單", src: author_guidelines}
  running_title: {max_chars: 40, quote: "A short running title of less than 40 characters;", src: author_guidelines}

  structure:
    submission_mode: free_format
    quote: "British Journal of Mathematical and Statistical Psychology now offers free format submission for a simplified and streamlined submission process."
    initial_submission: >-
      初次投稿可以是單一檔（含文字、圖、表）或分開的檔案；必須含 abstract、introduction、methods、results、conclusions；
      圖與表要有圖說；參考文獻可用任何格式，但全文要一致。官方原文："If your manuscript is difficult to read, the editorial office may send it back to you for revision."
    title_page_contents:
      - 簡短、含主要關鍵字的標題，不得含縮寫
      - 少於 40 字元的 running title
      - 作者全名
      - 作者做研究時的所屬機構（現址不同者加註腳）
      - Abstract
      - Keywords
      - Data and code availability statement
      - 生成式 AI 內容（AIGC）工具的使用聲明
      - Acknowledgments
    main_file_contents: [短標題, "Abstract（無小標題）", "最多七個關鍵字", "正文：introduction、materials & methods、results、discussion、conclusion", References, "Tables（各含標題與註腳）", "Figure legends"]
    main_file_note: 主檔的章節是通則寫法（introduction、materials & methods、results、discussion、conclusion），官方沒有為純理論或方法論文另列結構。
    revised_manuscripts: >-
      收到修稿邀請後，期刊會要求依期刊格式整理修稿；"Contributions must be typed in double spacing. All sheets must be numbered."
      （此句在 "Revised Manuscript Submission" 小標下，不是初次投稿的要求）；修稿階段圖與表須為獨立檔案。
    cover_letter:
      required: false
      quote: "Cover letters are not mandatory; however, they may be supplied at the author’s discretion."
      note: 申請 ECR Best Paper Award 者要在 cover letter 寫明（官方原文 "should submit a cover letter stating this with their manuscript"）。
      src: author_guidelines
    src: author_guidelines

  formatting:
    style_manual: {name: APA Publication Manual, quote: "For guidelines on editorial style, please consult the APA Publication Manual published by the American Psychological Association.", src: author_guidelines}
    citation_style:
      name: APA
      required_at_submission: false
      quote: "This journal uses APA reference style; as the journal offers Free Format submission, however, this is for information only and you do not need to format the references in your article. This will instead be taken care of by the typesetter."
      src: author_guidelines
    spelling: {value: British, note: 投稿可用英式或美式，錄取後由製作端轉換, quote: "The journal uses British spelling; however, authors may submit using either option, as spelling of accepted papers is converted during the production process.", src: author_guidelines}
    file_formats_at_submission:
      main_document: [".doc", ".docx", ".tex"]
      quote: "The main manuscript file can be submitted in Microsoft Word (.doc or .docx) or LaTex (.tex) format."
      latex_pdf_required: true
      latex_quote: "When submitting a LaTex Main Document, you must also provide a PDF version of the manuscript for Peer Review."
      latex_upload_labels: ["Main Document – LaTeX .tex File", "Main Document - LaTeX PDF", "LaTeX Supplementary File"]
      src: author_guidelines
    templates:
      latex: {status: not_published, checked: 2026-11-13, src: author_guidelines,
              note: "官方沒有提供投稿用的 LaTeX 範本；只在 post-acceptance 的檔案清單提到 \"those used in the NJD LaTex Template class file\"，沒有連結。"}
      word: {status: not_published, checked: 2026-11-13, src: author_guidelines, note: 只提供標題頁範本（見 title_page_template），沒有主檔的 Word 範本}
      title_page_template:
        url: https://bpspsychub.onlinelibrary.wiley.com/pb-assets/assets/20448317/BJMSP%20Sample_Manuscript_Title_Page-1713227067980.docx
        note: author_guidelines 兩處 "this template" 連結之一（另一個連結的檔案在 2044835X 路徑下，是同一組 BPS 期刊的通用版本）；本記錄沒有下載這個檔案。
        src: author_guidelines
    anonymisation_of_files: "To fully anonymize Word files before submission, please remove the file properties."
    line_numbers: {status: not_published, checked: 2026-11-13, src: author_guidelines, note: 初次投稿沒有行號規定；修稿規定只寫 "All sheets must be numbered."（頁碼）}
    spacing: {value: double, applies_to: 修稿, src: author_guidelines}
    figures_tables:
      tables: 須為可編輯檔，不可貼成圖片（"They should be supplied as editable files, not pasted as images."）；註腳符號依序用 †、‡、§、¶，* ** *** 保留給 P 值
      figures: 初次審查接受各種格式、大小與解析度；修稿階段圖與表須為獨立檔案；LaTeX 錄取後的圖要 EPS、PDF 或 TIFF，不要用 LaTeX 碼畫圖
      legends: 圖與表連同圖說要能不看正文就讀懂
      src: author_guidelines
    equations: {status: not_published, checked: 2026-11-13, src: author_guidelines}
    effect_size: {quote: "Effect size: In normal circumstances, effect size should be incorporated.", src: author_guidelines}

  supplementary_material:
    name: Supporting Information
    contents: [software code, additional tables, data sets, figures, movie files, audio clips, 其他非必要的多媒體檔]
    code_welcome: "Software code/syntax for widely available or open source software that enables researchers to use new procedures is particularly welcome and is likely to enhance the impact of your paper."
    publication: 照作者提供的檔案原樣刊出，刊出前不提供校樣（"It is published as supplied by the author, and a proof is not made available prior to publication"）
    citation: 須在正文引用並附說明性圖說
    counted_in_length:
      status: not_published
      checked: 2026-11-13
      src: author_guidelines
      note: 字數規定沒有提補充材料；見 length.unstated。
    src: author_guidelines

  openness:
    data_availability_statement:
      required: true
      applies_to: 所有稿件
      placement: 標題頁（"Data and code availability statement"）
      quote: "All papers need to be supported by a data archiving statement and the data set must be cited in the Methods section. The paper must include a link to the repository in order that the statement can be published."
      src: author_guidelines
    data:
      level: expected
      quote: "The journal expects that where possible all data supporting the results in papers, including reproducible computer code that is sufficiently annotated, are archived in an appropriate public archive offering open access and guaranteed preservation."
      timing: >-
        "It is not necessary to make data publicly available at the point of submission, but an active link must be included in the final accepted manuscript."
      exceptions: >-
        法律或倫理等理由無法分享時，作者須在投稿時告知編輯；編輯可核准例外。無法公開資料者，官方鼓勵提供模擬資料集，讓讀者能套用示範程式碼。
        不分享時，稿件內要有說明與理由；沒有使用程式碼或資料集時，要在資料可得性聲明中寫明。
      src: author_guidelines
    code:
      level: expected
      quote: "reproducible computer code that is sufficiently annotated"
      quote_context: 與上面 data.quote 同一句。
      src: [author_guidelines, data_sharing]
      conflict: >-
        data_sharing（BPS 通用 FAQ）寫："Authors are welcome to submit additional materials, such as code, but this is not a requirement."
        author_guidelines 把 "reproducible computer code that is sufficiently annotated" 列入期刊 "expects" 的歸檔內容（"where possible"）。
        官方沒有說明兩者以何者為準；兩句都帶保留語氣（"where possible"、"welcome"）。
    repository: >-
      官方建議公開、開放取用、保證長期保存的 repository（例：OSF、Dataverse；re3data.org 列有更多）。
      "Personal websites and most departmental websites do not qualify as repositories."（author_guidelines 與 data_sharing 皆有類似句）
    data_in_article: 若重現分析所需的全部資料都在正文、表與圖內，不必另存 repository；也可作為補充資料上傳，但官方偏好 repository（data_sharing）
    link_check: 編輯或出版社只檢查資料連結與檔案數量與類型，不檢查資料本身是否有效（data_sharing）
    preregistration:
      required: false
      note: 只有 Registered Reports 與系統性回顧要求；一般文章沒有要求。
      src: [author_guidelines, registered_reports]
    reporting_guidelines: {required: false, quote: "We encourage authors to refer to and follow guidelines from:", note: 清單見 standards, src: author_guidelines}
    top_guidelines: {status: not_published, checked: 2026-11-13, src: [author_guidelines, data_sharing, overview], note: 三頁都沒有提到 TOP Guidelines 或任何等級制度}

  review:
    type: double_anonymized
    quote: "Important: the journal operates a double-anonymous peer review policy. Please anonymise your manuscript and prepare a separate title page containing author details."
    type_src: author_guidelines
    policy_quote: "Except where otherwise stated, the journal operates a policy of anonymous (double-anonymous) peer review."
    anonymization:
      required: true
      rules:
        - 主檔不得含可辨識作者的資訊；不提作者姓名或所屬，引用自己先前的研究一律用第三人稱（"always refer to any previous work in the third person"）
        - 主檔中的 repository 連結（例：OSF）也要匿名化
        - 作者詳情放在另一個標題頁檔案
        - Word 檔要移除檔案屬性
        - 機構、地理位置、未發表研究的引用都可能洩漏身分（官方列舉）
      src: author_guidelines
    triage: 編輯可在外審之前直接退稿（見 scope.out_of_scope_hints）
    first_decision_target:
      quote: "We aim to provide authors with a first decision within 90 days of submission."
      src: author_guidelines
    review_articles_and_tutorials: "All Review Article or Expert Tutorial submissions will undergo the normal process of anonymous peer review."
    appeals:
      grounds: >-
        編輯決定若基於對稿件核心的重大誤解、未能理解稿件對文獻的推進、或對稿件處理流程的疑慮，可申訴；
        "Differences in opinion regarding the novelty or significance of the reported findings are not considered as grounds for appeal."
      deadline: 申訴須在編輯來信日期起兩個曆月內收到
      process: 先寫信給做決定的 Editor（用期刊信箱，附稿件編號與理由），不滿意再寫 BPS 的 Academic.Publications@bps.org.uk；依 COPE 建議的程序處理
      src: author_guidelines
    author_may_suggest_reviewers: {status: not_published, checked: 2026-11-13, src: author_guidelines}
    refer_and_transfer: 參與 Wiley 的 Refer and Transfer Program：被拒稿可能收到轉投其他 Wiley 期刊的建議（編輯推薦或 Transfer Desk Assistant）。
