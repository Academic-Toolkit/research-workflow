          搜尋 2044-8317 得 1 筆 "Exact Match Found"（BRITISH JOURNAL OF MATHEMATICAL & STATISTICAL PSYCHOLOGY，
          ISSN / eISSN 0007-1102 / 2044-8317），Web of Science Core Collection 欄列 Science Citation Index Expanded 與
          Social Sciences Citation Index。搜尋時頁面的篩選條件為預設的四項（SCIE、SSCI、AHCI、ESCI 皆勾選），
