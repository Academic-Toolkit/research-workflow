      quote: "2025 Acceptance rate:"
      as_of: 2026-11-13
      src: [journal_metrics, journal_home]
      note: 數值 27% 在 "2025 Acceptance rate:" 下一行；首頁摘要寫 "27% Acceptance Rate"。
    time_to_first_decision:
