identity:
  name: British Journal of Mathematical and Statistical Psychology
  abbreviation: BJMSP
  abbreviation_note: >-
    "BJMSP" 出自 author_guidelines 的標題與內文；Wiley 的投稿代碼與信箱用 "BMSP"（authors.wiley.com/journal/BMSP）。
    MJL 登錄的刊名是 "BRITISH JOURNAL OF MATHEMATICAL & STATISTICAL PSYCHOLOGY"。
  publisher: Wiley
  publisher_note: >-
    author_guidelines 的 Data protection 段稱 "the publisher (Wiley)"；首頁頁尾寫 "Published on behalf of the British Psychological Society"，
    版權行寫 "© The British Psychological Society"。MJL 出版社欄 "WILEY , 111 RIVER ST, HOBOKEN, USA, NJ, 07030-5774"。
  owner: The British Psychological Society
  owner_note: >-
    首頁寫 "A British Psychological Society journal."、頁尾寫 "Published on behalf of the British Psychological Society"。
    所有權的法律安排官方頁面沒有說明，這裡只記頁面的措辭。
  issn: {print: "0007-1102", electronic: "2044-8317", src: journal_home}
  issn_cross_check: >-
    MJL 搜尋 2044-8317 得 1 筆 "Exact Match Found"，"ISSN / eISSN: 0007-1102 / 2044-8317"；
    OpenAlex 與 Crossref 的 ISSN 也是這兩個（兩者只用於核對，不是須知來源）。
