        curl 讀到的是 1,319 bytes 的 SPA 空殼。cfp_xai 寫的 https://wiley.atyponrex.com/journal/BMSP 以 curl 追蹤後落在 authors.wiley.com 的 dashboard（?groupCode=BMSP），本記錄沒有用 Safari 開它。
