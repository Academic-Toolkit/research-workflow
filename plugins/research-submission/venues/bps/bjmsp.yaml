      - {system: SJR, category: "Statistics and Probability", subject_area: Mathematics, quartile: Q1, year: 2025, as_of: 2026-11-13, src: scimago}
      - {system: SJR, category: "Psychology (miscellaneous)", subject_area: Psychology, quartile: Q1, year: 2025, as_of: 2026-11-13, src: scimago}
      - {system: SJR, category: "Medicine (miscellaneous)", subject_area: Medicine, quartile: Q1, year: 2025, as_of: 2026-11-13, src: scimago}
      - system: SJR
        category: "Arts and Humanities (miscellaneous)"
        subject_area: Arts and Humanities
        quartile: Q1
        year: 2025
        as_of: 2026-11-13
        src: scimago
        note: >-
          SCImago 的 Subject Area and Category 欄列這四個類別；表格 "Category / Year / Quartile" 中 2025 年四者皆為 Q1（2024 年也都是 Q1）。
          頁面同列 "SJR 2025" 為 1.203、H-Index 69。這是 SJR 分區，不是 JCR；SCImago 不是本刊官方頁面。
    jcr_quartile:
      status: not_published
      checked: 2026-11-13
      src: [journal_metrics, journal_home, overview, mjl]
      note: >-
        官方頁面沒有分區（JCR 或 SJR 都沒有），也沒有學科類別名次。JCR 的類別與分區需登入 Clarivate JCR，本次未查；
        MJL 的 "View profile page" 也標 "* Requires free login."。（此段原為 quartiles 欄的內容，2026-11-13 改放這裡，
        quartiles 改記 SCImago 的 SJR 分區。）
    acceptance_rate:
