    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: journal_home
    role: supporting
    url: https://bpspsychub.onlinelibrary.wiley.com/journal/20448317
    note: >-
      期刊首頁：一句話宗旨、ISSN、主編、最新一期、指標摘要、徵稿。導覽選單（About、Authors、Browse、Special Issues）的
