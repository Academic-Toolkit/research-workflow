--- # research-submission venue record
# 內容擷取自 BPS 期刊在 Wiley Online Library 上的 BJMSP 頁面（bpspsychub.onlinelibrary.wiley.com）、
# Wiley Authors 投稿入口與 Clarivate Master Journal List，2026-11-13。
#
# 抓取方式：Wiley Online Library 全站由 Cloudflare managed challenge 擋 curl
# （HTTP 403 + 約 5.5–5.9 KB 的 "Just a moment..." 頁），本記錄的逐字內容全部用 safari-browser
# 讀 document.body.innerText 取得；各 source 的 fetch 欄位記錄了這件事。
# 因此 verify.py 對這些來源只會回 NEEDS_AGENT，重新驗證要用真實瀏覽器打開頁面比對。
#
# 官方頁面彼此有出入的地方（逐一記在 warnings 與各欄位 conflict 註記）：期刊宗旨的寫法有三種版本、
# Expert Tutorial 的字數上限有兩個數字、編輯部信箱有兩個拼法、程式碼是「期待」還是「非必須」、
# 首次決定時間有「中位 21 天」與「90 天內」兩種說法。

schema_version: 1
id: bps/bjmsp
kind: journal
family: psychometrics-journals
status: active

# ─────────────────────────────────────────────────────────────
# 來源與 provenance。須知集中在 Author Guidelines 一頁，加上 Overview、Open Access、
# Journal Metrics、Data Sharing 與 Calls for Papers 子頁。所有網址皆從期刊首頁的 About、
# Authors 選單與 Author Guidelines 內的連結取得，非推測；期刊首頁網址本身出自 BPS 官網的期刊頁
# （bps_journals，該頁列出 "Find out more about the British Journal of Mathematical and Statistical Psychology"）。
# ─────────────────────────────────────────────────────────────
sources:
  - id: author_guidelines
    role: authoritative
    url: https://bpspsychub.onlinelibrary.wiley.com/hub/journal/20448317/homepage/forauthors.html
    note: >-
      從期刊首頁 Authors 選單的 "Author Guidelines" 點入，頁內標題 "BJMSP AUTHOR GUIDELINES"，分九節：
      Submission、Aims and Scope、Manuscript Categories and Requirements、Preparing the Submission、
      Editorial Policies and Ethical Considerations、Author Licensing、Publication Process After Acceptance、
      Post Publication、Editorial Office Contact Details。首頁的 "Submit a Manuscript" 與 "Submit an article" 也連到同一頁。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        Cloudflare managed challenge：curl 以預設 UA 與 verify.py 的 UA 都回 HTTP 403 加約 5.6–5.8 KB 的
        "Just a moment..." 頁（回應標頭 cf-mitigated: challenge）。本站所有 Wiley Online Library 頁面皆同。
        逐字內容是用 safari-browser 讀 document.body.innerText 取得。
      validity:
        must_contain: "Papers should normally be no more than 5000 words"
        min_extracted_chars: 24000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: overview
    role: authoritative
    url: https://bpspsychub.onlinelibrary.wiley.com/hub/journal/20448317/homepage/productinformation.html
    note: >-
      首頁 About 選單的 "Overview"。載有 Aims and Scope（與 author_guidelines 的 Aims and Scope 寫法不同，見 scope.aims_variants）
      與出版社自述的 Abstracting and Indexing 清單。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁，約 5.7–5.9 KB）。
      validity:
        must_contain: "publishes articles that develop new quantitative methods or models"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: open_access
    role: authoritative
    url: https://bpspsychub.onlinelibrary.wiley.com/hub/journal/20448317/homepage/fundedaccess.html
    note: 首頁 Authors 選單的 "Open Access"（頁內標題 "Article Publication Charges (APCs)"）。APC 金額、授權、稅。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁，約 5.7–5.8 KB）。
      validity:
        must_contain: "If the Open Access option is selected, submissions will be subject to an APC"
        min_extracted_chars: 3600
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: data_sharing
    role: authoritative
    url: https://bpspsychub.onlinelibrary.wiley.com/hub/datasharingfaqs
    note: >-
      author_guidelines 的 "Data Sharing and Data Accessibility Policy" 與 "FAQs" 兩個連結都指向這一頁。
      BPS 全部期刊共用的資料分享 FAQ（不是 BJMSP 專屬）。與 author_guidelines 對「程式碼」的說法不同，見 openness.code。
    fetch:
