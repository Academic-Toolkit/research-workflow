      http_viable: false
      http_failure_mode: 同 author_guidelines（Cloudflare 403 挑戰頁，約 5.5–5.7 KB）。
      validity:
        must_contain: "The BPS expects authors to provide sufficient detail for the reader to understand the nature of the data"
        min_extracted_chars: 4400
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: journal_metrics
    role: supporting
    url: https://bpspsychub.onlinelibrary.wiley.com/journal/20448317/journal-metrics
    note: >-
      首頁 "VIEW ALL METRICS" 與 About 選單的 "Journal Metrics"。全部數值都標 2025 年，由 Wiley 公布；
