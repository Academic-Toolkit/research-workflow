        ahci: false
        web_of_science_core_collection: Science Citation Index Expanded | Social Sciences Citation Index
        additional_indexes: [Current Contents Social And Behavioral Sciences, Essential Science Indicators]
        checked: 2026-11-13
        search_issn: "2044-8317"
        mjl_publisher_string: "WILEY , 111 RIVER ST, HOBOKEN, USA, NJ, 07030-5774"
        src: mjl
