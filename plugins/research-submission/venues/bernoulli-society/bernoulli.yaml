--- # research-submission venue record
# 內容擷取自 Bernoulli Society 官網的期刊頁（bernoullisociety.org，curl 可讀）、IMS 的出版費頁
# （imstat.org，Anubis 挑戰，Safari 讀）、Project Euclid 期刊頁（Incapsula，Safari 讀）、
# 作者套件（e-publications.org、GitHub）與 Clarivate Master Journal List，2026-11-13。
#
# 2026-11-13 擷取時，期刊剛經歷一次規則更動，讀本記錄前先知道三件事（頁面原文見各欄位）：
#   1. 2026-10-21 的公告：期刊暫停收稿到 2026-11-08（原因：投稿量大增，編輯群與出版方要訂新的編輯政策與指引）。
#   2. 2026-11-05 的公告：Aims and Scope 已更新、採用新的 AI 政策；兩頁的 "Last Updated" 都是 2026-11-05。
#   3. AI 政策頁寫明適用於 2026-11-08 起的投稿。
# 所以任何在 2026-11-05 以前讀到的 Bernoulli 須知（含第三方網站與舊版記錄）都可能已過時，
# 這份記錄裡的 scope、AI、篇幅文字都要在投稿前重新對照原頁。

schema_version: 1
id: bernoulli-society/bernoulli
kind: journal
family: statistics-journals
status: active

# ─────────────────────────────────────────────────────────────
# 來源與 provenance。須知分散在 Bernoulli Society 官網的期刊頁（Aims and Scope、Notes for Authors、
# Supplement Instructions、Policy on AI、Editorial Board、Subscription）與 IMS 的出版費頁。
# 網址的來源：society 官網各頁、imstat.org 兩頁、e-publications.org 兩頁、GitHub 文件頁、Euclid 的 author-guidelines
# 與 editorial-office，都是由期刊首頁側欄、Notes for Authors 內連結、Euclid 頁內導覽或作者套件頁內連結取得。
# 三處不是這樣：(1) 擷取開頭曾對一個猜測的網址（.../bernoulli-journal-instructions-for-authors）發出請求，回 404，沒有使用；
# (2) Euclid 的 scope-and-details 與 author-guidelines 是先以猜測的路徑請求的（curl 只拿到挑戰頁），事後由 Euclid 頁內導覽的
# 連結確認路徑相同；(3) raw.githubusercontent.com 的 bj-template.tex、bj-sample.tex 兩個網址是用作者套件頁列出的
# 檔名與 repo 位置組成的，已確認 HTTP 200 且內容是範本。
# ─────────────────────────────────────────────────────────────
sources:
  - id: society_journal_home
    role: supporting
    url: https://www.bernoullisociety.org/publications/bernoulli-journal
    note: >-
      Bernoulli Society 官網的期刊首頁（Publications 選單）。側欄連到 Aims and Scope、Published Papers（Euclid）、
      Forthcoming Papers、Editorial Board、Notes for Authors、Policy on AI、Subscription Information；
      頁內另有一句 "The Bernoulli Journal has updated the Aims and Scope and adopted a new AI policy for authors, reviewers, and editors."
      頁尾 "Last Updated: Wednesday, 11 November 2026 07:37"。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "You can sign up to receive notifications for new issues for Bernoulli"
        min_extracted_chars: 800
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: aims_and_scope
    role: authoritative
    url: https://www.bernoullisociety.org/publications/bernoulli-journal/bernoulli-journal-aims-and-scope
    note: >-
      範圍、強調理論、不適合的稿件類型的正式文字。頁尾 "Last Updated: Thursday, 05 November 2026 12:58"
      （society_news 2026-11-05 的公告說此頁是新更新的）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "is the flagship journal of the Bernoulli Society for Mathematical Statistics and Probability"
        min_extracted_chars: 900
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: notes_for_authors
    role: authoritative
    url: https://www.bernoullisociety.org/publications/bernoulli-journal/bernoulli-journal-notes-for-authors
    note: >-
      規定本體：投稿系統、LaTeX 範本、25 頁上限、title page、summary、keywords、參考文獻、出版費與開放取用、
      版權。頁尾 "Last Updated: Thursday, 05 November 2026 06:19"。頁內連結：Bernoulli template →
      e-publications.org/ims/support/bj-instructions.html；Policy on AI；Supplement Instructions for Accepted Papers；
      出版費 → imstat.org/shop/publication-charge-funding-form/；Copyright, publication charges and offprints →
      imstat.org/journals-and-publications/acceptance-of-papers/。頁尾的聯絡信箱被 JavaScript 遮蔽，
      本紀錄不收錄遮蔽過的信箱；聯絡人見該頁（Kristina Mattson，Mattson Publishing Services）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Bernoulli uses an electronic submission system, EJMS"
        min_extracted_chars: 5500
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: supplement_instructions
    role: authoritative
    url: https://www.bernoullisociety.org/publications/bernoulli-journal/bernoulli-journal-notes-for-authors/supplemental-material
    note: >-
      Notes for Authors 內 "Supplement Instructions for Accepted Papers" 連結的目標（原連結為 /index.php/... 形式，
      同一頁）。頁尾 "Last Updated: Monday, 26 April 2021 14:26"，是這批頁面中最舊的一頁，沒有隨 2026-11-05 的更新改動。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "To prevent a delay in the production process, please follow the three steps below"
        min_extracted_chars: 2500
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: policy_on_ai
    role: authoritative
    url: https://www.bernoullisociety.org/publications/bernoulli-journal/policy-on-ai-3
    note: >-
      期刊頁側欄 "Policy on AI" 與 Notes for Authors 內 "Policy on AI" 連結的目標。頁面開頭寫明適用於
      2026-11-08 起的投稿。頁尾 "Last Updated: Thursday, 05 November 2026 13:03"。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "For Reviewers and Editors"
        min_extracted_chars: 2800
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: publication_charge_form
    role: authoritative
    url: https://imstat.org/shop/publication-charge-funding-form/
    note: >-
      Notes for Authors 說 "Please see https://imstat.org/shop/publication-charge-funding-form/ for the current rates"。
      表單列出各期刊的出版費；Bernoulli Journal 在 "Print/Gated Electronic Access Journal" 清單內。
      這是 IMS 全站頁面，不是 Bernoulli Society 的頁面。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        imstat.org 全站由 Anubis proof-of-work 挑戰保護：curl 回 HTTP 200 + 7356 bytes 的挑戰頁（2026-11-13 實測，
        本頁與 acceptance_of_papers 皆 7356 bytes，是同一個挑戰頁）。須以 Safari 開啟、等 JS 解完挑戰後讀 innerText。
      validity:
        must_contain: "The IMS collects publication charges for the journals listed below"
        min_extracted_chars: 2000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: acceptance_of_papers
    role: authoritative
    url: https://imstat.org/journals-and-publications/acceptance-of-papers/
    note: >-
      Notes for Authors 內 "Copyright, publication charges and offprints" 連結的目標。IMS 各刊共用頁：
      版權轉讓表單、出版費金額、offprint。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 publication_charge_form（Anubis 挑戰頁，HTTP 200 + 7356 bytes）。
      validity:
        must_contain: "Following the acceptance of papers in for publication in IMS journals"
        min_extracted_chars: 2200
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: society_publications
    role: supporting
    url: https://www.bernoullisociety.org/publications
    note: >-
      主選單 Publications 的總頁。列出學會的 "Official publications"（Bernoulli、Stochastic Processes and their Applications、
      SpringerBriefs in Probability and Mathematical Statistics）與 "Bernoulli Society co-sponsored publications"
      （Electronic Communications in Probability、Electronic Journal of Probability、Electronic Journal of Statistics、
      Probability Surveys、Statistics Surveys、ALEA、SemStat Elements）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Official publications of the Bernoulli Society"
        min_extracted_chars: 600
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: society_news
    role: supporting
    url: https://www.bernoullisociety.org/news
    note: >-
      學會新聞頁（主選單 News & Calls）。載有 2026-10-21 "Temporary Submission Pause" 與 2026-11-05
      "A Message from the Editor of the Bernoulli Journal" 兩則公告。這是滾動更新的頁面，舊公告會被擠出去，
      所以 must_contain 用的是固定的區塊標題；hash 會經常變動，CHANGED 不代表須知改版。
      各則公告的 "Details" 沒有獨立連結，全文就在這一頁。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Announcements and News"
        min_extracted_chars: 4000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: editorial_board
    role: supporting
    url: https://www.bernoullisociety.org/publications/bernoulli-journal/bernoulli-journal-editorial-board
    note: >-
      頁尾 "Last Updated: Monday, 11 May 2026 07:38"。列主編、副編輯（51 位）與歷任主編。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Current Editorial Staff"
        min_extracted_chars: 1200
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: subscription
    role: supporting
    url: https://www.bernoullisociety.org/publications/bernoulli-journal/bernoulli-journal-subscription
    note: >-
      ISSN、刊期（每年 2、5、8、11 月）、會員與機構訂閱價。頁尾 "Last Updated: Monday, 29 December 2025 09:28"。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "The ISSN number of the Bernoulli journal is"
        min_extracted_chars: 2200
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: euclid_scope
    role: supporting
    url: https://projecteuclid.org/journals/bernoulli/scope-and-details
    note: >-
      Project Euclid 的 "SCOPE & DETAILS" 分頁。期刊首頁側欄 "Published Papers" 連到 http://projecteuclid.org/bj，
      轉到 /journals/bernoulli。Print ISSN、頻率、存取政策與 metrics 只在這一頁出現。
      頁面寫 "Current: Nov 2026 : Volume 32 Issue 4"。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        Incapsula bot 挑戰：curl（預設 UA 與 Safari UA）回 HTTP 200 + 1050–1161 bytes 空殼（iframe 指向 /_Incapsula_Resource）。
        Safari 在 2026-11-13 第一次開啟時也只得到挑戰頁 iframe 內的文字 "Additional security check is required" 與
        "If the problem continues, please try again in a few minutes."；幾分鐘後重新載入就拿到真實頁面。
      validity:
        must_contain: "Articles older than 3 years are open"
        min_extracted_chars: 1200
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: euclid_author_guidelines
    role: supporting
    url: https://projecteuclid.org/journals/bernoulli/author-guidelines
    note: >-
      Euclid 的 "AUTHOR GUIDELINES" 分頁，全頁只有一句 "Author guidelines and submission instructions for Bernoulli are
      available on the journal's website."，沒有實質規定。同站 "EDITORIAL OFFICE" 分頁
      （/journals/bernoulli/editorial-office）也只有一句 "View Bernoulli’s full editorial office on the journal's website."，
      2026-11-13 兩頁都讀過。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 euclid_scope（Incapsula 空殼，HTTP 200 + 1165 bytes）。
      validity:
        must_contain: "Author guidelines and submission instructions for Bernoulli are available on the journal's website"
        min_extracted_chars: 800
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: ejms_portal
    role: supporting
    url: https://www.e-publications.org/ims/submission/
    note: >-
      Notes for Authors 內的投稿入口（頁面寫 www.e-publications.org/ims/submission/）。未登入時轉址到
      /ims/submission/index/login，2026-11-13 curl 取得 HTTP 200、6420 bytes 的 EJMS 登入頁（IMS 各刊共用，
      頁面本身沒有出現 Bernoulli 字樣）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "EJMS - Electronic Journal Management System"
        min_extracted_chars: 300
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: template_page
    role: supporting
    url: https://www.e-publications.org/ims/support/bj-instructions.html
    note: Notes for Authors 內 "Bernoulli template" 連結的目標（VTeX 的 Bernoulli LaTeX 作者套件頁），連到 GitHub 與文件頁。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "LaTeX Author Package for the publications in Bernoulli Society journal"
        min_extracted_chars: 300
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: template_docs
    role: supporting
    url: https://vtex-soft.github.io/texsupport.ims_supported-bj/
    note: 作者套件說明（imsart.cls、imsart.sty、bj-template.tex、bj-sample.tex/pdf、spr-ims-nameyear.bst、spr-ims-number.bst）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "bj-template.tex - the main template file"
        min_extracted_chars: 1200
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: bj_template_tex
    role: supporting
    url: https://raw.githubusercontent.com/vtex-soft/texsupport.ims_supported-bj/master/bj-template.tex
    note: >-
      作者套件 repo（https://github.com/vtex-soft/texsupport.ims_supported-bj ，由 template_page 連入）中的投稿範本。
      「以單一 .tex 檔投稿、不用 \input」與「補充材料不得只以外部連結提供」的說明只出現在這份範本的註解裡，
      是範本層級的說明，不是期刊頁面規定。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Submit your LaTeX"
        min_extracted_chars: 4000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: bj_sample_tex
    role: supporting
    url: https://raw.githubusercontent.com/vtex-soft/texsupport.ims_supported-bj/master/bj-sample.tex
    note: >-
      同一 repo 的範例檔（Notes for Authors 稱 bj-sample.tex/.pdf 是準備稿件的說明）。摘要 "not longer than 200 words"
      的文字出現在這份範例的 abstract 環境；Notes for Authors 本身也寫 summary 不超過 200 字。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "than 200 words"
        min_extracted_chars: 12000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

  - id: mjl
    role: supporting
    url: https://mjl.clarivate.com/home
    note: >-
      Clarivate Master Journal List。JS 單頁應用，結果頁網址不帶查詢字串，無法用網址重現；只能在頁內於 #search-box
      填 ISSN（本次填 1350-7265）、按 #search-button 後讀結果列。結果列的 "View profile page" 需要免費登入
      （頁面標 "* Requires free login."），所以 JCR 的類別與分區沒有取得。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 取 /home 只拿到 SPA 空殼；查詢結果需在頁內操作（見 note）"
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13

  - id: scimago
    role: supporting
    url: https://www.scimagojr.com/journalsearch.php?q=4700152871&tip=sid&clean=0
    note: >-
      SCImago（SJR）期刊頁。sid 4700152871 由 journalsearch.php?q=1350-7265&tip=iss&clean=0 的搜尋結果取得（只列 "Bernoulli" 一筆，
      出版者標 "Bernoulli Society for Mathematical Statistics and Probability"）。curl 回 403 Cloudflare 挑戰頁，以 Safari 讀到約 20.4 K 字元。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "403, Cloudflare challenge page (~5.7 KB)"
      validity:
        must_contain: "The set of journals have been ranked according to their SJR and divided into four equal groups"
        min_extracted_chars: 12000
    snapshot:
      fetched_at: 2026-11-13
      last_verified_at: 2026-11-13
      extracted_sha256: null

