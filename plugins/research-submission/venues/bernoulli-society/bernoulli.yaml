# ─────────────────────────────────────────────────────────────
warnings:
  - >-
    期刊剛改版：2026-10-21 公告暫停收稿到 2026-11-08（"to handle the substantial increase in submissions"），2026-11-05 更新
    Aims and Scope 並採用新的 AI 政策，Notes for Authors 與兩個政策頁的 "Last Updated" 都是 2026-11-05。
    2026-11-05 以前的任何 Bernoulli 須知（含記憶與第三方網站）都可能過時；投稿前重讀 aims_and_scope、notes_for_authors、policy_on_ai 三頁。
  - >-
    範圍以理論為主："The main emphasis of Bernoulli is on theoretical work." 並明寫 "Mere technical execution without clear
    motivation, without new understanding, or without a transferable idea would not be suitable for the journal."
    投稿前要能在引言前段交代動機、結果概觀與關鍵想法（"clearly and early in the paper"）。Euclid 頁仍寫 "both theoretical and applied work"，
    與新版 Aims and Scope 不完全一致。
  - >-
    篇幅 "will generally be limited to 25 pages in the Bernoulli template, including references but excluding the acknowledgments section"；
    要超過須在 EJMS 的 "comments to the editor" 說明理由，由編輯決定；同段警告 "Failing to comply with these guidelines might result in
    immediate rejection." 多出的技術推導與數值結果放補充材料。
  - >-
    2026-11-08 起的投稿，acknowledgments 一定要有 AI 使用聲明，沒用 AI 也要寫明（"Even if no AI tools were used, authors must include an
    AI statement clarifying this."）；AI 不得列為作者，嚴重違規可能被限制日後投稿。
  - >-
    補充材料與主文分開成不同檔案、不排版、照原樣張貼；主文不可用 \ref 指向補充材料內的物件；所有補充檔案（含資料與程式碼）都要隨文
    放在 Euclid，不能只放 GitHub 連結。未發表或不易取得的被引用論文，投稿時就要作為補充檔案上傳。
  - >-
    審查模式（single 或 double anonymised）與首次決定時間、錄取率，官方頁面都沒有寫；title page 要列全部作者的全名、單位與地址。
    出版費是自願的 USD 1,295（錄取後才請求，付全額才開放取用）；官方頁面沒有提到投稿費。
    Euclid 頁的 IF 1.393 與名次 43/123 未標年度，分母與本庫 2025 年的 Statistics & Probability 數字（170 本）不同，很可能是舊版次，不可與其他刊的 2025 數字並排。
