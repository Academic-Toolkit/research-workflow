    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 與 Python urllib 皆回 HTTP 403，832,805 bytes 的 ScienceDirect 錯誤殼"
      validity:
        must_contain: "algorithmic treatment of all types of symbolic objects"
        min_extracted_chars: 1200
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: journal_home
    role: authoritative
    url: https://www.sciencedirect.com/journal/journal-of-symbolic-computation
    note: >-
      期刊首頁：CiteScore、Impact Factor、APC、審稿時程四項中位數、主編、最新文章、Calls for papers、ISSN。
      指標旁的 "Info on ..." 按鈕點開後才有定義：Impact Factor 的說明寫 "2025 Journal Citation Reports (Clarivate Analytics, 2026)"；
