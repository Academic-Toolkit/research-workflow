--- # research-submission venue record
# 內容擷取自 ScienceDirect 上 Journal of Symbolic Computation 的官方頁面（期刊首頁、aims and scope、journal insights、
# guide for authors、open access information、editorial board）、SCImago、Clarivate Master Journal List，2026-10-25。
# 讀取方式：ScienceDirect 的 HTML 頁用 Safari 讀（document.body.innerText）；curl 與 Python urllib 對所有 ScienceDirect
# 網址都回 403（每個網址都是同樣的 832,805 bytes 錯誤殼），SCImago 回 403 挑戰頁，MJL 是 JS 單頁應用，三者都只能用瀏覽器讀。
# 指標旁的小圖示（Info on Impact Factor 等）要點開才看得到定義與年份：2026-10-25 逐一點開讀過，結果記在 identity.metrics。
# Safari 讀頁時畫面右上角會顯示瀏覽器登入者的帳號名稱，這是讀頁環境的產物，不是期刊資訊，本記錄不採用。
# 這本刊沒有 Instructions for Authors PDF：投稿規定全部寫在 guide-for-authors 這一個 HTML 頁（頁內有「Print Guide as PDF」按鈕）。
# 收錄緣由：語料庫缺這本；補錄符號計算（computer algebra）類期刊，供 choose-venue 比較用。
# 本記錄只放期刊公開規定，不含任何投稿者或稿件資訊。

schema_version: 1
id: elsevier/journal-of-symbolic-computation
kind: journal
family: symbolic-computation-journals
status: active

sources:
  - id: guide_for_authors
    role: authoritative
    url: https://www.sciencedirect.com/journal/journal-of-symbolic-computation/publish/guide-for-authors
    note: >-
      投稿規定本體：About the journal（aims and scope、Open Archive）、Peer review、Ethics and policies（含 Preprints、
      Declaration of generative AI use）、Writing and formatting（File format、LaTeX、Title page、Abstract、Keywords、Highlights、
      Math formulae、Tables、Figures、Supplementary material、Video）、Research data、Article structure、References、Submitting
      your manuscript 都在這一個頁面（Safari 讀到約 55 KB 文字）。頁面沒有列出文章類型，也沒有正文字數或頁數上限。
      這是 Elsevier 的標準版面，多數段落是 Elsevier 全品牌通用文字（本記錄未逐刊比對）；文中明寫 "this journal" 的有：
      single anonymized 審稿、Open Archive、Research data 的 Option C、SSRN 預印本張貼服務、作者變更政策、編輯與審稿人不得把
      未發表稿上傳到生成式 AI 工具。
      頁面是動態產生的，hash 在 Elsevier 改版時一定會變；CHANGED 時要人工找出變動的段落。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 與 Python urllib 皆回 HTTP 403，832,805 bytes 的 ScienceDirect 錯誤殼（本刊六個 ScienceDirect 網址大小全部相同）"
      validity:
        must_contain: "This journal follows a single anonymized review process"
        min_extracted_chars: 20000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: aims_and_scope
    role: authoritative
    url: https://www.sciencedirect.com/journal/journal-of-symbolic-computation/about/aims-and-scope
    note: >-
      兩段文字加一份 "Research Areas Include" 清單（六項）。guide for authors 的 About the journal 段重複同一份文字。
