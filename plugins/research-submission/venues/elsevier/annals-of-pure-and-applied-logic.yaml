    Crossref（api.crossref.org/journals/0168-0072）與 OpenAlex 也回同一組 ISSN（輔助確認，非來源）。
  homepage: https://www.sciencedirect.com/journal/annals-of-pure-and-applied-logic
  hosting_platform: {name: ScienceDirect, url: "https://www.sciencedirect.com/journal/annals-of-pure-and-applied-logic"}
