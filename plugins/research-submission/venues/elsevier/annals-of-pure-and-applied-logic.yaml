      value: 0.737
      year: 2025
      as_of: 2026-10-25
      src: scimago
    h_index: {value: 55, as_of: 2026-10-25, src: scimago, note: SCImago 頁面所列}
    quartiles:
      - {system: SJR, category: Logic, quartile: Q1, year: 2025, as_of: 2026-10-25, src: scimago,
         note: "SCImago 頁面（學科領域 Mathematics → Logic）列 1999–2025 逐年分區：2008、2009、2012 為 Q2，其餘各年 Q1；頁面不給名次"}
    jcr_quartile:
      status: not_found
      checked: 2026-10-25
      note: >-
        JCR 分區與名次需登入 Clarivate JCR，本次未查。ScienceDirect 頁面只列 IF（0.8），沒有列分區。
        上方 quartiles 是 SJR 分區，不是 JCR。
    acceptance_rate:
      status: not_published
      checked: 2026-10-25
      src: journal_insights
      note: Journal Insights、期刊首頁、Guide for authors 皆無錄取率；也沒有拒絕率。
    time_to_first_decision:
      value: 12
      unit: days
      statistic: median
      as_of: 2026-10-25
      src: journal_insights
      basis: >-
        Journal Insights 的 "Submission to first decision"，(i) 說明原文："The median number of days from submission to first
        decision (desk accept or send the paper to review or desk reject)."。含不送外審的直接決定（desk reject），
        所以這個數字大半反映初篩速度，不是外審結果的時間。頁面沒有標統計期間或年度。
    time_submission_to_decision_after_review:
      value: 224
      unit: days
      statistic: median
      as_of: 2026-10-25
