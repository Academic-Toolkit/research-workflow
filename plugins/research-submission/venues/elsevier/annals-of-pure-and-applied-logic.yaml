--- # research-submission venue record
# 內容擷取自 Elsevier／ScienceDirect 官方頁面、SCImago 與 Clarivate Master Journal List，2026-10-25。
# ScienceDirect（sciencedirect.com）對 curl 回 HTTP 403 + 832,805 bytes 的挑戰頁（所有子頁大小完全相同），
# 規定本體只能用 Safari 讀；elsevier.com 的政策頁 curl 讀得到。各 source 的 fetch 欄位記錄了這件事。
# 收錄緣由：數理邏輯領域期刊的投稿標的評估（choose-venue）。
# 本記錄只放期刊公開規定，不含任何特定稿件或合作者資訊。

schema_version: 1
id: elsevier/annals-of-pure-and-applied-logic
kind: journal
family: logic-journals
status: active

# ─────────────────────────────────────────────────────────────
# 來源與 provenance。須知集中在 ScienceDirect 的 Guide for authors 一頁（含 Aims and scope、Peer review、
# 倫理與政策、格式、投稿檢核表）；開放取用與 APC 在 Open access information 頁；審稿時程與指標在
# Journal Insights 頁；Elsevier 全公司層級的 preprint／分享規定在 elsevier.com 的 Article sharing 頁。
# 所有 sciencedirect.com 子頁網址皆由期刊首頁的導覽連結取得，非推測。
# 唯一例外：試過 /about/call-for-papers 被導回期刊首頁（該路徑不存在），真正的頁面是 /special-issues。
# ─────────────────────────────────────────────────────────────
sources:
  - id: guide_for_authors
    role: authoritative
    url: https://www.sciencedirect.com/journal/annals-of-pure-and-applied-logic/publish/guide-for-authors
    note: >-
      投稿規定本體：Aims and scope、Peer review、倫理與政策（含 GenAI、preprint）、檔案格式、
      摘要與關鍵字、參考文獻、研究資料、cover letter、投稿檢核表。頁面沒有標修訂日期。
      頁面沒有文章類型清單，也沒有正文字數或頁數上限。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        sciencedirect.com 對 curl 回 HTTP 403 + 832,805 bytes（挑戰頁）。2026-10-25 實測 6 個不同
        ScienceDirect 子頁（guide-for-authors、about/insights、publish/open-access-options、
        about/editorial-board、about/aims-and-scope、special-issues）以及期刊首頁，回應大小全部相同，
        是決定性證據：同一個挑戰頁。須以 safari-browser 開啟後讀 document.body.innerText
        （本頁約 48,670 字元）。
      validity:
        must_contain: "This journal follows a single anonymized review process"
        min_extracted_chars: 30000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: aims_and_scope
    role: authoritative
    url: https://www.sciencedirect.com/journal/annals-of-pure-and-applied-logic/about/aims-and-scope
    note: >-
      Aims and scope 全文（單段）。與 Guide for authors 的 "Aims and scope" 段、期刊首頁 About the journal
      段（被截斷，連到此頁）、SCImago 的 Scope 段逐字相同。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 guide_for_authors（403 + 832,805 bytes 挑戰頁）
      validity:
        must_contain: "of significant interest to a substantial number of logicians"
        min_extracted_chars: 700
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: journal_insights
    role: authoritative
    url: https://www.sciencedirect.com/journal/annals-of-pure-and-applied-logic/about/insights
    note: >-
      Journal Insights：ISSN、學科領域、CiteScore、Impact Factor、APC、四項審稿時程中位數、收錄清單。
      指標旁的 (i) 按鈕展開後的定義文字（Impact Factor 的 JCR 年度、時程的統計口徑）只在點擊後才出現在 DOM，
      innerText 讀不到，需在頁內點 "Info on Impact Factor" 等按鈕。頁面沒有標時程的統計期間。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 guide_for_authors（403 + 832,805 bytes 挑戰頁）
      validity:
        must_contain: "Submission to first decision"
        min_extracted_chars: 1200
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: open_access_options
    role: authoritative
    url: https://www.sciencedirect.com/journal/annals-of-pure-and-applied-logic/publish/open-access-options
    note: 開放取用選項、可選授權、APC 金額、Open Archive（48 個月）、自存（self-archiving）禁運期。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 guide_for_authors（403 + 832,805 bytes 挑戰頁）
      validity:
        must_contain: "The Article Publishing Charge for this journal is"
        min_extracted_chars: 5000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: elsevier_article_sharing
    role: authoritative
    url: https://www.elsevier.com/about/policies-and-standards/sharing
    note: >-
      Elsevier 全公司的 Article sharing 政策。Guide for authors 的 Preprints 段說 "Authors may share preprints in line
      with Elsevier's article sharing policy"，所以 preprint 規定的本體在此頁。頁面提醒
      "Some society-owned titles and journals that operate double-anonymized peer review have different preprint
      policies"；本刊是 single anonymized，且 Guide for authors 沒有另訂不同規定。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Authors can share their preprint anywhere at any time"
        min_extracted_chars: 5000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: journal_home
    role: supporting
    url: https://www.sciencedirect.com/journal/annals-of-pure-and-applied-logic
    note: >-
      期刊首頁：CiteScore、Impact Factor、APC、審稿時程（與 journal_insights 相同）、協調編輯、最新文章、特刊清單。
      "Submit your article" 連到 https://submit.elsevier.com/APAL ，"Guide for authors"、"Order journal" 等導覽連結
      也從這裡取得。文章列表的標籤（Research article、Open access、Abstract only）見 requirements.article_type_labels_observed。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 guide_for_authors（403 + 832,805 bytes 挑戰頁）
      validity:
        must_contain: "Article publishing options"
        min_extracted_chars: 2500
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: editorial_board
    role: supporting
    url: https://www.sciencedirect.com/journal/annals-of-pure-and-applied-logic/about/editorial-board
    note: Coordinating Editors、Editors（含各自列出的專長）、Editors Emeriti。cover letter 須指名一位 preferred handling editor，所以名單與專長有用。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 guide_for_authors（403 + 832,805 bytes 挑戰頁）
      validity:
        must_contain: "Coordinating Editors"
        min_extracted_chars: 2000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: special_issues
    role: supporting
    url: https://www.sciencedirect.com/journal/annals-of-pure-and-applied-logic/special-issues
    note: 期刊的特刊與文章集合清單，頁面只列已出版者（最近一筆 Last update October–November 2024）；沒有列開放中的徵稿。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 guide_for_authors（403 + 832,805 bytes 挑戰頁）
      validity:
        must_contain: "This page contains a list of all available article collections"
        min_extracted_chars: 4000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: calls_for_papers_browse
    role: supporting
    url: https://www.sciencedirect.com/browse/calls-for-papers
    note: >-
      ScienceDirect 全站的特刊徵稿總覽（2026-10-25 頁首 "Browse 2824 calls for papers for special issues"，
      頁內文字載入 2,754 筆 "Submission deadline"）。頁面內容每天都在變（徵稿增減），hash 不穩定，
      只用來回答「查過，沒有看到本刊的徵稿」，不要用 verify 的 hash 差異判斷它是否 CHANGED。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 guide_for_authors（sciencedirect.com 挑戰頁）
      validity:
        must_contain: "calls for papers for special issues"
        min_extracted_chars: 100000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: submission_portal
    role: supporting
    url: https://submit.elsevier.com/APAL
    note: >-
      期刊的投稿入口（由期刊首頁 "Submit your article" 連入）。Elsevier 的新投稿服務 "Submit your manuscript"：
      "Start a submission" 與 "Complete a transfer" 兩個入口；送出後在 Editorial Manager 管理稿件
      （頁內連到 https://www.editorialmanager.com/APAL ）。入口頁列出投稿前要準備：投稿檔案、
      全部作者與共同作者的資料（含 email 與 affiliation）、資助者資料。本記錄沒有登入或開始投稿。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        curl 回 HTTP 200 + 56,268 bytes，但是 React 單頁應用的空殼，抽取後只有 "Submit your manuscript"
        與 "You need to enable JavaScript to run this app."；說明文字由 JS 繪製，須用瀏覽器讀。
      validity:
        must_contain: "Use this service to submit to Annals of Pure and Applied Logic"
        min_extracted_chars: 500
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: scimago
    role: supporting
    url: https://www.scimagojr.com/journalsearch.php?q=24726&tip=sid&clean=0
    note: >-
      SCImago（SJR）期刊頁：SJR、分區（1999–2025 逐年）、H-index、涵蓋年份、Scope（與期刊現行 Aims and scope 相同）。
      網址的 q=24726 是 SCImago 的 source id，由 ISSN 搜尋結果頁
      （journalsearch.php?q=01680072&tip=iss）的唯一結果連結取得。頁面上 "How to publish in this journal" 列了
      一位編輯的 email，本記錄不收。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "403, 5586-byte challenge page"
      validity:
        must_contain: "Subject Area and Category"
        min_extracted_chars: 8000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: mjl
    role: supporting
    url: https://mjl.clarivate.com/home
    note: >-
      Clarivate Master Journal List。JS 單頁應用，結果頁網址不帶查詢字串，無法用網址重現；
      只能在頁內於 #search-box 填 ISSN、按 #search-button 後讀結果列。
      curl 取 /home 只拿到空殼，沒有任何期刊資料。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "200 但只有 SPA 空殼，查詢結果需在頁內操作"
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25}

