      basis: >-
        "Submission to decision after review"，(i) 說明原文："For papers that are sent to review, the median number of days
        from submission to receipt of first editor decision."。只計有送外審的稿件。頁面沒有標統計期間或年度。
    time_submission_to_acceptance:
      value: 391
      unit: days
      statistic: median
      as_of: 2026-10-25
      src: journal_insights
      basis: >-
        "Submission to acceptance"，(i) 說明原文："For accepted papers, the median number of days from submission to receipt
        of accept decision."。只計最後被接受的稿件（看不到被拒稿）。頁面沒有標統計期間或年度。
    time_acceptance_to_online_publication:
