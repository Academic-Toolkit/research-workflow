requirements:
  refresh: {check_every: P6M, method: extracted_hash_diff}

  scope:
    aims_verbatim: >-
      The Review of Symbolic Logic is designed to cultivate research on the borders of logic, philosophy, and the sciences, and to support substantive
      interactions between these disciplines. The journal welcomes submissions in any of the following areas, broadly construed:
    areas_verbatim_cup:
      - "The general study of logical systems and their semantics, including non-classical logics and algebraic logic;"
      - "Philosophical logic and formal epistemology, including interactions with decision theory and game theory;"
      - "The history, philosophy, and methodology of logic and mathematics, including the history of philosophy of logic and mathematics;"
      - "Applications of logic to the sciences, such as computer science, cognitive science, and linguistics; and logical results addressing foundational issues in the sciences."
    areas_verbatim_asl:
      - "The general study of logical systems and their semantics, including non-classical logics and algebraic logic"
      - "Philosophical logic and formal epistemology, including interactions with decision theory and game theory"
      - "The history, philosophy, and methodology of logic and mathematics, including the history of philosophy of logic and mathematics"
      - "Applications of logic to the sciences, such as computer science, cognitive science, and linguistics"
      - "Logical results addressing foundational issues in the sciences"
    aims_closing_verbatim: "The Review welcomes submissions in all these areas. The Review began publication in June 2008."
    aims_verbatim_note: >-
      aims_verbatim 與 areas_verbatim_cup 是 cup_preparing 的文字（項目符號 "- " 在此拆成清單；cup_about 與 cup_home 的第一項在 "semantics," 之後沒有空格，其餘相同；
      cup_authorinstr 同）。areas_verbatim_asl 是 asl_rsl 的文字：領域清單相同，只是把 Cambridge 的第四項拆成兩項（"Applications of logic to the sciences ..." 與
      "Logical results addressing foundational issues in the sciences"），ASL 版的引言句是 "The Review welcomes submissions in any of the following areas, broadly construed:"
      （沒有 "The journal welcomes" 那一句）。aims_closing_verbatim 在 cup_about、cup_preparing、cup_home 出現；asl_rsl 只有 "The Review began publication in June 2008."
    src: [cup_about, cup_home, cup_preparing, cup_authorinstr, asl_rsl, scimago]
    audience:
      statement: >-
        "designed to cultivate research on the borders of logic, philosophy, and the sciences, and to support substantive interactions between these disciplines."
        官網沒有寫 "accessible to a wide audience" 之類的要求（BSL 才有）。
      src: [cup_about, asl_rsl]
      reading: >-
        讀者是跨越邏輯、哲學與科學邊界的研究者；官網沒有要求稿件寫給整個邏輯社群讀（與 BSL 不同），也沒有要求是數學或哲學的某一邊。
    submission_invitation:
      statement: >-
        asl_guidelines："All papers should be submitted via the RSL EditFlow Management System. Authors should follow the specific procedures indicated there."
        cup_preparing：入口 "Proceed to submission system"（https://ef.msp.org/submit/asl_rsl）。
      src: [asl_guidelines, cup_preparing, editflow]
      reading: >-
        官網寫成一般主動投稿，沒有任何一頁寫 RSL 是邀稿制，也沒有要求投稿前先詢問編輯。
        （唯一的 "invited" 出現在 EditFlow：被拒稿件的修訂版除非 "explicitly invited to re-submit"，不得重投。）
    areas:
      - id: logical_systems_and_semantics
        statement: '"The general study of logical systems and their semantics, including non-classical logics and algebraic logic"（原文）'
        src: [cup_about, asl_rsl]
      - id: philosophical_logic_and_formal_epistemology
        statement: '"Philosophical logic and formal epistemology, including interactions with decision theory and game theory"（原文）'
        src: [cup_about, asl_rsl]
      - id: history_philosophy_methodology_of_logic_and_mathematics
        statement: '"The history, philosophy, and methodology of logic and mathematics, including the history of philosophy of logic and mathematics"（原文）'
        src: [cup_about, asl_rsl]
      - id: applications_to_the_sciences
        statement: '"Applications of logic to the sciences, such as computer science, cognitive science, and linguistics"（原文）'
        src: [cup_about, asl_rsl]
      - id: foundational_logical_results_in_the_sciences
        statement: '"logical results addressing foundational issues in the sciences"（cup_about，併在上一項之後）／"Logical results addressing foundational issues in the sciences"（asl_rsl，獨立一項）'
        src: [cup_about, asl_rsl]
    mathematical_vs_philosophical:
      statement: >-
        官網沒有任何一句話說明純數學的邏輯稿件與哲學稿件各自適不適合 RSL，也沒有說比例。最接近的官方敘述有三處：
        (a) asl_journals 對三本期刊的定位——RSL："focuses on original scholarly work in philosophical and non-classical logics and their applications,
        history and philosophy of logic, and philosophy and methodology of mathematics"，JSL："focuses on original research in mathematical logic and its applications"。
        (b) 範圍清單第 1 項含 "non-classical logics and algebraic logic"，第 4 項含 "logical results addressing foundational issues in the sciences"；
        (c) asl_appeals："The editors of ASL journals have wide discretion about ... the appropriateness of the subject matter for our journal ... Their decisions about such matters are not subject to appeal."
      src: [asl_journals, cup_about, asl_appeals]
      reading: >-
        範圍清單同時包含邏輯系統與語意（含代數邏輯）的一般研究，以及哲學與歷史方向；官網沒有排除數學性的稿件，也沒有保證收。
        asl_staff 頁各編輯名下列出的領域中，哲學方向最多（Philosophical logic、Philosophy of logic／mathematics／language 等），
        也有數學方向（Algebraic logic、Definability theory、Axiomatic methods、Proof theory、Algebraic and categorical logic、Modal and temporal logic），見 identity.editors.members。
        這是對編輯名單的觀察，不是官方的收稿規則。
    observed_recent_articles:
      as_of: 2026-10-27
      src: cup_home
      note: >-
        不是投稿規定：期刊首頁 "Recently published articles"（First View）當日列出的八篇標題，用來看實際刊出的主題範圍；"Most read" 與 "Most cited" 各列一篇。
        首頁內容會隨時間變動。
      first_view_titles:
        - "RECONSIDERING GÖDEL'S DOCTRINE: INDEPENDENCE RESULTS（Patrick J. Ryan）"
        - "THE CARDINALITIES OF INTERVALS OF EQUATIONAL THEORIES AND LOGICS（Juan Aguilera, Nick Bezhanishvili, Tenyo Takahashi）"
        - "ON THE CHOICE OF GÖDEL NUMBERINGS（Léon Probst）"
        - "THE PROOF IS IN THE CHECKING（Nicholas J. J. Smith）"
        - "ON SELF-DISOBEDIENT LOGICS（Bas Kortenbach）"
        - "KRIPKE COMPLETENESS FOR PREDICATE MODAL LOGICS OF BOUNDED ALTERNATIVITY: FIRST STEPS（Valentin Shehtman, Dmitry Shkatov）"
        - "MAXIMAL NEIGHBORHOOD UNSOUND CONGRUENTIAL MODAL LOGICS（Krzysztof Aleksander Krawczyk）"
        - "WHEN DO BIRKHOFF OBJECTS SEPARATE?（Francisco Marmolejo, Matías Menni）"
      most_read: "SATISFACTION IS NOT ABSOLUTE（Joel David Hamkins, Ruizhi Yang），Volume 19, Issue 1"
      most_cited: "THE LOGIC OF JUSTIFICATION（Sergei Artemov），Volume 1, Issue 4"
    acceptance_criteria:
      statement: >-
        官網沒有給明確的錄取判準。與錄取有關的官方文字只有：(1) 篇幅與年錄取量的限制（見 length 與 identity.metrics.annual_acceptance_target）；
        (2) 較長的稿件 "will in general be judged by higher standards"；(3) asl_appeals 的編輯裁量條款（"the basic expository level of the submission and its intelligibility
        to our audience, the appropriateness of the subject matter for our journal and the quality or importance of the results presented"）。
      src: [asl_guidelines, editflow, cup_about, asl_appeals]
    out_of_scope_hints:
      - case: 重複投稿被判在範圍外、由 AI 大量生成的稿件、宣稱解決重大公開問題卻沒有新方法或沒有處理現有文獻的稿件
        statement: >-
          "If your submissions repeatedly are outside the scope of the journal or do not meet scholarly standards, your ability to submit
          might be limited or suspended. This includes (for example) manuscripts generated largely by AI and manuscripts asserting
          resolutions of major open problems without valid new methods or proper engagement with the current research literature."
        src: editflow
        reading: >-
          這是 EditFlow Step 0 的 Author Agreement，寫的是後果（repeatedly 才限制投稿資格），並以 "for example" 舉例；
          不是範圍條款，但屬於官方明文勸阻的稿件類型
      - case: 編輯對主題是否適合本刊的裁量
        statement: >-
          "The editors of ASL journals have wide discretion about general concerns such as the basic expository level of the submission and
          its intelligibility to our audience, the appropriateness of the subject matter for our journal and the quality or importance of
          the results presented. ... Their decisions about such matters are not subject to appeal."
        src: asl_appeals
        reading: 主題適不適合、呈現層次、對讀者的可懂程度、結果的品質與重要性，編輯有廣泛裁量，且不可申訴
      - case: 與會議論文集版本差異不大的完整版
        statement: >-
          "Full versions of important papers that have previously been published in conference proceedings are eligible for publication,
          provided that the submitted paper extends the prior publication in a significant way."
        src: asl_guidelines
        reading: 是條件（significantly extend），不是排除
      - case: 非英文稿件
        statement: '"As of January 1, 2023 only papers in English will be considered for publication."'
        src: asl_guidelines
        reading: 明文限定英文
      - case: 超過預設篇幅的稿件
        statement: >-
          "longer submissions will be considered, although longer submissions will in general be judged by higher standards. Contributors are given the opportunity
          to explain, in the cover letter, if the rationale for the longer submission relates to specifics of the content, topic, or area."
        src: asl_guidelines
        reading: 不是排除，是更高的標準；見 length
    explicit_exclusions:
      status: not_published
      checked: 2026-10-27
      src: [cup_about, cup_preparing, asl_rsl, asl_guidelines, editflow]
      note: >-
        各頁都沒有 "we do not publish X" 形式的主題排除句。最接近的是上列的 may be limited or suspended／higher standards／provided that 措辭，
        以及 EditFlow 對 AI 大量生成稿件與宣稱解決重大公開問題稿件的警告。
    related_asl_journals:
      statement: >-
        ASL 另有兩本期刊定位不同：Journal of Symbolic Logic 收 "original research in mathematical logic and its applications"；
        Bulletin of Symbolic Logic 收 "articles of general interest to the logic community in all the areas of logic as well as communications of important new developments"。
        RSL 的定位是 "original scholarly work in philosophical and non-classical logics and their applications, history and philosophy of logic, and philosophy and methodology of mathematics"。
      src: asl_journals

  # RSL 的官方文字只描述一種稿件。ASL 的 Guidelines 寫 "See the general description of the RSL for the types of material published in the Review"，
  # 而該 general description（asl_rsl）只列領域，沒有列稿件類型。
  article_types:
    - id: article
      label: 一般投稿（官網稱 "submission"、"papers"、"article"；Cambridge 的 Author instructions 首頁提到 "Research Articles" 一詞）
      what_it_is_expected_to_be:
        asl_guidelines: >-
          "See the general description of the RSL for the types of material published in the Review."　（RSL 頁 asl_rsl 只列範圍的領域清單，沒有列稿件類型）
        cup_authorinstr: >-
          "Certain article types (for example, Research Articles) may be eligible for APC waivers or discounts under one of the agreements Cambridge University Press has made
          to support open access."
        reading: >-
          官網沒有定義 RSL 的稿件類型：沒有 Communications、survey、expository、short note、Reviews、Thesis Abstracts 或會議報告等欄目，
          也沒有說明 "research article" 與其他類型的區別。「投稿 RSL」在官方文字上就是投一篇落在範圍清單內的論文。
        src: [asl_guidelines, asl_rsl, cup_authorinstr]
      invited_or_submitted: 可主動投稿。官網沒有寫邀稿制，也沒有要求先詢問編輯；投稿方式是用 EditFlow（https://ef.msp.org/submit/asl_rsl）。
      invited_src: [asl_guidelines, cup_preparing, editflow]
      length:
        value: 25
        unit: pages_typeset
        basis: >-
          單位是 schema 列舉中最接近的選項，不是來源定義的：來源寫 "25 pages (using the RSL style)"（cup_about、cup_home）與 "a 25-page limit for the initial submission"
          （asl_guidelines、editflow），沒有說明字體、行距或版面。cup_about 的 "using the RSL style" 暗示用 RSL（ASL）的 LaTeX 樣式排出來的頁數。
        wording: >-
          cup_about："The default length of the initial submission is 25 pages (using the RSL style.) Papers may go up to 30 pages during revisions). Longer submissions will be considered,
          although contributors should bear in mind that longer submissions will in general be judged by higher standards."
        revision_max: {value: 30, unit: pages_typeset, note: '"with the option to go up to 30 during revisions"（asl_guidelines）'}
        src: [cup_about, cup_home, asl_guidelines, editflow]
      abstract_and_keywords: 見 requirements.abstracts 與 requirements.keywords（摘要 300 字以內；定稿須有 MSC 2020 分類號與關鍵字）
      submission: 用 EditFlow（https://ef.msp.org/submit/asl_rsl）；PDF ＋ 原始檔；只收英文。細節見 requirements.submission
      review: 單匿名同行審查（cup_review），作者可在投稿時選雙匿名（asl_guidelines）。官網沒有說明審稿人數、輪次或時程
      src: [asl_guidelines, asl_rsl, cup_about, cup_review]
    - id: other_types
      label: Articles 以外的稿件類型（Communications、Reviews、Thesis Abstracts、會議報告、survey 專欄等）
      status: not_published
      checked: 2026-10-27
      src: [cup_about, cup_preparing, cup_authorinstr, asl_rsl, asl_guidelines, editflow]
      note: 官網沒有列出任何其他稿件類型，也沒有 "other high quality submissions" 之類的寄給 managing editor 的規定（BSL 才有）。

  article_type_labels_observed:
    labels: [Article]
    src: cup_home
    as_of: 2026-10-27
    note: >-
      這是已刊出文章在 Cambridge Core 首頁列表上的標籤，不是投稿規定：首頁 "Recently published articles"、"Most read"、"Most cited" 每篇都標為 "Article"。

  length:
    value: 25
    unit: pages_typeset
    basis:
      note: >-
        單位是 schema 列舉中最接近的選項，不是來源定義的：來源寫 "25 pages (using the RSL style)" 與 "a 25-page limit for the initial submission"，
        沒有說明字體、行距或版面。這是初次投稿的預設值；修訂時可到 30 頁；更長的稿件 "will be considered" 但標準較高。
    wording: >-
      asl_guidelines："the new default is a 25-page limit for the initial submission (with the option to go up to 30 during revisions). However, longer submissions will be considered,
      although longer submissions will in general be judged by higher standards. Contributors are given the opportunity to explain, in the cover letter, if the rationale for the longer
      submission relates to specifics of the content, topic, or area."
    exceptions: >-
      超過 25 頁的稿件仍會被考慮（"longer submissions will be considered"），所以是軟性上限，沒有給更高的硬上限。修訂時可到 30 頁。
      較長稿件的理由要寫在 cover letter（asl_guidelines）或 EditFlow Step 4 的 "Notes for Editors"（editflow）；兩處說法不同，見 warnings。
    includes_note:
      status: not_published
      checked: 2026-10-27
      note: 官網未說明 25 頁是否含參考文獻、附錄、圖表，也沒有字數上限。
    revision_max: {value: 30, unit: pages_typeset}
    src: [cup_about, cup_home, asl_guidelines, editflow]

  abstracts:
    - id: main
      applies_to: [article]
      max_words: 300
      required_at: final_version
      rules:
        - 'cup_preparing："Manuscripts should begin with an abstract of no more than 300 words."'
        - 'asl_guidelines："Note that abstracts are now required for final versions of all papers."'
      note: >-
        Cambridge 的 Layout of manuscripts 要求稿件以不超過 300 字的摘要開頭；ASL 的 Guidelines 另說定稿（final version）必須有摘要。
        ASL 沒有寫字數；300 字上限只出現在 Cambridge 的 Preparing 頁。Cambridge 的措辭是稿件版面（layout）規定，沒有明說初投是否必須，所以 required_at 只記 ASL 明文的定稿。
      src: [cup_preparing, asl_guidelines]

  keywords:
    msc_classification:
      required_for_final_version: true
      statement: '"AMS classification numbers (MSC 2020) and keywords are also required."（asl_guidelines，指定稿）'
      acm_ccs: '"If appropriate, ACM CCS designators are strongly recommended."'
      src: asl_guidelines
    free_keywords: {max: {status: not_published, checked: 2026-10-27, src: [asl_guidelines, cup_preparing]}}

  formatting:
    submission_file: PDF（EditFlow 上傳）；另須上傳原始檔
    statement: >-
      asl_guidelines："All submissions must be PDF documents. Color is not allowed. We also do not generally allow hand-drawn figures or
      diagrams. Exceptions may be made e.g., for professionally drawn diagrams. Please consult with your editor if this is necessary."
      editflow："Your submission must be a PDF file with no use of colors other than grayscale."
    typesetting: >-
      TeX 最佳（"It is by far best to prepare manuscripts in some version of TeX."）。其他格式在數學符號全部使用公式模式
      （Word）或 MathType 時可接受。cup_preparing："The publisher encourages submission of manuscripts in LaTeX which can be used for direct typesetting.
      Authors using LaTeX should use the RSL LaTeX class file. ... While use of the RSL LaTeX file is preferred, plain LaTeX or TeX files can also be accepted."
    source_file_at_submission:
      required: true
      statement: >-
        asl_guidelines："The source file (e.g. .doc or .docx) will also be required at submission. For submissions prepared in TeX,
        the .tex file is sufficient."（editflow 寫 "The source file (e.g., .doc or .docx) must also be uploaded now."）
      conflict: 'cup_preparing 沒有寫投稿時要附原始檔。以 asl_guidelines 與 EditFlow 為準（實際投稿用的是 EditFlow）。'
      src: [asl_guidelines, editflow, cup_preparing]
    template:
      class: "RSL（cup_preparing 稱 RSL LaTeX class file）／asl（asl_guidelines 稱 ASL style files）"
      files: [asl.cls, asl.bst]
      src: [cup_preparing, asl_guidelines, asl_resources]
      note: >-
        cup_preparing："Authors using LaTeX should use the RSL LaTeX class file. This, along with related files, can be found here (zip file download). If you have difficulties obtaining these files
        please contact [Cambridge 的 texline 信箱，本記錄不收 email]."　asl_guidelines："The relevant ASL style files can be found at our Author Resources page and can be used for submissions."
        檔名 asl.cls、asl.bst 是 BSL 與 JSL 記錄沿用的；RSL 的來源頁沒有寫檔名，所以這裡的 files 是推測，不是來源所寫。見 warnings。
    language: 英文限定（2023-01-01 起）。來源 asl_guidelines
    authors_identifiable: >-
      每位作者都必須是可辨識的人，不接受匿名作者；允許筆名，但編輯須收到完整正確的姓名與聯絡資料（asl_guidelines）。
    orcid: >-
      asl_guidelines："We strongly encourage that submitted manuscripts include ORCID identifiers for all authors."；
      cup_preparing 與 cup_submitting："We encourage authors to identify themselves using ORCID"
    author_web_urls: 'cup_preparing："Please supply Web URLs for the home page of each of the authors of the paper."'
    final_version_extras:
      - 摘要、MSC 2020 分類號與關鍵字（見上）
      - 每位作者具機構隸屬者，須附研究進行處的完整郵寄地址（asl_guidelines）
      - 所有圖、表與其他顯示材料的說明文字（alt-text）；可自行寫，或在校樣階段檢查 Cambridge 系統產生的版本（asl_guidelines、cup_preparing）
    labelling: '圖一律稱 "Figures"，表與圖須編號並附標題；程式碼片段、圖解等也須標號（cup_preparing）'
    src: [asl_guidelines, cup_preparing, editflow]

  supplementary_material:
    role: 與文章無關鍵關係但可能有讀者興趣的材料
    separate_file: true
    typeset: false
    rules:
      - '"Material that is not essential to understanding or supporting a manuscript ... may be submitted as supplementary material."'
      - 須經編輯同意才會與文章一起線上發表，不放在期刊頁面中（"With the approval of the editors"）
      - 不排版也不 copyedit，須以最終呈現的樣子提供（"supplied exactly as they are to appear online"）
      - 類型包括附錄、額外的表圖、資料集、影片、音檔（"not limited to"）
    repository_encouragement: '"Where relevant we encourage authors to publish additional qualitative or quantitative research outputs in an appropriate repository"'
    src: cup_preparing

  reproducibility:
    code_and_data_sharing_mandate:
      status: not_published
      checked: 2026-10-27
      src: [cup_transparency, asl_guidelines, cup_preparing]
      note: >-
        Cambridge 的 Research transparency 頁全頁只寫 "For any policy relating to the Review please refer to the ASL page here."；
        ASL 的 RSL Submission Guidelines 與倫理政策頁都沒有資料或程式碼公開、資料可得性聲明的條文。
    reporting_standards: {status: not_published, checked: 2026-10-27, src: [asl_guidelines, cup_preparing], note: 無 TOP、JARS 或其他報告標準要求}
    formalization_or_proof_checking:
      status: not_published
      checked: 2026-10-27
      src: [asl_guidelines, cup_preparing]
      note: 官網沒有關於形式化驗證（proof assistant）稿件、附形式化檔案或證明檢查的規定。

  review:
    type: single_anonymized
    statement: >-
      cup_review："This journal uses a single-anonymized model of peer review. The author does not know the identity of the reviewers,
      but the reviewers know the identity of the author."　cup_peerinfo 同義（"single-anonymous peer review model"）。
      但 asl_guidelines 另給作者一個雙匿名選項（見 conditional）；官網沒有說明兩者如何調和，預設應是 Cambridge 所寫的單匿名。
    applies_to: 全刊（兩處頁面都沒有按稿件類型區分；RSL 官網只描述一種稿件）。
    src: [cup_review, cup_peerinfo, asl_guidelines]
    conditional:
      - id: double_anonymous_option
        optional: true
        when: 作者希望雙匿名審稿，並在投稿時選此選項（asl_guidelines）
        requirements:
          - 稿件須照雙匿名準備（asl_guidelines："invited to prepare their papers accordingly"）；官網沒有說明要遮蔽哪些內容
          - 投稿時選此選項（"choose this option upon submission"）；EditFlow Step 0 之後的欄位本記錄未讀
          - 流程：managing editor 指派 handling editor；編輯知道作者身分，審稿人不知道（"The editors will know the identity of the authors, but the referees will not."）
          - 不論哪種模式，作者都不會被告知審稿人身分（"In any case, authors are not informed of the identity of the reviewers."）
        src: asl_guidelines
    editorial_decision:
      status: not_published
      checked: 2026-10-27
      src: [asl_rsl, cup_review, cup_peerinfo, asl_guidelines]
      note: >-
        官網沒有寫誰做錄取決定（handling editor 個人或編輯委員會）。asl_guidelines 只寫 managing editor 指派 handling editor。
    stages:
      status: not_published
      checked: 2026-10-27
      src: [cup_review, cup_peerinfo, asl_guidelines, editflow]
      note: 官網沒有說明初篩、審稿人人數、輪次或各階段時程。
    timeline_targets: {status: not_published, checked: 2026-10-27, src: [cup_review, asl_guidelines, editflow], note: 只有錄取後的出版目標（Accepted Manuscript 48 小時內，見 identity.metrics.time_acceptance_to_online）}
    appeals:
      statement: >-
        可申訴的只有兩種：編輯或審稿人的具體事實性陳述在決定中扮演關鍵角色，或基於具體個人／機構關係的偏見或利益衝突主張；
        對主題適不適合、呈現層次、結果品質的決定不可申訴。申訴交給期刊的 managing 或 coordinating editor
        （若他同時是該稿的 handling editor 則交給 ASL Publications Advisory Committee 主席），之後不再有進一步申訴。
      src: asl_appeals
    rejected_elsewhere_in_asl: >-
      asl_guidelines："If a paper has been previously rejected by one of the editors, this fact must be disclosed to any new editor to whom it,
      or a revised version, is being submitted."
    author_may_suggest_reviewers: {status: not_found, checked: 2026-10-27, src: [asl_guidelines, cup_preparing, editflow], note: Step 0 之前的頁面沒有提到；EditFlow 後續步驟未讀}
    authors_as_referees: {status: not_found, checked: 2026-10-27, src: [asl_guidelines, cup_preparing, editflow], note: 沒有看到作者須擔任審稿人的規定}
    revisions_link: >-
      修訂稿不要走新投稿入口：editflow 寫 "If you are trying to upload a revision of a previously submitted article (which had not been rejected),
      use instead the status link from the email you received from us about your original submission."
      被拒稿的修訂版不得重新投稿，除非編輯委員會明確邀請（"unless explicitly invited to re-submit"）。

  submission:
    portal: https://ef.msp.org/submit/asl_rsl
    system: EditFlow（MSP 的編輯管理平台；ASL 稱 "RSL EditFlow Management System"）
    applies_to: [article]
    file: PDF ＋ 原始檔（TeX 或 doc／docx）
    conditions:                     # editflow 的 Author Agreement；按 "I accept" 即表示同意
      - 稿件（或高度相似的稿件）目前沒有在別處審查中，審查期間也不會投到別處，且尚未在同行審查期刊發表或被接受
      - 稿件不是本刊先前被拒稿件的修訂版，除非編輯委員會明確邀請重投
      - 每位共同作者都知道此投稿以其名義送出，且各有只屬於本人的有效 email
      - 沒有共同作者冒用身分或誤導身分
      - 使用 AI 工具進行研究或準備稿件，符合 RSL 的指引與倫理政策，並向編輯（投稿流程稍後）與讀者（Acknowledgements 段）完整說明
    corresponding_author: >-
      開放取用資格取決於通訊作者的身分；通訊作者負責所有往來（審稿報告、修訂、校樣）。投稿流程中須指定，且 "difficult if not impossible
      to change the designation later"（editflow）。
    cover_letter_and_notes: >-
      asl_guidelines："Contributors are given the opportunity to explain, in the cover letter, if the rationale for the longer submission relates to specifics of the content, topic, or area."；
      editflow："please communicate this clearly in the 'Notes for Editors', on Step 4 of this submission process."
    portal_steps_read: Step 0 only
    steps_not_read: 作者資料、雙匿名審稿選項的欄位、稿件類型選單（有沒有類型選項未知）、Notes for Editors（Step 4）、cover letter、檔案上傳、建議審稿人等欄位未讀（需按 "I accept" 才會進入，本記錄沒有開始投稿）
    technical_help: 'EditFlow 問題寫信 editflow@msp.org；asl_guidelines 另指 "technical help resources at EditFlow"，並說更全面的問題寄給出版者代表 Steffen Lempp（asl_guidelines 列有其信箱，本記錄不收）'
    src: [editflow, cup_submitting, cup_preparing, asl_guidelines]

  fees:
    submission: {status: not_published, checked: 2026-10-27, src: [cup_fees, editflow, asl_guidelines], note: Cambridge 的 Fees and pricing、EditFlow Step 0 與 ASL 的 Submission Guidelines 都沒有提投稿費}
    apc:
      amount: 3655
      currency: USD
      amounts:
        - {currency: GBP, amount: 2610}
        - {currency: USD, amount: 3655}
      mandatory: false
      excludes: "taxes（原文 additional taxes may apply）"
      applies_to: 本頁沒有分文章類型，表為 "Article Processing Charges for this journal"；cup_authorinstr 另寫 "Certain article types (for example, Research Articles) may be eligible for APC waivers or discounts"
      wording: >-
        cup_fees 的表："Article Processing Charges for this journal — Currency: GBP (£) APC: 2610; USD ($) APC: 3655"，
        前有 "(additional taxes may apply)"。
      conditions: >-
        APC 只適用於選 Gold Open Access 且沒有被機構協議涵蓋的情況："For articles that are not published Gold Open Access, costs of
        publishing Gold OA are not applicable."
      waivers_and_agreements: >-
        Cambridge 與 2,000 多個機構有開放取用協議，通訊作者所屬機構在名單內時"in the majority of cases these agreements cover the full costs"；
        Cambridge Open Equity Initiative 補助 100 多個中低收入國家的通訊作者；EditFlow 另提到 Research4Life 國家。資格在錄取流程中自動判定。
        'asl_guidelines 同樣寫 Gold OA "is available for a fee (APC) or in accordance with (read and) publish agreements ... and for corresponding authors in certain countries."'
      src: [cup_fees, cup_oa, cup_authorinstr, editflow, asl_guidelines]
    color_print:
      amount: 320
      currency: USD
      amounts:
        - {currency: GBP, amount: 200}
        - {currency: USD, amount: 320}
      src: cup_fees
      note: >-
        cup_fees 列出 "Colour Charges for this journal"。但 asl_guidelines 與 editflow 都規定投稿 PDF 不得用灰階以外的顏色
        （"Color is not allowed"），這筆費用實際適用於什麼情況，官網沒有說明。見 warnings。
    page_charges: {status: not_published, checked: 2026-10-27, src: cup_fees, note: Fees and pricing 只列 APC 與彩色費，沒有頁費}

  open_access:
    options: [Gold Open Access（hybrid，付 APC 或由機構協議涵蓋）, 訂閱制（作者不付費）]
    licenses_offered: {status: not_published, checked: 2026-10-27, src: [cup_oa, cup_agreement], note: "cup_oa 與 cup_agreement 只寫 'a Creative Commons licence'，沒有列出可選的 CC 版本。asl_guidelines 建議不需要無限制 CC-BY 的作者選 CC-BY-NC-ND"}
    gold_oa_licence_suggestion: >-
      asl_guidelines："If you are eligible for gold open access publishing and your funder or institution does not require an unrestricted
      version of the CC-By license, we suggest that you choose one that does not automatically allow commercial use or distribution,
      i.e., the CC-By-NC-ND one."
    green_oa:
      embargo_months: {status: not_published, checked: 2026-10-27, src: [cup_oa, asl_guidelines, cup_green_oa], note: "本刊自己的頁面（cup_oa、asl_guidelines）沒有寫禁運期；通用政策頁見 standard_policy_inference"}
      statement: >-
        cup_oa 只寫 "Under this journal's Green Open Access policy, authors can make pre-published versions of their articles available in institutional or other
        repositories, or on their personal or departmental websites, under certain conditions."，沒有寫禁運期長度。
        asl_guidelines 寫 "All publications are eligible for the science journal version of CUP's Green Open Access."
      standard_policy_inference:
        statement: >-
          cup_green_oa（Cambridge 通用政策頁）寫標準 Green OA 政策是 "zero embargo periods for sharing Accepted Manuscripts"，只有少數期刊有較嚴的非標準政策，
          列在頁底的試算表（"Non-standard Green Open Access journal policies"，標示 "Updated October 2026"）。2026-10-27 下載該試算表，
          以期刊名稱（Review of Symbolic Logic）與縮寫（RSL）查，RSL 不在名單內（名單約 15 本，例如 Philosophy of Science、Canadian Journal of Mathematics、
          British Journal of Nutrition）。
        reading: >-
          所以依 Cambridge 通用政策，RSL 適用標準 Green OA 政策（Accepted Manuscript 零禁運）。這是由官方頁面與官方名單的缺席推得的，
          RSL 自己的頁面並沒有明說；要引用禁運期長度時請直接引 cup_green_oa 並註明這個推論。
        checked: 2026-10-27
        src: cup_green_oa
      src: [cup_oa, asl_guidelines, cup_green_oa]
    plan_s:
      statement: >-
        cup_oa："This journal is registered with cOAlition S as a Transformative Journal, and articles subject to Plan S as a result of funding by
        cOAlition S should be published as Gold Open Access. This journal's Green Open Access policy does not meet the open access requirements of Plan S."
      editflow_note: >-
        editflow：Plan S 受資助者 "After acceptance, choose the journal's Gold Open Access option, which is compliant with Plan S"；
        簽署本刊的出版協議後 "you will not be able to use the Green OA (self-archiving) route to Plan S compliance"。
      src: [cup_oa, editflow]
    src: [cup_oa, asl_guidelines, editflow]

  policies:
    dual_submission: forbidden
    dual_submission_wording: >-
      asl_guidelines："the same work (1) has not been published elsewhere; (2) is not presently submitted or accepted for publication elsewhere;
      and (3) will not be submitted elsewhere unless the manuscript is either withdrawn from or rejected by the RSL first."
    prior_publication: >-
      editflow："The submitted article has not already been published or accepted for publication in a peer-reviewed journal."；
      asl_guidelines："the same work (1) has not been published elsewhere"。
    conference_versions: >-
      會議論文集中已發表的重要論文的完整版可投稿，但須 extend the prior publication in a significant way；投稿時必須提供對先前出版品的精確引用，
      並說明與會議版本有何不同（asl_guidelines）。已投稿 RSL 的稿件想另投會議縮短版時，須通知編輯並附上會議版本與差異說明；
      會議版先被接受時要通知期刊編輯，期刊版先被接受時會議版要註明完整版已被接受（asl_guidelines）。
    preprints:
      allowed: true
      statement: '"This journal allows preprints to be posted anywhere at any time, including before submission to the journal."'
      editflow_note: >-
        editflow："We encourage the use of pre-print repositories such as arXiv. Pre-review, submitted manuscripts can be posted as CC-BY but
        post-review, accepted manuscripts should be deposited only using a CC-BY-NC-ND licence or a 'non-exclusive licence to distribute'."
        （上下文是 Plan S 受資助者的段落）
      not_prior_publication:
        status: not_found
        checked: 2026-10-27
        src: [cup_oa, cup_preparing, asl_guidelines, editflow]
        note: >-
          RSL 的 Preparing 頁與 asl_guidelines 都沒有「預印本不算先前發表或重複發表」的明文；
          只有 cup_oa 的 "This journal allows preprints to be posted anywhere at any time, including before submission to the journal."
      src: [cup_oa, editflow]
    copyright:
      transfer_required: false
      statement: >-
        asl_guidelines："Authors retain copyright in published articles but before publication they will be required to sign a license to publish
        agreement with the Association for Symbolic Logic. The Journal is now a hybrid publication and so there will be a choice of the type
        of license." cup_agreement：Gold OA 用非專屬授權，非 Gold OA 用專屬授權，著作權歸屬不變。
      src: [asl_guidelines, cup_agreement]
    generative_ai:
      author_listing: 'asl_guidelines："no Artficial Intelligence (AI) tool can be listed as an author of any submission."（原文 "Artficial" 為拼字錯誤）'
      disclosure: >-
        asl_guidelines："any use of such tools in the research for, or the preparation of, the submission should be in compliance with the general
        guidelines mentioned above and must be fully acknowledged and described to both the editors and readers where relevant in the submission and
        in a general way in the Acknowledgements section of the paper. Similarly, the use of other general aids, human or machine, in translation,
        writing or editing should be acknowledged in the Acknowledgements section of the submission. This last requirement does not apply to standard
        word processing or translation programs."
      warning: 'editflow："manuscripts generated largely by AI" 列為可能導致投稿資格被限制或停權的例子（見 scope.out_of_scope_hints）。'
      src: [asl_guidelines, editflow]
    ethics:
      statement: >-
        authors 須遵守 ASL 的出版倫理政策；各作者對內容與是否符合指引負責，包括正確引用、版權、避免利益衝突、誹謗、偏見、騷擾或抄襲（asl_guidelines）。
        ASL 不逐項定義違規行為，交由編輯委員會判斷；違規可由 Committee on Publications 裁定，處分包括退稿、禁止向任何 ASL 期刊或叢書投稿至少兩年、
        通知作者的系所主管或院長等（asl_ethics）。
      src: [asl_guidelines, asl_ethics, cup_ethics]
    conflict_of_interest:
      author_disclosure: {status: not_found, checked: 2026-10-27, src: [asl_guidelines, asl_ethics, cup_preparing], note: "只在 asl_guidelines 的責任段把 conflicts of interest 列為作者須避免的事，沒有揭露格式或欄位要求"}
    language_editing: >-
      cup_preparing：英語語言編修服務是選配、自費，使用不保證錄取（"voluntary ... at the author's own expense"）。

  standards: []

