    note: >-
      ASL Publication Ethics Policy（頁面日期 December 1, 2021），ASL 各刊共用。從 RSL 頁 "Publication Ethics Policy" 連入。
      Cambridge 的 Publishing ethics 頁寫的連結 "http://aslonline.org/journals/..." 被截斷，沒有直接取得。
    fetch:
