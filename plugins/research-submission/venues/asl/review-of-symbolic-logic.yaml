--- # research-submission venue record
# 內容擷取自 Cambridge Core 的期刊頁面（出版：Cambridge University Press，代表 Association for Symbolic Logic）、
# ASL 自己的網站（aslonline.org）、EditFlow 投稿入口（ef.msp.org）、SCImago 與 Clarivate Master Journal List，
# 全部 2026-10-27 經 Safari 讀頁面文字（document.body.innerText）取得；例外是 cup_metrics_guide 與 cup_green_oa 兩頁，
# Safari 只顯示頁首頁尾（內文是動態載入），所以只讀了 HTTP 抽取後的文字（見各自的 note）。
# RSL 的須知分散在三處：Cambridge 的 Author instructions（Preparing your materials 含本刊文字）、
# ASL 網站的 RSL 頁與 RSL Submission Guidelines（投稿規定的本體）、EditFlow 的 Step 0（篇幅與年錄取量的說明、作者聲明）。
# 與同一學會的 BSL、JSL 不同：RSL 的官方文字只描述一種稿件（一般投稿），沒有 Communications、Reviews、Thesis Abstracts 等類型，
# 但有明文的篇幅預設值（初投 25 頁、修訂時可到 30 頁）與每年錄取量的預設值（25–30 篇）。三處文字有出入的地方見 warnings。
# 注意 ASL 網站上 RSL 頁的網址是 /journals/the-review-of-symbolic/（沒有 "-logic"），不是依 BSL 網址樣式可以推得的。
# Cambridge 與 ASL 的頁面對 curl 都回正常內容（沒有 bot 挑戰頁），所以各 source 的 fetch.method 記 http。

schema_version: 1
id: asl/review-of-symbolic-logic
kind: journal
family: logic-journals
status: active

# ─────────────────────────────────────────────────────────────
# 來源與 provenance。所有網址皆由 Cambridge 期刊首頁的導覽、頁內連結，或 ASL 網站的 Journals 頁連結取得，非推測。
# 例外：Cambridge 頁面內有截斷的連結顯示文字，見 cup_submitting 與 cup_ethics 的 note。
# ─────────────────────────────────────────────────────────────
sources:
  - id: cup_preparing
    role: authoritative
    url: https://www.cambridge.org/core/journals/review-of-symbolic-logic/information/author-instructions/preparing-your-materials
    note: >-
      Cambridge 的 "Preparing your materials"。全頁包含：範圍（與期刊首頁逐字相同的四項領域清單）、LaTeX 與 RSL 類別檔、
      "Manuscripts should begin with an abstract of no more than 300 words"、圖、ORCID、英文編修服務、無障礙要求與補充材料。
      頁面沒有篇幅規定（篇幅在 cup_about、asl_guidelines、editflow），也沒有先前發表或審稿模式的規定。
      頁面的 "Illustrations" 一段（墨水手繪圖、紙本圖）是舊式文字，與 asl_guidelines 的 PDF 投稿規定並存，見 warnings。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Manuscripts should begin with an abstract of no more than 300 words"
        min_extracted_chars: 8900
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: cup_submitting
    role: authoritative
    url: https://www.cambridge.org/core/journals/review-of-symbolic-logic/information/author-instructions/submitting-your-materials
    note: >-
      投稿入口（EditFlow）、licence to publish、ORCID。頁內顯示文字 "https://ef.msp.org/submit/asl_..." 被截斷；
      Preparing your materials 頁的 "Proceed to submission system" 實際連到 https://ef.msp.org/submit/asl_rsl。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Papers must be submitted electronically via the journal"
        min_extracted_chars: 3900
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: cup_fees
    role: authoritative
    url: https://www.cambridge.org/core/journals/review-of-symbolic-logic/information/author-instructions/fees-and-pricing
    note: APC 與彩色費的金額表（GBP、USD）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Article Processing Charges for this journal"
        min_extracted_chars: 3400
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: cup_oa
    role: authoritative
