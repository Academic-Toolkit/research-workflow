    role: authoritative
    url: https://aslonline.org/journals/the-review-of-symbolic/rsl-editorial-staff/
    note: >-
      RSL 編輯群與各編輯列出的領域（頁面只列領域名稱，不是自述句）。頁面只寫 "See the RSL Guidelines for information on how to submit an article"，
      沒有 BSL 頁那種 "one (and only one)" 編輯的規定。本記錄不收 email 與通訊地址。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Formal approaches to metaphysics"
        min_extracted_chars: 2800
    snapshot:
