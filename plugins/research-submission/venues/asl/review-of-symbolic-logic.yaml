    note: >-
      SCImago（SJR）期刊頁：SJR、分區（2009–2025 逐年，三個類別）、H-index、涵蓋年份、Scope。網址的 q=19800188078 是 SCImago 的 source id，
      由 ISSN 搜尋結果頁（journalsearch.php?q=17550203&tip=iss&clean=0）唯一的結果連結取得。
      頁面最上方的 "SJR 2025 0.713 Q1" 的 Q1 是各學科類別中最好的一個；本刊 2025 年三個類別（Logic、Mathematics (miscellaneous)、Philosophy）都是 Q1，見 identity.metrics.quartiles。
