      method: http
      http_viable: true
      validity:
        must_contain: "This journal allows preprints to be posted anywhere at any time"
        min_extracted_chars: 4900
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: cup_review
