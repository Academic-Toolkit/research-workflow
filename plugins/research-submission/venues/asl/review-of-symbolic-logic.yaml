    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "single-anonymized model of peer review"
        min_extracted_chars: 2200
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: asl_rsl
    role: authoritative
    url: https://aslonline.org/journals/the-review-of-symbolic/
    note: >-
      ASL 網站的 RSL 頁（asl_guidelines 稱之為 "the general description of the RSL"，並指示 "for the types of material published in the Review" 看這頁）。
      範圍的官方敘述（五項領域，Cambridge 版把最後一項併在第四項後面）、投稿須知與倫理政策的連結、Cambridge 取得存取資訊的指引。
      頁面沒有日期。頁面沒有列出任何稿件類型，只列領域。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Logical results addressing foundational issues in the sciences"
        min_extracted_chars: 2100
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

  - id: asl_guidelines
    role: authoritative
    url: https://aslonline.org/journals/the-review-of-symbolic/the-review-of-symbolic-logic-submission-guidelines/
    note: >-
      ASL 網站的 RSL Submission Guidelines（頁面日期 October 5, 2023），從 ASL 的 RSL 頁 "RSL Guidelines" 連入。
      作者資格、AI 使用、一稿多投、會議論文版本、篇幅與年錄取量的預設值、雙匿名審稿選項、英文限定、PDF 與灰階、原始檔、
      摘要與 MSC、授權與開放取用都在這一頁，是投稿規定的本體。頁內有幾處沿用 JSL 的措辭（例如 "The Journal is now a hybrid publication"），
      本記錄照原文引用。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "the new default is a 25-page limit for the initial submission"
        min_extracted_chars: 8300
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

