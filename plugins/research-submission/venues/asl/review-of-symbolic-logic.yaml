    note: >-
      EditFlow 投稿入口的 Step 0（Article Submission）。2026-10-27 curl 轉址到 https://ef.msp.org/submit_new.php?j=asl_rsl（Safari 讀的是轉址後的網址）。
      含新投稿 vs 修訂稿的區分、通訊作者與開放取用資格、Plan S 注意事項、"Note on length of submissions"（25 頁、年錄取量 25–30 篇、
      "Notes for Editors" 在 Step 4）、"Note on format and sources"，以及按 "I accept" 前的 Author Agreement。
      本記錄只讀到 Step 0，沒有按 "I accept"，所以後續步驟（作者資料、雙匿名選項的欄位、稿件類型選單、Notes for Editors、檔案上傳等）未讀。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Proceed only if this is an entirely new submission"
        min_extracted_chars: 4900
    snapshot:
      fetched_at: 2026-10-27
      last_verified_at: 2026-10-27
      extracted_sha256: null

