# FAST — 期刊無年度週期。
# ─────────────────────────────────────────────────────────────
cycle:
  applies_to: null
  rolling_calls: []
  special_issues:
    status: not_published
    checked: 2026-10-27
    note: Cambridge 的期刊首頁與 Journal information 各頁、ASL 的 RSL 頁都沒有徵稿或特刊公告

# ─────────────────────────────────────────────────────────────
warnings:
  - >-
    RSL 與 BSL、JSL 不同：官網只描述一種稿件。ASL 的 Guidelines 說稿件類型看 RSL 頁的 general description，而該頁只列範圍的領域，沒有稿件類型。
    ASL 對自己三本期刊的定位（asl_journals）：JSL 是 "original research in mathematical logic and its applications"，RSL 是 "original scholarly work in philosophical
    and non-classical logics and their applications, history and philosophy of logic, and philosophy and methodology of mathematics"，BSL 是 "articles of general interest
    to the logic community in all the areas of logic as well as communications of important new developments"。官網沒有任何一句說明純數學稿件適不適合 RSL。
  - >-
    篇幅與錄取量是 RSL 特有的明文限制：初次投稿預設 25 頁（用 RSL 樣式；修訂時可到 30 頁），更長的稿件會被考慮但 "will in general be judged by higher standards"；
    每年錄取總量的預設值是 25–30 篇，兩者都寫 "for now"（asl_guidelines）／"has begun limiting"（editflow），是為了應付投稿量增加的暫時措施。
    官網沒有說明 25 頁是否含參考文獻與附錄。較長稿件的理由，asl_guidelines 說寫在 cover letter，editflow 說寫在 Step 4 的 "Notes for Editors"。
  - >-
    審稿模式有三種說法：cup_review 寫 "single-anonymized"；cup_peerinfo 寫 "single-anonymous"，並說審稿問題找 "the Editor-in-Chief"（本刊的頭銜是 Coordinating Editor，
    沒有 Editor-in-Chief）；asl_guidelines 另寫作者可選雙匿名審稿（"Authors who prefer doubly anonymous refereeing are invited to prepare their papers accordingly and
    choose this option upon submission"）。官網沒有說明雙匿名選項的欄位與遮蔽要求，也沒有說明預設是單匿名；本記錄以單匿名為預設、雙匿名為選配（requirements.review.conditional）。
  - >-
    投稿規定的本體在 ASL 網站的 RSL 頁與 Submission Guidelines 與 EditFlow Step 0，不在 Cambridge 的 Author instructions。兩處有出入時，
    實際投稿用的是 EditFlow：Cambridge 的 Preparing 頁沒有寫投稿時要附原始檔，ASL 與 EditFlow 則要求投稿時就附原始檔（TeX 檔，或 doc／docx）；
    Cambridge 的 Preparing 頁要求 300 字內的摘要，ASL 寫定稿時摘要、MSC 2020 分類號與關鍵字是 required，沒有寫摘要字數。
  - >-
    編輯名單不一致：cup_board 列 12 位（含 Paul Shafer，University of Leeds），asl_staff 列 11 位（沒有 Shafer）。asl_staff 頁的 Zaffora Blando 名下沒有列領域。
    官網沒有說明作者是否挑選編輯（BSL 的 "one (and only one)" 規定在 RSL 頁沒有出現）；asl_guidelines 只寫 managing editor 會指派 handling editor。
  - >-
    Cambridge 的 Author instructions 首頁（cup_authorinstr）最後一段寫 "For each research article accepted by the JSL"，指的是另一本期刊，疑為複製貼上的殘留；
    該段的實質（APC 豁免或折扣）仍可參考，但引用時不要把 JSL 當成本刊。asl_guidelines 也有沿用 JSL 的措辭（例如 "The Journal is now a hybrid publication"）。
  - >-
    樣式檔：cup_preparing 稱 "RSL LaTeX class file"（zip 下載，取檔問題寫信給 Cambridge 的 TeX 支援信箱），asl_guidelines 稱 "ASL style files" 在 Author Resources 頁；
    Author Resources 頁的說明只提 JSL 與 BSL。RSL 的來源頁沒有寫檔名，本記錄的 files: [asl.cls, asl.bst] 是沿用 BSL 與 JSL 記錄，不是 RSL 來源所寫；投稿前要確認用的是 RSL 的類別檔。
  - >-
    投稿 PDF 不得使用灰階以外的顏色（"Color is not allowed"），也一般不收手繪圖，需要時先和編輯討論；但 Cambridge 的 Fees and pricing 仍列有彩色費
    （GBP 200／USD 320），Preparing 頁的 Illustrations 一段還保留墨水手繪圖與紙本圖的舊式文字。官網沒有說明彩色費適用於哪種情況，投稿時一律用灰階與 PDF。
  - >-
    只收英文稿件（2023-01-01 起）。不接受匿名作者，每位作者須是可辨識的人；單匿名審稿時審稿人知道作者，稿件不需遮蔽作者資訊（選雙匿名時才需要）。
  - >-
    AI 工具不得列為作者；研究或寫作過程使用 AI 須在稿件內向編輯與讀者說明，並在 Acknowledgements 寫一段概述（asl_guidelines）；
    EditFlow 的 Author Agreement 另明文警告：重複投稿範圍外或不符學術標準的稿件，投稿資格可能被限制或停權，例子包括大量由 AI 生成的稿件，
    以及宣稱解決重大公開問題卻沒有有效新方法、也沒有處理現有文獻的稿件。
  - >-
    投稿前要決定誰是通訊作者：開放取用資格看通訊作者的所屬機構（機構協議或 Research4Life／Cambridge Open Equity Initiative 國家），
    且 EditFlow 寫事後很難改。Plan S 受資助者須選 Gold OA，本刊的 Green OA 不符合 Plan S，簽出版協議後也不能走 Green OA 達成 Plan S。
  - >-
    指標：Cambridge 的 Impact Factor 沒有標示年度，頁面顯示 ".7"（2 年）與 ".8"（5 年）；JCR 分區需登入，本記錄沒有；記錄中的分區是 SJR 分區
    （Logic、Mathematics (miscellaneous)、Philosophy 三個類別 2025 年都是 Q1），不是 JCR。Web of Science 收錄在 SCIE 與 AHCI（MJL 核對），不在 SSCI、ESCI。
    比較表只顯示 SCIE 與 SSCI，所以本刊在表上是 "SCIE"，AHCI 要看 identity.metrics.indexing。
  - >-
    篇數有三個口徑不同的數字，不可互比：Cambridge 的 Journal metrics 寫 "Total number of articles last year 17"（不標年度）；SCImago 的 Total Documents 2024 年 43、2025 年 46
    （含所有文件類型）；ASL 的 Guidelines 說每年錄取總量預設 25–30 篇。
  - >-
    官方沒有公布錄取率、首次決定時間、投稿到接受時間、審稿人人數與各階段時程；官網也沒有資料或程式碼公開的規定。官方只公布年錄取量的預設值（25–30 篇）與錄取後的出版目標（48 小時內）。
  - >-
    EditFlow 只讀到 Step 0（沒有按 "I accept"）。作者資料、雙匿名選項、稿件類型選單、Notes for Editors（Step 4）、cover letter、建議審稿人與檔案上傳的欄位要求未知。
  - >-
    Cambridge 頁面上 "https://ef.msp.org/submit/asl_..." 與 Publishing ethics 頁 "http://aslonline.org/journals/..." 的連結顯示文字被截斷，
    實際連結分別指向 EditFlow 的 asl_rsl 入口與 ASL 的倫理政策頁；現行頁面網址見 sources。ASL 網站上 RSL 頁的網址是 /journals/the-review-of-symbolic/，沒有 "-logic"。
