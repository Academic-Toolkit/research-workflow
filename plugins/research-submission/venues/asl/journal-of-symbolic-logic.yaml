--- # research-submission venue record
# 內容擷取自 Cambridge Core 的期刊頁面（出版：Cambridge University Press，代表 Association for Symbolic Logic）、
# ASL 自己的網站（aslonline.org）、EditFlow 投稿入口（ef.msp.org）、SCImago 與 Clarivate Master Journal List，
# 全部 2026-10-25 經 Safari 讀頁面文字（document.body.innerText）取得。
# JSL 的須知分散在三處：Cambridge 的 Author instructions 是通用範本加幾段本刊文字；真正的本刊投稿規定在 ASL 網站的
# Submission Guidelines；實際的投稿條件與作者聲明在 EditFlow 的 Step 0。三處文字有出入的地方見 warnings。
# Cambridge 與 ASL 的頁面對 curl 都回正常內容（沒有 bot 挑戰頁），所以各 source 的 fetch.method 記 http。

schema_version: 1
id: asl/journal-of-symbolic-logic
kind: journal
family: logic-journals
status: active

# ─────────────────────────────────────────────────────────────
# 來源與 provenance。所有網址皆由 Cambridge 期刊首頁的導覽、頁內連結，或 ASL 網站側欄連結取得，非推測。
# 例外：Cambridge 頁面內有兩個失效或截斷的 ASL 連結，見 asl_ethics 的 note。
# ─────────────────────────────────────────────────────────────
sources:
  - id: cup_preparing
    role: authoritative
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/author-instructions/preparing-your-materials
    note: >-
      Cambridge 的 "Preparing your materials"，頁內標題 "The Journal of Symbolic Logic - Submission Guidelines"。
      篇幅（30 頁）、投稿格式（PDF）、先前發表政策與 preprint、補充材料、無障礙要求都在這一頁。
      頁內有指向 ASL "Author Resources" 與 "JSL Author Guidelines" 的連結，也列出一個已失效的 ASL 倫理政策網址。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "primarily publishes papers of up to 30 pages in length, but longer papers will be considered"
        min_extracted_chars: 6000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: cup_submitting
    role: authoritative
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/author-instructions/submitting-your-materials
    note: >-
      投稿入口（EditFlow，頁內文字 "https://ef.msp.org/submit_new...." 的實際連結為
      https://ef.msp.org/submit_new.php?j=asl_jsl）、licence to publish、ORCID。期刊首頁 "Submit manuscript" 的彈出視窗
      "Proceed to submission system" 則連到 https://ef.msp.org/submit/asl_jsl。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Please submit your paper via the online submission system here"
        min_extracted_chars: 2800
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: cup_fees
    role: authoritative
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/author-instructions/fees-and-pricing
    note: APC 與彩色費的金額表（GBP、USD）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Article Processing Charges for this journal"
        min_extracted_chars: 2400
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: cup_oa
    role: authoritative
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/journal-policies/open-access-options
    note: 開放取用選項、機構協議、Green OA 禁運期、preprint 政策、Plan S。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "This journal allows preprints to be posted anywhere at any time"
        min_extracted_chars: 3600
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: cup_review
    role: authoritative
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/peer-review-information/review-process
    note: 審稿模式（單匿名）與申訴辦法；全頁只有兩段。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "single-anonymized model of peer review"
        min_extracted_chars: 1500
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: asl_guidelines
    role: authoritative
    url: https://aslonline.org/journals/the-journal-of-symbolic-logic/submission-guidelines/
    note: >-
      ASL 網站的 JSL Submission Guidelines（頁面日期 October 5, 2023），從 ASL 的 JSL 頁面 "JSL Author Guidelines" 連入。
      作者資格、AI 使用、一稿多投、會議論文版本、英文限定、PDF 與灰階、摘要與 MSC、授權與開放取用都在這一頁，
      是本刊投稿規定的本體。頁首第一句 "See the general description of the JSL for the types of material published in the Journal."
      指向 asl_jsl。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "no Artificial Intelligence (AI) tool can be listed as an author"
        min_extracted_chars: 5000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: asl_jsl
    role: authoritative
    url: https://aslonline.org/journals/the-journal-of-symbolic-logic/
    note: >-
      ASL 網站的 JSL 頁面：範圍的官方敘述（與 Cambridge 首頁相同，另加 "Submissions are expected to..." 與
      "Final decisions to accept papers are made by The Journal editorial board as a whole."），
      是 asl_guidelines 所說的 "general description of the JSL"。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Final decisions to accept papers are made by The Journal editorial board as a whole"
        min_extracted_chars: 1300
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: asl_ethics
    role: authoritative
    url: https://aslonline.org/journals/publication-ethics-policy/
    note: >-
      ASL Publication Ethics Policy（頁面日期 December 1, 2021）。網址從 Cambridge 的 Publishing ethics 與
      Research transparency 頁連入（實際 href 為 http://aslonline.org/journals/publication-ethics-policy/，頁內顯示文字被截成
      "http://aslonline.org/journals/..."）。Cambridge 的 "Preparing your materials" 頁寫的舊網址
      http://www.aslonline.org/PublicationEthicsPolicy.html 在 2026-10-25 回 404。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "relies on its editorial boards to determine whether there has been a potential violation"
        min_extracted_chars: 3300
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: editflow
    role: authoritative
    url: https://ef.msp.org/submit/asl_jsl
    note: >-
      EditFlow 投稿入口的 Step 0（Article Submission）。2026-10-25 curl 轉址到 https://ef.msp.org/submit_new.php?j=asl_jsl。
      含新投稿 vs 修訂稿的區分、通訊作者與開放取用資格、PDF 與灰階、Plan S 注意事項，以及按 "I accept" 前的 Author Agreement。
      本記錄只讀到 Step 0，沒有按 "I accept"，所以後續步驟（作者資料、編輯選擇、cover letter、檔案上傳等）未讀。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Proceed only if this is an entirely new submission to the Journal of Symbolic Logic"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-10-25
      last_verified_at: 2026-10-25
      extracted_sha256: null

  - id: cup_home
    role: supporting
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic
    note: 期刊首頁：ISSN、協調編輯、範圍一段、導覽選單。各子頁連結從這裡的 Journal information 選單取得。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "publishes research in mathematical logic and its applications of the highest quality"
        min_extracted_chars: 2500
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: cup_about
    role: supporting
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/about-this-journal
    note: ISSN、出刊頻率（4 issues per year）、擁有者與出版者的關係。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "managed and published by Cambridge University Press on behalf of the owners, The Association for Symbolic Logic"
        min_extracted_chars: 2000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: cup_pubproc
    role: supporting
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/author-instructions/publication-process-after-acceptance
    note: 錄取後流程：Author Information Form、Accepted Manuscript（48 小時內上線）、FirstView、校樣時間。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "We aim to publish the Accepted Manuscript within 48 hours of final acceptance"
        min_extracted_chars: 4000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: cup_agreement
    role: supporting
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/author-instructions/publishing-agreement
    note: Licence to publish 的種類（Gold OA 非專屬授權；非 Gold OA 專屬授權）與各版本表單的選擇表。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Before Cambridge can publish a journal article"
        min_extracted_chars: 4000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: cup_metrics
    role: supporting
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/about-this-journal/journal-metrics
    note: >-
      Cambridge 的 Journal metrics 表：2 年與 5 年 Impact Factor、Eigenfactor、Article Influence、CiteScore、SJR、SNIP，
      以及去年發表篇數。頁面沒有標年度，也沒有分區或名次。表中 Impact Factor 的值照頁面顯示為 ".6"、".7"（省略前導的 0）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Scimago Journal Rank (SJR)"
        min_extracted_chars: 1800
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: cup_metrics_guide
    role: supporting
    url: https://www.cambridge.org/core/services/authors/journals/measuring-impact
    note: >-
      Journal metrics 頁 "guide to journal-level metrics" 連結的目標（轉址到 /core/services/authors/measuring-impact）。
      用途是確認 Cambridge 表中的 Impact Factor 指的是 Clarivate Journal Citation Reports 的 Journal Impact Factor。
      2026-10-25 Safari 的 innerText 只顯示頁首與回饋視窗，內文沒有出現；本記錄引用的內容是從 curl 取得的原始 HTML 讀出的
      （抽取後約 14,000 字，含 "Metrics provided by Clarivate Analytics" 一段），用 safari 讀不到內文，原因未查。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Metrics provided by Clarivate Analytics"
        min_extracted_chars: 8000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: cup_abstracting
    role: supporting
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/about-this-journal/abstracting-and-indexing
    note: 出版社自述的收錄清單。Web of Science 的收錄已用 Master Journal List 核對（見 mjl），其他項目沒有另外核對。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Science Citation Index Expanded"
        min_extracted_chars: 2000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: cup_board
    role: supporting
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/about-this-journal/editorial-board
    note: 編輯名單（本記錄只收姓名、職稱與所屬機構，不收 email）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Steve Awodey"
        min_extracted_chars: 1800
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: cup_ethics
    role: supporting
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/journal-policies/publishing-ethics
    note: 全頁只有一句，指向 ASL 的倫理原則（連結見 asl_ethics 的 note）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Please refer to the ASL publication ethics principles"
        min_extracted_chars: 1400
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: cup_transparency
    role: supporting
    url: https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/journal-policies/research-transparency
    note: Research transparency（資料與程式碼政策）頁全頁只有一句，指向 ASL；證明 Cambridge 端沒有資料可得性規定。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "For any policy relating to the Journal please refer to the ASL page"
        min_extracted_chars: 1400
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: asl_staff
    role: supporting
    url: https://aslonline.org/journals/the-journal-of-symbolic-logic/jsl-editorial-staff/
    note: 每位編輯自述接哪些領域的稿件（引號內是各編輯自己的話）。本記錄不收 email 與通訊地址。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "I welcome papers in model theory and its applications"
        min_extracted_chars: 2400
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: asl_appeals
    role: supporting
    url: https://aslonline.org/journals/publication-ethics-policy/appeals-of-editorial-decisions/
    note: ASL 各刊共用的申訴規定（頁面日期 January 15, 2024），從 Cambridge 的 Review process 頁連入。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Their decisions about such matters are not subject to appeal"
        min_extracted_chars: 1700
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: asl_resources
    role: supporting
    url: https://aslonline.org/journals/author-resources/
    note: asl.cls / asl.bst 等 TeX 檔案的下載頁（一個 zip）。本記錄沒有下載 zip，檔名 asl.cls、asl.bst 來自 cup_preparing。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "The files needed to make it possible to create TEX-files in the style used by the publications of the Association for Symbolic Logic"
        min_extracted_chars: 1000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: asl_journals
    role: supporting
    url: https://aslonline.org/journals/
    note: ASL 三本期刊的一句話定位（JSL、Review of Symbolic Logic、Bulletin of Symbolic Logic）。用於判斷稿件該投 ASL 的哪一本。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "The Review focuses on original scholarly work in philosophical and non-classical logics"
        min_extracted_chars: 1400
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: asl_subscriptions
    role: supporting
    url: https://aslonline.org/journals/subscriptions/
    note: 訂閱方式（JSL 與 Bulletin 只賣套裝）與 2026 年定價。作者不需要，只用來回答存取模式。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Subscriptions to the ASL journals are available for libraries and other non-members"
        min_extracted_chars: 2000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: scimago
    role: supporting
    url: https://www.scimagojr.com/journalsearch.php?q=23974&tip=sid&clean=0
    note: >-
      SCImago（SJR）期刊頁：SJR、分區（1999–2025 逐年）、H-index、涵蓋年份、Scope。網址的 q=23974 是 SCImago 的 source id，
      由 ISSN 搜尋結果頁（journalsearch.php?q=00224812&tip=iss&clean=0）唯一的結果連結取得。
      頁面上 "How to publish in this journal" 列了一位人士的 email，本記錄不收。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "curl 回 HTTP 403 + 5595 bytes 的 Cloudflare 挑戰頁（title 為 'Just a moment...'）"
      validity:
        must_contain: "Subject Area and Category"
        min_extracted_chars: 8000
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25, extracted_sha256: null}

  - id: mjl
    role: supporting
    url: https://mjl.clarivate.com/home
    note: >-
      Clarivate Master Journal List。JS 單頁應用，結果頁網址不帶查詢字串，無法用網址重現；只能在頁內於 #search-box 填 ISSN
      （本次填 0022-4812）、按 #search-button 後讀結果列。結果列的 "View profile page" 會導向登入頁，所以 JCR 的類別與分區沒有取得。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: "200 但只有 SPA 空殼，查詢結果需在頁內操作"
    snapshot: {fetched_at: 2026-10-25, last_verified_at: 2026-10-25}

# ─────────────────────────────────────────────────────────────
identity:
  name: The Journal of Symbolic Logic
  abbreviation: JSL
  abbreviation_note: 投稿入口網址與 EditFlow 的期刊代碼用 asl_jsl（ef.msp.org/submit/asl_jsl）。來源 cup_submitting
  publisher: Cambridge University Press
  owner: Association for Symbolic Logic
  publisher_evidence: >-
    cup_about："This journal is managed and published by Cambridge University Press on behalf of the owners, The Association for Symbolic Logic."
    MJL 出版社欄 "CAMBRIDGE UNIV PRESS , EDINBURGH BLDG, SHAFTESBURY RD, CAMBRIDGE, ENGLAND, CB2 8RU"；
    SCImago 出版社欄 "Cambridge University Press"，國別 United Kingdom。
  issn: {print: "0022-4812", electronic: "1943-5886", src: cup_about}
  issn_cross_check: >-
    SCImago 頁 "ISSN 00224812, 19435886"；MJL 搜尋 0022-4812 得 "ISSN / eISSN: 0022-4812 / 1943-5886"。三處一致。
  homepage: https://www.cambridge.org/core/journals/journal-of-symbolic-logic
  asl_page: https://aslonline.org/journals/the-journal-of-symbolic-logic/
  hosting_platform: {name: Cambridge Core, url: "https://www.cambridge.org/core/journals/journal-of-symbolic-logic"}
  subject_area:
    value: Mathematical logic
    scimago: "Mathematics → Logic；Arts and Humanities → Philosophy"
    src: scimago
  frequency: {value: quarterly, src: [cup_about, asl_jsl], note: 'Cambridge 寫 "Frequency: 4 issues per year"；ASL 寫 "issued quarterly with The Bulletin of Symbolic Logic"'}
  founded: {value: 1936, src: asl_jsl, note: '"The Journal was founded in 1936"；Cambridge 首頁寫 "since its establishment in 1936"'}
  coverage: {value: "1938, 1958, 1987, 1996-2026", src: scimago, note: SCImago 頁面所列涵蓋年份}
  external_ids:
    scimago: "23974"
    crossref: "0022-4812"
    openalex: issn:0022-4812
  sibling_journals:
    - {name: The Bulletin of Symbolic Logic, src: asl_journals, positioning: 'Published quarterly, The Bulletin publishes articles of general interest to the logic community in all the areas of logic as well as communications of important new developments.（原文節錄）'}
    - {name: The Review of Symbolic Logic, src: asl_journals, positioning: 'Published quarterly, The Review focuses on original scholarly work in philosophical and non-classical logics and their applications, history and philosophy of logic, and philosophy and methodology of mathematics.（原文）'}
  open_access:
    value: hybrid
    src: [cup_oa, cup_fees]
    note: '"This is a hybrid journal, which means it provides authors with options to make their articles open access, including the option to publish Gold Open Access under a Creative Commons licence."'
  access:
    model: 訂閱制為主（JSL 與 Bulletin 只賣套裝）；作者可選 Gold OA（付 APC 或由機構協議涵蓋）
    statement: '"Separate subscriptions to The Journal or The Bulletin are not available, as these two titles can only be purchased as a bundle."'
    back_volumes: '"Back volumes more than four years old of The Journal and all volumes of The Bulletin are available at JSTOR."'
    src: asl_subscriptions
  editors:
    coordinating: {name: Steve Awodey, affiliation: "Carnegie Mellon University, USA", role: Coordinating Editor, src: [cup_board, asl_staff]}
    list_src: [cup_board, asl_staff]
    members:
      - {name: Sylvy Anscombe, affiliation: "Université de Paris, France", self_described_areas: "model theory and its applications"}
      - {name: Jeremy Avigad, affiliation: "Carnegie Mellon University, USA", self_described_areas: "formal verification, automated reasoning, and their applications to mathematics"}
      - {name: Steve Awodey, affiliation: "Carnegie Mellon University, USA", self_described_areas: "algebraic and categorical logic, constructive mathematics, and type theory"}
      - {name: Alex Berenstein, affiliation: "Universidad de los Andes, Colombia", self_described_areas: "model theory"}
