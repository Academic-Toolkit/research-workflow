# ─────────────────────────────────────────────────────────────
# SLOW — 數年不變。驗證用 hash diff 即可。
# ─────────────────────────────────────────────────────────────
requirements:
  refresh: {check_every: P6M, method: extracted_hash_diff}

  scope:
    aims_verbatim: >-
      The Journal of Symbolic Logic publishes research in mathematical logic and its applications of the highest quality.
      Papers are expected to exhibit innovation and not merely be minor variations on established work.
      They should also be of interest to a broad audience.
      JSL has been, since its establishment in 1936, the leading journal in the world devoted to mathematical logic.
      Its prestige derives from its longevity and from the standard of submissions -- which, combined with the standards of reviewing,
      all contribute to the fact that it receives more citations than any other journal in logic.
    aims_verbatim_note: >-
      Cambridge 首頁、About 頁與 SCImago 的 Scope 逐字相同。ASL 的 JSL 頁改寫為 "The Journal of Symbolic Logic publishes research in
      mathematical logic and its applications of the highest quality. Submissions are expected to exhibit innovation and not merely be
      minor variations on established work. They should also be of interest to a broad audience."
    src: [cup_home, cup_about, asl_jsl]
    submission_invitation:
      statement: '"The Journal invites submission of original scholarly work in mathematical logic and its applications."'
      src: cup_preparing
    areas:
      - id: mathematical_logic
        statement: 'research in mathematical logic（原文）；ASL 的 journals 頁："The Journal focuses on original research in mathematical logic and its applications. It is the leading research journal in the field."'
        src: [cup_home, asl_journals]
      - id: applications
        statement: '"and its applications"（原文）。官網沒有定義或列舉 applications 的範圍'
        src: [cup_home, cup_preparing]
    acceptance_criteria:
      statement: >-
        原文 "Papers are expected to exhibit innovation and not merely be minor variations on established work. They should also be of
        interest to a broad audience."——兩項期待：創新（不是既有工作的小幅變化）、對廣泛讀者有興趣。
        最終錄取由編輯委員會整體決定："Final decisions to accept papers are made by The Journal editorial board as a whole."
      src: [cup_home, asl_jsl]
    out_of_scope_hints:
      - case: 既有工作的小幅變化（minor variations）
        statement: '"Papers are expected to exhibit innovation and not merely be minor variations on established work."'
        src: [cup_home, asl_jsl]
        reading: 用語是 expected，不是明文排除某類主題
      - case: 只對窄小讀者群有興趣的稿件
        statement: '"They should also be of interest to a broad audience."'
        src: [cup_home, asl_jsl]
        reading: 用語是 should，沒有給判準；窄而專門的結果有被判不合的風險
      - case: 重複投稿被判在範圍外、由 AI 大量生成的稿件、宣稱解決重大公開問題卻沒有新方法或沒有處理現有文獻的稿件
        statement: >-
          "If your submissions repeatedly are outside the scope of the journal or do not meet scholarly standards, your ability to submit
          might be limited or suspended. This includes (for example) manuscripts generated largely by AI and manuscripts asserting
          resolutions of major open problems without valid new methods or proper engagement with the current research literature."
        src: editflow
        reading: >-
          這是 EditFlow Step 0 的 Author Agreement，寫的是後果（repeatedly 才限制投稿資格），並以 "for example" 舉例；
          不是範圍條款，但屬於官方明文勸阻的稿件類型
      - case: 編輯對主題是否適合本刊的裁量
        statement: >-
          "The editors of ASL journals have wide discretion about general concerns such as the basic expository level of the submission and
          its intelligibility to our audience, the appropriateness of the subject matter for our journal and the quality or importance of
          the results presented. ... Their decisions about such matters are not subject to appeal."
        src: asl_appeals
        reading: 主題適不適合、呈現層次、結果的品質與重要性，編輯有廣泛裁量，且不可申訴
      - case: 與會議論文集版本差異不大的完整版
        statement: >-
          "Full versions of important papers that have previously been published in conference proceedings are eligible for publication,
          provided that the submitted paper extends the pre-publication in a significant way."
        src: [cup_preparing, asl_guidelines]
        reading: 是條件（significantly extend），不是排除
      - case: 非英文稿件
        statement: '"As of January 1, 2023 only papers in English will be considered for publication."'
        src: asl_guidelines
        reading: 明文限定英文
    explicit_exclusions:
      status: not_published
      checked: 2026-10-25
      src: [cup_home, cup_preparing, asl_jsl, asl_guidelines, editflow]
      note: >-
        各頁都沒有 "we do not publish X" 形式的主題排除句。最接近的是上列的 expected／should／provided that 措辭，
        以及 EditFlow 對 AI 大量生成稿件與宣稱解決重大公開問題稿件的警告。
    related_asl_journals:
      statement: >-
        ASL 另有兩本期刊定位不同：Review of Symbolic Logic 收 "philosophical and non-classical logics and their applications, history and
        philosophy of logic, and philosophy and methodology of mathematics"；Bulletin of Symbolic Logic 收 "articles of general interest to
        the logic community in all the areas of logic as well as communications of important new developments"。
      src: asl_journals

  article_types:
    status: not_published
    checked: 2026-10-25
    src: [cup_home, cup_preparing, asl_jsl, asl_guidelines]
    note: >-
      官網沒有列出文章類型（沒有 survey、short communication、note 等分類）。cup_preparing 只寫 "original scholarly work in mathematical
      logic and its applications"。Cambridge 的 Author instructions 首頁（https://www.cambridge.org/core/journals/journal-of-symbolic-logic/information/author-instructions，
      未列為 source）出現的 "Research Articles" 是 Cambridge 通用的 APC 豁免說明
      （"Certain article types (for example, Research Articles) may be eligible for APC waivers or discounts"），不是本刊的類型清單。
      EditFlow Step 0 之後的步驟是否有類型選單，本記錄無法得知。

  length:
    value: 30
    unit: pages_typeset
    basis:
      note: >-
        單位是 schema 列舉中最接近的選項，不是來源定義的：來源只寫 "30 pages in length"，沒有說明是排版後頁數還是稿件頁數，
        也沒有說明字體、行距或版面。
    wording: '"The Journal primarily publishes papers of up to 30 pages in length, but longer papers will be considered."'
    exceptions: 超過 30 頁的稿件仍會被考慮（"longer papers will be considered"），所以是軟性上限，沒有給更高的硬上限。
    includes_note:
      status: not_published
      checked: 2026-10-25
      note: 官網未說明 30 頁是否含參考文獻、附錄、圖表
    src: cup_preparing
  length_other_limits:
    status: not_published
    checked: 2026-10-25
    src: [cup_preparing, asl_guidelines, editflow]
    note: 沒有字數、圖表數或參考文獻數的上限。

  abstracts:
    - id: main
      max_words: {status: not_published, checked: 2026-10-25, src: [cup_preparing, asl_guidelines]}
      required_at: final_version
      rules:
        - 'cup_preparing："Note that abstracts are now required for final versions of all papers."'
        - 'asl_guidelines："Note that abstracts are now required for final versions of all papers."（同句）'
      note: >-
        兩處都只說「定稿（final version）」需要摘要，沒有說初次投稿是否需要，也沒有字數上限。
      src: [cup_preparing, asl_guidelines]
  keywords:
    msc_classification:
      required_for_final_version: true
      statement: '"AMS classification numbers (MSC 2020) and keywords are also required."（asl_guidelines，指定稿）'
      conflict: 'cup_preparing 寫 "Key words and AMS classification numbers are strongly recommended."（只說建議）。見 warnings。'
      acm_ccs: '"If appropriate, ACM CCS designators are strongly recommended."'
      src: [asl_guidelines, cup_preparing]
    free_keywords: {max: {status: not_published, checked: 2026-10-25, src: [asl_guidelines, cup_preparing]}}

  formatting:
    submission_file: PDF（EditFlow 上傳）；另須上傳原始檔
    statement: >-
      asl_guidelines："All submissions must be PDF documents. Color is not allowed. We also do not generally allow hand-drawn figures or
      diagrams. Exceptions may be made e.g., for professionally drawn diagrams. Please consult with your editor if this is necessary."
      editflow："Your submission must be a PDF file with no use of colors other than grayscale."
    typesetting: >-
      TeX 最佳（"It is by far best to prepare manuscripts in some version of TeX."）。其他格式在數學符號全部使用公式模式
      （Word）或 MathType 時可接受。
    source_file_at_submission:
      required: true
      statement: >-
        asl_guidelines："The source file (e.g. .doc or .docx) will also be required at submission. For submissions prepared in TeX,
        the .tex file is sufficient."（editflow 寫 "The source file (e.g., .doc or .docx) must also be uploaded now."）
      conflict: 'cup_preparing 寫 "Papers should be submitted in PDF. After acceptance a Latex source file ... would be much appreciated."，沒有要求投稿時附原始檔。見 warnings。'
      src: [asl_guidelines, editflow, cup_preparing]
    template:
      class: asl
      files: [asl.cls, asl.bst]
      src: [cup_preparing, asl_guidelines, asl_resources]
      note: 'cup_preparing："a Latex source file, preferably using the asl document class (asl.cls) and BibTeX style (asl.bst) which can be found at Author Resources"（錄取後）；asl_guidelines："The relevant ASL style files ... can be used for submissions."（投稿時可用）'
    language: 英文限定（2023-01-01 起）。來源 asl_guidelines
    authors_identifiable: >-
      每位作者都必須是可辨識的人，不接受匿名作者；允許筆名，但編輯須收到完整正確的姓名與聯絡資料（asl_guidelines）。
    orcid: >-
      asl_guidelines："We strongly encourage that submitted manuscripts include ORCID identifiers for all authors."；
      cup_preparing 與 cup_submitting："We encourage authors to identify themselves using ORCID"
    final_version_extras:
      - 摘要、MSC 2020 分類號與關鍵字（見上）
      - 每位作者具機構隸屬者，須附研究進行處的完整郵寄地址（asl_guidelines）
      - 所有圖、表與其他顯示材料的說明文字（alt-text）；可自行寫，或在校樣階段檢查 Cambridge 系統產生的版本（asl_guidelines、cup_preparing）
    labelling: '圖一律稱 "Figures"，表與圖須編號並附標題；程式碼片段、圖解等也須標號（cup_preparing）'
    src: [asl_guidelines, cup_preparing, editflow]

  supplementary_material:
    role: 與文章無關鍵關係但可能有讀者興趣的材料
    separate_file: true
    typeset: false
    rules:
      - '"Material that is not essential to understanding or supporting a manuscript ... may be submitted as supplementary material."'
      - 須經編輯同意才會與文章一起線上發表，不放在期刊頁面中（"With the approval of the editors"）
      - 不排版也不 copyedit，須以最終呈現的樣子提供（"supplied exactly as they are to appear online"）
      - 類型包括附錄、額外的表圖、資料集、影片、音檔（"not limited to"）
    repository_encouragement: '"Where relevant we encourage authors to publish additional qualitative or quantitative research outputs in an appropriate repository"'
    src: cup_preparing

  reproducibility:
    code_and_data_sharing_mandate:
      status: not_published
      checked: 2026-10-25
      src: [cup_transparency, asl_guidelines, cup_preparing]
      note: >-
        Cambridge 的 Research transparency 頁全頁只寫 "For any policy relating to the Journal please refer to the ASL page here."，
        連結指向 ASL 倫理政策頁；該頁與 JSL Submission Guidelines 都沒有資料或程式碼公開、資料可得性聲明的條文。
    reporting_standards: {status: not_published, checked: 2026-10-25, src: [asl_guidelines, cup_preparing], note: 無 TOP、JARS 或其他報告標準要求}
    formalization_or_proof_checking:
      status: not_published
      checked: 2026-10-25
      src: [asl_guidelines, cup_preparing]
      note: 官網沒有關於形式化驗證（proof assistant）稿件、附形式化檔案或證明檢查的規定。

  review:
    type: single_anonymized
    statement: >-
      cup_review："This journal uses a single-anonymized model of peer review. The author does not know the identity of the reviewers,
      but the reviewers know the identity of the author." 作者稿件須列作者姓名（asl_guidelines 不接受匿名作者），不需要遮蔽稿件。
    src: [cup_review, asl_guidelines]
    editorial_decision: >-
      asl_jsl："Final decisions to accept papers are made by The Journal editorial board as a whole."
    stages:
      status: not_published
      checked: 2026-10-25
      src: [cup_review, asl_jsl, asl_guidelines, editflow]
      note: 官網沒有說明初篩、審稿人人數、輪次或各階段時程。
    timeline_targets: {status: not_published, checked: 2026-10-25, src: [cup_review, asl_guidelines]}
    appeals:
      statement: >-
        可申訴的只有兩種：編輯或審稿人的具體事實性陳述在決定中扮演關鍵角色，或基於具體個人／機構關係的偏見或利益衝突主張；
        對主題適不適合、呈現層次、結果品質的決定不可申訴。申訴交給期刊的 managing 或 coordinating editor，之後不再有進一步申訴。
      src: asl_appeals
    rejected_elsewhere_in_asl: >-
      asl_guidelines："If a paper has been previously rejected by one of the editors, this fact must be disclosed to any new editor to whom it,
      or a revised version, is being submitted."（cup_preparing 有同義但措辭不同的句子："...this fact must be disclosed if it is being submitted to another editor."）
    author_may_suggest_reviewers: {status: not_found, checked: 2026-10-25, src: [asl_guidelines, cup_preparing, editflow], note: Step 0 之前的頁面沒有提到；EditFlow 後續步驟未讀}
    authors_as_referees: {status: not_found, checked: 2026-10-25, src: [asl_guidelines, cup_preparing, editflow], note: 沒有看到作者須擔任審稿人的規定}
    revisions_link: >-
      修訂稿不要走新投稿入口：editflow 寫 "If you are trying to upload a revision of a previously submitted article (which had not been rejected),
      use instead the status link from the email you received from us about your original submission."
      被拒稿的修訂版不得重新投稿，除非編輯委員會明確邀請（"unless explicitly invited to re-submit"）。

  submission:
    portal: https://ef.msp.org/submit/asl_jsl
    system: EditFlow（MSP 的編輯管理平台；ASL 稱 "JSL EditFlow Management System"）
    file: PDF ＋ 原始檔（TeX 或 doc／docx）
    conditions:                     # editflow 的 Author Agreement；按 "I accept" 即表示同意
      - 稿件（或高度相似的稿件）目前沒有在別處審查中，審查期間也不會投到別處，且尚未在同行審查期刊發表或被接受
      - 稿件不是本刊先前被拒稿件的修訂版，除非編輯委員會明確邀請重投
      - 每位共同作者都知道此投稿以其名義送出，且各有只屬於本人的有效 email
      - 沒有共同作者冒用身分或誤導身分
      - 使用 AI 工具進行研究或準備稿件，符合 JSL 的指引與倫理政策，並向編輯（投稿流程稍後）與讀者（Acknowledgements 段）完整說明
    corresponding_author: >-
      開放取用資格取決於通訊作者的身分；通訊作者負責所有往來（審稿報告、修訂、校樣）。投稿流程中須指定，且 "difficult if not impossible
      to change the designation later"（editflow）。
    portal_steps_read: Step 0 only
    steps_not_read: 作者資料、編輯選擇、cover letter、檔案上傳、建議審稿人等欄位未讀（需按 "I accept" 才會進入，本記錄沒有開始投稿）
    technical_help: 'EditFlow 問題寫信 editflow@msp.org；asl_guidelines 另指 "technical help resources at EditFlow"'
    src: [editflow, cup_submitting, asl_guidelines]

  fees:
    submission: {status: not_published, checked: 2026-10-25, src: [cup_fees, editflow, asl_guidelines], note: Cambridge 的 Fees and pricing、EditFlow Step 0 與 ASL 的 Submission Guidelines 都沒有提投稿費}
    apc:
      amount: 3655
      currency: USD
      amounts:
        - {currency: GBP, amount: 2610}
        - {currency: USD, amount: 3655}
      mandatory: false
      excludes: "taxes（原文 additional taxes may apply）"
      applies_to: 本頁沒有分文章類型，表為 "Article Processing Charges for this journal"
      wording: >-
        cup_fees 的表："Article Processing Charges for this journal — Currency: GBP (£) APC: 2610; USD ($) APC: 3655"，
        前有 "(additional taxes may apply)"。
      conditions: >-
        APC 只適用於選 Gold Open Access 且沒有被機構協議涵蓋的情況："For articles that are not published Gold Open Access, costs of
        publishing Gold OA are not applicable."
      waivers_and_agreements: >-
        Cambridge 與 2,000 多個機構有開放取用協議，通訊作者所屬機構在名單內時"in the majority of cases these agreements cover the full costs"；
        Cambridge Open Equity Initiative 補助 100 多個中低收入國家的通訊作者；EditFlow 另提到 Research4Life 國家。資格在錄取流程中自動判定。
        'asl_guidelines 同樣寫 Gold OA "is available for a fee (APC) or in accordance with (read and) publish agreements ... and for corresponding authors in certain countries."'
      src: [cup_fees, cup_oa, editflow, asl_guidelines]
    color_print:
      amount: 320
      currency: USD
      amounts:
        - {currency: GBP, amount: 200}
        - {currency: USD, amount: 320}
      src: cup_fees
      note: >-
        cup_fees 列出 "Colour Charges for this journal"。但 asl_guidelines 與 editflow 都規定投稿 PDF 不得用灰階以外的顏色
        （"Color is not allowed"），這筆費用實際適用於什麼情況，官網沒有說明。見 warnings。
    page_charges: {status: not_published, checked: 2026-10-25, src: cup_fees, note: Fees and pricing 只列 APC 與彩色費，沒有頁費}

  open_access:
    options: [Gold Open Access（hybrid，付 APC 或由機構協議涵蓋）, 訂閱制（作者不付費）]
    licenses_offered: {status: not_published, checked: 2026-10-25, src: [cup_oa, cup_agreement], note: "cup_oa 與 cup_agreement 只寫 'a Creative Commons licence'，沒有列出可選的 CC 版本。asl_guidelines 建議不需要無限制 CC-BY 的作者選 CC-BY-NC-ND"}
    gold_oa_licence_suggestion: >-
      asl_guidelines："If you are eligible for gold open access publishing and your funder or institution does not require an unrestricted
      version of the CC-By license, we suggest that you choose one that does not automatically allow commercial use or distribution,
      i.e., the CC-By-NC-ND one."
    green_oa:
      embargo_months: 6
      statement: >-
        "This journal follows Cambridge's Green Open Access policy for scientific, technical and medical journals, which means an embargo of
        six months applies before authors can make accepted manuscripts available in non-commercial repositories. The embargo period starts
        from the date the article's Version of Record is published online by Cambridge."
      src: cup_oa
    plan_s:
      statement: >-
        cup_oa："This journal is registered with cOAlition S as a Transformative Journal, and articles subject to Plan S as a result of funding by
        cOAlition S should be published as Gold Open Access. This journal's Green Open Access policy does not meet the open access requirements of Plan S."
      editflow_note: >-
        editflow：Plan S 受資助者 "After acceptance, choose the journal's Gold Open Access option, which is compliant with Plan S"；
        簽署本刊的出版協議後 "you will not be able to use the Green OA (self-archiving) route to Plan S compliance"。
      src: [cup_oa, editflow]
    src: [cup_oa, asl_guidelines, editflow]

  policies:
    dual_submission: forbidden
    dual_submission_wording: >-
      asl_guidelines："the same work (1) has not been published elsewhere; (2) is not presently submitted or accepted for publication elsewhere;
      and (3) will not be submitted elsewhere unless the manuscript is either withdrawn from or rejected by the JSL first."
    prior_publication: >-
      cup_preparing："these manuscripts should not be under consideration, accepted for publication or in press within a different journal, book or
      similar entity, unless explicit permission or agreement has been sought from all entities involved."
    conference_versions: >-
      會議論文集中已發表的重要論文的完整版可投稿，但須 extend the prior publication in a significant way；投稿時必須提供對先前出版品的精確引用，
      並說明與會議版本有何不同（asl_guidelines）。已投稿 JSL 的稿件想另投會議縮短版時，須通知編輯並附上會議版本與差異說明；
      會議版先被接受時要通知期刊編輯，期刊版先被接受時會議版要註明完整版已被接受（asl_guidelines）。
    preprints:
      allowed: true
      statement: '"This journal allows preprints to be posted anywhere at any time, including before submission to the journal."'
      not_prior_publication: >-
        cup_preparing："deposition of a preprint on the author's personal website, in an institutional repository, or in a preprint archive
        shall not be viewed as prior or duplicate publication."
      editflow_note: >-
        editflow："We encourage the use of pre-print repositories such as arXiv. Pre-review, submitted manuscripts can be posted as CC-BY but
        post-review, accepted manuscripts should be deposited only using a CC-BY-NC-ND licence or a 'non-exclusive licence to distribute'."
        （上下文是 Plan S 受資助者的段落）
      src: [cup_oa, cup_preparing, editflow]
    copyright:
      transfer_required: false
      statement: >-
        asl_guidelines："Authors retain copyright in published articles but before publication they will be required to sign a license to publish
        agreement with the Association for Symbolic Logic. The Journal is now a hybrid publication and so there will be a choice of the type
        of license." cup_agreement：Gold OA 用非專屬授權，非 Gold OA 用專屬授權，著作權歸屬不變。
      src: [asl_guidelines, cup_agreement]
    generative_ai:
      author_listing: 'asl_guidelines："no Artificial Intelligence (AI) tool can be listed as an author of any submission."'
      disclosure: >-
        asl_guidelines："any use of such tools in the research for, or the preparation of, the submission should be in compliance with the general
        guidelines mentioned above and must be fully acknowledged and described to both the editors and readers where relevant in the submission and
        in a general way in the Acknowledgements section of the paper. Similarly, the use of other general aids, human or machine, in translation,
        writing or editing should be acknowledged in the Acknowledgements section of the submission. This last requirement does not apply to standard
        word processing or translation programs."
      warning: 'editflow："manuscripts generated largely by AI" 列為可能導致投稿資格被限制或停權的例子（見 scope.out_of_scope_hints）。'
      src: [asl_guidelines, editflow]
    ethics:
      statement: >-
        authors 須遵守 ASL 的出版倫理政策；各作者對內容與是否符合指引負責，包括正確引用、版權、避免利益衝突、誹謗、偏見、騷擾或抄襲（asl_guidelines）。
        ASL 不逐項定義違規行為，交由編輯委員會判斷；違規可由 Committee on Publications 裁定，處分包括退稿、禁止向任何 ASL 期刊或叢書投稿至少兩年、
        通知作者的系所主管或院長等（asl_ethics）。
      src: [asl_guidelines, asl_ethics]
    conflict_of_interest:
      author_disclosure: {status: not_found, checked: 2026-10-25, src: [asl_guidelines, asl_ethics, cup_preparing], note: "只在 asl_guidelines 的責任段把 conflicts of interest 列為作者須避免的事，沒有揭露格式或欄位要求"}
    language_editing: >-
      cup_preparing：英語語言編修服務是選配、自費，使用不保證錄取（"voluntary ... at the author's own expense"）。

  standards: []

# ─────────────────────────────────────────────────────────────
# FAST — 期刊無年度週期。
# ─────────────────────────────────────────────────────────────
cycle:
  applies_to: null
  rolling_calls: []
  special_issues:
    status: not_published
    checked: 2026-10-25
    note: Cambridge 的期刊首頁與 Journal information 各頁、ASL 的 JSL 頁都沒有徵稿或特刊公告

# ─────────────────────────────────────────────────────────────
warnings:
  - >-
    投稿規定的本體在 ASL 網站的 Submission Guidelines 與 EditFlow Step 0，不在 Cambridge 的 Author instructions。兩處有出入時，
    實際投稿用的是 EditFlow：Cambridge 寫 "Papers should be submitted in PDF. After acceptance a Latex source file ... would be much appreciated"，
    ASL 與 EditFlow 則要求投稿時就附原始檔（TeX 檔，或 doc／docx）；Cambridge 寫 "Key words and AMS classification numbers are strongly recommended"，
    ASL 寫定稿時 MSC 2020 分類號與關鍵字是 required。
  - >-
    篇幅只有 Cambridge 的一句 "primarily publishes papers of up to 30 pages in length, but longer papers will be considered"，沒有說是排版頁數還是稿件頁數、
    是否含參考文獻與附錄，ASL 的 Submission Guidelines 沒有篇幅規定。本記錄的 unit: pages_typeset 是最接近的列舉值，不是來源定義。
  - >-
    投稿 PDF 不得使用灰階以外的顏色（"Color is not allowed"），也一般不收手繪圖，需要時先和編輯討論；但 Cambridge 的 Fees and pricing 仍列有彩色費
    （GBP 200／USD 320）。官網沒有說明彩色費適用於哪種情況（可能是線上或紙本定稿的彩圖），投稿時一律用灰階。
  - >-
    只收英文稿件（2023-01-01 起）。不接受匿名作者，每位作者須是可辨識的人；審稿是單匿名（審稿人知道作者），稿件不需遮蔽作者資訊。
  - >-
    AI 工具不得列為作者；研究或寫作過程使用 AI 須在稿件內向編輯與讀者說明，並在 Acknowledgements 寫一段概述（asl_guidelines）；
    EditFlow 的 Author Agreement 另明文警告：重複投稿範圍外或不符學術標準的稿件，投稿資格可能被限制或停權，例子包括大量由 AI 生成的稿件，
    以及宣稱解決重大公開問題卻沒有有效新方法、也沒有處理現有文獻的稿件。
  - >-
    投稿前要決定誰是通訊作者：開放取用資格看通訊作者的所屬機構（機構協議或 Research4Life／Cambridge Open Equity Initiative 國家），
    且 EditFlow 寫事後很難改。Plan S 受資助者須選 Gold OA，本刊的 Green OA 不符合 Plan S，簽出版協議後也不能走 Green OA 達成 Plan S。
  - >-
    Cambridge 頁面上有兩個壞掉的 ASL 連結：Preparing your materials 的 http://www.aslonline.org/PublicationEthicsPolicy.html 在 2026-10-25 回 404
    （現行頁面是 https://aslonline.org/journals/publication-ethics-policy/），同頁的 "Please also refer to the Guidelines here: https://aslonline.org/journals..."
    顯示文字被截斷（實際連到 ASL 的 JSL 頁）。Cambridge 各頁列出的 ASL 發行人聯絡信箱也不一致（Preparing your materials、Contact details、
    Rights and permissions 各列一個不同網域），需要聯絡時以 ASL 網站的 Submission Guidelines 為準。
  - >-
    指標：Cambridge 的 Impact Factor 沒有標示年度，頁面顯示 ".6"（2 年）與 ".7"（5 年）；JCR 分區需登入，本記錄沒有；記錄中的 Q1 是 SJR 分區（Logic、Philosophy），
    不是 JCR。Web of Science 只收錄在 SCIE（MJL 核對），不在 SSCI、AHCI、ESCI。
  - >-
    官方沒有公布錄取率、首次決定時間、投稿到接受時間、審稿人人數與各階段時程；article types 沒有列表。官網也沒有資料或程式碼公開的規定。
  - >-
    EditFlow 只讀到 Step 0（沒有按 "I accept"）。作者資料、編輯選擇（官網指引暗示稿件有指定編輯）、cover letter、建議審稿人與檔案上傳的欄位要求未知。
